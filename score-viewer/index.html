*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#203047;font-family:system-ui,sans-serif}header{background:#183d65;color:white;padding:24px max(20px,calc((100% - 1100px)/2));}h1{font-size:25px;margin:0}header p{margin:7px 0 0;font-size:13px;opacity:.85}main{max-width:1140px;margin:auto;padding:20px}section,.panel{background:white;border:1px solid #dfe6ee;border-radius:14px;padding:20px;margin-bottom:16px}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:block;font-size:12px;color:#617087;margin-bottom:6px}select,input,button{font:inherit;border:1px solid #c8d3e0;border-radius:8px;padding:11px;background:white;color:#203047}select{min-width:135px}input{width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#126d91;color:white;border-color:#126d91}.tabs{display:flex;gap:8px;margin:18px 0}.metric-switch[hidden]{display:none}.metric-switch{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.metric-switch button[aria-pressed=true]{background:#183d65;color:white}.tabs button[aria-selected=true]{background:#183d65;color:white}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:16px;background:#edf3f8;border-radius:10px}.stat b{display:block;font-size:27px;margin-top:7px}.stat span{font-size:12px}.muted{color:#63748a;font-size:13px;line-height:1.7}#message{margin:12px 0;line-height:1.6}.error{color:#b42318}.tag{display:inline-block;padding:4px 8px;background:#eef2f6;border-radius:6px;font-size:12px;white-space:nowrap}.done{background:#e2f4ed;color:#176344}.partial{background:#fff1d6;color:#855800}.failed{background:#ffe5e5;color:#a32c2c}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 9px;border-bottom:1px solid #e5ebf1;text-align:left;white-space:nowrap}th{background:#f5f8fb;color:#617087;font-size:12px}td.num{text-align:right}.student{color:#126d91;border:0;padding:0;text-align:left;text-decoration:underline;background:none}.memo{white-space:pre-wrap;max-width:250px;min-width:120px;overflow-wrap:anywhere}h2{font-size:18px;margin-top:0}.toolbar{display:grid;grid-template-columns:1fr 170px;gap:12px;margin:18px 0}#detail[hidden]{display:none}#detail{border:2px solid #8fb6cc}.empty{padding:35px;text-align:center;color:#64748b}@media(max-width:650px){main{padding:12px}section{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:first-child{grid-column:1/-1}.filters>div{flex:1}select{width:100%;min-width:100px}.toolbar{grid-template-columns:1fr}.tabs button{flex:1;padding:11px 6px;font-size:13px}}@media(max-width:650px){.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:end}.filters>div{min-width:0}.filters select{width:100%;min-width:0}.filters>button{grid-column:1/-1;width:100%;min-height:46px;white-space:nowrap}.tabs button{white-space:nowrap}.metric-switch button{white-space:nowrap}#message{overflow-wrap:anywhere;word-break:normal}}@media print{header{background:white;color:black}.filters,.tabs,.toolbar,button{display:none}section{border:0;padding:0}.tablewrap{overflow:visible}.stats{grid-template-columns:repeat(5,1fr)}body{background:white}}
body.locked>header,body.locked>main{display:none}.gate[hidden]{display:none}.gate{min-height:100dvh;display:grid;place-items:center;padding:20px;background:#eef3f8}.gate-card{width:min(100%,380px);background:white;border-radius:16px;padding:28px;box-shadow:0 10px 32px #183d6522}.gate-card h1{color:#183d65;margin:0 0 8px}.gate-card p{line-height:1.6}.gate-card button{width:100%;margin-top:12px}.gate-error{color:#b42318;min-height:1.5em;font-size:14px}.startup[hidden]{display:none}.startup{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#203047;font-family:system-ui,sans-serif}.startup-card{text-align:center;width:min(100%,380px);padding:36px 24px;background:white;border:1px solid #dce5eb;border-radius:20px;box-shadow:0 14px 44px #183d6514}.startup-mark{display:block;color:#684CAF;font-weight:800;font-size:14px;letter-spacing:.1em;margin-bottom:26px}.startup-spinner{width:46px;height:46px;margin:0 auto 25px;border:5px solid #e3ebee;border-top-color:#684CAF;border-radius:50%;animation:startup-spin .8s linear infinite}.startup strong{display:block;font-size:20px;margin-bottom:8px}.startup p{font-size:14px;color:#60727e;margin:0;line-height:1.6}@keyframes startup-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.startup-spinner{animation:none;border-color:#684CAF}}</style></head><body class="locked"><div id="gate" class="gate"><form id="gateForm" class="gate-card"><h1>Score View</h1><p>社員用アプリのパスワードを入力してください。</p><label for="gatePassword">パスワード</label><input id="gatePassword" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required><button class="primary">開く</button><p id="gateError" class="gate-error" role="alert"></p></form></div><div id="startup" class="startup" role="status" aria-live="polite" hidden><div class="startup-card"><span class="startup-mark">共和校</span><div class="startup-spinner" aria-hidden="true"></div><strong>成績閲覧を準備中</strong><p>名簿とテストを読み込んでいます</p></div></div><header><h1>Score View <span style="font-size:13px">社員用・閲覧専用</span></h1><p>共和校｜入力状況と生徒の成績を確認</p></header><main><section><div class="filters"><div><label for="year">年度</label><select id="year"></select></div><div><label for="test">テスト</label><select id="test"></select></div><div><label for="grade">学年</label><select id="grade"></select></div><div><label for="school">学校</label><select id="school"></select></div><button id="load" class="primary" disabled>成績を読み込む</button><button id="cancel" hidden>読み込み中止</button></div><button id="retryMaster" class="primary" hidden>名簿の取得を再試行</button><div id="scoreFreshness" class="muted" role="status"></div><div id="message" role="status" aria-live="polite">名簿とテスト設定を確認中…</div><div class="muted">年度・テストを選んで読み込みます。生徒名を押すと過去の成績を確認できます。入力・修正・削除の操作はありません。</div></section><div class="stats" id="stats"></div><nav class="tabs" aria-label="表示切替"><button data-tab="status" aria-selected="true">入力状況</button><button data-tab="scores" aria-selected="false">成績一覧</button><button id="print">印刷</button></nav><section><h2 id="heading">入力状況</h2><div id="listMetric" class="metric-switch" aria-label="成績一覧の表示" hidden></div><div class="toolbar"><input id="search" placeholder="生徒名・学校で検索" aria-label="検索"><select id="filter" aria-label="状況で絞り込み"><option value="all">すべて</option><option value="missing">未入力</option><option value="partial">一部入力</option><option value="complete">入力完了</option><option value="uncollected">未回収</option><option value="error">取得失敗</option></select></div><div class="tablewrap" id="table"><p class="empty">年度・テストを選び「成績を読み込む」を押してください。</p></div><p class="muted">入力完了＝５科すべてに得点あり。一部入力＝１〜４科に得点あり。未入力＝得点なし。0点は入力済みとして数えます。取得失敗は未入力に含めません。</p></section><section id="detail" hidden></section></main><script>
const API='https://script.google.com/macros/s/AKfycbya7qViVMKVJau3fZ1fgyKF82jkAeQOtMMQSpzC8fqjhRBMgoB9h8cf0nCmWcVL7izntQ/exec';
const SUB=['国語','数学','英語','理科','社会'];const $=id=>document.getElementById(id);let supportsBulk=false;let master={tests:[],students:[]},rows=[],tab='status',epoch=0,detailEpoch=0,controller=null,metric='score',detailData=null;
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const present=v=>v!==null&&v!==undefined&&String(v).trim()!=='';

function metricButtons(){return ['score','dev'].map(m=>`<button type="button" data-metric="${m}" aria-pressed="${metric===m}">${m==='score'?'点数':'偏差値'}</button>`).join('')}
function metricValue(rec,subject){const v=rec?.scores?.[subject]?.[metric];return escape(present(v)?v:'—')}
function setMetric(next){if(!['score','dev'].includes(next))return;metric=next;render();if(detailData&&!$('detail').hidden)renderDetail()}

function classify(record,error){if(error==='確認中')return 'pending';if(error)return 'error';const n=SUB.filter(s=>present(record?.scores?.[s]?.score)).length;return n===5?'complete':n?'partial':'missing'}
const labels={complete:'入力完了',partial:'一部入力',missing:'未入力',error:'取得失敗',pending:'確認中'};
function msg(t,bad=false){$('message').textContent=t;$('message').className=bad?'error':''}
async function get(action,data,signal){const ctl=new AbortController(),onAbort=()=>ctl.abort();if(signal?.aborted)ctl.abort();signal?.addEventListener('abort',onAbort,{once:true});const timer=setTimeout(()=>ctl.abort(),45000);try{const u=new URL(API);u.searchParams.set('action',action);u.searchParams.set('_request',Date.now()+'-'+Math.random().toString(36).slice(2));if(data)u.searchParams.set('data',JSON.stringify(data));const r=await fetch(u,{method:'GET',cache:'no-store',signal:ctl.signal});if(!r.ok){const host=new URL(r.url||API).hostname;const e=Error('接続先からエラーが返りました（'+r.status+' / '+host+'）');e.status=r.status;throw e;}let j;try{j=await r.json()}catch(_){throw Error('接続先が成績データを返していません。Apps Scriptの公開状態を確認してください')}if(!j.ok)throw Error(j.message||'取得できませんでした');if(action==='record'&&(!Object.prototype.hasOwnProperty.call(j,'record')||(j.record&&!j.record.scores)))throw Error('成績取得の形式が異なります。接続先を確認してください');return j}catch(e){if(e.name==='AbortError'&&!signal?.aborted)throw Error('45秒以内に応答がありませんでした。再試行してください');if(e instanceof TypeError)throw Error('Googleの接続先に通信できませんでした。通信状態を確認して再試行してください');throw e}finally{clearTimeout(timer);signal?.removeEventListener('abort',onAbort)}}
async function getWithRetry(action,data,signal,onRetry,maxAttempts=2){for(let attempt=0;attempt<maxAttempts;attempt++){try{return await get(action,data,signal)}catch(e){if(signal?.aborted||attempt===maxAttempts-1||!([404,429,500,502,503,504].includes(e.status)||/秒以内に応答|通信できません/.test(e.message)))throw e;onRetry?.();await new Promise((resolve,reject)=>{const abort=()=>{clearTimeout(timer);reject(new DOMException('中止しました','AbortError'))};const timer=setTimeout(()=>{signal?.removeEventListener('abort',abort);resolve()},1000);signal?.addEventListener('abort',abort,{once:true});if(signal?.aborted)abort()})}}}
function scoreCacheKey(year,test){return 'kyowa-score-view-records-v1:'+JSON.stringify([year,test,$('grade').value,$('school').value])}
function readScoreCache(key,students){try{const x=JSON.parse(sessionStorage.getItem(key)||'null');if(!x||!Array.isArray(x.records)||Date.now()-x.savedAt>86400000)return null;const map=new Map(x.records.map(r=>[String(r.studentId),r]));if(!students.every(st=>map.has(String(st.id))))return null;return {savedAt:x.savedAt,rows:students.map(student=>({student,record:map.get(String(student.id)).record,error:null}))}}catch(_){return null}}
function writeScoreCache(key,records){try{sessionStorage.setItem(key,JSON.stringify({savedAt:Date.now(),records}))}catch(_){}}
function options(id,items,first){const old=$(id).value;$(id).innerHTML=(first?`<option value="">${first}</option>`:'')+items.map(v=>`<option value="${escape(v)}">${escape(v)}</option>`).join('');if(items.includes(old))$(id).value=old}
function tests(){options('test',master.tests.filter(t=>String(t.year)===$('year').value).map(t=>t.name),'テストを選択')}
function selected(){return master.students.filter(s=>s.status==='在籍'&&Number(s.startYear||0)<=Number($('year').value)&&(!$('grade').value||s.grade===$('grade').value)&&(!$('school').value||s.school===$('school').value))}
function invalidate(){$('scoreFreshness').textContent='';epoch++;detailEpoch++;controller?.abort();rows=[];detailData=null;$('detail').hidden=true;$('load').disabled=!$('test').value;$('cancel').hidden=true;render();msg('条件を選んで成績を読み込んでください')}
function render(){$('listMetric').hidden=tab!=='scores';$('listMetric').innerHTML=metricButtons();const counts={complete:0,partial:0,missing:0,error:0,pending:0};rows.forEach(r=>counts[classify(r.record,r.error)]++);$('stats').innerHTML=[['確認対象',rows.length],['入力完了',counts.complete],['一部入力',counts.partial],['未入力',counts.missing],['取得失敗',counts.error]].map(([s,n])=>`<div class="stat"><span>${s}</span><b>${n}</b></div>`).join('');$('heading').textContent=tab==='status'?'入力状況':'成績一覧｜'+(metric==='score'?'点数':'偏差値');const q=$('search').value.trim().toLocaleLowerCase(),f=$('filter').value;const list=rows.filter(r=>(r.student.name+' '+r.student.school).toLocaleLowerCase().includes(q)&&(f==='all'||f==='uncollected'?f!=='uncollected'||r.record?.collect==='未':classify(r.record,r.error)===f));
if(!list.length){$('table').innerHTML='<p class="empty">'+(rows.length?'該当する生徒はいません。':'成績を読み込むとここに表示されます。')+'</p>';return}
const scoreHead=SUB.map(s=>`<th>${s}</th>`).join('');$('table').innerHTML=`<table><thead><tr><th>生徒</th><th>学年 / 学校</th><th>入力状況</th>${tab==='scores'?scoreHead+(metric==='score'?'<th>５科合計</th><th>学校平均合計</th>':'')+'<th>順位</th>':'<th>入力科目</th>'}<th>回収</th><th>メモ</th></tr></thead><tbody>`+list.map(r=>{const rec=r.record,n=SUB.filter(s=>present(rec?.scores?.[s]?.score)).length,k=classify(rec,r.error);const sum=field=>{const vals=SUB.map(s=>rec?.scores?.[s]?.[field]);return vals.every(v=>present(v)&&Number.isFinite(Number(v)))?vals.reduce((a,v)=>a+Number(v),0):'—'};return `<tr><td><button class="student" data-id="${escape(r.student.id)}">${escape(r.student.name)}</button></td><td>${escape(r.student.grade)} / ${escape(r.student.school)}</td><td><span class="tag ${k==='complete'?'done':k==='partial'?'partial':k==='error'?'failed':''}" title="${escape(r.error||'')}">${labels[k]}</span></td>${tab==='scores'?SUB.map(s=>`<td class="num">${metricValue(rec,s)}${metric==='score'?`<small class="muted" style="display:block">平均 ${escape(present(rec?.scores?.[s]?.avg)?rec.scores[s].avg:'—')}</small>`:''}</td>`).join('')+(metric==='score'?`<td class="num">${sum('score')}</td><td class="num">${sum('avg')}</td>`:'')+`<td>${escape(present(rec?.rank)?rec.rank:'—')}</td>`:`<td>${r.error?'—':n+' / 5科'}</td>`}<td>${escape(rec?.collect||'—')}</td><td class="memo">${escape(rec?.memo||'')}</td></tr>`}).join('')+'</tbody></table>'}
async function load(){invalidate();const run=epoch;controller=new AbortController();const signal=controller.signal,students=selected(),year=$('year').value,test=$('test').value;const cacheKey=scoreCacheKey(year,test),cached=supportsBulk?readScoreCache(cacheKey,students):null;rows=cached?cached.rows:students.map(student=>({student,record:null,error:'確認中'}));if(cached)$('scoreFreshness').textContent='前回取得（'+new Date(cached.savedAt).toLocaleString('ja-JP')+'）の成績を表示中です。最新情報を確認しています。';$('load').disabled=true;$('cancel').hidden=false;if(supportsBulk){msg('対象生徒の成績をまとめて読み込み中…');render();try{const d=await getWithRetry('records',{year,test,grade:$('grade').value,school:$('school').value},signal,()=>{if(run===epoch)msg('応答が遅れているため、自動で再試行しています…')});if(run!==epoch)return;if(!Array.isArray(d.records))throw Error('一覧取得に対応していない接続先です');const byId=new Map(d.records.map(r=>[String(r.studentId),r]));rows=students.map(student=>{const x=byId.get(String(student.id));return {student,record:x?.record||null,error:x?null:'一覧に対象生徒が含まれていません'}});if(rows.every(r=>!r.error))writeScoreCache(cacheKey,d.records);$('scoreFreshness').textContent='';render();msg(`${year}年度 ${test}：${students.length}人を確認しました（${new Date().toLocaleTimeString('ja-JP')}）`)}catch(e){if(run!==epoch)return;if(cached){rows=cached.rows;$('scoreFreshness').textContent='最新情報を取得できませんでした。前回取得（'+new Date(cached.savedAt).toLocaleString('ja-JP')+'）の成績を表示しています。'}else rows=students.map(student=>({student,record:null,error:e.message}));render();msg(e.message,true)}finally{if(run===epoch){$('load').disabled=false;$('cancel').hidden=true}}return}let next=0,done=0;render();msg(`読み込み中 0 / ${students.length}人`);async function worker(){while(next<students.length&&!signal.aborted){const i=next++;try{const d=await getWithRetry('record',{year,test,studentId:students[i].id},signal);if(run!==epoch)return;rows[i]={student:students[i],record:d.record||null,error:null}}catch(e){if(run!==epoch||signal.aborted)return;rows[i].error=e.message}done++;if(run===epoch){render();msg(`読み込み中 ${done} / ${students.length}人`)}}}await Promise.all(Array.from({length:Math.min(2,students.length)},worker));if(run!==epoch)return;$('load').disabled=false;$('cancel').hidden=true;const failures=rows.filter(r=>r.error).length;msg(`${year}年度 ${test}：${students.length}人を確認しました（${new Date().toLocaleTimeString('ja-JP')}）${failures?' / '+failures+'人の取得に失敗。再読み込みしてください。':''}`,!!failures)}
async function detail(id){const st=master.students.find(s=>s.id===id);if(!st)return;const run=++detailEpoch;detailData=null;$('detail').hidden=false;$('detail').innerHTML=`<h2>${escape(st.name)}｜過去の成績</h2><p>読み込み中…</p>`;$('detail').scrollIntoView({behavior:'smooth',block:'start'});const list=master.tests.filter(t=>Number(t.year)>=Number(st.startYear||0)).slice().sort((a,b)=>Number(b.year)-Number(a.year)||(a.order||0)-(b.order||0));const results=[];for(const t of list){if(run!==detailEpoch)return;try{const d=await get('record',{year:t.year,test:t.name,studentId:id});results.push({t,rec:d.record})}catch(e){results.push({t,error:e.message})}}if(run!==detailEpoch)return;detailData={st,results};renderDetail()}
function renderDetail(){if(!detailData)return;const {st,results}=detailData;$('detail').innerHTML=`<div style="display:flex;justify-content:space-between"><h2>${escape(st.name)}｜過去の成績（${metric==='score'?'点数':'偏差値'}）</h2><button id="close">閉じる</button></div><div class="metric-switch" aria-label="過去の成績の表示">${metricButtons()}</div><div class="tablewrap"><table><thead><tr><th>年度 / テスト</th>${SUB.map(s=>'<th>'+s+'</th>').join('')}<th>順位</th><th>メモ</th></tr></thead><tbody>`+results.map(({t,rec,error})=>`<tr><td>${escape(t.year)} / ${escape(t.name)}${error?'<br><span class="error">取得失敗</span>':''}</td>${SUB.map(s=>`<td>${metricValue(rec,s)}</td>`).join('')}<td>${escape(rec?.rank||'—')}</td><td class="memo">${escape(error||rec?.memo||'')}</td></tr>`).join('')+'</tbody></table></div>';$('close').onclick=()=>{$('detail').hidden=true;detailEpoch++;detailData=null}}
$('listMetric').onclick=e=>{const b=e.target.closest('[data-metric]');if(b)setMetric(b.dataset.metric)};$('detail').onclick=e=>{const b=e.target.closest('[data-metric]');if(b)setMetric(b.dataset.metric)};$('load').onclick=load;$('cancel').onclick=()=>{invalidate();msg('読み込みを中止しました。再度読み込んでください')};$('year').onchange=()=>{tests();invalidate()};for(const id of ['test','grade','school'])$(id).onchange=invalidate;for(const id of ['search','filter'])$(id).oninput=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render()});$('table').onclick=e=>{const b=e.target.closest('[data-id]');if(b)detail(b.dataset.id)};$('print').onclick=()=>window.print();
const MASTER_KEY='kyowa-score-view-master-v1',MASTER_TTL=24*60*60*1000;
function cachedMaster(){for(const key of [MASTER_KEY,'kyowa-score-input-master-v1']){try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&Array.isArray(x.data?.tests)&&Array.isArray(x.data?.students))return x.data}catch(_){}}return null}
function applyMaster(d){if(!Array.isArray(d.tests)||!Array.isArray(d.students))throw Error('接続先のマスター形式を確認してください');supportsBulk=d.capabilities?.records===true;const next={tests:d.tests,students:d.students},changed=JSON.stringify(master)!==JSON.stringify(next),before=$('year').value+'|'+$('test').value+'|'+$('grade').value+'|'+$('school').value;master=next;const years=[...new Set(master.tests.map(t=>String(t.year)))].sort().reverse();options('year',years);tests();options('grade',[...new Set(master.students.filter(s=>s.status==='在籍').map(s=>s.grade))].sort(),'全学年');options('school',[...new Set(master.students.filter(s=>s.status==='在籍').map(s=>s.school).filter(Boolean))].sort(),'全学校');const after=$('year').value+'|'+$('test').value+'|'+$('grade').value+'|'+$('school').value;if(before!==after||(changed&&rows.length))invalidate();else $('load').disabled=controller&&!controller.signal.aborted&& !$('cancel').hidden?true:!$('test').value;return changed}
async function boot(){$('retryMaster').hidden=true;const cached=cachedMaster();if(cached){applyMaster(cached);$('startup').hidden=true;msg('前回の名簿を表示しました。最新情報を確認中…')}try{const d=await getWithRetry('bootstrap',undefined,undefined,()=>msg('接続先の応答が不安定なため、名簿を再取得しています…'),3),changed=applyMaster(d);try{localStorage.setItem(MASTER_KEY,JSON.stringify({savedAt:Date.now(),data:{tests:d.tests,students:d.students}}))}catch(_){}if(!$('cancel').hidden)return;if(rows.length&&!changed)return;msg('最新の名簿とテスト設定を読み込みました')}catch(e){$('retryMaster').hidden=false;msg(cached?'前回の名簿を表示中です。最新化できませんでした：'+e.message:'読み込めませんでした：'+e.message+'。ページを再読み込みしてください。',true)}finally{$('startup').hidden=true}}
const GATE_KEY='kyowa-score-view-unlocked-v1',GATE_HASH='52fca1c4244d415a9f7934878ec582a71099283471514360ff8976d1463118d9';
function unlock(){document.body.classList.remove('locked');$('gate').hidden=true;$('startup').hidden=false;render();boot()}
$('gateForm').onsubmit=async e=>{e.preventDefault();const input=$('gatePassword'),bytes=new TextEncoder().encode(input.value),digest=await crypto.subtle.digest('SHA-256',bytes),hash=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==GATE_HASH){$('gateError').textContent='パスワードが違います。';input.value='';input.focus();return}try{sessionStorage.setItem(GATE_KEY,'1')}catch(_){}unlock()};
$('retryMaster').onclick=boot;try{if(sessionStorage.getItem(GATE_KEY)==='1')unlock()}catch(_){}
</script></body></html>
