<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Score View｜社員用</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#203047;font-family:system-ui,sans-serif}header{background:#183d65;color:white;padding:24px max(20px,calc((100% - 1100px)/2));}h1{font-size:25px;margin:0}header p{margin:7px 0 0;font-size:13px;opacity:.85}main{max-width:1140px;margin:auto;padding:20px}section,.panel{background:white;border:1px solid #dfe6ee;border-radius:14px;padding:20px;margin-bottom:16px}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:block;font-size:12px;color:#617087;margin-bottom:6px}select,input,button{font:inherit;border:1px solid #c8d3e0;border-radius:8px;padding:11px;background:white;color:#203047}select{min-width:135px}input{width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#126d91;color:white;border-color:#126d91}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button[aria-selected=true]{background:#183d65;color:white}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:16px;background:#edf3f8;border-radius:10px}.stat b{display:block;font-size:27px;margin-top:7px}.stat span{font-size:12px}.muted{color:#63748a;font-size:13px;line-height:1.7}#message{margin:12px 0;line-height:1.6}.error{color:#b42318}.tag{display:inline-block;padding:4px 8px;background:#eef2f6;border-radius:6px;font-size:12px;white-space:nowrap}.done{background:#e2f4ed;color:#176344}.partial{background:#fff1d6;color:#855800}.failed{background:#ffe5e5;color:#a32c2c}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 9px;border-bottom:1px solid #e5ebf1;text-align:left;white-space:nowrap}th{background:#f5f8fb;color:#617087;font-size:12px}td.num{text-align:right}.student{color:#126d91;border:0;padding:0;text-align:left;text-decoration:underline;background:none}.memo{white-space:pre-wrap;max-width:250px;min-width:120px;overflow-wrap:anywhere}h2{font-size:18px;margin-top:0}.toolbar{display:grid;grid-template-columns:1fr 170px;gap:12px;margin:18px 0}#detail[hidden]{display:none}#detail{border:2px solid #8fb6cc}.empty{padding:35px;text-align:center;color:#64748b}@media(max-width:650px){main{padding:12px}section{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:first-child{grid-column:1/-1}.filters>div{flex:1}select{width:100%;min-width:100px}.toolbar{grid-template-columns:1fr}.tabs button{flex:1;padding:11px 6px;font-size:13px}}@media print{header{background:white;color:black}.filters,.tabs,.toolbar,button{display:none}section{border:0;padding:0}.tablewrap{overflow:visible}.stats{grid-template-columns:repeat(5,1fr)}body{background:white}}
</style></head><body><header><h1>Score View <span style="font-size:13px">社員用・閲覧専用</span></h1><p>共和校｜入力状況と生徒の成績を確認</p></header><main><section><div class="filters"><div><label for="year">年度</label><select id="year"></select></div><div><label for="test">テスト</label><select id="test"></select></div><div><label for="grade">学年</label><select id="grade"></select></div><div><label for="school">学校</label><select id="school"></select></div><button id="load" class="primary" disabled>成績を読み込む</button><button id="cancel" hidden>読み込み中止</button></div><div id="message" role="status" aria-live="polite">名簿とテスト設定を確認中…</div><div class="muted">年度・テストを選んで読み込みます。生徒名を押すと過去の成績を確認できます。入力・修正・削除の操作はありません。</div></section><div class="stats" id="stats"></div><nav class="tabs" aria-label="表示切替"><button data-tab="status" aria-selected="true">入力状況</button><button data-tab="scores" aria-selected="false">成績一覧</button><button id="print">印刷</button></nav><section><h2 id="heading">入力状況</h2><div class="toolbar"><input id="search" placeholder="生徒名・学校で検索" aria-label="検索"><select id="filter" aria-label="状況で絞り込み"><option value="all">すべて</option><option value="missing">未入力</option><option value="partial">一部入力</option><option value="complete">入力完了</option><option value="uncollected">未回収</option><option value="error">取得失敗</option></select></div><div class="tablewrap" id="table"><p class="empty">年度・テストを選び「成績を読み込む」を押してください。</p></div><p class="muted">入力完了＝５科すべてに得点あり。一部入力＝１〜４科に得点あり。未入力＝得点なし。0点は入力済みとして数えます。取得失敗は未入力に含めません。</p></section><section id="detail" hidden></section></main><script>
const API='https://script.google.com/macros/s/AKfycbya7qViVMKVJau3fZ1fgyKF82jkAeQOtMMQSpzC8fqjhRBMgoB9h8cf0nCmWcVL7izntQ/exec';
const SUB=['国語','数学','英語','理科','社会'];const $=id=>document.getElementById(id);let master={tests:[],students:[]},rows=[],tab='status',epoch=0,detailEpoch=0,controller=null;
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const present=v=>v!==null&&v!==undefined&&String(v).trim()!=='';
function classify(record,error){if(error==='確認中')return 'pending';if(error)return 'error';const n=SUB.filter(s=>present(record?.scores?.[s]?.score)).length;return n===5?'complete':n?'partial':'missing'}
const labels={complete:'入力完了',partial:'一部入力',missing:'未入力',error:'取得失敗',pending:'確認中'};
function msg(t,bad=false){$('message').textContent=t;$('message').className=bad?'error':''}
async function get(action,data,signal){const u=new URL(API);u.searchParams.set('action',action);if(data)u.searchParams.set('data',JSON.stringify(data));const r=await fetch(u,{method:'GET',cache:'no-store',signal});if(!r.ok)throw Error('通信エラー');const j=await r.json();if(!j.ok)throw Error(j.message||'取得できませんでした');if(action==='record'&&(!Object.prototype.hasOwnProperty.call(j,'record')||(j.record&&!j.record.scores)))throw Error('成績取得の形式が異なります。接続先を確認してください');return j}
function options(id,items,first){const old=$(id).value;$(id).innerHTML=(first?`<option value="">${first}</option>`:'')+items.map(v=>`<option value="${escape(v)}">${escape(v)}</option>`).join('');if(items.includes(old))$(id).value=old}
function tests(){options('test',master.tests.filter(t=>String(t.year)===$('year').value).map(t=>t.name),'テストを選択')}
function selected(){return master.students.filter(s=>s.status==='在籍'&&Number(s.startYear||0)<=Number($('year').value)&&(!$('grade').value||s.grade===$('grade').value)&&(!$('school').value||s.school===$('school').value))}
function invalidate(){epoch++;detailEpoch++;controller?.abort();rows=[];$('detail').hidden=true;$('load').disabled=!$('test').value;$('cancel').hidden=true;render();msg('条件を選んで成績を読み込んでください')}
function render(){const counts={complete:0,partial:0,missing:0,error:0,pending:0};rows.forEach(r=>counts[classify(r.record,r.error)]++);$('stats').innerHTML=[['確認対象',rows.length],['入力完了',counts.complete],['一部入力',counts.partial],['未入力',counts.missing],['取得失敗',counts.error]].map(([s,n])=>`<div class="stat"><span>${s}</span><b>${n}</b></div>`).join('');$('heading').textContent=tab==='status'?'入力状況':'成績一覧';const q=$('search').value.trim().toLocaleLowerCase(),f=$('filter').value;const list=rows.filter(r=>(r.student.name+' '+r.student.school).toLocaleLowerCase().includes(q)&&(f==='all'||f==='uncollected'?f!=='uncollected'||r.record?.collect==='未':classify(r.record,r.error)===f));
if(!list.length){$('table').innerHTML='<p class="empty">'+(rows.length?'該当する生徒はいません。':'成績を読み込むとここに表示されます。')+'</p>';return}
const scoreHead=SUB.map(s=>`<th>${s}</th>`).join('');$('table').innerHTML=`<table><thead><tr><th>生徒</th><th>学年 / 学校</th><th>入力状況</th>${tab==='scores'?scoreHead+'<th>５科合計</th><th>学校平均合計</th><th>順位</th>':'<th>入力科目</th>'}<th>回収</th><th>メモ</th></tr></thead><tbody>`+list.map(r=>{const rec=r.record,n=SUB.filter(s=>present(rec?.scores?.[s]?.score)).length,k=classify(rec,r.error);const sum=field=>{const vals=SUB.map(s=>rec?.scores?.[s]?.[field]);return vals.every(v=>present(v)&&Number.isFinite(Number(v)))?vals.reduce((a,v)=>a+Number(v),0):'—'};return `<tr><td><button class="student" data-id="${escape(r.student.id)}">${escape(r.student.name)}</button></td><td>${escape(r.student.grade)} / ${escape(r.student.school)}</td><td><span class="tag ${k==='complete'?'done':k==='partial'?'partial':k==='error'?'failed':''}" title="${escape(r.error||'')}">${labels[k]}</span></td>${tab==='scores'?SUB.map(s=>`<td class="num">${escape(present(rec?.scores?.[s]?.score)?rec.scores[s].score:'—')}<small class="muted" style="display:block">平均 ${escape(present(rec?.scores?.[s]?.avg)?rec.scores[s].avg:'—')} / 偏 ${escape(present(rec?.scores?.[s]?.dev)?rec.scores[s].dev:'—')}</small></td>`).join('')+`<td class="num">${sum('score')}</td><td class="num">${sum('avg')}</td><td>${escape(present(rec?.rank)?rec.rank:'—')}</td>`:`<td>${r.error?'—':n+' / 5科'}</td>`}<td>${escape(rec?.collect||'—')}</td><td class="memo">${escape(rec?.memo||'')}</td></tr>`}).join('')+'</tbody></table>'}
async function load(){invalidate();const run=epoch;controller=new AbortController();const signal=controller.signal,students=selected(),year=$('year').value,test=$('test').value;rows=students.map(student=>({student,record:null,error:'確認中'}));$('load').disabled=true;$('cancel').hidden=false;let next=0,done=0;render();msg(`読み込み中 0 / ${students.length}人`);async function worker(){while(next<students.length&&!signal.aborted){const i=next++;try{const d=await get('record',{year,test,studentId:students[i].id},signal);if(run!==epoch)return;rows[i]={student:students[i],record:d.record||null,error:null}}catch(e){if(run!==epoch||signal.aborted)return;rows[i].error=e.message}done++;if(run===epoch){render();msg(`読み込み中 ${done} / ${students.length}人`)}}}await Promise.all(Array.from({length:Math.min(4,students.length)},worker));if(run!==epoch)return;$('load').disabled=false;$('cancel').hidden=true;const failures=rows.filter(r=>r.error).length;msg(`${year}年度 ${test}：${students.length}人を確認しました（${new Date().toLocaleTimeString('ja-JP')}）${failures?' / '+failures+'人の取得に失敗。再読み込みしてください。':''}`,!!failures)}
async function detail(id){const st=master.students.find(s=>s.id===id);if(!st)return;const run=++detailEpoch;$('detail').hidden=false;$('detail').innerHTML=`<h2>${escape(st.name)}｜過去の成績</h2><p>読み込み中…</p>`;$('detail').scrollIntoView({behavior:'smooth',block:'start'});const list=master.tests.filter(t=>Number(t.year)>=Number(st.startYear||0)).slice().sort((a,b)=>Number(b.year)-Number(a.year)||(a.order||0)-(b.order||0));const results=[];for(const t of list){if(run!==detailEpoch)return;try{const d=await get('record',{year:t.year,test:t.name,studentId:id});results.push({t,rec:d.record})}catch(e){results.push({t,error:e.message})}}if(run!==detailEpoch)return;$('detail').innerHTML=`<div style="display:flex;justify-content:space-between"><h2>${escape(st.name)}｜過去の成績</h2><button id="close">閉じる</button></div><div class="tablewrap"><table><thead><tr><th>年度 / テスト</th>${SUB.map(s=>'<th>'+s+'</th>').join('')}<th>順位</th><th>メモ</th></tr></thead><tbody>`+results.map(({t,rec,error})=>`<tr><td>${escape(t.year)} / ${escape(t.name)}${error?'<br><span class="error">取得失敗</span>':''}</td>${SUB.map(s=>`<td>${escape(present(rec?.scores?.[s]?.score)?rec.scores[s].score:'—')}</td>`).join('')}<td>${escape(rec?.rank||'—')}</td><td class="memo">${escape(error||rec?.memo||'')}</td></tr>`).join('')+'</tbody></table></div>';$('close').onclick=()=>{$('detail').hidden=true;detailEpoch++}}
$('load').onclick=load;$('cancel').onclick=()=>{invalidate();msg('読み込みを中止しました。再度読み込んでください')};$('year').onchange=()=>{tests();invalidate()};for(const id of ['test','grade','school'])$(id).onchange=invalidate;for(const id of ['search','filter'])$(id).oninput=render;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render()});$('table').onclick=e=>{const b=e.target.closest('[data-id]');if(b)detail(b.dataset.id)};$('print').onclick=()=>window.print();
const MASTER_KEY='kyowa-score-view-master-v1',MASTER_TTL=24*60*60*1000;
function cachedMaster(){for(const key of [MASTER_KEY,'kyowa-score-input-master-v1']){try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&Date.now()-x.savedAt<MASTER_TTL&&Array.isArray(x.data?.tests)&&Array.isArray(x.data?.students))return x.data}catch(_){}}return null}
function applyMaster(d){if(!Array.isArray(d.tests)||!Array.isArray(d.students))throw Error('接続先のマスター形式を確認してください');const next={tests:d.tests,students:d.students},changed=JSON.stringify(master)!==JSON.stringify(next),before=$('year').value+'|'+$('test').value+'|'+$('grade').value+'|'+$('school').value;master=next;const years=[...new Set(master.tests.map(t=>String(t.year)))].sort().reverse();options('year',years);tests();options('grade',[...new Set(master.students.filter(s=>s.status==='在籍').map(s=>s.grade))].sort(),'全学年');options('school',[...new Set(master.students.filter(s=>s.status==='在籍').map(s=>s.school).filter(Boolean))].sort(),'全学校');const after=$('year').value+'|'+$('test').value+'|'+$('grade').value+'|'+$('school').value;if(before!==after||(changed&&rows.length))invalidate();else $('load').disabled=controller&&!controller.signal.aborted&& !$('cancel').hidden?true:!$('test').value;return changed}
async function boot(){const cached=cachedMaster();if(cached){applyMaster(cached);msg('前回の名簿を表示しました。最新情報を確認中…')}try{const d=await get('bootstrap'),changed=applyMaster(d);try{localStorage.setItem(MASTER_KEY,JSON.stringify({savedAt:Date.now(),data:{tests:d.tests,students:d.students}}))}catch(_){}if(!$('cancel').hidden)return;if(rows.length&&!changed)return;msg('最新の名簿とテスト設定を読み込みました')}catch(e){msg(cached?'前回の名簿を表示中です。最新化できませんでした：'+e.message:'読み込めませんでした：'+e.message+'。ページを再読み込みしてください。',true)}}
render();boot();
</script></body></html>
