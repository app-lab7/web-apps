<!DOCTYPE html>

<style>
:root{--n:#1f3a5f;--bg:#f4f6fa;--c:#fff;--b:#d5dbe6;--ok:#2e8b57;--warn:#d9822b;--t:#222}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--c:#1e242e;--b:#333c4b;--t:#e8ecf2;--n:#9db8e6}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--b);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
h1{font-size:17px;margin:0 0 2px;color:var(--n)}.sub{font-size:12px;opacity:.7;display:flex;justify-content:space-between;gap:8px}
.bar{height:10px;background:var(--b);border-radius:6px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

.cds{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.cd{border:1px solid var(--b);border-radius:8px;padding:4px 10px;font-size:12px;background:var(--bg)}.cd b{font-size:15px;color:var(--n)}.cd .x{border:0;background:none;color:var(--t);opacity:.5;font-size:14px;padding:0 0 0 6px}

.cdform{display:none;gap:6px;flex-wrap:wrap;margin:6px 0}.cdform.on{display:flex}.cdform input{padding:6px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);font:inherit;font-size:13px}.cdform input[type=text]{flex:1;min-width:140px}.cdform button{padding:6px 12px;border:0;border-radius:6px;background:var(--n);color:#fff}

.tabs button i{font-style:normal;font-size:22px;line-height:1.1}
.tabs button.on{opacity:1;color:var(--n);font-weight:700}
.tabs button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--n)}
main{max-width:720px;margin:0 auto;padding:8px 12px calc(96px + env(safe-area-inset-bottom))}
.ph{margin:18px 4px 6px;font-size:13px;font-weight:700;color:var(--n)}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin:6px 0}
.row.today{border:2px solid var(--n)}.row.rest{opacity:.75}.row.done{opacity:.55}.row.done .t{text-decoration:line-through}
.row input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}
.d{font-weight:700;font-size:14px}.tag{font-size:11px;background:var(--n);color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px}
@media(prefers-color-scheme:dark){.tag{color:#14181f}}
.t{font-size:14px}.m{font-size:12px;opacity:.7}.lt{border-left:4px solid var(--warn)}
.memo{width:100%;margin-top:6px;min-height:70px;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;font-size:14px}
.mb{margin-top:6px;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:6px;padding:3px 10px;font-size:12px}.mb.has{background:var(--warn);color:#fff;border-color:var(--warn)}
.mi{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin:6px 0}.mi b{color:var(--n)}.mi div{white-space:pre-wrap;font-size:14px;margin-top:4px}
.qb{margin-top:6px;margin-left:6px;border:1px solid var(--n);background:var(--c);color:var(--n);border-radius:6px;padding:3px 10px;font-size:12px}.qb.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.qb.ng{background:var(--warn);color:#fff;border-color:var(--warn)}
.qz{margin-top:8px;border:1px solid var(--b);border-radius:10px;padding:10px;background:var(--bg)}.qz .qt{font-size:14px;font-weight:600;margin-bottom:8px}.qz .qu{font-size:11px;opacity:.7;margin-bottom:4px}
.qo{display:block;width:100%;text-align:left;margin:5px 0;padding:9px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;font-size:14px}.qo.sel{border-color:var(--n);border-width:2px}.qo.right{background:var(--ok);color:#fff;border-color:var(--ok)}.qo.wrong{background:var(--warn);color:#fff;border-color:var(--warn)}
.qv{margin-top:8px;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:6px;padding:4px 12px;font-size:12px}
.qr{margin-top:8px;font-size:13px;white-space:pre-wrap}.qr b{font-size:15px}
.empty{text-align:center;opacity:.6;padding:30px}
footer{font-size:11px;opacity:.6;text-align:center;padding:0 16px 100px}
</style></head><body>

<script>
let QUIZ={"2026-11-23": {"u": "観察・実験の基本操作", "q": "手に持てる葉をルーペで観察するときの、正しい使い方はどれか。", "o": ["ルーペを目から遠ざけ、葉を前後に動かしてピントを合わせる", "葉を目に近づけ、ルーペを前後に動かしてピントを合わせる", "ルーペを目に近づけて持ち、葉を前後に動かしてピントを合わせる", "ルーペを葉に近づけて持ち、顔を前後に動かしてピントを合わせる"], "a": 2, "e": "動かせるもの(葉など)を観察するときは、ルーペを目に近づけて持ち、観察するものを前後に動かしてピントを合わせます。花など動かせないものを観察するときは、ルーペを目に近づけたまま、顔を前後に動かします。"}, "2026-11-24": {"u": "顕微鏡の使い方", "q": "接眼レンズが10倍、対物レンズが40倍のとき、顕微鏡の倍率は何倍か。", "o": ["50倍", "100倍", "400倍", "4000倍"], "a": 2, "e": "顕微鏡の倍率は「接眼レンズの倍率×対物レンズの倍率」で求めます。10×40=400倍です。倍率を高くすると、見える範囲(視野)はせまくなり、暗くなります。"}, "2026-11-25": {"u": "植物のなかま(種子植物)", "q": "被子植物と裸子植物の違いについて、正しいものはどれか。", "o": ["被子植物は胞子でふえ、裸子植物は種子でふえる", "被子植物は子房がなく、裸子植物は子房がある", "被子植物も裸子植物も、胚珠は子房の中にある", "被子植物は胚珠が子房の中にあり、裸子植物は子房がなく胚珠がむき出しである"], "a": 3, "e": "被子植物は胚珠が子房の中にあります(子房は成長して果実になります)。裸子植物には子房がなく、胚珠がむき出しです。どちらも種子でふえる「種子植物」です。"}, "2026-11-26": {"u": "植物のなかま(単子葉類・双子葉類)", "q": "イネのような単子葉類の、葉脈と根のつくりの組み合わせとして正しいものはどれか。", "o": ["網状脈・主根と側根", "網状脈・ひげ根", "平行脈・ひげ根", "平行脈・主根と側根"], "a": 2, "e": "単子葉類は、葉脈が平行脈で、根はひげ根です。双子葉類は、葉脈が網状脈で、根は主根と側根です。"}, "2026-11-27": {"u": "シダ植物・コケ植物", "q": "シダ植物とコケ植物について、正しいものはどれか。", "o": ["コケ植物は、根・茎・葉の区別がはっきりしている", "シダ植物は、種子をつくってふえる", "コケ植物は、種子でふえる", "シダ植物は、根・茎・葉の区別があり、胞子でふえる"], "a": 3, "e": "シダ植物は、根・茎・葉の区別があり、胞子でふえます。コケ植物は、根・茎・葉の区別がなく(根のように見える部分は仮根)、胞子でふえます。どちらも種子はつくりません。"}, "2026-11-28": {"u": "解き直し(マツの花)", "q": "マツの花で、のちに種子になる部分はどれか。", "o": ["子房", "やく", "花粉のう", "胚珠"], "a": 3, "e": "のちに種子になるのは胚珠です。マツは裸子植物で子房がないので、胚珠がむき出しになっています。花粉は、花粉のうの中でつくられます。"}, "2026-11-29": {"u": "1週間のまとめ", "q": "次のうち、種子をつくらずに胞子でふえる植物はどれか。", "o": ["イネ", "マツ", "アブラナ", "ゼニゴケ"], "a": 3, "e": "ゼニゴケはコケ植物で、胞子でふえます。イネ・マツ・アブラナは種子植物で、種子でふえます。"}, "2026-11-30": {"u": "動物のなかま", "q": "セキツイ動物のうち、子が母親の体内である程度育ってから生まれる(胎生)のはどれか。", "o": ["魚類", "両生類", "は虫類", "ほ乳類"], "a": 3, "e": "ほ乳類は胎生で、生まれた子は母乳で育てられます。魚類・両生類・は虫類・鳥類は、卵をうんで子をふやす卵生です。"}, "2026-12-01": {"u": "動物のなかま", "q": "カエルの幼生(オタマジャクシ)と成体の呼吸のしかたの組み合わせとして、正しいものはどれか。", "o": ["幼生:肺 / 成体:えら", "幼生:えらと皮膚 / 成体:肺と皮膚", "幼生:肺と皮膚 / 成体:えらと皮膚", "幼生:えら / 成体:えら"], "a": 1, "e": "両生類は、幼生のときはえらと皮膚で呼吸し、成体になると肺と皮膚で呼吸します。"}, "2026-12-02": {"u": "気体の性質", "q": "石灰石にうすい塩酸を加えると発生する気体はどれか。", "o": ["酸素", "水素", "二酸化炭素", "アンモニア"], "a": 2, "e": "石灰石にうすい塩酸を加えると、二酸化炭素が発生します。二酸化炭素は石灰水を白くにごらせます。"}, "2026-12-03": {"u": "気体の性質", "q": "水素の性質として、正しいものはどれか。", "o": ["物質の中で最も密度が小さく、火を近づけると音を立てて燃える", "空気より重く、石灰水を白くにごらせる", "刺激臭があり、水に非常によくとける", "物を燃やすはたらきがあり、火のついた線香が炎を出して燃える"], "a": 0, "e": "水素は、物質の中で最も密度が小さく、火を近づけると音を立てて燃えて水ができます。水にとけにくいので、水上置換法で集めます。"}, "2026-12-04": {"u": "気体の集め方", "q": "水にとけやすく、空気より軽いアンモニアを集めるのに適した方法はどれか。", "o": ["下方置換法", "水上置換法", "ろ過", "上方置換法"], "a": 3, "e": "アンモニアは水に非常にとけやすく、空気より軽いので、上方置換法で集めます。"}, "2026-12-05": {"u": "解き直し(気体)", "q": "二酸化マンガンにうすい過酸化水素水(オキシドール)を加えたときに発生する気体と、その性質の組み合わせとして正しいものはどれか。", "o": ["水素:火を近づけると音を立てて燃える", "二酸化炭素:石灰水を白くにごらせる", "酸素:物を燃やすはたらきがある", "アンモニア:水溶液がアルカリ性を示す"], "a": 2, "e": "発生する気体は酸素です。酸素には、物を燃やすはたらきがあり、火のついた線香を入れると炎を出して燃えます。"}, "2026-12-06": {"u": "1週間のまとめ", "q": "水にとけにくい気体を集めるのに適した方法はどれか。", "o": ["上方置換法", "下方置換法", "水上置換法", "ろ過"], "a": 2, "e": "水にとけにくい気体は、水上置換法で集めます。水素や酸素は、この方法で集められます。"}};

  h+='<div class="'+cls+'"><input type="checkbox" data-d="'+x.d+'" '+(done[x.d]?"checked":"")+(isStudy(x)?"":" disabled")+'><div style="flex:1;min-width:0"><div class="d">'+dt+"("+x.w+")"+(x.d===today?'<span class="tag">今日</span>':"")+'</div><div class="t">'+x.t+'</div><div class="m">'+(x.p&&x.p!=="—"?x.p+"・":"")+x.m+"</div>"+(isStudy(x)?'<button class="mb'+(hasM?" has":"")+'" data-k="'+esc(k)+'">📝 '+(hasM?"メモあり":"メモ")+"</button>"+(open[k]?'<textarea class="memo" data-k="'+esc(k)+'" placeholder="わからないところ(ページ・問題番号・なぜ間違えたか)">'+esc(memo[k]||"")+"</textarea>":""):"")+quizHtml(x)+"</div></div>";
 }
 list.innerHTML=h||'<div class="empty">この期間の予定はありません</div>';
 list.querySelectorAll(".mb").forEach(b=>b.onclick=()=>{open[b.dataset.k]=!open[b.dataset.k];render();const t=list.querySelector('textarea[data-k="'+b.dataset.k+'"]');if(t)t.focus()});
 list.querySelectorAll("textarea.memo").forEach(t=>t.oninput=()=>{const k=t.dataset.k;if(t.value.trim())memo[k]=t.value;else delete memo[k];touch();list.querySelectorAll('.mb[data-k="'+k+'"]').forEach(b=>{b.classList.toggle("has",!!memo[k]);b.textContent="📝 "+(memo[k]?"メモあり":"メモ")})});
 list.querySelectorAll("button.qb").forEach(b=>b.onclick=()=>{open["q"+b.dataset.qd]=!open["q"+b.dataset.qd];render()});
 list.querySelectorAll("button.qv").forEach(b=>b.onclick=()=>{const r=done["q:"+b.dataset.qd];if(r&&!r.ok){r.v=1;touch();render()}});
 list.querySelectorAll("button.qo").forEach(b=>b.onclick=()=>answer(b.dataset.qd,+b.dataset.qi));
 list.querySelectorAll("input[type=checkbox]").forEach(i=>i.onchange=()=>{if(i.checked)done[i.dataset.d]=1;else delete done[i.dataset.d];touch();render()});
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;ls.set(KEY+"-view",view);render();scrollTo(0,0)});
function initOpen(){if(QUIZ[today]&&!(done['q:'+today]&&done['q:'+today].ok))open['q'+today]=true}
initOpen();
render();
fetch('quiz.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&typeof j==='object'){QUIZ=j;initOpen();render()}}).catch(()=>{});
if(code){setSync("同期中…");pull();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()})}
</script></body></html>
