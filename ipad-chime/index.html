<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="チャイム">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>教室チャイム</title>
  <style>
    :root{color-scheme:dark;--bg:#07110f;--panel:#10201c;--line:#294039;--text:#eef8f4;--muted:#9db4ad;--accent:#6ee7b7;--warn:#fbbf24;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#17372e 0,var(--bg) 45%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;min-height:100dvh}.app{max-width:1000px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:.08em}.status{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:#0b1714;padding:7px 11px;border-radius:99px;font-size:13px;color:var(--muted)}.pill.ok{color:var(--accent);border-color:#28684f}.pill.warn{color:var(--warn);border-color:#69551d}.clock{text-align:center;padding:8vh 0 5vh}.time{font-size:clamp(76px,17vw,170px);font-weight:300;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.06em}.date{margin-top:18px;color:var(--muted);font-size:clamp(16px,2.5vw,23px)}.next{margin:28px auto 0;max-width:620px;padding:20px;border:1px solid var(--line);background:rgba(16,32,28,.72);border-radius:20px}.next small{color:var(--muted)}.next strong{display:block;font-size:clamp(21px,4vw,34px);margin-top:7px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}button{appearance:none;border:1px solid var(--line);background:#132720;color:var(--text);font:inherit;font-weight:700;border-radius:14px;padding:15px 12px;cursor:pointer}button.primary{background:var(--accent);color:#062017;border-color:transparent}button.danger{color:#fecdd3}button:active{transform:scale(.98)}.panel{background:rgba(16,32,28,.9);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}.panel h2{font-size:18px;margin:0 0 14px}.schedule{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 130px 120px auto;align-items:center;gap:10px;padding:12px;background:#0b1714;border-radius:14px}.row input,.row select{width:100%;border:1px solid var(--line);background:#09130f;color:var(--text);border-radius:10px;padding:11px;font:inherit}.row .days{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:24px}.settings{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted)}.settings input{width:180px}.hidden{display:none!important}.dim body,.dim{background:#000}.dim .app{opacity:.16}.dim .panel,.dim .controls,.dim header{display:none}.dim .clock{padding-top:23vh}.dim .next{border-color:#111;background:#020202}.dim .time{color:#78918a}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 110px auto}.row .days{grid-column:1/-1}.settings{align-items:flex-start;flex-direction:column}.settings input{width:100%}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand">教室チャイム</div><div class="status"><span id="audioStatus" class="pill warn">音声：未確認</span><span id="wakeStatus" class="pill warn">画面維持：未開始</span></div></header>
  <section class="clock"><div id="time" class="time">--:--:--</div><div id="date" class="date"></div><div class="next"><small>次のチャイム</small><strong id="next">予定を登録してください</strong></div></section>
  <section class="controls"><button id="enable" class="primary">音を有効化</button><button id="test">チャイム試聴</button><button id="dim">低照度モード</button><button id="fullscreen">全画面表示</button></section>
  <section class="panel"><h2>チャイム予定</h2><div id="schedule" class="schedule"></div><button id="add" style="margin-top:12px;width:100%">＋ 時刻を追加</button></section>
  <section class="panel settings"><label>チャイム音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label><span>設定はこのiPad内に保存されます</span></section>
</main>
<script>
const KEY='classroom_chime_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{volume:.8,items:[{id:crypto.randomUUID(),label:'授業開始',time:'17:00',days:[1,2,3,4,5],on:true}]};
let ctx=null,wakeLock=null,lastKey='';
const $=s=>document.querySelector(s),days=['日','月','火','水','木','金','土'];
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function bell(){if(!ctx)return;const now=ctx.currentTime;[0,1.05,2.1].forEach((d,i)=>{const g=ctx.createGain(),o=ctx.createOscillator(),o2=ctx.createOscillator();o.frequency.value=659.25;o2.frequency.value=987.77;g.gain.setValueAtTime(0,now+d);g.gain.linearRampToValueAtTime(state.volume*.2,now+d+.03);g.gain.exponentialRampToValueAtTime(.001,now+d+.9);o.connect(g);o2.connect(g);g.connect(ctx.destination);o.start(now+d);o2.start(now+d);o.stop(now+d+1);o2.stop(now+d+1)})}
async function enable(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();bell();$('#audioStatus').textContent='音声：有効';$('#audioStatus').className='pill ok';await keepAwake()}
async function keepAwake(){try{if('wakeLock'in navigator){wakeLock=await navigator.wakeLock.request('screen');$('#wakeStatus').textContent='画面維持：有効';$('#wakeStatus').className='pill ok'}else{$('#wakeStatus').textContent='自動ロックを「なし」に';}}catch(e){$('#wakeStatus').textContent='自動ロックを確認';}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ctx)keepAwake()});
function render(){state.items.sort((a,b)=>a.time.localeCompare(b.time));$('#volume').value=state.volume;const box=$('#schedule');box.innerHTML='';if(!state.items.length)box.innerHTML='<div class="empty">まだ予定がありません</div>';state.items.forEach(item=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<input class="label" value="${item.label.replaceAll('&','&amp;').replaceAll('"','&quot;')}"><input class="tm" type="time" value="${item.time}"><button class="toggle">${item.on?'ON':'OFF'}</button><button class="del danger">削除</button><div class="days"></div>`;const ds=row.querySelector('.days');days.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d;b.style.padding='7px 10px';b.style.marginRight='5px';b.style.opacity=item.days.includes(i)?'1':'.35';b.onclick=()=>{item.days=item.days.includes(i)?item.days.filter(x=>x!==i):[...item.days,i];save()};ds.appendChild(b)});row.querySelector('.label').onchange=e=>{item.label=e.target.value;save()};row.querySelector('.tm').onchange=e=>{item.time=e.target.value;save()};row.querySelector('.toggle').onclick=()=>{item.on=!item.on;save()};row.querySelector('.del').onclick=()=>{state.items=state.items.filter(x=>x.id!==item.id);save()};box.appendChild(row)})}
function tick(){const n=new Date();$('#time').textContent=n.toLocaleTimeString('ja-JP',{hour12:false});$('#date').textContent=n.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const hm=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;const key=`${n.toDateString()}-${hm}`;const due=state.items.find(x=>x.on&&x.days.includes(n.getDay())&&x.time===hm);if(due&&key!==lastKey){lastKey=key;bell()}let next=null;for(let plus=0;plus<8;plus++){const d=new Date(n);d.setDate(n.getDate()+plus);for(const x of state.items){if(!x.on||!x.days.includes(d.getDay()))continue;const [h,m]=x.time.split(':').map(Number),at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);if(at>n&&(!next||at<next.at))next={at,x}}}$('#next').textContent=next?`${next.x.label}　${next.at.toLocaleDateString('ja-JP',{weekday:'short'})} ${next.x.time}`:'予定はありません'}
$('#enable').onclick=enable;$('#test').onclick=()=>ctx?bell():enable();$('#dim').onclick=()=>document.documentElement.classList.toggle('dim');$('#fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();$('#add').onclick=()=>{state.items.push({id:crypto.randomUUID(),label:'チャイム',time:'12:00',days:[1,2,3,4,5],on:true});save()};$('#volume').oninput=e=>{state.volume=Number(e.target.value);localStorage.setItem(KEY,JSON.stringify(state))};render();tick();setInterval(tick,1000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
