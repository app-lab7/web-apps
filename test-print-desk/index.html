<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TestStock</title><link rel="stylesheet" href="style.css?v=5"><script defer src="pdf-lib.min.js"></script><script defer src="app.js?v=6"></script><script defer src="drive.js?v=6"></script><script defer src="print-preview.js?v=5"></script></head><body>
<div class="layout"><aside><div class="brand"><span class="mark" aria-hidden="true">▤</span><span>TestStock<small>塾の教材管理</small></span></div><div class="nav"><span aria-current="page">▤　テスト一覧</span></div><div class="storage"><strong>データの管理</strong><button id="connectDrive">共有ドライブを開く</button><button id="backup">バックアップを保存</button><label class="restore">バックアップを読み込む<input id="restore" type="file" accept=".json"></label><p>登録データはこのブラウザに保存されます。</p></div></aside>
<main><header><div><div class="eyebrow">教材管理 / テスト一覧</div><h1>テスト一覧</h1><p>テストの問題・解答・解説をまとめて管理</p></div><button id="add" class="primary">＋ テストを登録</button></header>
<p id="status" role="status"></p><section class="filters" aria-label="検索と絞り込み"><label>キーワード<input id="search" type="search" placeholder="テスト名・学校名・教科など"></label><label>学校<select id="schoolFilter"></select></label><label>学年<select id="gradeFilter"></select></label><label>年度<select id="yearFilter"></select></label></section>
<section class="panel"><div class="panelHead"><h2>登録テスト <span id="count"></span></h2><button id="clear" class="plain">絞り込みを解除</button></div><div id="list"></div></section></main></div>
<dialog id="editor"><form id="editForm"><div class="dialogHead"><h2 id="editTitle">テストを登録</h2><button type="button" data-close aria-label="閉じる">×</button></div><label>テスト名 <b>必須</b><input name="title" required maxlength="150" placeholder="例：2学期期末テスト"></label><div class="grid"><label>学校 <b>必須</b><input name="school" required maxlength="100" list="schools" placeholder="例：大府中学校"><datalist id="schools"></datalist></label><label>学年<select name="grade"></select></label><label>年度<input name="year" required type="number" min="1900" max="2200"></label><label>教科<input name="subject" maxlength="50" placeholder="例：数学"></label></div><label>GoogleドキュメントのURL<input name="doc" type="url" placeholder="https://docs.google.com/document/d/…"></label><p class="hint">元の文書を開くためのリンクです。印刷用には Googleドキュメントから PDF をダウンロードして添付してください。</p><div id="uploads"></div><p class="error" role="alert"></p><footer><button type="button" data-close>キャンセル</button><button class="primary" type="submit">保存</button></footer></form></dialog>
<dialog id="printer"><form id="printForm"><div class="dialogHead"><h2>印刷・PDF保存</h2><button type="button" data-close aria-label="閉じる">×</button></div><p id="printTitle"></p><fieldset><legend>含めるPDF</legend><div id="parts"></div></fieldset><label>レイアウト<select name="layout"><option value="normal">通常（元のページサイズ）</option><option value="a4">冊子（A4横 → A5仕上がり）</option><option value="a3">冊子（A3横 → A4仕上がり）</option></select></label><label id="bindingLine">綴じ方向<select name="binding"><option value="left">左綴じ</option><option value="right">右綴じ</option></select></label><p id="printHint" class="hint"></p><p class="error" role="alert"></p><footer><button type="submit" name="action" value="download">PDFを保存</button><button type="submit" name="action" value="preview" class="primary">印刷プレビュー</button></footer></form></dialog>
<dialog id="driveDialog"><form id="driveForm"><div class="dialogHead"><h2>共有ドライブを開く</h2><button type="button" data-close aria-label="閉じる">×</button></div><label>共有フォルダのURL<input name="folder" type="url" required placeholder="https://drive.google.com/drive/folders/…"></label><label><input type="checkbox" name="remember" checked> このブラウザに教材一覧を保存する</label><p class="hint">保存するのは教材名と分類などの一覧情報です。印刷時はGoogleドライブの閲覧権限が必要です。</p><p class="error" role="alert"></p><footer><button type="button" id="closeDrive" hidden>接続解除・保存一覧を消去</button><button class="primary" type="submit">Googleで接続</button></footer></form></dialog><dialog id="previewDialog"><div class="dialogHead"><h2>印刷プレビュー</h2><button type="button" id="closePreview" aria-label="閉じる">×</button></div><p id="previewInfo" role="status"></p><div id="previewPages"></div><footer><button type="button" id="backToPrint">印刷設定に戻る</button><button type="button" id="sendToPrinter" class="primary" disabled>印刷する</button></footer></dialog><div id="printPages" aria-hidden="true"></div><style id="printPaperRules"></style></body></html>
