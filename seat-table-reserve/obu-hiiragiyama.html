<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>座席表｜大府柊山校 予備版</title>
<link rel="stylesheet" href="style.css?v=1790923500004">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="reserve.css">
</head>
<body data-locked>
<nav class="reserve-nav" aria-label="予備版ナビゲーション"><strong>大府柊山校の予備版</strong><a href="./">教室選択に戻る</a></nav>
<header class="topbar">
<div class="brand">
<div class="brand-mark">座</div>
<div class="brand-text">
<h1>座席表｜大府柊山校</h1>
<p>授業配置を、すばやく分かりやすく。</p>
</div>
</div>
<div class="save-indicator" id="saveIndicator">
<span class="dot"></span>
<span id="saveIndicatorText">この端末に自動保存</span>
</div>
</header>

<nav class="tabs" id="tabs">
<button class="tab-btn active" data-tab="seat">座席表</button>
<button class="tab-btn" data-tab="students">生徒名簿 <span class="count" id="studentCount">0</span></button>
<button class="tab-btn" data-tab="teachers">講師名簿 <span class="count" id="teacherCount">0</span></button>
<button class="tab-btn" data-tab="print">印刷プレビュー</button>
<button class="tab-btn" data-tab="settings">設定・バックアップ</button>
</nav>

<main id="app">
<section id="view-seat" class="view"></section>
<section id="view-students" class="view" hidden></section>
<section id="view-teachers" class="view" hidden></section>
<section id="view-print" class="view" hidden></section>
<section id="view-settings" class="view" hidden></section>
</main>

<div id="toast" class="toast" hidden></div>
<div id="modalRoot"></div>
<div id="multiDayPrint" hidden></div>

<script>
(function(){
  const prefix = "seat-reserve-obu-hiiragiyama:";
  function scoped(storage){
    return {
      getItem(key){ return storage.getItem(prefix + key); },
      setItem(key, value){ storage.setItem(prefix + key, value); },
      removeItem(key){ storage.removeItem(prefix + key); }
    };
  }
  window.__seatStorageOverride = scoped(window.localStorage);
  window.__seatSessionStorageOverride = scoped(window.sessionStorage);
  window.__seatClassroomId = "seat-table-classroom-1";
})();
</script>
<section class="reserve-lock" aria-labelledby="lock-title">
  <form id="reserve-lock-form">
    <h2 id="lock-title">座席表を開く</h2>
    <p id="lock-help">番号の設定を確認しています。</p>
    <label for="lock-pin">4桁の番号</label>
    <input id="lock-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required disabled>
    <div id="lock-confirm-wrap" hidden>
      <label for="lock-confirm">番号をもう一度入力</label>
      <input id="lock-confirm" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4">
    </div>
    <p id="lock-error" role="status"></p>
    <button id="lock-submit" disabled>開く</button>
    <a href="./">教室選択に戻る</a>
  </form>
</section>
<script src="reserve-lock.js?v=2"></script>
</body>
</html>
