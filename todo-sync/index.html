<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ToDo Sync</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--danger:#dc2626;--warn:#d97706;--ok:#15803d;--shadow:0 10px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,select{font:inherit}.wrap{max-width:1160px;margin:auto;padding:24px 18px 56px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}h1{margin:0 0 4px;font-size:28px}.sub,.small{color:var(--muted);font-size:13px}.btn,.field{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}.btn{cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.auth{max-width:440px;margin:8vh auto;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:24px}.stack{display:grid;gap:10px;margin-top:18px}.msg{font-size:13px;min-height:18px;color:#b91c1c}.userbar,.addbox,.card,.panel{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px}.userbar{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:14px}.spacer{flex:1}.sync{font-size:12px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.card{padding:15px}.klabel{font-size:12px;color:var(--muted);font-weight:700}.kpi{font-size:27px;font-weight:800;margin-top:3px}.addbox{display:grid;grid-template-columns:minmax(220px,1fr) 150px 160px auto;gap:10px;padding:14px}.field-wrap{display:grid;gap:5px}.field-label{font-size:11px;font-weight:700;color:var(--muted);padding-left:2px}.priority-select{font-weight:700}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.tabs{display:flex;gap:5px;background:#e9edf5;padding:4px;border-radius:10px}.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}.tab.active{background:#fff;box-shadow:0 1px 4px #0002}.search{margin-left:auto}.panel{overflow:hidden}table{width:100%;border-collapse:collapse}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);background:#fafafa}.task{font-weight:750}.meta{font-size:12px;color:var(--muted)}tr.due-overdue td{background:#feecec}tr.due-today td{background:#fff0df}tr.due-soon td{background:#fff9dc}tr.due-week td{background:#f1f8e9}tr.done td{background:#f3f4f6!important}.done{opacity:.5}.done .task{text-decoration:line-through}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.high{background:#fee2e2;color:#991b1b}.mid{background:#fef3c7;color:#92400e}.low{background:#e0f2fe;color:#075985}.red{color:var(--danger);font-weight:800}.orange{color:var(--warn);font-weight:800}.green{color:var(--ok);font-weight:800}.icon{border:0;background:none;font-size:17px;cursor:pointer;color:#6b7280;padding:5px}.empty{text-align:center;padding:46px;color:var(--muted)}.note{margin-top:10px;color:var(--muted);font-size:12px}.row-actions{white-space:nowrap}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.dialog{width:min(520px,100%);background:#fff;border-radius:18px;padding:22px;box-shadow:0 24px 70px #0004}.dialog h2{margin:0 0 16px}.edit-grid{display:grid;gap:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.addbox{grid-template-columns:1fr 1fr}.addbox .taskin,.addbox .primary{grid-column:1/-1}.panel{overflow:auto}table{min-width:780px}.search{margin-left:0;width:100%}.userbar{flex-wrap:wrap}}
</style></head>
<body><div class="wrap">
<section id="auth" class="auth"><h2>ToDo Sync</h2><p class="small">ログインすると、自分のToDoだけをPC・スマホで同期できます。</p><div class="stack"><input id="email" class="field" type="email" placeholder="メールアドレス"><input id="password" class="field" type="password" placeholder="パスワード（6文字以上）"><button class="btn primary" id="loginBtn">ログイン</button><button class="btn" id="signupBtn">新規登録</button><div id="authMsg" class="msg"></div></div></section>
<section id="app" class="hidden"><div class="top"><div><h1>ToDo Sync</h1><div class="sub">自分専用のToDoを、端末をまたいで同期。</div></div></div><div class="userbar"><strong id="userEmail"></strong><span class="sync" id="syncState">同期済み</span><div class="spacer"></div><button class="btn" id="logoutBtn">ログアウト</button></div><div class="summary"><div class="card"><div class="klabel">未完了</div><div class="kpi" id="openK">0</div></div><div class="card"><div class="klabel">今日まで</div><div class="kpi" id="todayK">0</div></div><div class="card"><div class="klabel">3日以内</div><div class="kpi" id="soonK">0</div></div><div class="card"><div class="klabel">完了</div><div class="kpi" id="doneK">0</div></div></div>
<div class="addbox"><input id="task" class="field taskin" placeholder="やることを入力…"><input id="due" class="field" type="date"><select id="priority" class="field priority-select"><option value="中">優先度：中</option><option value="高">優先度：高</option><option value="低">優先度：低</option></select><button class="btn primary" id="addBtn">＋ タスク追加</button></div>
<div class="toolbar"><div class="tabs"><button class="tab active" data-filter="all">すべて</button><button class="tab" data-filter="today">今日</button><button class="tab" data-filter="week">今週</button><button class="tab" data-filter="done">完了</button></div><select id="sort" class="field"><option value="due">締切順</option><option value="priority">優先度順</option><option value="created">追加順</option></select><input id="search" class="field search" placeholder="検索"></div><div class="panel"><table><thead><tr><th>完了</th><th>優先度</th><th>タスク</th><th>締切</th><th>残日数</th><th></th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty hidden">タスクはありません。</div></div><div class="note">締切が近いタスクほど背景色で強調します。入力中のEnterでは追加されません。</div></section></div>
<div id="editModal" class="modal hidden"><div class="dialog"><h2>タスクを編集</h2><div class="edit-grid"><div class="field-wrap"><label class="field-label" for="editTask">タスク名</label><input id="editTask" class="field"></div><div class="field-wrap"><label class="field-label" for="editDue">締切日</label><input id="editDue" class="field" type="date"></div><div class="field-wrap"><label class="field-label" for="editPriority">優先度</label><select id="editPriority" class="field"><option value="高">高</option><option value="中">中</option><option value="低">低</option></select></div></div><div class="dialog-actions"><button class="btn" id="cancelEdit">キャンセル</button><button class="btn primary" id="saveEdit">保存</button></div></div></div>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import{getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const config={apiKey:"AIzaSyB2DxyfSoNEiEPRCWHPLcLz8z1rpBL78sE",authDomain:"todo-sync-4e467.firebaseapp.com",projectId:"todo-sync-4e467",storageBucket:"todo-sync-4e467.firebasestorage.app",messagingSenderId:"771396467067",appId:"1:771396467067:web:6c668c3eb48f07aa05e5de"};const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let user,tasks=[],filter='all',unsub,editingId;
const todoRef=()=>collection(db,'users',user.uid,'todos');const days=s=>{if(!s)return null;let a=new Date(s+'T00:00:00'),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.round((a-b)/864e5)};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
$('signupBtn').onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('authMsg').textContent='登録できませんでした: '+e.code}};$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('authMsg').textContent='メールアドレスまたはパスワードを確認してください。'}};$('logoutBtn').onclick=()=>signOut(auth);$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};
onAuthStateChanged(auth,u=>{user=u;if(unsub)unsub();if(u){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=u.email;unsub=onSnapshot(todoRef(),s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()}));render();$('syncState').textContent='同期済み'})}else{$('app').classList.add('hidden');$('auth').classList.remove('hidden')}});
$('addBtn').onclick=async()=>{const name=$('task').value.trim();if(!name)return;$('syncState').textContent='保存中…';await addDoc(todoRef(),{task:name,due_date:$('due').value||null,priority:$('priority').value,done:false,created_at:serverTimestamp(),updated_at:serverTimestamp()});$('task').value=''};
window.toggleTodo=(id,v)=>updateDoc(doc(db,'users',user.uid,'todos',id),{done:v,updated_at:serverTimestamp()});window.deleteTodo=async id=>{if(confirm('このタスクを削除しますか？'))await deleteDoc(doc(db,'users',user.uid,'todos',id))};window.openEdit=id=>{let t=tasks.find(x=>x.id===id);editingId=id;$('editTask').value=t.task;$('editDue').value=t.due_date||'';$('editPriority').value=t.priority||'中';$('editModal').classList.remove('hidden')};$('cancelEdit').onclick=()=>$('editModal').classList.add('hidden');$('saveEdit').onclick=async()=>{let name=$('editTask').value.trim();if(!name)return;await updateDoc(doc(db,'users',user.uid,'todos',editingId),{task:name,due_date:$('editDue').value||null,priority:$('editPriority').value,updated_at:serverTimestamp()});$('editModal').classList.add('hidden')};
function rowUrgency(t,n){if(t.done)return'done';if(n===null)return'';if(n<0)return'due-overdue';if(n===0)return'due-today';if(n<=3)return'due-soon';if(n<=7)return'due-week';return''}
function render(){let q=$('search').value.toLowerCase();let list=tasks.filter(t=>{let n=days(t.due_date);if(q&&!String(t.task).toLowerCase().includes(q))return false;if(filter==='done')return t.done;if(filter==='today')return !t.done&&n!==null&&n<=0;if(filter==='week')return !t.done&&n!==null&&n>=0&&n<=7;return true});let pr=p=>p==='高'?3:p==='中'?2:1;list.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;let x=days(a.due_date)??9999,y=days(b.due_date)??9999,m=$('sort').value;if(m==='priority')return pr(b.priority)-pr(a.priority)||x-y;if(m==='created')return (b.created_at?.seconds||0)-(a.created_at?.seconds||0);return x-y});$('tbody').innerHTML=list.map(t=>{let n=days(t.due_date),left=t.done?'完了':n===null?'期限なし':n<0?`${-n}日超過`:n===0?'今日まで':`あと${n}日`;let cls=n!==null&&n<=0?'red':n!==null&&n<=3?'orange':'green';let d=t.due_date?new Date(t.due_date+'T00:00:00'):null,ds=d?`${d.getMonth()+1}/${d.getDate()}`:'—';return`<tr class="${rowUrgency(t,n)}"><td><input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo('${t.id}',this.checked)"></td><td><span class="badge ${t.priority==='高'?'high':t.priority==='低'?'low':'mid'}">${t.priority||'中'}</span></td><td><div class="task">${esc(t.task)}</div></td><td>${ds}</td><td><span class="${cls}">${left}</span></td><td class="row-actions"><button class="icon" onclick="openEdit('${t.id}')">✎</button><button class="icon" onclick="deleteTodo('${t.id}')">×</button></td></tr>`}).join('');$('empty').classList.toggle('hidden',list.length>0);let o=tasks.filter(t=>!t.done);$('openK').textContent=o.length;$('todayK').textContent=o.filter(t=>days(t.due_date)!==null&&days(t.due_date)<=0).length;$('soonK').textContent=o.filter(t=>days(t.due_date)>0&&days(t.due_date)<=3).length;$('doneK').textContent=tasks.filter(t=>t.done).length}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});$('sort').onchange=render;$('search').oninput=render;</script></body></html>
