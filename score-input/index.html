<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>共和校 成績入力</title><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="共和校 入力"><meta name="theme-color" content="#1769AA"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}header{background:#173b68;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:2}header b{font-size:20px}header small{display:block;opacity:.8;margin-top:3px}main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #18304c12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#5c6878;margin:0 0 5px}select,input,textarea{width:100%;font-size:16px;padding:12px;border:1px solid #cfd8e4;border-radius:10px;background:#fff}.subject{border-top:4px solid #d7dde6}.subject h3{margin:0 0 12px}.subject .grid{grid-template-columns:repeat(3,1fr)}input[readonly]{background:#eef4f9;color:#526174}button{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;background:#1769aa;color:#fff}.sub{background:#e9eef5;color:#25364a;margin-top:8px}.danger{background:#fff0f0;color:#b42318;border:1px solid #f2b8b5}#status{font-size:14px;text-align:center;margin-top:10px;min-height:20px}.hint{font-size:12px;color:#738094;line-height:1.6}.loading{opacity:.65;pointer-events:none}@media(max-width:600px){main{padding:10px}.grid,.subject .grid{grid-template-columns:1fr 1fr}.subject .grid>div:last-child{grid-column:1/-1}}body.locked>header,body.locked>main,body.locked>dialog{display:none}.gate[hidden]{display:none}.gate{min-height:100dvh;display:grid;place-items:center;padding:20px;background:#eef3f8;font-family:system-ui,sans-serif;color:#203047}.gate-card{width:min(100%,380px);background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 32px #183d6522}.gate-card h1{font-size:24px;color:#183d65;margin:0 0 8px}.gate-card p{line-height:1.6}.gate-card label{display:block;margin-bottom:8px}.gate-card input{width:100%;box-sizing:border-box;padding:12px;font-size:18px;border:1px solid #c8d3e0;border-radius:8px}.gate-card button{width:100%;margin-top:12px;padding:13px;background:#126d91;color:white;border:0;border-radius:8px;font-size:17px;font-weight:bold}.gate-error{color:#b42318;min-height:1.5em;font-size:14px}@media(max-width:600px){main>.card>.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid>div,.subject .grid>div{min-width:0}select{min-width:0}header b{font-size:19px}#status,.hint{overflow-wrap:anywhere;word-break:normal}button{line-height:1.35;min-height:48px}}.startup[hidden]{display:none}.startup{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#203047;font-family:system-ui,sans-serif}.startup-card{text-align:center;width:min(100%,380px);padding:36px 24px;background:white;border:1px solid #dce5eb;border-radius:20px;box-shadow:0 14px 44px #183d6514}.startup-mark{display:block;color:#1769AA;font-weight:800;font-size:14px;letter-spacing:.1em;margin-bottom:26px}.startup-spinner{width:46px;height:46px;margin:0 auto 25px;border:5px solid #e3ebee;border-top-color:#1769AA;border-radius:50%;animation:startup-spin .8s linear infinite}.startup strong{display:block;font-size:20px;margin-bottom:8px}.startup p{font-size:14px;color:#60727e;margin:0;line-height:1.6}@keyframes startup-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.startup-spinner{animation:none;border-color:#1769AA}}</style></head><body class="locked"><div id="gate" class="gate"><form id="gateForm" class="gate-card"><h1>Score Input</h1><p>アプリのパスワードを入力してください。</p><label for="gatePassword">パスワード</label><input id="gatePassword" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required><button>開く</button><p id="gateError" class="gate-error" role="alert"></p></form></div><div id="startup" class="startup" role="status" aria-live="polite" hidden><div class="startup-card"><span class="startup-mark">共和校</span><div class="startup-spinner" aria-hidden="true"></div><strong>成績入力を準備中</strong><p>名簿とテストを読み込んでいます</p></div></div>
<header><b>Score Input</b><small>共和校　中学生テスト成績入力</small></header><main><div class="card"><div class="grid"><div><label>年度</label><select id="year"></select></div><div><label>テスト</label><select id="test"><option value="">読み込み中…</option></select></div><div><label>学年</label><select id="grade"><option value="">学年を選択</option></select></div><div><label>生徒</label><select id="student"><option value="">生徒を選択</option></select></div></div></div><div class="card"><label for="school">学校（生徒マスターに登録）</label><select id="school" disabled><option value="">生徒を選択してください</option></select><button class="sub" id="schoolSave" disabled>学校を名簿に保存</button><button class="sub" id="masterReload">名簿・学校候補を再読込</button><p class="hint" id="schoolHint">学校を選び、ボタンを押すと名簿に反映します。</p></div><div id="subjects"></div><div class="card"><div class="grid"><div><label>順位</label><input id="rank" inputmode="numeric" placeholder="例：12"></div><div><label>回収状況</label><select id="collect"><option value="○">○ 回収済</option><option value="未">未回収</option></select></div><div class="full"><label>メモ</label><textarea id="memo" rows="3" placeholder="面談・テストについてのメモ"></textarea></div></div></div><div class="card"><button id="save">保存する</button><button class="sub" id="reload">保存済みを再読込</button><button class="sub" id="clear">入力をクリア</button><button class="sub danger" id="delete">この成績を削除</button><div id="status"></div><p class="hint">削除は選択中の年度・テスト・生徒の保存済み成績だけに適用されます。生徒別点数などの数式は変更しません。</p></div></main>
<script>
const CONFIG={apiUrl:"https://script.google.com/macros/s/AKfycbya7qViVMKVJau3fZ1fgyKF82jkAeQOtMMQSpzC8fqjhRBMgoB9h8cf0nCmWcVL7izntQ/exec"};const MASTER_CACHE_KEY="kyowa-score-input-master-v1",MASTER_CACHE_MAX_AGE=24*60*60*1000;const subjects=["国語","数学","英語","理科","社会"],$=s=>document.querySelector(s);let state={tests:[],students:[],schools:[],capabilities:{}};let schoolBusy=false,recordRequest=0;
function h(v){return String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function setStatus(t,bad=false){$("#status").textContent=t;$("#status").style.color=bad?"#c13b3b":"#1769aa"}function value(id){return $(id).value}
$("#subjects").innerHTML=subjects.map(s=>`<div class="card subject"><h3>${s}</h3><div class="grid"><div><label>本人点</label><input data-s="${s}" data-k="score" inputmode="decimal" placeholder="点"></div><div><label>学校平均</label><input data-s="${s}" data-k="avg" readonly placeholder="マスター未登録"></div><div><label>偏差値</label><input data-s="${s}" data-k="dev" inputmode="decimal" placeholder="偏差値"></div></div></div>`).join("");
async function api(action,data){let u=CONFIG.apiUrl+"?action="+encodeURIComponent(action);if(data)u+="&data="+encodeURIComponent(JSON.stringify(data));const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);let j;try{const r=await fetch(u,{cache:"no-store",signal:controller.signal});j=await r.json()}catch(e){if(e.name==="AbortError")throw Error("読み込みがタイムアウトしました。再読込してください");throw e}finally{clearTimeout(timer)}if(!j.ok)throw Error(j.message||"通信に失敗しました");return j}function fill(sel,items,placeholder,mapper=v=>[v,v]){$(sel).innerHTML=`<option value="">${placeholder}</option>`+items.map(v=>{const [a,b]=mapper(v);return `<option value="${h(a)}">${h(b)}</option>`}).join("")}
function refreshTests(){const keep=value("#test"),year=value("#year");fill("#test",state.tests.filter(x=>String(x.year)===String(year)),"テストを選択",x=>[x.name,x.name]);if([...$("#test").options].some(o=>o.value===keep))$("#test").value=keep}function refreshGrades(){const keep=value("#grade"),year=value("#year");const grades=[...new Set(state.students.filter(s=>String(s.startYear)<=String(year)&&s.status==="在籍").map(s=>s.grade))];fill("#grade",grades,"学年を選択");if(grades.includes(keep))$("#grade").value=keep;refreshStudents()}function refreshStudents(){const keep=value("#student"),g=value("#grade"),list=state.students.filter(s=>s.status==="在籍"&&s.grade===g);fill("#student",list,"生徒を選択",s=>[s.id,`${s.name}${s.school?"（"+s.school+"）":""}`]);if(list.some(s=>s.id===keep))$("#student").value=keep;refreshSchool()}
function setScores(scores={}){subjects.forEach(s=>["score","avg","dev"].forEach(k=>document.querySelector(`[data-s="${s}"][data-k="${k}"]`).value=(scores[s]||{})[k]??""))}function clearInputs(){setScores();$("#rank").value="";$("#collect").value="○";$("#memo").value=""}
async function loadRecord(){const request=++recordRequest;refreshSchool();clearInputs();if(!value("#year")||!value("#test")||!value("#student"))return;setStatus("保存内容を読み込み中…");try{const d=await api("record",{year:value("#year"),test:value("#test"),studentId:value("#student")});if(request!==recordRequest)return;if(d.record){setScores(d.record.scores);$("#rank").value=d.record.rank||"";$("#collect").value=d.record.collect||"○";$("#memo").value=d.record.memo||"";setStatus("保存済みの内容を読み込みました")}else{setScores(d.averages||{});setStatus("新規入力です。学校平均はマスターから読み込みました")}}catch(e){setStatus(e.message,true)}}
function payload(){const p={year:value("#year"),test:value("#test"),grade:value("#grade"),studentId:value("#student"),rank:value("#rank"),collect:value("#collect"),memo:value("#memo"),scores:{}};subjects.forEach(s=>{p.scores[s]={};["score","avg","dev"].forEach(k=>p.scores[s][k]=document.querySelector(`[data-s="${s}"][data-k="${k}"]`).value)});return p}
function applyMaster(d){state={tests:d.tests||[],students:d.students||[],schools:d.schools||[],capabilities:d.capabilities||{}};const keepYear=value("#year"),keepTest=value("#test"),keepGrade=value("#grade"),keepStudent=value("#student"),years=[...new Set(state.tests.map(x=>String(x.year)))].sort();fill("#year",years,"年度を選択");const now=String(new Date().getFullYear());$("#year").value=years.includes(keepYear)?keepYear:(years.includes(now)?now:years.at(-1)||"");refreshTests();if([...$("#test").options].some(o=>o.value===keepTest))$("#test").value=keepTest;refreshGrades();if([...$("#grade").options].some(o=>o.value===keepGrade))$("#grade").value=keepGrade;refreshStudents();if([...$("#student").options].some(o=>o.value===keepStudent))$("#student").value=keepStudent;refreshSchool()}
function cachedMaster(){try{const x=JSON.parse(localStorage.getItem(MASTER_CACHE_KEY)||"null");return x&&Date.now()-x.savedAt<MASTER_CACHE_MAX_AGE?x.data:null}catch(_){return null}}
function cacheMaster(d){try{localStorage.setItem(MASTER_CACHE_KEY,JSON.stringify({savedAt:Date.now(),data:{tests:d.tests||[],students:d.students||[],schools:d.schools||[],capabilities:d.capabilities||{}}}))}catch(_){}}
async function refreshMaster(){const d=await api("bootstrap");if(!Array.isArray(d.tests)||!d.tests.length||!Array.isArray(d.students)||!d.students.length)throw Error("接続先のApps Scriptが旧版です。管理者に更新を依頼してください");applyMaster(d);cacheMaster(d);setStatus("名簿とテスト設定を読み込みました")}
function hideStartup(){$("#startup").hidden=true}
async function boot(){const cached=cachedMaster();if(cached){applyMaster(cached);hideStartup();setStatus("名簿を表示しました（最新データを確認中…）");refreshMaster().catch(e=>setStatus("前回の名簿を表示中です。最新化できませんでした："+e.message,true));return}try{await refreshMaster()}catch(e){setStatus("マスターを取得できませんでした："+e.message,true)}finally{hideStartup()}}
$("#year").addEventListener("change",()=>{refreshTests();refreshGrades();clearInputs()});$("#test").addEventListener("change",loadRecord);$("#grade").addEventListener("change",()=>{refreshStudents();clearInputs()});$("#student").addEventListener("change",loadRecord);$("#reload").onclick=loadRecord;$("#clear").onclick=()=>{clearInputs();setStatus("")};$("#save").onclick=async()=>{if(!value("#year")||!value("#test")||!value("#grade")||!value("#student")){setStatus("年度・テスト・学年・生徒を選択してください",true);return}const b=$("#save");b.disabled=true;setStatus("保存中…");try{const r=await fetch(CONFIG.apiUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"save",data:payload()})});const d=await r.json();if(!d.ok)throw Error(d.message||"保存できませんでした");setScores(d.record.scores);setStatus("保存しました。生徒別点数にも反映済みです")}catch(e){setStatus(e.message||"保存に失敗しました",true)}finally{b.disabled=false}};$("#delete").onclick=async()=>{if(!value("#year")||!value("#test")||!value("#student")){setStatus("年度・テスト・生徒を選択してください",true);return}if(!confirm("選択中の生徒・年度・テストの保存済み成績を削除します。元に戻せません。"))return;const b=$("#delete");b.disabled=true;setStatus("削除中…");try{const r=await fetch(CONFIG.apiUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete",data:{year:value("#year"),test:value("#test"),studentId:value("#student")}})});const d=await r.json();if(!d.ok)throw Error(d.message||"削除できませんでした");clearInputs();setStatus("削除しました。生徒別点数にも反映済みです")}catch(e){setStatus(e.message||"削除に失敗しました",true)}finally{b.disabled=false}};
$("#masterReload").onclick=async()=>{if(schoolBusy)return;const b=$("#masterReload");b.disabled=true;setStatus("名簿と学校候補を読み込み中…");try{await refreshMaster()}catch(e){setStatus(e.message,true)}finally{b.disabled=false}};
function refreshSchool(){
  const st=state.students.find(s=>s.id===value('#student'));
  const schools=[...new Set((state.capabilities.schoolMaster===true?state.schools:[...state.schools,...state.students.map(s=>s.school)]).filter(Boolean))].sort();
  fill('#school',schools,'学校を選択');
  $('#school').value=st?.school||'';
  const enabled=!!st&&state.capabilities.schoolUpdate===true;
  $('#school').disabled=schoolBusy||!st||schools.length===0;$('#schoolSave').disabled=schoolBusy||!enabled;
  $('#schoolHint').textContent=!st?'先に学年と生徒を選択してください。':schools.length===0?'学校候補がありません。学校マスターへの登録後、再読込してください。':state.capabilities.schoolUpdate===true?'学校を選び、ボタンを押すと名簿に反映します。':'学校は選択できます。名簿への保存には最新データの読み込みが必要です。';
}
$('#school').onchange=()=>{
  if(value('#school')!=='__new_school__')return;
  const name=(prompt('学校名を入力してください（学校平均マスターと同じ表記）')||'').trim();
  if(!name){refreshSchool();return}
  if(name.length>80||/^[=+@-]/.test(name)||/[\r\n\t]/.test(name)){setStatus('学校名を確認してください',true);refreshSchool();return}
  if(![...$('#school').options].some(o=>o.value===name)){const option=document.createElement('option');option.value=name;option.textContent=name;$('#school').append(option)}
  $('#school').value=name;
};
$('#schoolSave').onclick=async()=>{
  const st=state.students.find(s=>s.id===value('#student')),school=value('#school');
  if(schoolBusy||!st||!school||school==='__new_school__')return;
  schoolBusy=true;++recordRequest;
  const controls=['#year','#test','#grade','#student','#school','#schoolSave','#save','#delete','#reload'];
  const disabled=controls.map(id=>$(id).disabled);controls.forEach(id=>$(id).disabled=true);
  setStatus('学校を名簿に保存中…');
  try{
    const response=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'school',data:{studentId:st.id,school,previousSchool:st.school||'',year:value('#year'),test:value('#test')}})});
    const d=await response.json();if(!d.ok||d.school!==school||d.studentId!==st.id)throw Error(d.message||'学校を保存できませんでした');
    st.school=d.school;if(!state.schools.includes(d.school))state.schools.push(d.school);
    refreshStudents();cacheMaster(state);
    subjects.forEach(sub=>document.querySelector(`[data-s="${sub}"][data-k="avg"]`).value=d.averages?.[sub]?.avg??'');
    setStatus('学校を名簿に保存しました。点数は「保存する」で保存してください。');
  }catch(error){setStatus(error.message||'学校を保存できませんでした',true)}
  finally{schoolBusy=false;controls.forEach((id,n)=>$(id).disabled=disabled[n])}
};
const GATE_KEY='kyowa-score-input-unlocked-v1',GATE_HASH='52fca1c4244d415a9f7934878ec582a71099283471514360ff8976d1463118d9';
function unlock(){document.body.classList.remove('locked');$('#gate').hidden=true;$('#startup').hidden=false;boot()}
$('#gateForm').onsubmit=async e=>{e.preventDefault();const input=$('#gatePassword'),bytes=new TextEncoder().encode(input.value),digest=await crypto.subtle.digest('SHA-256',bytes),value=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');if(value!==GATE_HASH){$('#gateError').textContent='パスワードが違います。';input.value='';input.focus();return}try{sessionStorage.setItem(GATE_KEY,'1')}catch(_){}unlock()};
try{if(sessionStorage.getItem(GATE_KEY)==='1')unlock()}catch(_){}
</script></body></html>
