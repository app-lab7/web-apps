<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melody Compose</title><style>:root{--bg:#111318;--panel:#181b21;--panel2:#20242b;--line:#303641;--text:#e8edf5;--muted:#8d96a5;--blue:#5d9cff;--red:#ef5262}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.app{height:100vh;display:grid;grid-template-columns:250px 1fr;grid-template-rows:48px 1fr;overflow:hidden}.top{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#0d0f13}.top strong{font-size:14px}.top span{font-size:11px;color:var(--muted)}.side{padding:12px;border-right:1px solid var(--line);overflow:auto}.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}.status{font-size:11px;color:#b7c0cc;padding:8px 10px;border:1px solid var(--line);background:var(--panel);border-radius:5px;margin-bottom:10px}.tempo{display:flex;align-items:center;gap:7px}.tempo button,.btn,select,input{height:34px;border:1px solid #3a414d;background:#242932;color:var(--text);border-radius:5px;font:inherit}.tempo button{width:34px;font-size:18px}.bpm{flex:1;background:#0d0f13;border:1px solid var(--line);padding:5px 8px;border-radius:5px}.bpm b{display:block;font:700 24px ui-monospace,monospace}.bpm small{font-size:9px;color:var(--muted)}input[type=range]{width:100%;height:auto;border:0;background:none;accent-color:var(--blue);margin:10px 0}.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}.btn{padding:0 10px;cursor:pointer;font-size:11px;font-weight:650}.btn.on{border-color:var(--blue);background:#203653}.recordbox{display:flex;align-items:center;gap:9px;margin:14px 0 10px}.rec{width:42px;height:42px;border-radius:50%;background:var(--red);border:5px solid #2c313a;outline:1px solid #535b68;cursor:pointer}.rec.on{border-radius:8px}.time{font:700 17px ui-monospace,monospace}.wave{height:70px;border:1px solid var(--line);background:#0d0f13;border-radius:4px;display:flex;align-items:center;gap:2px;padding:8px;overflow:hidden}.bar{width:3px;min-width:3px;height:8px;background:#66707e}.level{margin-top:8px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between}.primary{border-color:#477dcc;background:#23579c}.workbar{padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}.workbar .title{font-size:12px;font-weight:700;margin-right:auto}.workbar select,.workbar button{height:32px}.guide{padding:7px 10px;font-size:11px;color:#aeb7c4;border-bottom:1px solid var(--line);background:#15191f}.guide b{color:#7fb1ff}.roll{flex:1;overflow:auto;background:#0e1014;position:relative}.grid{position:relative;min-width:1200px;height:528px;background:repeating-linear-gradient(to right,transparent 0,transparent 43px,#232932 44px),repeating-linear-gradient(to right,transparent 0,transparent 175px,#39414d 176px),repeating-linear-gradient(to bottom,#171b21 0,#171b21 21px,#262c35 22px)}.keys{position:absolute;left:0;top:0;width:60px;height:100%;z-index:2;background:#1a1e25;border-right:1px solid #3c444f}.key{height:22px;border-bottom:1px solid #252b34;font-size:9px;color:#929cac;padding:4px 6px;text-align:right}.notes{position:absolute;left:62px;right:8px;top:0;bottom:0}.note{position:absolute;height:18px;border:1px solid #7ab1ff;border-radius:2px;background:#4e91e8;color:white;font-size:9px;padding:1px 5px;cursor:pointer;overflow:hidden;white-space:nowrap}.note.sel{outline:2px solid #ffd166;outline-offset:1px}.editor{padding:8px 10px;border-top:1px solid var(--line);background:var(--panel);display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:7px}.editor label{font-size:9px;color:var(--muted)}.editor input,.editor select{width:100%;margin-top:3px;padding:0 8px}.empty{position:absolute;left:90px;top:34px;color:#687281;font-size:12px}.audio{width:100%;margin-top:8px;display:none}@media(max-width:760px){.app{height:auto;min-height:100vh;display:block}.side{border-right:0;border-bottom:1px solid var(--line)}.main{height:70vh}.editor{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><header class="top"><strong>Melody Compose</strong><span>VOICE → MIDI STYLE</span></header><aside class="side"><div id="status" class="status">テンポを決めて録音してください</div><div class="tempo"><button id="minus">−</button><div class="bpm"><b id="bpmText">120</b><small>BPM</small></div><button id="plus">＋</button></div><input id="bpm" type="range" min="40" max="240" value="120"><div class="row"><select id="meter"><option value="4">4 / 4</option><option value="3">3 / 4</option></select><button id="metro" class="btn on">メトロノーム ON</button></div><div class="recordbox"><button id="record" class="rec" aria-label="録音"></button><div><div id="recLabel" style="font-size:11px;font-weight:700">録音する</div><div id="time" class="time">00:00.0</div></div></div><div id="wave" class="wave"></div><div class="level"><span>マイク入力</span><b id="level">0%</b></div><audio id="audio" class="audio" controls></audio><div class="row" style="margin-top:10px"><button id="playVoice" class="btn" disabled>▶ 元の歌声</button><button id="redo" class="btn" disabled>↻ 録り直す</button></div></aside><main class="main"><div class="workbar"><div class="title">ピアノロール</div><select id="instrument"><option value="piano">ピアノ</option><option value="epiano">エレピ</option><option value="synth">シンセ</option></select><select id="quant"><option value="0.25">1/16</option><option value="0.5" selected>1/8</option><option value="1">1/4</option></select><button id="playNotes" class="btn primary" disabled>▶ 楽器音で聴く</button><button id="delete" class="btn" disabled>削除</button></div><div id="guide" class="guide"><b>録音停止で自動変換</b>　歌ったメロディをそのままピアノロールに表示します。</div><div class="roll"><div class="grid"><div id="keys" class="keys"></div><div id="notes" class="notes"></div><div id="empty" class="empty">録音すると、ここに音符が表示されます</div></div></div><div class="editor"><label>音階<select id="pitch" disabled></select></label><label>長さ<select id="length" disabled><option value="0.25">1/4拍</option><option value="0.5">1/2拍</option><option value="1">1拍</option><option value="2">2拍</option><option value="4">4拍</option></select></label><label>開始<input id="start" type="number" min="0" step="0.25" disabled></label><label>強さ<input id="velocity" type="number" min="1" max="127" value="100" disabled></label></div></main></div><script>(()=>{const $=s=>document.querySelector(s),status=$('#status'),bpmEl=$('#bpm'),bpmText=$('#bpmText'),meter=$('#meter'),metro=$('#metro'),record=$('#record'),recLabel=$('#recLabel'),time=$('#time'),wave=$('#wave'),levelEl=$('#level'),audio=$('#audio'),playVoice=$('#playVoice'),redo=$('#redo'),notesEl=$('#notes'),keys=$('#keys'),empty=$('#empty'),instrument=$('#instrument'),quant=$('#quant'),playNotes=$('#playNotes'),del=$('#delete'),pitchSel=$('#pitch'),lengthSel=$('#length'),startEl=$('#start'),velocityEl=$('#velocity'),guide=$('#guide');let bpm=120,metroOn=true,beatTimer=null,stream=null,ctx=null,analyser=null,data=null,recorder=null,chunks=[],url=null,recording=false,recStart=0,timerId=null,raw=[],melody=[],selected=-1,history=[];const pitches=['C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4','B3','A#3','A3','G#3','G3','F#3','F3','E3','D#3','D3','C#3'];pitches.forEach(p=>{let k=document.createElement('div');k.className='key';k.textContent=p;keys.appendChild(k);let o=document.createElement('option');o.value=p;o.textContent=p;pitchSel.appendChild(o)});for(let i=0;i<70;i++){let b=document.createElement('i');b.className='bar';wave.appendChild(b)}function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function setBpm(v){bpm=Math.max(40,Math.min(240,Math.round(v)));bpmEl.value=bpm;bpmText.textContent=bpm;restartMetro()}$('#minus').onclick=()=>setBpm(bpm-1);$('#plus').onclick=()=>setBpm(bpm+1);bpmEl.oninput=()=>setBpm(+bpmEl.value);function click(){if(!metroOn)return;let c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.04);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.05)}function restartMetro(){clearInterval(beatTimer);if(!metroOn)return;beatTimer=setInterval(click,60000/bpm)}metro.onclick=()=>{metroOn=!metroOn;metro.classList.toggle('on',metroOn);metro.textContent='メトロノーム '+(metroOn?'ON':'OFF');restartMetro()};async function mic(){if(stream?.getAudioTracks()[0]?.readyState==='live')return true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});let c=ac(),src=c.createMediaStreamSource(stream);analyser=c.createAnalyser();analyser.fftSize=4096;data=new Float32Array(analyser.fftSize);src.connect(analyser);status.textContent='✓ '+(stream.getAudioTracks()[0].label||'マイク')+' 接続中';return true}catch(e){status.textContent='マイクを使えません：'+e.name;return false}}function rms(){if(!analyser)return 0;analyser.getFloatTimeDomainData(data);let s=0;for(let v of data)s+=v*v;return Math.sqrt(s/data.length)}function detect(){if(!analyser||!ctx)return null;analyser.getFloatTimeDomainData(data);let r=rms();if(r<.012){history=[];return null}let min=Math.floor(ctx.sampleRate/700),max=Math.min(Math.floor(ctx.sampleRate/80),data.length/2),best=-1,bestScore=-1;for(let lag=min;lag<=max;lag++){let sum=0,a2=0,b2=0;for(let i=0;i<data.length-lag;i++){let a=data[i],b=data[i+lag];sum+=a*b;a2+=a*a;b2+=b*b}let score=sum/(Math.sqrt(a2*b2)||1);if(score>bestScore){bestScore=score;best=lag}}if(best<0||bestScore<.72)return null;let f=ctx.sampleRate/best,m=Math.round(69+12*Math.log2(f/440));history.push(m);if(history.length>5)history.shift();let counts={};for(let x of history)counts[x]=(counts[x]||0)+1;let mode=+Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];if(counts[mode]<3)return null;let names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],name=names[(mode%12+12)%12]+(Math.floor(mode/12)-1);return pitches.includes(name)?name:null}function fmt(ms){let s=ms/1000;return '00:'+String(Math.floor(s)).padStart(2,'0')+'.'+Math.floor((s%1)*10)}async function startRec(){if(!(await mic()))return;raw=[];melody=[];selected=-1;render();chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);audio.src=url;audio.style.display='block';playVoice.disabled=redo.disabled=false;buildFromRaw();};recorder.start();recording=true;recStart=performance.now();record.classList.add('on');recLabel.textContent='停止';status.textContent='録音中 — 歌ってください';let tick=0;timerId=setInterval(()=>{time.textContent=fmt(performance.now()-recStart);let r=rms(),lv=Math.min(100,Math.round(r*1800));levelEl.textContent=lv+'%';[...wave.children].forEach((b,i)=>b.style.height=(8+Math.min(1,r*16)*48*(.4+.6*Math.abs(Math.sin((i+tick)*.3))))+'px');let p=detect();if(p)raw.push({pitch:p,t:(performance.now()-recStart)/(60000/bpm),v:Math.max(50,Math.min(127,55+lv))});tick++},80)}function stopRec(){recording=false;clearInterval(timerId);record.classList.remove('on');recLabel.textContent='録音する';status.textContent='録音を解析しています…';if(recorder&&recorder.state!=='inactive')recorder.stop()}record.onclick=()=>recording?stopRec():startRec();function buildFromRaw(){let q=+quant.value||.5;if(!raw.length){status.textContent='音程を検出できませんでした。もう少し大きめに歌ってください';guide.innerHTML='<b>音符を作れませんでした</b>　マイクに近づいて、1音ずつはっきり歌ってください。';render();return}let g=[];for(let r of raw){let st=Math.round(r.t/q)*q,last=g[g.length-1];if(last&&last.pitch===r.pitch&&st-last.end<=q*1.6){last.end=Math.max(last.end,st+q);last.v=Math.max(last.v,r.v)}else g.push({pitch:r.pitch,start:Math.max(0,st),end:Math.max(0,st)+q,v:r.v})}melody=g.map(n=>({pitch:n.pitch,start:n.start,length:Math.max(q,n.end-n.start),velocity:n.v}));selected=melody.length?0:-1;render();if(selected>=0)select(selected);playNotes.disabled=!melody.length;status.textContent='✓ 録音完了。ピアノロールに自動反映しました';guide.innerHTML='<b>自動変換しました</b>　音符をクリックすると音階・長さを修正できます。'}function render(){notesEl.innerHTML='';empty.style.display=melody.length?'none':'block';melody.forEach((n,i)=>{let b=document.createElement('button');b.className='note'+(i===selected?' sel':'');b.textContent=n.pitch;b.style.top=(pitches.indexOf(n.pitch)*22+2)+'px';b.style.left=(n.start*44)+'px';b.style.width=Math.max(24,n.length*44-4)+'px';b.onclick=()=>select(i);notesEl.appendChild(b)});del.disabled=selected<0}function select(i){selected=i;let n=melody[i];pitchSel.disabled=lengthSel.disabled=startEl.disabled=velocityEl.disabled=false;pitchSel.value=n.pitch;lengthSel.value=String([.25,.5,1,2,4].includes(n.length)?n.length:1);startEl.value=n.start;velocityEl.value=n.velocity||100;render()}function update(){if(selected<0)return;let n=melody[selected];n.pitch=pitchSel.value;n.length=+lengthSel.value;n.start=Math.max(0,+startEl.value||0);n.velocity=Math.max(1,Math.min(127,+velocityEl.value||100));render()}pitchSel.onchange=lengthSel.onchange=startEl.oninput=velocityEl.oninput=update;del.onclick=()=>{if(selected<0)return;melody.splice(selected,1);selected=melody.length?Math.min(selected,melody.length-1):-1;render();if(selected>=0)select(selected);playNotes.disabled=!melody.length};playVoice.onclick=()=>url&&new Audio(url).play();redo.onclick=()=>{raw=[];melody=[];selected=-1;render();audio.style.display='none';playVoice.disabled=redo.disabled=playNotes.disabled=true;time.textContent='00:00.0';status.textContent='録り直せます'};function freq(name){let m=name.match(/^([A-G])(#?)(-?\d+)$/),map={C:0,D:2,E:4,F:5,G:7,A:9,B:11};let midi=(+m[3]+1)*12+map[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(midi-69)/12)}function sound(n,t,d,type){let c=ac(),f=freq(n.pitch),g=c.createGain(),o=c.createOscillator();o.frequency.value=f;o.type=type==='synth'?'sawtooth':'sine';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.24*((n.velocity||100)/127),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.3,d));o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.1);if(type==='piano'){[2,3].forEach((h,ix)=>{let x=c.createOscillator(),xg=c.createGain();x.type='sine';x.frequency.value=f*h;xg.gain.value=ix?0.05:0.11;x.connect(xg).connect(g);x.start(t);x.stop(t+d+.1)})}}playNotes.onclick=()=>{if(!melody.length)return;let c=ac(),bs=60/bpm,base=c.currentTime+.08;melody.forEach(n=>sound(n,base+n.start*bs,Math.max(.12,n.length*bs*.9),instrument.value));status.textContent='♪ '+instrument.options[instrument.selectedIndex].text+'で再生中'};setBpm(120);restartMetro()})();</script></body></html>
