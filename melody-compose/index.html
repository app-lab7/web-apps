<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Melody Compose</title></head><body style="margin:0"><div id="melody-recorder" class="melody-app">
  <style>
    #melody-recorder{background:#15171c;color:#e8ebf1;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0;min-height:620px;box-sizing:border-box}
    #melody-recorder *{box-sizing:border-box}
    #melody-recorder .wrap{max-width:none;margin:0 auto;padding:10px 12px 14px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:10px;align-items:start}
    #melody-recorder .status{text-align:left;color:#aeb5c1;font-size:12px;margin:0 0 10px;padding:8px 10px;background:#20232a;border:1px solid #2d313a;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    #melody-recorder .tempo{display:flex;justify-content:flex-start;align-items:center;gap:8px;margin:0 0 8px}
    #melody-recorder .tempo button{width:34px;height:34px;border-radius:5px;border:1px solid #3a3f49;background:#24272e;color:#e8ebf1;font-size:18px;cursor:pointer}
    #melody-recorder .bpm{text-align:left;min-width:92px;background:#0e1014;border:1px solid #343944;border-radius:5px;padding:5px 10px}
    #melody-recorder .bpm strong{display:block;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;color:#f1f4f8}
    #melody-recorder .bpm span{font-size:9px;color:#7f8794;letter-spacing:.12em}
    #melody-recorder input[type=range]{display:block;width:260px;margin:0 0 10px;accent-color:#5f9cff}
    #melody-recorder .settings{display:flex;justify-content:flex-start;gap:6px;flex-wrap:wrap;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid #2a2e36}
    #melody-recorder select,#melody-recorder .pill{min-height:34px;border:1px solid #3a3f49;border-radius:5px;background:#24272e;color:#dfe3ea;padding:0 10px;font-size:12px}
    #melody-recorder .pill{cursor:pointer}
    #melody-recorder .pill.active{border-color:#5f9cff;background:#203653;color:#dbe9ff}
    #melody-recorder .pulse{height:24px;display:flex;align-items:center;justify-content:flex-start;gap:5px;margin-bottom:8px}
    #melody-recorder .beat{width:18px;height:5px;border-radius:2px;background:#343943;transition:transform .08s,background .08s}
    #melody-recorder .beat.on{background:#5f9cff;transform:scaleY(1.5)}
    #melody-recorder .record-zone{display:flex;align-items:center;gap:10px;text-align:left;padding:6px 0 10px}
    #melody-recorder .record{width:38px;height:38px;border-radius:50%;border:4px solid #30343d;outline:1px solid #4a505c;background:#ef4d5d;cursor:pointer;box-shadow:none;transition:transform .15s}
    #melody-recorder .record:active{transform:scale(.96)}
    #melody-recorder .record.recording{border-radius:7px;width:38px;height:38px;animation:recpulse 1.2s infinite}
    @keyframes recpulse{50%{box-shadow:0 0 0 14px rgba(227,77,91,.12)}}
    #melody-recorder .record-label{margin-top:0;font-weight:700;font-size:12px}
    #melody-recorder .timer{font-size:18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;margin-top:0;min-height:auto;color:#d7dce4}
    #melody-recorder .wave{height:72px;border-radius:4px;background:#0d0f13;border:1px solid #2b3038;display:flex;align-items:center;justify-content:flex-start;gap:2px;padding:8px;margin:0 0 8px;overflow:hidden}
    #melody-recorder .bar{width:3px;border-radius:1px;background:#68717f;height:14px;transition:height .15s}
    #melody-recorder .recording-wave .bar{background:#5f9cff}
    #melody-recorder .actions{display:flex;justify-content:flex-start;gap:6px;flex-wrap:wrap}
    #melody-recorder .convert{grid-column:2;grid-row:1 / span 9;margin-top:0;padding:0;border-radius:4px;background:#171a20;border:1px solid #2f343d;overflow:hidden;min-width:0}
    #melody-recorder .next-step{margin:0;padding:8px 10px;border-radius:0;background:#1d2229;border:0;border-bottom:1px solid #2f343d;font-size:11px;line-height:1.5;color:#aab1bd}
    #melody-recorder .next-step strong{display:inline;font-size:11px;margin-right:8px;color:#80b5ff}
    #melody-recorder .convert h3{margin:0;padding:9px 10px;font-size:12px;background:#20242b;border-bottom:1px solid #30353e;color:#dce1e9;text-transform:uppercase;letter-spacing:.08em}
    #melody-recorder .convert-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px}
    #melody-recorder .notes{margin:0 10px 8px;padding:7px 9px;border-radius:3px;background:#0f1115;border:1px solid #292e36;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;min-height:34px;color:#9fa7b3}
    #melody-recorder .live-detect{margin:8px 0 0;padding:7px 9px;border-radius:4px;background:#1b1f25;border:1px solid #30353e;font-size:10px;color:#a3aab5;display:flex;justify-content:space-between;gap:12px;align-items:center}
    #melody-recorder .live-detect strong{font-size:13px;color:#7fb2ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    #melody-recorder .analysis-options{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0;padding:0 10px 8px}
    #melody-recorder .analysis-options label{font-size:10px;color:#89919e;display:flex;align-items:center;gap:6px}
    #melody-recorder .piano-roll{margin:0;border-top:1px solid #2d323a;border-bottom:1px solid #2d323a;border-left:0;border-right:0;border-radius:0;overflow:auto;background:#0f1115}
    #melody-recorder .roll-grid{position:relative;min-width:980px;height:312px;background:repeating-linear-gradient(to right,transparent 0,transparent 43px,#252a31 44px),repeating-linear-gradient(to right,transparent 0,transparent 175px,#3a414b 176px),repeating-linear-gradient(to bottom,#171a20 0,#171a20 21px,#242931 22px)}
    #melody-recorder .roll-labels{position:absolute;inset:0 auto 0 0;width:58px;background:#181b21;border-right:1px solid #343a44;z-index:2;pointer-events:none;box-shadow:6px 0 12px rgba(0,0,0,.18)}
    #melody-recorder .roll-label{height:22px;padding:3px 6px;font-size:9px;color:#8f98a6;text-align:right;border-bottom:1px solid #22272e}
    #melody-recorder .roll-notes{position:absolute;left:60px;right:6px;top:0;bottom:0}
    #melody-recorder .roll-note{position:absolute;height:18px;border:1px solid #79aefc;border-radius:2px;background:#4c8fe8;color:#eaf3ff;padding:0 5px;font-size:9px;font-weight:700;cursor:pointer;min-height:18px;overflow:hidden;white-space:nowrap;text-align:left;box-shadow:inset 0 1px rgba(255,255,255,.18)}
    #melody-recorder .roll-note.selected{outline:2px solid #ffd166;outline-offset:1px;background:#559af2}
    #melody-recorder .roll-note .resize-handle{position:absolute;right:0;top:0;width:7px;height:100%;cursor:ew-resize;background:rgba(255,255,255,.18)}
    #melody-recorder .roll-tools{display:flex;gap:5px;flex-wrap:wrap;margin:0;padding:8px 10px;background:#1b1f25;border-bottom:1px solid #2d323a}
    #melody-recorder .note-editor{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px;margin:0;padding:8px 10px;background:#171a20}
    #melody-recorder .note-editor label{font-size:9px;color:#868f9d;text-transform:uppercase;letter-spacing:.05em}
    #melody-recorder .note-editor select,#melody-recorder .note-editor input{width:100%;margin-top:4px;min-height:32px;border:1px solid #3a3f49;border-radius:4px;background:#23262d;color:#e0e4eb;padding:0 8px;font-size:11px}
    #melody-recorder .action{min-height:34px;padding:0 10px;border-radius:5px;border:1px solid #3a3f49;background:#24272e;color:#dfe3ea;font-size:11px;font-weight:650;cursor:pointer}
    #melody-recorder .action:disabled{opacity:.4;cursor:not-allowed}
    #melody-recorder .hint{text-align:left;font-size:10px;color:#737c89;margin-top:8px;line-height:1.5;padding:6px 8px;background:#111318;border:1px solid #262b32;border-radius:4px}
    @media(max-width:820px){#melody-recorder .wrap{display:block;padding:12px}#melody-recorder .convert{margin-top:12px}#melody-recorder .note-editor{grid-template-columns:1fr 1fr}}@media(max-width:480px){#melody-recorder .wrap{padding:10px}#melody-recorder .note-editor{grid-template-columns:1fr}}
  </style>
  <div class="wrap">
    <div class="status" id="status">テンポを決めて、メロディを歌ってみよう</div>
    <div class="tempo"><button type="button" id="minus">−</button><div class="bpm"><strong id="bpmText">120</strong><span>BPM</span></div><button type="button" id="plus">＋</button></div>
    <input id="tempoRange" type="range" min="40" max="240" value="120">
    <div class="settings"><select id="meter"><option value="4">4 / 4</option><option value="3">3 / 4</option><option value="6">6 / 8</option></select><button type="button" class="pill active" id="metro">♪ メトロノーム ON</button><select id="countIn"><option value="4">4拍カウント</option><option value="2">2拍カウント</option><option value="0">カウントなし</option></select><button type="button" class="pill" id="tap">TAP TEMPO</button></div>
    <div class="pulse" id="pulse"></div>
    <div class="record-zone"><button type="button" class="record" id="record"></button><div class="record-label" id="recordLabel">録音する</div><div class="timer" id="timer">00:00.0</div></div>
    <div class="wave" id="wave"></div>
    <div class="actions"><select id="micDevice" class="action"><option value="">自動：現在のマイク</option></select><button type="button" class="action" id="micCheck">🎤 マイク接続確認</button><button type="button" class="action" id="play" disabled>▶ 再生</button><button type="button" class="action" id="keep" disabled>＋ このテイクを残す</button><button type="button" class="action" id="redo" disabled>↻ 録り直す</button></div>
    <div class="live-detect" id="micLevel"><span>マイク入力レベル</span><strong id="micLevelValue">0%</strong></div>
    <div class="convert"><h3>鼻歌から打ち込みを作成</h3><div class="next-step" id="nextStep"><strong>録音したらここ</strong>①「鼻歌を打ち込みに変換」→ ② ピアノロールを確認・修正 → ③「ピアノ音で聴く」の順です。</div><div class="convert-row"><select id="instrument"><option value="piano">ピアノ</option><option value="epiano">エレピ</option><option value="synth">シンセ</option></select><button type="button" class="action" id="analyze" disabled>① 鼻歌を打ち込みに変換</button><button type="button" class="action" id="instrumentPlay" disabled>③ ピアノ音で聴く</button></div><div class="analysis-options"><label>クオンタイズ<select id="quantize"><option value="0.25">1/16</option><option value="0.5" selected>1/8</option><option value="1">1/4</option></select></label><label>最短音価<select id="minNote"><option value="0.25">1/16拍</option><option value="0.5" selected>1/8拍</option><option value="1">1拍</option></select></label></div><div class="notes" id="notes">録音後、鼻歌から音階・タイミング・長さを推定して打ち込みを作成します。</div><div class="live-detect" id="liveDetect"><span>録音中の仮検出</span><strong id="livePitch">—</strong></div><div class="piano-roll"><div class="roll-grid"><div class="roll-labels" id="rollLabels"></div><div class="roll-notes" id="rollNotes"></div></div></div><div class="roll-tools"><button type="button" class="action" id="addNote" disabled>＋ 音を追加</button><button type="button" class="action" id="deleteNote" disabled>削除</button><button type="button" class="action" id="splitNote" disabled>音を分割</button><button type="button" class="action" id="duplicateNote" disabled>複製</button><button type="button" class="action" id="quantizeAll" disabled>全体をクオンタイズ</button></div><div class="note-editor"><label>音階<select id="notePitch" disabled></select></label><label>長さ<select id="noteLength" disabled><option value="0.25">1/4拍</option><option value="0.5">1/2拍</option><option value="1">1拍</option><option value="2">2拍</option><option value="4">4拍</option></select></label><label>開始<input id="noteStart" type="number" min="0" step="0.25" value="0" disabled></label><label>ベロシティ<input id="noteVelocity" type="number" min="1" max="127" value="100" disabled></label></div></div>
    <div class="hint">録音中にメトロノーム音がマイクへ回り込むと歌声が弱く聞こえることがあります。イヤホン使用を推奨します。</div>
  </div>
  <script>
  (()=>{const root=document.getElementById('melody-recorder');const bpmText=root.querySelector('#bpmText'),range=root.querySelector('#tempoRange'),pulse=root.querySelector('#pulse'),meter=root.querySelector('#meter'),metro=root.querySelector('#metro'),record=root.querySelector('#record'),label=root.querySelector('#recordLabel'),timer=root.querySelector('#timer'),wave=root.querySelector('#wave'),status=root.querySelector('#status'),micDevice=root.querySelector('#micDevice'),micCheck=root.querySelector('#micCheck'),micLevelValue=root.querySelector('#micLevelValue'),play=root.querySelector('#play'),keep=root.querySelector('#keep'),redo=root.querySelector('#redo'),countIn=root.querySelector('#countIn'),analyze=root.querySelector('#analyze'),instrumentPlay=root.querySelector('#instrumentPlay'),instrument=root.querySelector('#instrument'),notes=root.querySelector('#notes'),livePitch=root.querySelector('#livePitch'),nextStep=root.querySelector('#nextStep'),quantize=root.querySelector('#quantize'),minNote=root.querySelector('#minNote'),rollLabels=root.querySelector('#rollLabels'),rollNotes=root.querySelector('#rollNotes'),notePitch=root.querySelector('#notePitch'),noteLength=root.querySelector('#noteLength'),noteStart=root.querySelector('#noteStart'),noteVelocity=root.querySelector('#noteVelocity'),addNote=root.querySelector('#addNote'),deleteNote=root.querySelector('#deleteNote'),splitNote=root.querySelector('#splitNote'),duplicateNote=root.querySelector('#duplicateNote'),quantizeAll=root.querySelector('#quantizeAll');let bpm=120,metroOn=true,beatTimer=null,beatIndex=0,recording=false,recStart=0,recTimer=null,hasTake=false,taps=[],melody=[],selectedNote=-1,micStream=null,micCtx=null,micAnalyser=null,micData=null,mediaRecorder=null,recordedChunks=[],recordedBlob=null,recordedUrl=null;const pitchNames=['B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];pitchNames.forEach(p=>{const l=document.createElement('div');l.className='roll-label';l.textContent=p;rollLabels.appendChild(l);const o=document.createElement('option');o.value=p;o.textContent=p;notePitch.appendChild(o)});for(let i=0;i<48;i++){const b=document.createElement('span');b.className='bar';b.style.height=(8+(i*17%44))+'px';wave.appendChild(b)}function drawBeats(){pulse.innerHTML='';for(let i=0;i<Number(meter.value);i++){const d=document.createElement('span');d.className='beat';pulse.appendChild(d)}restartMetro()}function restartMetro(){clearInterval(beatTimer);beatIndex=0;if(!metroOn)return;tick();beatTimer=setInterval(tick,60000/bpm)}function tick(){const beats=[...pulse.children];beats.forEach(x=>x.classList.remove('on'));if(beats.length)beats[beatIndex%beats.length].classList.add('on');beatIndex++}function setBpm(v){bpm=Math.max(40,Math.min(240,Math.round(v)));range.value=bpm;bpmText.textContent=bpm;restartMetro()}range.oninput=()=>setBpm(+range.value);root.querySelector('#minus').onclick=()=>setBpm(bpm-1);root.querySelector('#plus').onclick=()=>setBpm(bpm+1);meter.onchange=drawBeats;metro.onclick=()=>{metroOn=!metroOn;metro.classList.toggle('active',metroOn);metro.textContent=metroOn?'♪ メトロノーム ON':'♪ メトロノーム OFF';restartMetro()};root.querySelector('#tap').onclick=()=>{const now=performance.now();taps=taps.filter(t=>now-t<3000);taps.push(now);if(taps.length>1){let total=0;for(let i=1;i<taps.length;i++)total+=taps[i]-taps[i-1];setBpm(60000/(total/(taps.length-1)))}};function fmt(ms){const s=ms/1000,m=Math.floor(s/60),sec=Math.floor(s%60),d=Math.floor((s%1)*10);return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+d}async function refreshMicDevices(){try{const devices=await navigator.mediaDevices.enumerateDevices();const current=micDevice.value;micDevice.innerHTML='<option value="">自動：現在のマイク</option>';devices.filter(d=>d.kind==='audioinput').forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||('マイク '+(i+1));micDevice.appendChild(o)});if([...micDevice.options].some(o=>o.value===current))micDevice.value=current}catch(_){}}async function prepareMic(force=false){if(micStream&&!force)return true;if(micStream)micStream.getTracks().forEach(t=>t.stop());try{micStream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:micDevice.value?{exact:micDevice.value}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});micCtx=new (window.AudioContext||window.webkitAudioContext)();const src=micCtx.createMediaStreamSource(micStream);micAnalyser=micCtx.createAnalyser();micAnalyser.fftSize=2048;micData=new Float32Array(micAnalyser.fftSize);src.connect(micAnalyser);await refreshMicDevices();status.textContent='✓ 接続中：'+(micStream.getAudioTracks()[0]?.label||'現在のマイク');return true}catch(e){status.textContent='マイクを開始できませんでした：'+(e.name||'不明なエラー');return false}}micDevice.onchange=()=>prepareMic(true);micCheck.onclick=()=>prepareMic(true);function detectPitch(){if(!micAnalyser||!micData||!micCtx)return null;micAnalyser.getFloatTimeDomainData(micData);let rms=0;for(const v of micData)rms+=v*v;rms=Math.sqrt(rms/micData.length);if(rms<.015)return null;let bestLag=-1,bestScore=-1,minLag=Math.floor(micCtx.sampleRate/700),maxLag=Math.floor(micCtx.sampleRate/90);for(let lag=minLag;lag<=maxLag;lag++){let ac=0,e1=0,e2=0;for(let i=0;i<micData.length-lag;i++){const a=micData[i],b=micData[i+lag];ac+=a*b;e1+=a*a;e2+=b*b}const score=ac/(Math.sqrt(e1*e2)||1);if(score>bestScore){bestScore=score;bestLag=lag}}if(bestLag<0||bestScore<.72)return null;const freq=micCtx.sampleRate/bestLag,midi=Math.round(69+12*Math.log2(freq/440)),names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];return names[(midi%12+12)%12]+(Math.floor(midi/12)-1)}async function beginRecording(){if(!(await prepareMic()))return;recordedChunks=[];mediaRecorder=new MediaRecorder(micStream);mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};mediaRecorder.onstop=()=>{recordedBlob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||'audio/webm'});recordedUrl=URL.createObjectURL(recordedBlob);hasTake=true;play.disabled=keep.disabled=redo.disabled=analyze.disabled=false;instrumentPlay.disabled=!melody.length};mediaRecorder.start();recording=true;recStart=performance.now();melody=[];record.classList.add('recording');label.textContent='停止';wave.classList.add('recording-wave');recTimer=setInterval(()=>{timer.textContent=fmt(performance.now()-recStart);let rms=0;if(micAnalyser){micAnalyser.getFloatTimeDomainData(micData);for(const v of micData)rms+=v*v;rms=Math.sqrt(rms/micData.length)}micLevelValue.textContent=Math.min(100,Math.round(rms*1800))+'%';const p=detectPitch();livePitch.textContent=p||'—';if(p&&pitchNames.includes(p)){const q=+quantize.value||.5,start=Math.round(((performance.now()-recStart)/(60000/bpm))/q)*q,prev=melody[melody.length-1];if(prev&&prev.pitch===p&&Math.abs(prev.start+prev.length-start)<=q)prev.length+=q;else melody.push({pitch:p,start,length:q,velocity:96});renderMelody()}},120)}function start(){let c=+countIn.value;if(!c)return beginRecording();label.textContent=c;const id=setInterval(()=>{c--;if(c<=0){clearInterval(id);beginRecording()}else label.textContent=c},60000/bpm)}function stop(){recording=false;clearInterval(recTimer);record.classList.remove('recording');wave.classList.remove('recording-wave');label.textContent='もう一度録音';if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop()}record.onclick=()=>recording?stop():start();play.onclick=()=>recordedUrl&&new Audio(recordedUrl).play();function renderMelody(){rollNotes.innerHTML='';notes.textContent=melody.length?melody.map(n=>n.pitch+' ('+n.length+'拍)').join('  '):'録音すると、ここに検出した音階が表示されます。';melody.forEach((n,i)=>{const b=document.createElement('button');b.className='roll-note'+(i===selectedNote?' selected':'');b.textContent=n.pitch;b.style.top=(Math.max(0,pitchNames.indexOf(n.pitch))*22+2)+'px';b.style.left=(n.start*44)+'px';b.style.width=Math.max(24,n.length*44-4)+'px';b.onclick=()=>selectNote(i);rollNotes.appendChild(b)});instrumentPlay.disabled=!me
