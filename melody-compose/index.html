<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Melody Compose</title><style>:root{color-scheme:light dark;--bg:#f6f7f9;--p:#fff;--t:#17191d;--m:#737983;--l:#dde1e7;--a:#e34d5b;--s:#fff1f3}@media(prefers-color-scheme:dark){:root{--bg:#101114;--p:#191b20;--t:#f5f6f8;--m:#a9afb9;--l:#30333a;--s:#351a1e}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,sans-serif}.app{max-width:980px;margin:auto;padding:22px 14px 50px}.top{display:flex;justify-content:space-between;align-items:end}.top h1{margin:0;font-size:25px}.top p{margin:4px 0;color:var(--m);font-size:13px}.ver{font-size:11px;color:var(--m);border:1px solid var(--l);padding:7px 10px;border-radius:999px}.panel{margin-top:14px;background:var(--p);border:1px solid var(--l);border-radius:18px;padding:17px}.status{text-align:center;color:var(--m);min-height:22px;font-size:14px}.tempo{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:12px}.bpm strong{display:block;text-align:center;font-size:48px}.bpm span{display:block;text-align:center;color:var(--m);font-size:11px;letter-spacing:.14em}.round{width:46px;height:46px;border-radius:50%;font-size:22px;padding:0}button,select,input{font:inherit;color:inherit}button,select,input[type=number]{min-height:44px;border:1px solid var(--l);border-radius:12px;background:transparent;padding:0 14px}button{font-weight:650;cursor:pointer}button.active{border-color:var(--a);background:var(--s)}button.primary{background:var(--a);border-color:var(--a);color:#fff}button:disabled{opacity:.38;cursor:not-allowed}input[type=range]{display:block;width:min(520px,100%);margin:20px auto;accent-color:var(--a)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center}.beats{height:40px;display:flex;gap:11px;align-items:center;justify-content:center}.beat{width:10px;height:10px;border-radius:50%;background:#aaa}.beat.on{background:var(--a);transform:scale(1.55)}.rec{text-align:center;padding:14px 0}.record{width:108px;height:108px;border-radius:50%;background:var(--a);border:8px solid var(--p);outline:2px solid var(--l)}.record.on{width:82px;height:82px;border-radius:27px}.rlabel{font-weight:750;margin-top:12px}.timer{font-size:30px;margin-top:4px}.wave{height:82px;border:1px solid var(--l);border-radius:14px;display:flex;gap:3px;align-items:center;justify-content:center;padding:10px;overflow:hidden}.bar{width:4px;height:9px;border-radius:4px;background:#aaa}.bar.live{background:var(--a)}audio{width:100%;margin-top:12px}.meter{height:10px;border-radius:99px;background:var(--l);overflow:hidden;margin-top:12px}.meter i{display:block;height:100%;width:0;background:var(--a)}.guide{padding:14px 16px;border:1px solid color-mix(in srgb,var(--a) 35%,var(--l));border-radius:14px;background:var(--s);font-size:13px;line-height:1.55}.guide strong{display:block;color:var(--a);font-size:15px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.head h2{margin:0;font-size:18px}.live{margin-top:10px;border:1px solid var(--l);border-radius:10px;padding:9px 11px;display:flex;justify-content:space-between;color:var(--m);font-size:12px}.live strong{color:var(--a);font-family:monospace;font-size:17px}.roll{overflow:auto;margin-top:12px;border:1px solid var(--l);border-radius:14px}.grid{position:relative;min-width:780px;height:286px;background:repeating-linear-gradient(to right,transparent 0,transparent 43px,var(--l) 44px),repeating-linear-gradient(to bottom,transparent 0,transparent 21px,var(--l) 22px)}.labels{position:absolute;left:0;top:0;bottom:0;width:54px;background:color-mix(in srgb,var(--p) 94%,transparent);border-right:1px solid var(--l);z-index:2}.lab{height:22px;padding:3px 6px;text-align:right;color:var(--m);font-size:10px}.notes{position:absolute;left:56px;right:6px;top:0;bottom:0}.note{position:absolute;height:18px;min-height:18px;border:0;border-radius:5px;background:var(--a);color:#fff;font-size:10px;padding:0 6px;text-align:left;overflow:hidden;white-space:nowrap}.note.sel{outline:3px solid var(--t);outline-offset:1px}.resize{position:absolute;right:0;top:0;width:10px;height:100%;background:#ffffff44}.editor{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:9px;margin-top:12px}.editor label{font-size:11px;color:var(--m)}.editor select,.editor input{width:100%;margin-top:5px;min-height:42px;border:1px solid var(--l);border-radius:10px;background:transparent;padding:0 9px}@media(max-width:560px){.ver{display:none}.editor{grid-template-columns:1fr 1fr}.row>*{flex:1 1 130px}}</style></head><body><main class="app"><div class="top"><div><h1>Melody Compose</h1><p>口ずさむ → 自動打ち込み → 本物のピアノ音で聴く</p></div><div class="ver">Live v5 · Sample Piano</div></div><section class="panel"><div class="status" id="status">テンポを決めて録音してください</div><div class="tempo"><button class="round" id="minus">−</button><div class="bpm"><strong id="bpmText">120</strong><span>BPM</span></div><button class="round" id="plus">＋</button></div><input id="bpm" type="range" min="40" max="240" value="120"><div class="row"><select id="meter"><option value="4">4 / 4</option><option value="3">3 / 4</option><option value="6">6 / 8</option></select><button id="metro" class="active">♪ メトロノーム ON</button><select id="count"><option value="4">4拍カウント</option><option value="2">2拍カウント</option><option value="0">カウントなし</option></select><button id="tap">TAP TEMPO</button></div><div class="beats" id="beats"></div></section><section class="panel"><div class="rec"><button class="record" id="record"></button><div class="rlabel" id="recordLabel">録音する</div><div class="timer" id="timer">00:00.0</div></div><div class="wave" id="wave"></div><audio id="audio" controls hidden></audio><div class="row" style="margin-top:12px"><select id="micDevice"><option value="">自動：現在のマイク</option></select><button id="micCheck">🎤 マイク確認</button><button id="play" disabled>▶ 元の歌声</button><button id="redo" disabled>↻ 録り直す</button></div><div class="meter"><i id="micBar"></i></div></section><section class="panel"><div class="guide" id="guide"><strong>録音を止めるだけでOK</strong>歌った音を自動で打ち込みにします。ピアノは実際のグランドピアノ録音サンプルで再生します。</div><div class="head"><h2>鼻歌 → 打ち込み</h2><div class="row"><select id="instrument"><option value="piano">ピアノ（実録音）</option><option value="epiano">エレピ</option><option value="synth">シンセ</option></select><select id="quant"><option value="0.25">1/16</option><option value="0.5" selected>1/8</option><option value="1">1/4</option></select><button id="convert" disabled>再生成</button><button id="playNotes" class="primary" disabled>♪ ピアノ音で聴く</button></div></div><div class="live"><span>検出中の音</span><strong id="livePitch">—</strong></div><div class="roll"><div class="grid"><div class="labels" id="labels"></div><div class="notes" id="notes"></div></div></div><div class="row" style="margin-top:12px"><button id="add" disabled>＋ 音を追加</button><button id="del" disabled>削除</button><button id="split" disabled>分割</button><button id="dup" disabled>複製</button><button id="quantAll" disabled>全体クオンタイズ</button></div><div class="editor"><label>音階<select id="pitch" disabled></select></label><label>長さ<select id="length" disabled><option value="0.25">1/4拍</option><option value="0.5">1/2拍</option><option value="1">1拍</option><option value="2">2拍</option><option value="4">4拍</option></select></label><label>開始<input id="start" type="number" step="0.25" min="0" disabled></label><label>強さ<input id="velocity" type="number" min="1" max="127" value="100" disabled></label></div></section></main><script>const $=s=>document.querySelector(s),statusEl=$('#status'),bpmEl=$('#bpm'),bpmText=$('#bpmText'),meter=$('#meter'),metroBtn=$('#metro'),beats=$('#beats'),record=$('#record'),recordLabel=$('#recordLabel'),timer=$('#timer'),wave=$('#wave'),audio=$('#audio'),play=$('#play'),redo=$('#redo'),micCheck=$('#micCheck'),micDevice=$('#micDevice'),micBar=$('#micBar'),livePitch=$('#livePitch'),instrument=$('#instrument'),quant=$('#quant'),convert=$('#convert'),playNotes=$('#playNotes'),guide=$('#guide'),notesEl=$('#notes'),labels=$('#labels'),pitchSel=$('#pitch'),lengthSel=$('#length'),startEl=$('#start'),velocityEl=$('#velocity'),addBtn=$('#add'),delBtn=$('#del'),splitBtn=$('#split'),dupBtn=$('#dup'),quantAll=$('#quantAll');let bpm=120,metroOn=true,metroTimer=null,beat=0,taps=[],stream=null,ctx=null,analyser=null,data=null,recorder=null,chunks=[],blob=null,url=null,recording=false,recStart=0,recTimer=null,raw=[],melody=[],selected=-1;const pitchNames=['C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];const sampleBase='https://tonejs.github.io/audio/salamander/';const sampleDefs={C4:'C4.mp3',Ds4:'Ds4.mp3',Fs4:'Fs4.mp3',A4:'A4.mp3',C5:'C5.mp3'};const sampleMidi={C4:60,Ds4:63,Fs4:66,A4:69,C5:72};const pianoBuffers={};let pianoLoading=null;pitchNames.forEach(p=>{let l=document.createElement('div');l.className='lab';l.textContent=p;labels.appendChild(l);let o=document.createElement('option');o.value=p;o.textContent=p;pitchSel.appendChild(o)});for(let i=0;i<56;i++){let b=document.createElement('i');b.className='bar';wave.appendChild(b)}function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}async function loadPiano(){if(Object.keys(pianoBuffers).length===Object.keys(sampleDefs).length)return true;if(pianoLoading)return pianoLoading;statusEl.textContent='ピアノ実録音サンプルを読み込み中…';pianoLoading=Promise.all(Object.entries(sampleDefs).map(async([k,f])=>{let r=await fetch(sampleBase+f);if(!r.ok)throw new Error(f);pianoBuffers[k]=await ac().decodeAudioData(await r.arrayBuffer())})).then(()=>{statusEl.textContent='✓ 実録音ピアノ音源 準備完了';return true}).catch(()=>{statusEl.textContent='ピアノ音源を読み込めませんでした';return false}).finally(()=>pianoLoading=null);return pianoLoading}function midi(name){let m=name.match(/^([A-G])(#?)(-?\d+)$/),map={C:0,D:2,E:4,F:5,G:7,A:9,B:11};return m?(+m[3]+1)*12+map[m[1]]+(m[2]?1:0):69}function nearestSample(note){let target=midi(note),best='A4',dist=999;for(let k in sampleMidi){let d=Math.abs(sampleMidi[k]-target);if(d<dist){dist=d;best=k}}return {key:best,rate:Math.pow(2,(target-sampleMidi[best])/12)}}function samplePiano(n,t,d){let c=ac(),s=nearestSample(n.pitch),buf=pianoBuffers[s.key];if(!buf)return;let src=c.createBufferSource(),g=c.createGain();src.buffer=buf;src.playbackRate.value=s.rate;let v=(n.velocity||100)/127;g.gain.setValueAtTime(Math.max(.001,.62*v),t);g.gain.setValueAtTime(Math.max(.001,.56*v),t+Math.min(.08,d*.25));g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.35,d+.45));src.connect(g).connect(c.destination);src.start(t);src.stop(t+Math.max(.45,d+.55))}function drawBeats(){beats.innerHTML='';for(let i=0;i<+meter.value;i++){let d=document.createElement('i');d.className='beat';beats.appendChild(d)}restartMetro()}function clickBeat(){if(!metroOn)return;let c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=beat%(+meter.value)===0?1200:850;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.05);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.06);[...beats.children].forEach(x=>x.classList.remove('on'));beats.children[beat%(+meter.value)]?.classList.add('on');beat++}function restartMetro(){clearInterval(metroTimer);beat=0;[...beats.children].forEach(x=>x.classList.remove('on'));if(!metroOn)return;clickBeat();metroTimer=setInterval(clickBeat,60000/bpm)}function setBpm(v){bpm=Math.max(40,Math.min(240,Math.round(v)));bpmEl.value=bpm;bpmText.textContent=bpm;if(metroOn)restartMetro()}$('#minus').onclick=()=>setBpm(bpm-1);$('#plus').onclick=()=>setBpm(bpm+1);bpmEl.oninput=()=>setBpm(+bpmEl.value);meter.onchange=drawBeats;metroBtn.onclick=()=>{metroOn=!metroOn;metroBtn.classList.toggle('active',metroOn);metroBtn.textContent=metroOn?'♪ メトロノーム ON':'♪ メトロノーム OFF';restartMetro()};$('#tap').onclick=()=>{let n=performance.now();taps=taps.filter(x=>n-x<3000);taps.push(n);if(taps.length>1){let t=0;for(let i=1;i<taps.length;i++)t+=taps[i]-taps[i-1];setBpm(60000/(t/(taps.length-1)))}};async function devices(){try{let ds=await navigator.mediaDevices.enumerateDevices(),cur=micDevice.value;micDevice.innerHTML='<option value="">自動：現在のマイク</option>';ds.filter(d=>d.kind==='audioinput').forEach((d,i)=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'マイク '+(i+1);micDevice.appendChild(o)});if([...micDevice.options].some(o=>o.value===cur))micDevice.value=cur}catch{}}async function prepareMic(force=false){let live=stream?.getAudioTracks().find(t=>t.readyState==='live'&&t.enabled);if(live&&!force)return true;if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:micDevice.value?{exact:micDevice.value}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});let c=ac(),src=c.createMediaStreamSource(stream);analyser=c.createAnalyser();analyser.fftSize=2048;data=new Float32Array(analyser.fftSize);src.connect(analyser);await devices();statusEl.textContent='✓ '+(stream.getAudioTracks()[0]?.label||'マイク')+' 接続中';return true}catch(e){statusEl.textContent='マイクエラー：'+e.name;return false}}micDevice.onchange=()=>prepareMic(true);micCheck.onclick=()=>prepareMic(true);function rms(){if(!analyser)return 0;analyser.getFloatTimeDomainData(data);let s=0;for(let v of data)s+=v*v;return Math.sqrt(s/data.length)}function pitch(){if(!analyser||!ctx)return null;analyser.getFloatTimeDomainData(data);let r=rms();if(r<.008)return null;let best=-1,score=0,min=Math.floor(ctx.sampleRate/1000),max=Math.min(Math.floor(ctx.sampleRate/70),data.length/2);for(let off=min;off<=max;off++){let c=0;for(let i=0;i<data.length-off;i++)c+=data[i]*data[i+off];if(c>score){score=c;best=off}}if(best<0)return null;let f=ctx.sampleRate/best,m=Math.round(69+12*Math.log2(f/440)),names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];return names[(m%12+12)%12]+(Math.floor(m/12)-1)}function fmt(ms){let s=ms/1000,m=Math.floor(s/60),ss=Math.floor(s%60),d=Math.floor((s%1)*10);return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'.'+d}async function beginRec(){if(!(await prepareMic()))return;raw=[];melody=[];selected=-1;render();chunks=[];if(url){URL.revokeObjectURL(url);url=null}recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});url=URL.createObjectURL(blob);audio.src=url;audio.hidden=false;play.disabled=redo.disabled=convert.disabled=false;autoConvert();guide.innerHTML='<strong>打ち込み化できました</strong>ピアノを選ぶと本物の録音サンプルで再生します。'};recorder.start();recording=true;recStart=performance.now();record.classList.add('on');recordLabel.textContent='停止';statusEl.textContent='録音中 — 歌ってください';let tick=0;recTimer=setInterval(()=>{timer.textContent=fmt(performance.now()-recStart);let r=rms(),lev=Math.min(100,Math.round(r*1800));micBar.style.width=lev+'%';[...wave.children].forEach((b,i)=>{b.classList.add('live');b.style.height=(8+Math.min(1,r*16)*58*(.45+.55*Math.abs(Math.sin((i+tick)*.31))))+'px'});let p=pitch();livePitch.textContent=p||'—';if(p&&pitchNames.includes(p))raw.push({pitch:p,t:(performance.now()-recStart)/(60000/bpm),v:lev});tick++},90)}function startRec(){let n=+$('#count').value;if(!n){beginRec();return}let left=n;recordLabel.textContent=left;statusEl.textContent='カウントイン…';let t=setInterval(()=>{left--;if(left<=0){clearInterval(t);beginRec()}else recordLabel.textContent=left},60000/bpm)}function stopRec(){recording=false;clearInterval(recTimer);if(recorder&&recorder.state!=='inactive')recorder.stop();record.classList.remove('on');recordLabel.textContent='もう一度録音';livePitch.textContent='—';[...wave.children].forEach(b=>b.classList.remove('live'))}record.onclick=()=>recording?stopRec():startRec();play.onclick=()=>url&&new Audio(url).play();redo.onclick=()=>{if(recording)stopRec();raw=[];melody=[];selected=-1;render();audio.hidden=true;play.disabled=redo.disabled=convert.disabled=playNotes.disabled=true;timer.textContent='00:00.0';recordLabel.textContent='録音する'};function autoConvert(){let q=+quant.value||.5;if(!raw.length){melody=[];render();playNotes.disabled=true;guide.innerHTML='<strong>音程を検出できませんでした</strong>少し大きめに、伴奏なしで長めに歌ってください。';return}let g=[];for(let r of raw){let st=Math.max(0,Math.round(r.t/q)*q),last=g[g.length-1];if(last&&last.pitch===r.pitch&&st-last.end<=q*1.5){last.end=Math.max(last.end,st+q);last.v=Math.max(last.v,r.v)}else g.push({pitch:r.pitch,start:st,end:st+q,v:r.v})}melody=g.map(n=>({pitch:n.pitch,start:n.start,length:Math.max(q,n.end-n.start),velocity:Math.max(50,Math.min(127,60+Math.round(n.v*.65)))}));selected=melody.length?0:-1;render();if(selected>=0)select(selected);playNotes.disabled=!melody.length}convert.onclick=autoConvert;function render(){notesEl.innerHTML='';melody.forEach((n,i)=>{let b=document.createElement('button');b.className='note'+(i===selected?' sel':'');b.textContent=n.pitch;let row=Math.max(0,pitchNames.indexOf(n.pitch));b.style.top=(row*22+2)+'px';b.style.left=(n.start*44)+'px';b.style.width=Math.max(24,n.length*44-4)+'px';let h=document.createElement('span');h.className='resize';b.appendChild(h);b.onclick=()=>select(i);notesEl.appendChild(b)});addBtn.disabled=!blob;quantAll.disabled=!melody.length;delBtn.disabled=splitBtn.disabled=dupBtn.disabled=selected<0}function select(i){selected=i;let n=melody[i];pitchSel.disabled=lengthSel.disabled=startEl.disabled=velocityEl.disabled=false;pitchSel.value=n.pitch;lengthSel.value=String([.25,.5,1,2,4].includes(n.length)?n.length:1);startEl.value=n.start;velocityEl.value=n.velocity||100;render()}function upd(){if(selected<0)return;let n=melody[selected];n.pitch=pitchSel.value;n.length=Math.max(.25,+lengthSel.value||1);n.start=Math.max(0,+startEl.value||0);n.velocity=Math.max(1,Math.min(127,+velocityEl.value||100));render()}pitchSel.onchange=lengthSel.onchange=startEl.oninput=velocityEl.oninput=upd;addBtn.onclick=()=>{let l=melody[melody.length-1];melody.push({pitch:'C4',start:l?l.start+l.length:0,length:1,velocity:100});select(melody.length-1);playNotes.disabled=false};delBtn.onclick=()=>{if(selected<0)return;melody.splice(selected,1);selected=melody.length?Math.min(selected,melody.length-1):-1;render();playNotes.disabled=!melody.length};splitBtn.onclick=()=>{if(selected<0)return;let n=melody[selected],q=+quant.value||.5;if(n.length<=q)return;let h=Math.max(q,Math.round(n.length/2/q)*q);n.length=h;melody.splice(selected+1,0,{pitch:n.pitch,start:n.start+h,length:h,velocity:n.velocity});render()};dupBtn.onclick=()=>{if(selected<0)return;let n=melody[selected];melody.splice(selected+1,0,{pitch:n.pitch,start:n.start+n.length,length:n.length,velocity:n.velocity});select(selected+1)};quantAll.onclick=()=>{let q=+quant.value||.5;melody.forEach(n=>{n.start=Math.round(n.start/q)*q;n.length=Math.max(q,Math.round(n.length/q)*q)});render()};function freq(name){return 440*Math.pow(2,(midi(name)-69)/12)}function epiano(n,t,d){let c=ac(),f=freq(n.pitch),g=c.createGain(),o=c.createOscillator(),m=c.createOscillator(),mg=c.createGain();g.connect(c.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.35,d*1.1));o.type=m.type='sine';o.frequency.value=f;m.frequency.value=f*2;mg.gain.value=f*.7;m.connect(mg).connect(o.frequency);o.connect(g);o.start(t);m.start(t);o.stop(t+d+.2);m.stop(t+d+.2)}function synth(n,t,d){let c=ac(),f=freq(n.pitch),g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=Math.min(4500,f*6);fl.connect(g).connect(c.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.17,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);[-7,0,7].forEach(dt=>{let o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(fl);o.start(t);o.stop(t+d+.05)})}playNotes.onclick=async()=>{if(!melody.length)return;let type=instrument.value;if(type==='piano'&&!(await loadPiano()))return;let c=ac(),bs=60/bpm,base=c.currentTime+.08;melody.forEach(n=>{let t=base+n.start*bs,d=Math.max(.12,n.length*bs*.92);type==='piano'?samplePiano(n,t,d):type==='epiano'?epiano(n,t,d):synth(n,t,d)});guide.innerHTML='<strong>'+instrument.options[instrument.selectedIndex].text+'で再生中</strong>'+(type==='piano'?'合成音ではなく、グランドピアノの実録音サンプルです。':'選んだ楽器音で再生しています。')};instrument.onchange=()=>{playNotes.textContent='♪ '+(instrument.value==='piano'?'ピアノ':instrument.options[instrument.selectedIndex].text)+'音で聴く';if(instrument.value==='piano')loadPiano()};drawBeats();devices();</script></body></html>
