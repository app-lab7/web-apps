<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melody Compose</title><style>:root{--bg:#0f1115;--p:#181b21;--p2:#20242b;--l:#303641;--t:#e8edf5;--m:#8e98a7;--b:#5d9cff;--r:#ef5262}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,sans-serif}.app{height:100vh;display:grid;grid-template-columns:260px 1fr;grid-template-rows:46px 1fr;overflow:hidden}.top{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0b0d10;border-bottom:1px solid var(--l)}.top b{font-size:14px}.top span{font-size:10px;color:var(--m)}.side{padding:12px;border-right:1px solid var(--l);overflow:auto}.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}.status{font-size:11px;color:#bcc5d0;background:var(--p);border:1px solid var(--l);padding:8px;border-radius:5px;margin-bottom:10px}.tempo{display:flex;gap:7px;align-items:center}.tempo button,.btn,select,input{height:34px;border:1px solid #3a414d;background:#242932;color:var(--t);border-radius:5px;font:inherit}.tempo button{width:34px;font-size:18px}.bpm{flex:1;background:#0b0d10;border:1px solid var(--l);padding:5px 8px;border-radius:5px}.bpm b{display:block;font:700 24px ui-monospace,monospace}.bpm small{font-size:9px;color:var(--m)}input[type=range]{width:100%;height:auto;border:0;background:none;accent-color:var(--b);margin:10px 0}.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}.btn{padding:0 10px;cursor:pointer;font-size:11px;font-weight:650}.btn.on{border-color:var(--b);background:#203653}.recrow{display:flex;align-items:center;gap:10px;margin:14px 0 10px}.rec{width:42px;height:42px;border-radius:50%;background:var(--r);border:5px solid #2c313a;outline:1px solid #535b68;cursor:pointer}.rec.on{border-radius:8px}.time{font:700 17px ui-monospace,monospace}.wave{height:68px;border:1px solid var(--l);background:#0b0d10;border-radius:4px;display:flex;align-items:center;gap:2px;padding:8px;overflow:hidden}.bar{width:3px;min-width:3px;height:8px;background:#66707e}.level{margin-top:7px;font-size:10px;color:var(--m);display:flex;justify-content:space-between}.audio{width:100%;margin-top:8px;display:none}.work{padding:8px 10px;border-bottom:1px solid var(--l);background:var(--p2);display:flex;gap:7px;align-items:center;flex-wrap:wrap}.work .title{font-size:12px;font-weight:700;margin-right:auto}.work select,.work button{height:32px}.primary{border-color:#477dcc;background:#23579c}.guide{padding:7px 10px;font-size:11px;color:#aeb7c4;border-bottom:1px solid var(--l);background:#15191f}.guide b{color:#7fb1ff}.roll{flex:1;overflow:auto;background:#0d0f13}.grid{position:relative;min-width:1400px;height:1518px;background:repeating-linear-gradient(to right,transparent 0,transparent 43px,#232932 44px),repeating-linear-gradient(to right,transparent 0,transparent 175px,#39414d 176px),repeating-linear-gradient(to bottom,#171b21 0,#171b21 21px,#262c35 22px)}.keys{position:absolute;left:0;top:0;width:60px;height:100%;z-index:2;background:#1a1e25;border-right:1px solid #3c444f}.key{height:22px;border-bottom:1px solid #252b34;font-size:9px;color:#929cac;padding:4px 6px;text-align:right}.notes{position:absolute;left:62px;right:8px;top:0;bottom:0}.note{position:absolute;height:18px;border:1px solid #7ab1ff;border-radius:2px;background:#4e91e8;color:#fff;font-size:9px;padding:1px 5px;cursor:pointer;overflow:hidden;white-space:nowrap}.note.sel{outline:2px solid #ffd166;outline-offset:1px}.empty{position:absolute;left:90px;top:34px;color:#687281;font-size:12px}.editor{padding:8px 10px;border-top:1px solid var(--l);background:var(--p);display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:7px}.editor label{font-size:9px;color:var(--m)}.editor input,.editor select{width:100%;margin-top:3px;padding:0 8px}@media(max-width:760px){.app{height:auto;min-height:100vh;display:block}.side{border-right:0;border-bottom:1px solid var(--l)}.main{height:72vh}.editor{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><header class="top"><b>Melody Compose</b><span>VOICE → PIANO ROLL · MONO</span></header><aside class="side"><div id="status" class="status">テンポを決めて録音してください</div><div class="tempo"><button id="minus">−</button><div class="bpm"><b id="bpmText">120</b><small>BPM</small></div><button id="plus">＋</button></div><input id="bpm" type="range" min="40" max="240" value="120"><div class="row"><select id="meter"><option value="4">4 / 4</option><option value="3">3 / 4</option><option value="6">6 / 8</option></select><button id="metro" class="btn on">メトロノーム ON</button></div><div class="recrow"><button id="record" class="rec" aria-label="録音"></button><div><div id="recLabel" style="font-size:11px;font-weight:700">録音する</div><div id="time" class="time">00:00.0</div></div></div><div id="wave" class="wave"></div><div class="level"><span>マイク入力</span><b id="level">0%</b></div><audio id="audio" class="audio" controls></audio><div class="row" style="margin-top:10px"><button id="playVoice" class="btn" disabled>▶ 元の歌声</button><button id="redo" class="btn" disabled>↻ 録り直す</button></div></aside><main class="main"><div class="work"><div class="title">ピアノロール</div><select id="instrument"><option value="piano">ピアノ</option><option value="epiano">エレピ</option><option value="synth">シンセ</option></select><select id="quant"><option value="0.25">1/16</option><option value="0.5" selected>1/8</option><option value="1">1/4</option></select><button id="playNotes" class="btn primary" disabled>▶ 楽器音で聴く</button><button id="delete" class="btn" disabled>削除</button></div><div id="guide" class="guide"><b>単音メロディとして自動変換</b>　同じ時間に複数の音符を置かず、音程の揺れは前後の音として整理します。</div><div class="roll"><div class="grid"><div id="keys" class="keys"></div><div id="notes" class="notes"></div><div id="empty" class="empty">録音すると、ここに音符が表示されます</div></div></div><div class="editor"><label>音階<select id="pitch" disabled></select></label><label>長さ<select id="length" disabled><option value="0.25">1/4拍</option><option value="0.5">1/2拍</option><option value="1">1拍</option><option value="2">2拍</option><option value="4">4拍</option></select></label><label>開始<input id="start" type="number" min="0" step="0.25" disabled></label><label>強さ<input id="velocity" type="number" min="1" max="127" value="100" disabled></label></div></main></div><script>(()=>{const $=s=>document.querySelector(s),status=$('#status'),bpmEl=$('#bpm'),bpmText=$('#bpmText'),metro=$('#metro'),record=$('#record'),recLabel=$('#recLabel'),time=$('#time'),wave=$('#wave'),levelEl=$('#level'),audio=$('#audio'),playVoice=$('#playVoice'),redo=$('#redo'),notesEl=$('#notes'),keys=$('#keys'),empty=$('#empty'),instrument=$('#instrument'),quant=$('#quant'),playNotes=$('#playNotes'),del=$('#delete'),pitchSel=$('#pitch'),lengthSel=$('#length'),startEl=$('#start'),velocityEl=$('#velocity'),guide=$('#guide');let bpm=120,metroOn=true,beatTimer=null,stream=null,ctx=null,analyser=null,data=null,recorder=null,chunks=[],url=null,recording=false,recStart=0,timerId=null,raw=[],melody=[],selected=-1,hist=[],lastMidi=null;const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],pitches=[];for(let m=96;m>=28;m--)pitches.push(names[m%12]+(Math.floor(m/12)-1));pitches.forEach(p=>{let k=document.createElement('div');k.className='key';k.textContent=p;keys.appendChild(k);let o=document.createElement('option');o.value=p;o.textContent=p;pitchSel.appendChild(o)});for(let i=0;i<70;i++){let b=document.createElement('i');b.className='bar';wave.appendChild(b)}function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function setBpm(v){bpm=Math.max(40,Math.min(240,Math.round(v)));bpmEl.value=bpm;bpmText.textContent=bpm;restartMetro()}$('#minus').onclick=()=>setBpm(bpm-1);$('#plus').onclick=()=>setBpm(bpm+1);bpmEl.oninput=()=>setBpm(+bpmEl.value);function click(){if(!metroOn)return;let c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.035);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.045)}function restartMetro(){clearInterval(beatTimer);if(metroOn)beatTimer=setInterval(click,60000/bpm)}metro.onclick=()=>{metroOn=!metroOn;metro.classList.toggle('on',metroOn);metro.textContent='メトロノーム '+(metroOn?'ON':'OFF');restartMetro()};async function mic(){if(stream?.getAudioTracks()[0]?.readyState==='live')return true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});let c=ac(),src=c.createMediaStreamSource(stream);analyser=c.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=.02;data=new Float32Array(analyser.fftSize);src.connect(analyser);status.textContent='✓ '+(stream.getAudioTracks()[0].label||'マイク')+' 接続中';return true}catch(e){status.textContent='マイクを使えません：'+e.name;return false}}function rms(){if(!analyser)return 0;analyser.getFloatTimeDomainData(data);let s=0;for(let v of data)s+=v*v;return Math.sqrt(s/data.length)}function detect(){if(!analyser||!ctx)return null;analyser.getFloatTimeDomainData(data);const n=data.length;let mean=0;for(let v of data)mean+=v;mean/=n;let rr=0;for(let i=0;i<n;i++){data[i]-=mean;rr+=data[i]*data[i]}rr=Math.sqrt(rr/n);if(rr<.0015){hist=[];return null}const minF=45,maxF=1800,minLag=Math.floor(ctx.sampleRate/maxF),maxLag=Math.min(Math.floor(ctx.sampleRate/minF),Math.floor(n/2)),cm=new Float32Array(maxLag+1);let run=0,best=-1,bestV=1;cm[0]=1;for(let lag=1;lag<=maxLag;lag++){let d=0;for(let i=0;i<n-lag;i++){let x=data[i]-data[i+lag];d+=x*x}run+=d;cm[lag]=run?d*lag/run:1;if(lag>=minLag&&cm[lag]<bestV){bestV=cm[lag];best=lag}}if(best<0||bestV>.45)return null;for(let lag=minLag;lag<maxLag;lag++){if(cm[lag]<.16&&cm[lag]<=cm[lag-1]&&cm[lag]<=cm[lag+1]){best=lag;break}}let lag=best;if(best>minLag&&best<maxLag){let a=cm[best-1],b=cm[best],c=cm[best+1],den=a-2*b+c;if(Math.abs(den)>1e-9)lag=best+.5*(a-c)/den}let f=ctx.sampleRate/lag;if(!Number.isFinite(f)||f<minF||f>maxF)return null;let m=Math.round(69+12*Math.log2(f/440));if(lastMidi!=null){let cand=[m-12,m,m+12].sort((a,b)=>Math.abs(a-lastMidi)-Math.abs(b-lastMidi));if(Math.abs(cand[0]-lastMidi)<=7)m=cand[0]}hist.push(m);if(hist.length>7)hist.shift();let s=[...hist].sort((a,b)=>a-b),med=s[Math.floor(s.length/2)];lastMidi=med;let p=names[(med%12+12)%12]+(Math.floor(med/12)-1);return pitches.includes(p)?p:null}function fmt(ms){let s=ms/1000,m=Math.floor(s/60),ss=Math.floor(s%60),d=Math.floor((s%1)*10);return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'.'+d}async function startRec(){if(!(await mic()))return;raw=[];melody=[];selected=-1;hist=[];lastMidi=null;render();chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);audio.src=url;audio.style.display='block';playVoice.disabled=redo.disabled=false;build()};recorder.start();recording=true;recStart=performance.now();record.classList.add('on');recLabel.textContent='停止';status.textContent='録音中 — 単音メロディとして検出しています';let tick=0;timerId=setInterval(()=>{time.textContent=fmt(performance.now()-recStart);let r=rms(),lv=Math.min(100,Math.round(r*1800));levelEl.textContent=lv+'%';[...wave.children].forEach((b,i)=>b.style.height=(8+Math.min(1,r*18)*48*(.4+.6*Math.abs(Math.sin((i+tick)*.3))))+'px');let p=detect();if(p)raw.push({pitch:p,t:(performance.now()-recStart)/(60000/bpm),v:Math.max(50,Math.min(127,55+lv))});tick++},70)}function stopRec(){recording=false;clearInterval(timerId);record.classList.remove('on');recLabel.textContent='録音する';status.textContent='録音を解析しています…';if(recorder&&recorder.state!=='inactive')recorder.stop()}record.onclick=()=>recording?stopRec():startRec();function build(){let q=+quant.value||.5;if(!raw.length){status.textContent='音程を検出できませんでした。マイク入力を確認してもう一度歌ってください';guide.innerHTML='<b>音符を作れませんでした</b>　伴奏なし・イヤホン使用で、少し長めに歌うと精度が上がります。';render();return}const bySlot=new Map();for(let r of raw){const st=Math.max(0,Math.round(r.t/q)*q),arr=bySlot.get(st)||[];arr.push(r);bySlot.set(st,arr)}const slots=[...bySlot.keys()].sort((a,b)=>a-b),chosen=[];let prevMidi=null;for(const st of slots){const arr=bySlot.get(st),counts=new Map();for(const r of arr){const md=pitches.length-1-pitches.indexOf(r.pitch)+28;counts.set(md,(counts.get(md)||0)+1)}let candidates=[...counts.entries()].sort((a,b)=>b[1]-a[1]);let md=candidates[0][0];if(prevMidi!=null){candidates.sort((a,b)=>{const sa=b[1]*4-Math.abs(b[0]-prevMidi),sb=a[1]*4-Math.abs(a[0]-prevMidi);return sa-sb});md=candidates[0][0]}const pitch=names[(md%12+12)%12]+(Math.floor(md/12)-1),v=Math.max(...arr.map(x=>x.v));chosen.push({pitch,start:st,length:q,velocity:v});prevMidi=md}let g=[];for(const n of chosen){const last=g[g.length-1];if(last&&last.pitch===n.pitch&&Math.abs((last.start+last.length)-n.start)<=q*.51){last.length+=q;last.velocity=Math.max(last.velocity,n.velocity)}else{if(last&&n.start<last.start+last.length)last.length=Math.max(q,n.start-last.start);g.push({...n})}}for(let i=0;i<g.length-1;i++){const next=g[i+1];if(g[i].start+g[i].length>next.start)g[i].length=Math.max(q,next.start-g[i].start)}melody=g.filter((n,i,a)=>!a.some((x,j)=>j<i&&Math.abs(x.start-n.start)<1e-6));selected=melody.length?0:-1;render();if(selected>=0)select(selected);playNotes.disabled=!melody.length;status.textContent='✓ 録音完了。単音メロディとして自動反映しました'}function render(){notesEl.innerHTML='';empty.style.display=melody.length?'none':'block';melody.forEach((n,i)=>{let b=document.createElement('button');b.className='note'+(i===selected?' sel':'');b.textContent=n.pitch;b.style.top=(pitches.indexOf(n.pitch)*22+2)+'px';b.style.left=(n.start*44)+'px';b.style.width=Math.max(24,n.length*44-4)+'px';b.onclick=()=>select(i);notesEl.appendChild(b)});del.disabled=selected<0}function select(i){selected=i;let n=melody[i];pitchSel.disabled=lengthSel.disabled=startEl.disabled=velocityEl.disabled=false;pitchSel.value=n.pitch;lengthSel.value=String([.25,.5,1,2,4].includes(n.length)?n.length:1);startEl.value=n.start;velocityEl.value=n.velocity||100;render()}function update(){if(selected<0)return;let n=melody[selected];n.pitch=pitchSel.value;n.length=+lengthSel.value;n.start=Math.max(0,+startEl.value||0);n.velocity=Math.max(1,Math.min(127,+velocityEl.value||100));render()}pitchSel.onchange=lengthSel.onchange=startEl.oninput=velocityEl.oninput=update;del.onclick=()=>{if(selected<0)return;melody.splice(selected,1);selected=melody.length?Math.min(selected,melody.length-1):-1;render();if(selected>=0)select(selected);playNotes.disabled=!melody.length};playVoice.onclick=()=>url&&new Audio(url).play();redo.onclick=()=>{raw=[];melody=[];selected=-1;render();audio.style.display='none';playVoice.disabled=redo.disabled=playNotes.disabled=true;time.textContent='00:00.0';status.textContent='録り直せます'};function freq(name){let m=name.match(/^([A-G])(#?)(-?\d+)$/),map={C:0,D:2,E:4,F:5,G:7,A:9,B:11},md=(+m[3]+1)*12+map[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(md-69)/12)}function sound(n,t,d,type){let c=ac(),f=freq(n.pitch),g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22*((n.velocity||100)/127),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.35,d));g.connect(c.destination);let waves=type==='piano'?[[1,'sine',1],[2,'sine',.35],[3,'sine',.16]]:type==='epiano'?[[1,'sine',1],[2,'sine',.2]]:[[1,'sawtooth',.6],[1.01,'square',.18]];waves.forEach(([h,w,a])=>{let o=c.createOscillator(),x=c.createGain();o.type=w;o.frequency.value=f*h;x.gain.value=a;o.connect(x).connect(g);o.start(t);o.stop(t+d+.1)})}playNotes.onclick=()=>{if(!melody.length)return;let c=ac(),bs=60/bpm,base=c.currentTime+.08;melody.forEach(n=>sound(n,base+n.start*bs,Math.max(.12,n.length*bs*.9),instrument.value));status.textContent='♪ '+instrument.options[instrument.selectedIndex].text+'で再生中'};setBpm(120);restartMetro()})();</script></body></html>
