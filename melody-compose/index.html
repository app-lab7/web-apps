e="1">1拍</option><option value="2">2拍</option><option value="4">4拍</option></select></label><label>開始位置<input id="start" type="number" min="0" step="0.25" disabled></label><label>ベロシティ<input id="velocity" type="number" min="1" max="127" value="100" disabled></label></div><div class="hint">赤い音符はドラッグで移動、右端をドラッグで長さ変更できます。</div></section></main><script>const $=s=>document.querySelector(s),statusEl=$('#status'),bpmEl=$('#bpm'),bpmText=$('#bpmText'),meter=$('#meter'),metroBtn=$('#metro'),beats=$('#beats'),record=$('#record'),recordLabel=$('#recordLabel'),timer=$('#timer'),wave=$('#wave'),audio=$('#audio'),play=$('#play'),redo=$('#redo'),micCheck=$('#micCheck'),micDevice=$('#micDevice'),micBar=$('#micBar'),micPct=$('#micPct'),livePitch=$('#livePitch'),instrument=$('#instrument'),quant=$('#quant'),convert=$('#convert'),playNotes=$('#playNotes'),guide=$('#guide'),notesEl=$('#notes'),labels=$('#labels'),pitchSel=$('#pitch'),lengthSel=$('#length'),startEl=$('#start'),velocityEl=$('#velocity'),addBtn=$('#add'),delBtn=$('#del'),splitBtn=$('#split'),dupBtn=$('#dup'),quantAll=$('#quantAll');let bpm=120,metroOn=true,metroTimer=null,beat=0,taps=[],stream=null,ctx=null,analyser=null,data=null,recorder=null,chunks=[],blob=null,url=null,recording=false,recStart=0,recTimer=null,melody=[],rawNotes=[],selected=-1;const pitchNames=['C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];pitchNames.forEach(p=>{let l=document.createElement('div');l.className='lab';l.textContent=p;labels.appendChild(l);let o=document.createElement('option');o.value=p;o.textContent=p;pitchSel.appendChild(o)});for(let i=0;i<56;i++){let b=document.createElement('i');b.className='bar';wave.appendChild(b)}function ensureCtx(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function drawBeats(){beats.innerHTML='';for(let i=0;i<+meter.value;i++){let d=document.createElement('i');d.className='beat';beats.appendChild(d)}restartMetro()}function clickSound(){if(!metroOn)return;let c=ensureCtx(),o=c.createOscillator(),g=c.createGain();o.frequency.value=beat%(+meter.value)===0?1250:900;g.gain.setValueAtTime(.14,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.055);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.06);[...beats.children].forEach(x=>x.classList.remove('on'));beats.children[beat%(+meter.value)]?.classList.add('on');beat++}function restartMetro(){clearInterval(metroTimer);metroTimer=null;beat=0;[...beats.children].forEach(x=>x.classList.remove('on'));if(!metroOn)return;clickSound();metroTimer=setInterval(clickSound,60000/bpm)}function setBpm(v){bpm=Math.max(40,Math.min(240,Math.round(v)));bpmEl.value=bpm;bpmText.textContent=bpm;if(metroOn)restartMetro()}$('#minus').onclick=()=>setBpm(bpm-1);$('#plus').onclick=()=>setBpm(bpm+1);bpmEl.oninput=()=>setBpm(+bpmEl.value);meter.onchange=drawBeats;metroBtn.onclick=()=>{metroOn=!metroOn;metroBtn.classList.toggle('active',metroOn);metroBtn.textContent=metroOn?'♪ メトロノーム ON':'♪ メトロノーム OFF';restartMetro()};$('#tap').onclick=()=>{let n=performance.now();taps=taps.filter(x=>n-x<3000);taps.push(n);if(taps.length>1){let t=0;for(let i=1;i<taps.length;i++)t+=taps[i]-taps[i-1];setBpm(60000/(t/(taps.length-1)))}};async function devices(){try{let ds=await navigator.mediaDevices.enumerateDevices(),cur=micDevice.value;micDevice.innerHTML='<option value="">自動：現在のマイク</option>';ds.filter(d=>d.kind==='audioinput').forEach((d,i)=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'マイク '+(i+1);micDevice.appendChild(o)});if([...micDevice.options].some(o=>o.value===cur))micDevice.value=cur}catch{}}async function prepareMic(force=false){let live=stream?.getAudioTracks().find(t=>t.readyState==='live'&&t.enabled);if(live&&!force)return true;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(!navigator.mediaDevices?.getUserMedia){statusEl.textContent='このブラウザではマイクを利用できません';return false}tr
