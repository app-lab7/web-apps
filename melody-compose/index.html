<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Melody Compose</title><style>
:root{color-scheme:light dark;--bg:#f6f7f9;--panel:#fff;--text:#17191d;--muted:#6f7580;--line:#dfe3e8;--accent:#e34d5b;--soft:#fff1f3}@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#191c22;--text:#f4f5f7;--muted:#a3a9b3;--line:#30343d;--soft:#351a1e}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1040px;margin:auto;padding:20px 14px 48px}.top{display:flex;justify-content:space-between;align-items:end;gap:12px}.top h1{margin:0;font-size:25px}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px}.panel{margin-top:14px;padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.status{text-align:center;color:var(--muted);font-size:14px;min-height:22px}.tempo{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:12px}.tempo button{width:46px;height:46px;padding:0;border-radius:50%;font-size:22px}.bpm{text-align:center;min-width:130px}.bpm strong{display:block;font-size:48px;line-height:1}.bpm span{font-size:11px;letter-spacing:.12em;color:var(--muted)}input[type=range]{display:block;width:min(520px,100%);margin:20px auto;accent-color:var(--accent)}button,select,input{font:inherit}button,select,.num{min-height:44px;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;padding:0 14px}button{cursor:pointer;font-weight:650}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.active{background:var(--soft);border-color:var(--accent)}button:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center}.beats{height:42px;display:flex;gap:11px;justify-content:center;align-items:center}.beat{width:10px;height:10px;border-radius:50%;background:#aeb4bd}.beat.on{background:var(--accent);transform:scale(1.6)}.recordZone{text-align:center;padding:10px 0 15px}.record{width:108px;height:108px;padding:0;border-radius:50%;background:var(--accent);border:8px solid var(--panel);outline:2px solid var(--line)}.record.rec{width:82px;height:82px;border-radius:27px}.label{font-weight:750;margin-top:14px}.timer{font-size:30px;margin:5px 0;font-variant-numeric:tabular-nums}.wave{height:86px;display:flex;align-items:center;justify-content:center;gap:3px;padding:10px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--bg) 72%,var(--panel));overflow:hidden}.bar{width:4px;max-width:5px;border-radius:4px;background:#a4a9b2;height:9px}.bar.live{background:var(--accent)}audio{width:100%;margin-top:12px}.sectionHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.sectionHead h2{font-size:18px;margin:0}.live{margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.live strong{font-family:ui-monospace,monospace;font-size:17px;color:var(--accent)}.roll{overflow:auto;margin-top:13px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--bg) 70%,var(--panel))}.grid{position:relative;min-width:760px;height:308px;background:repeating-linear-gradient(to right,transparent 0,transparent 43px,var(--line) 44px),repeating-linear-gradient(to bottom,transparent 0,transparent 21px,var(--line) 22px)}.labels{position:absolute;left:0;top:0;bottom:0;width:54px;background:color-mix(in srgb,var(--panel) 94%,transparent);border-right:1px solid var(--line);z-index:2}.lab{height:22px;padding:3px 6px;text-align:right;font-size:10px;color:var(--muted)}.notes{position:absolute;left:56px;right:6px;top:0;bottom:0}.note{position:absolute;height:18px;min-height:18px;border:0;border-radius:5px;background:var(--accent);color:#fff;font-size:10px;padding:0 6px;text-align:left;overflow:hidden;white-space:nowrap}.note.sel{outline:3px solid var(--text);outline-offset:1px}.resize{position:absolute;right:0;top:0;width:10px;height:100%;background:#ffffff44;cursor:ew-resize}.editor{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:9px;margin-top:12px}.editor label{font-size:11px;color:var(--muted)}.editor select,.editor input{width:100%;margin-top:5px;min-height:42px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit;padding:0 9px}.hint{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;margin-top:14px}@media(max-width:560px){.tag{display:none}.editor{grid-template-columns:1fr 1fr}.row>*{flex:1 1 130px}}
</style></head><body><main class="app"><div class="top"><div><h1>Melody Compose</h1><p>口ずさむ → 打ち込み → 編集</p></div><div class="tag">Web App</div></div>
<section class="panel"><div class="status" id="status">テンポを決めて、メロディを歌ってください</div><div class="tempo"><button id="minus">−</button><div class="bpm"><strong id="bpmText">120</strong><span>BPM</span></div><button id="plus">＋</button></div><input id="bpm" type="range" min="40" max="240" value="120"><div class="row"><select id="meter"><option value="4">4 / 4</option><option value="3">3 / 4</option><option value="6">6 / 8</option></select><button id="metro" class="active">♪ メトロノーム ON</button><select id="count"><option value="4">4拍カウント</option><option value="2">2拍カウント</option><option value="0">カウントなし</option></select><button id="tap">TAP TEMPO</button></div><div class="beats" id="beats"></div></section>
<section class="panel"><div class="recordZone"><button class="record" id="record" aria-label="録音開始"></button><div class="label" id="recordLabel">録音する</div><div class="timer" id="timer">00:00.0</div></div><div class="wave" id="wave"></div><audio id="audio" controls hidden></audio><div class="row" style="margin-top:13px"><button id="micCheck">🎤 マイク接続確認</button><button id="play" disabled>▶ 再生</button><button id="redo" disabled>↻ 録り直す</button></div></section>
<section class="panel"><div class="sectionHead"><h2>鼻歌 → 打ち込み</h2><div class="row"><select id="instrument"><option value="piano">ピアノ</option><option value="epiano">エレピ</option><option value="synth">シンセ</option></select><select id="quant"><option value="0.25">1/16</option><option value="0.5" selected>1/8</option><option value="1">1/4</option></select><button id="generate" disabled>鼻歌から自動生成</button><button id="playNotes" class="primary" disabled>♪ 打ち込み再生</button></div></div><div class="live"><span>録音中の検出音</span><strong id="livePitch">—</strong></div><div class="roll"><div class="grid"><div class="labels" id="labels"></div><div class="notes" id="notes"></div></div></div><div class="row" style="margin-top:12px"><button id="add" disabled>＋ 音を追加</button><button id="del" disabled>削除</button><button id="split" disabled>分割</button><button id="dup" disabled>複製</button><button id="quantAll" disabled>全体クオンタイズ</button></div><div class="editor"><label>音階<select id="pitch" disabled></select></label><label>長さ<select id="length" disabled><option value="0.25">1/4拍</option><option value="0.5">1/2拍</option><option value="1">1拍</option><option value="2">2拍</option><option value="4">4拍</option></select></label><label>開始位置<input class="num" id="start" type="number" min="0" step="0.25" disabled></label><label>ベロシティ<input class="num" id="velocity" type="number" min="1" max="127" value="100" disabled></label></div><div class="hint">音符はドラッグで移動、右端をドラッグで長さ変更できます。メトロノームを鳴らしながら録音する場合はイヤホン推奨です。</div></section></main>
<script>
const $=s=>document.querySelector(s),statusEl=$('#status'),bpmEl=$('#bpm'),bpmText=$('#bpmText'),meter=$('#meter'),metroBtn=$('#metro'),beats=$('#beats'),record=$('#record'),recordLabel=$('#recordLabel'),timer=$('#timer'),wave=$('#wave'),audio=$('#audio'),play=$('#play'),redo=$('#redo'),micCheck=$('#micCheck'),livePitch=$('#livePitch'),instrument=$('#instrument'),quant=$('#quant'),generate=$('#generate'),playNotes=$('#playNotes'),notesEl=$('#notes'),labels=$('#labels'),pitchSel=$('#pitch'),lengthSel=$('#length'),startEl=$('#start'),velocityEl=$('#velocity'),addBtn=$('#add'),delBtn=$('#del'),splitBtn=$('#split'),dupBtn=$('#dup'),quantAll=$('#quantAll');
let bpm=120,metroOn=true,metroTimer=null,beat=0,taps=[],stream=null,ctx=null,analyser=null,timeData=null,recorder=null,chunks=[],blob=null,url=null,recording=false,recStart=0,recTimer=null,melody=[],selected=-1;
const pitchNames=['C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];
pitchNames.forEach(p=>{const l=document.createElement('div');l.className='lab';l.textContent=p;labels.appendChild(l);const o=document.createElement('option');o.value=p;o.textContent=p;pitchSel.appendChild(o)});for(let i=0;i<56;i++){const b=document.createElement('i');b.className='bar';wave.appendChild(b)}
function ensureCtx(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function drawBeats(){beats.innerHTML='';for(let i=0;i<+meter.value;i++){const d=document.createElement('i');d.className='beat';beats.appendChild(d)}restartMetro()}
function clickSound(){if(!metroOn)return;const c=ensureCtx(),o=c.createOscillator(),g=c.createGain();o.frequency.value=beat%(+meter.value)===0?1250:900;g.gain.setValueAtTime(.16,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.055);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.06);[...beats.children].forEach(x=>x.classList.remove('on'));if(beats.children[beat%(+meter.value)])beats.children[beat%(+meter.value)].classList.add('on');beat++}
function restartMetro(){clearInterval(metroTimer);metroTimer=null;beat=0;[...beats.children].forEach(x=>x.classList.remove('on'));if(!metroOn)return;clickSound();metroTimer=setInterval(clickSound,60000/bpm)}
function setBpm(v){bpm=Math.max(40,Math.min(240,Math.round(v)));bpmEl.value=bpm;bpmText.textContent=bpm;if(metroOn)restartMetro()}
$('#minus').onclick=()=>setBpm(bpm-1);$('#plus').onclick=()=>setBpm(bpm+1);bpmEl.oninput=()=>setBpm(+bpmEl.value);meter.onchange=drawBeats;metroBtn.onclick=()=>{metroOn=!metroOn;metroBtn.classList.toggle('active',metroOn);metroBtn.textContent=metroOn?'♪ メトロノーム ON':'♪ メトロノーム OFF';restartMetro()};$('#tap').onclick=()=>{const n=performance.now();taps=taps.filter(x=>n-x<3000);taps.push(n);if(taps.length>1){let t=0;for(let i=1;i<taps.length;i++)t+=taps[i]-taps[i-1];setBpm(60000/(t/(taps.length-1)))}};
async function prepareMic(){const live=stream&&stream.getAudioTracks().find(t=>t.readyState==='live'&&t.enabled);if(live)return true;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(!window.isSecureContext){statusEl.textContent='HTTPS環境で開いてください';return false}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});const c=ensureCtx(),src=c.createMediaStreamSource(stream);analyser=c.createAnalyser();analyser.fftSize=2048;timeData=new Float32Array(analyser.fftSize);src.connect(analyser);stream.getAudioTracks()[0]?.addEventListener('ended',()=>{stream=null;statusEl.textContent='マイク接続が変わりました。もう一度接続確認を押してください'});statusEl.textContent='✓ マイク接続OK';return true}catch(e){const n=e.name||'';statusEl.textContent=n==='NotAllowedError'?'マイクが拒否されています。アドレスバーのサイト設定から許可してください':n==='NotFoundError'?'使用できるマイクが見つかりません':n==='NotReadableError'?'マイクが他アプリで使用中、または機材切替後です。再読み込みしてください':'マイクを開始できません：'+n;return false}}
micCheck.onclick=async()=>{statusEl.textContent='マイクを確認中…';if(await prepareMic()){livePitch.textContent='MIC OK';setTimeout(()=>{if(!recording)livePitch.textContent='—'},1000)}};
function detectPitch(){if(!analyser||!timeData||!ctx)return null;analyser.getFloatTimeDomainData(timeData);let rms=0;for(const v of timeData)rms+=v*v;rms=Math.sqrt(rms/timeData.length);if(rms<.012)return null;let best=-1,score=0;const min=Math.floor(ctx.sampleRate/1000),max=Math.min(Math.floor(ctx.sampleRate/70),timeData.length/2);for(let off=min;off<=max;off++){let c=0;for(let i=0;i<timeData.length-off;i++)c+=timeData[i]*timeData[i+off];if(c>score){score=c;best=off}}if(best<0)return null;const f=ctx.sampleRate/best,m=Math.round(69+12*Math.log2(f/440)),names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];return names[(m%12+12)%12]+(Math.floor(m/12)-1)}
function fmt(ms){const s=ms/1000,m=Math.floor(s/60),sec=Math.floor(s%60),d=Math.floor((s%1)*10);return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+d}
async function beginRec(){if(!(await prepareMic()))return;chunks=[];if(url){URL.revokeObjectURL(url);url=null}recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});url=URL.createObjectURL(blob);audio.src=url;audio.hidden=false;play.disabled=false;generate.disabled=false;redo.disabled=false;statusEl.textContent='✓ 録音できました'};recorder.start();recording=true;recStart=performance.now();melody=[];selected=-1;render();record.classList.add('rec');recordLabel.textContent='停止';statusEl.textContent='録音中 — 音階を検出しています';let tick=0;recTimer=setInterval(()=>{timer.textContent=fmt(performance.now()-recStart);let level=0;if(analyser&&timeData){analyser.getFloatTimeDomainData(timeData);for(const v of timeData)level+=Math.abs(v);level=Math.min(1,level/timeData.length*9)}[...wave.children].forEach((b,i)=>{b.classList.add('live');b.style.height=(8+level*58*(.45+.55*Math.abs(Math.sin((i+tick)*.31))))+'px'});const p=detectPitch();livePitch.textContent=p||'—';if(p&&pitchNames.includes(p)&&tick%2===0){const q=+quant.value||.5,st=Math.max(0,Math.round(((performance.now()-recStart)/(60000/bpm))/q)*q),last=melody[melody.length-1];if(last&&last.pitch===p&&Math.abs(last.start+last.length-st)<=q)last.length+=q;else melody.push({pitch:p,start:st,length:q,velocity:95});selected=melody.length-1;render();playNotes.disabled=!melody.length}tick++},100)}
function startRec(){const n=+$('#count').value;if(!n){beginRec();return}statusEl.textContent='カウントイン…';let left=n;recordLabel.textContent=left;const t=setInterval(()=>{left--;if(left<=0){clearInterval(t);beginRec()}else recordLabel.textContent=left},60000/bpm)}
function stopRec(){recording=false;clearInterval(recTimer);if(recorder&&recorder.state!=='inactive')recorder.stop();record.classList.remove('rec');recordLabel.textContent='もう一度録音';livePitch.textContent='—';[...wave.children].forEach(b=>b.classList.remove('live'))}
record.onclick=()=>recording?stopRec():startRec();play.onclick=()=>{if(!url)return;const a=new Audio(url);a.play();statusEl.textContent='▶ 録音した歌声を再生中'};redo.onclick=()=>{if(recording)stopRec();melody=[];selected=-1;render();audio.hidden=true;play.disabled=true;redo.disabled=true;generate.disabled=true;playNotes.disabled=true;timer.textContent='00:00.0';recordLabel.textContent='録音する';statusEl.textContent='録り直せます'};
function render(){notesEl.innerHTML='';melody.forEach((n,i)=>{const b=document.createElement('button');b.className='note'+(i===selected?' sel':'');b.textContent=n.pitch;const row=Math.max(0,pitchNames.indexOf(n.pitch));b.style.top=(row*22+2)+'px';b.style.left=(n.start*44)+'px';b.style.width=Math.max(24,n.length*44-4)+'px';const h=document.createElement('span');h.className='resize';b.appendChild(h);b.onclick=()=>select(i);b.onpointerdown=e=>{if(e.target===h)return;select(i);const sx=e.clientX,sy=e.clientY,os=n.start,or=row,q=+quant.value||.5;const mv=ev=>{n.start=Math.max(0,Math.round((os+(ev.clientX-sx)/44)/q)*q);n.pitch=pitchNames[Math.max(0,Math.min(pitchNames.length-1,or+Math.round((ev.clientY-sy)/22)))];render()};const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)};h.onpointerdown=e=>{e.stopPropagation();select(i);const sx=e.clientX,ol=n.length,q=+quant.value||.5;const mv=ev=>{n.length=Math.max(.25,Math.round((ol+(ev.clientX-sx)/44)/q)*q);render()};const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)};notesEl.appendChild(b)});addBtn.disabled=!blob;quantAll.disabled=!melody.length;delBtn.disabled=splitBtn.disabled=dupBtn.disabled=selected<0}
function select(i){selected=i;const n=melody[i];pitchSel.disabled=lengthSel.disabled=startEl.disabled=velocityEl.disabled=false;pitchSel.value=n.pitch;lengthSel.value=String([.25,.5,1,2,4].includes(n.length)?n.length:1);startEl.value=n.start;velocityEl.value=n.velocity||100;render()}
function updateSel(){if(selected<0)return;const n=melody[selected];n.pitch=pitchSel.value;n.length=Math.max(.25,+lengthSel.value||1);n.start=Math.max(0,+startEl.value||0);n.velocity=Math.max(1,Math.min(127,+velocityEl.value||100));render()}
pitchSel.onchange=lengthSel.onchange=startEl.oninput=velocityEl.oninput=updateSel;addBtn.onclick=()=>{const l=melody[melody.length-1];melody.push({pitch:'C4',start:l?l.start+l.length:0,length:1,velocity:100});select(melody.length-1);playNotes.disabled=false};delBtn.onclick=()=>{if(selected<0)return;melody.splice(selected,1);selected=melody.length?Math.min(selected,melody.length-1):-1;render();playNotes.disabled=!melody.length};splitBtn.onclick=()=>{if(selected<0)return;const n=melody[selected],q=+quant.value||.5;if(n.length<=q)return;const h=Math.max(q,Math.round(n.length/2/q)*q),r=Math.max(q,n.length-h);n.length=h;melody.splice(selected+1,0,{pitch:n.pitch,start:n.start+h,length:r,velocity:n.velocity});render()};dupBtn.onclick=()=>{if(selected<0)return;const n=melody[selected];melody.splice(selected+1,0,{pitch:n.pitch,start:n.start+n.length,length:n.length,velocity:n.velocity});select(selected+1)};quantAll.onclick=()=>{const q=+quant.value||.5;melody.forEach(n=>{n.start=Math.round(n.start/q)*q;n.length=Math.max(q,Math.round(n.length/q)*q)});render()};generate.onclick=()=>{if(!melody.length){statusEl.textContent='録音中に音階を検出できませんでした';return}const q=+quant.value||.5;melody.forEach(n=>{n.start=Math.round(n.start/q)*q;n.length=Math.max(q,Math.round(n.length/q)*q)});render();statusEl.textContent='✓ 鼻歌を打ち込み化しました'};
function freq(name){const m=name.match(/^([A-G])(#?)(-?\d+)$/),map={C:0,D:2,E:4,F:5,G:7,A:9,B:11};if(!m)return 440;const midi=(+m[3]+1)*12+map[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(midi-69)/12)}
function tone(n,t,d,type){const c=ensureCtx(),f=freq(n.pitch),g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.17*((n.velocity||100)/127),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.12,d));g.connect(c.destination);if(type==='piano'){[[1,1],[2,.35],[3,.15],[4,.06]].forEach(([h,a])=>{const o=c.createOscillator(),x=c.createGain();o.type='sine';o.frequency.value=f*h;x.gain.value=a;o.connect(x).connect(g);o.start(t);o.stop(t+d+.18)})}else if(type==='epiano'){const o=c.createOscillator(),m=c.createOscillator(),mg=c.createGain();o.type=m.type='sine';o.frequency.value=f;m.frequency.value=f*2;mg.gain.value=f*.65;m.connect(mg).connect(o.frequency);o.connect(g);o.start(t);m.start(t);o.stop(t+d+.12);m.stop(t+d+.12)}else{const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=Math.min(4500,f*6);g.disconnect();fl.connect(g);g.connect(c.destination);[-7,0,7].forEach(dt=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(fl);o.start(t);o.stop(t+d+.04)})}}
playNotes.onclick=()=>{if(!melody.length)return;const c=ensureCtx(),beatSec=60/bpm,base=c.currentTime+.06;melody.forEach(n=>tone(n,base+n.start*beatSec,Math.max(.1,n.length*beatSec*.92),instrument.value));statusEl.textContent='♪ '+instrument.options[instrument.selectedIndex].text+'で再生中'};drawBeats();
</script></body></html>
