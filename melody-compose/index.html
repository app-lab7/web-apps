<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Melody Compose</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--panel:#fff;--text:#17191d;--muted:#6f7580;--line:#dfe2e7;--accent:#e34d5b;--accent2:#b92f3d;--soft:#fff0f2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#181b21;--text:#f5f6f8;--muted:#a1a7b0;--line:#30343d;--soft:#351a1e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:960px;margin:auto;padding:22px 16px 48px}.top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:24px}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.tempo{display:flex;align-items:center;justify-content:center;gap:18px}.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:transparent;color:inherit;font-size:22px;cursor:pointer}.bpm{text-align:center;min-width:132px}.bpm strong{display:block;font-size:50px;line-height:1;font-variant-numeric:tabular-nums}.bpm span{font-size:11px;letter-spacing:.12em;color:var(--muted)}input[type=range]{width:min(520px,100%);display:block;margin:20px auto;accent-color:var(--accent)}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}button,select{min-height:44px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:12px;padding:0 14px;font-size:15px}button{cursor:pointer;font-weight:650}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.active{background:var(--soft);border-color:var(--accent)}button:disabled{opacity:.42;cursor:not-allowed}.beatline{height:46px;display:flex;align-items:center;justify-content:center;gap:12px}.beat{width:10px;height:10px;background:#aeb3bc;border-radius:50%}.beat.on{background:var(--accent);transform:scale(1.6)}.status{text-align:center;color:var(--muted);font-size:14px;min-height:22px}.recordZone{text-align:center;padding:14px 0}.record{width:112px;height:112px;padding:0;border-radius:50%;background:var(--accent);border:8px solid var(--panel);outline:2px solid var(--line);box-shadow:0 8px 25px #0002}.record.recording{width:84px;height:84px;border-radius:28px}.recordLabel{margin-top:14px;font-weight:750}.timer{font-size:30px;font-variant-numeric:tabular-nums;margin:6px 0}.wave{height:92px;display:flex;align-items:center;gap:3px;padding:10px;overflow:hidden;border-radius:14px;background:color-mix(in srgb,var(--bg) 70%,var(--panel));border:1px solid var(--line)}.bar{flex:1;max-width:6px;min-width:2px;background:#9fa5ae;border-radius:4px;height:10px}.bar.live{background:var(--accent)}audio{width:100%;margin-top:14px}.analysisHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.analysisHead h2{margin:0;font-size:18px}.notes{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--bg) 70%,var(--panel))}.note{padding:7px 9px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.small{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}.takes{display:grid;gap:8px;margin-top:12px}.take{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:12px}.take span{font-size:13px}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}@media(max-width:520px){.app{padding:16px 12px 38px}.top{align-items:start}.badge{display:none}.panel{padding:14px}.bpm strong{font-size:44px}.record{width:100px;height:100px}.row>*{flex:1 1 130px}.row .round{flex:none}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div><h1>Melody Compose</h1><p>歌って、メロディにする。</p></div><div class="badge">Prototype 2</div></div>

  <section class="panel">
    <div class="status" id="status">テンポを決めて録音してください</div>
    <div class="tempo">
      <button class="round" id="minus" aria-label="BPMを下げる">−</button>
      <div class="bpm"><strong id="bpmText">120</strong><span>BPM</span></div>
      <button class="round" id="plus" aria-label="BPMを上げる">＋</button>
    </div>
    <input id="bpm" type="range" min="40" max="240" value="120">
    <div class="row">
      <select id="meter"><option value="4">4 / 4</option><option value="3">3 / 4</option><option value="6">6 / 8</option></select>
      <button id="metro" class="active">♪ メトロノーム ON</button>
      <select id="countIn"><option value="4">4拍カウント</option><option value="2">2拍カウント</option><option value="0">カウントなし</option></select>
      <button id="tap">TAP TEMPO</button>
    </div>
    <div class="beatline" id="beatline"></div>
  </section>

  <section class="panel">
    <div class="recordZone">
      <button class="record" id="record" aria-label="録音開始"></button>
      <div class="recordLabel" id="recordLabel">録音する</div>
      <div class="timer" id="timer">00:00.0</div>
    </div>
    <div class="wave" id="wave"></div>
    <audio id="audio" controls hidden></audio>
    <div class="row" style="margin-top:14px">
      <button id="saveTake" disabled>＋ テイクを残す</button>
      <button id="redo" disabled>↻ 録り直す</button>
    </div>
    <div class="takes" id="takes"></div>
  </section>

  <section class="panel">
    <div class="analysisHead"><h2>歌声 → メロディ</h2><div class="row"><select id="instrument"><option value="piano">ピアノ</option><option value="epiano">エレクトリックピアノ</option><option value="synth">シンセ</option></select><button id="previewTone">音色を試す</button><button id="analyze" disabled>音階を解析</button><button class="primary" id="playNotes" disabled>♪ 楽器音で再生</button></div></div>
    <div class="notes" id="notes"><span class="small">録音後に「音階を解析」を押すと、検出した音がここに並びます。</span></div>
    <div class="small">音色を選んで「音色を試す」を押すと、録音前でも違いを確認できます。歌声の音程解析は単音メロディ向けです。</div>
  </section>
  <div class="footer">録音は歌声優先モードです。メトロノームを鳴らしながら録音する場合はイヤホン推奨です。</div>
</main>
<script>
const $=s=>document.querySelector(s);
const statusEl=$('#status'),bpmRange=$('#bpm'),bpmText=$('#bpmText'),meter=$('#meter'),metroBtn=$('#metro'),countIn=$('#countIn'),beatline=$('#beatline');
const recordBtn=$('#record'),recordLabel=$('#recordLabel'),timer=$('#timer'),wave=$('#wave'),audioEl=$('#audio'),saveTake=$('#saveTake'),redo=$('#redo'),takesEl=$('#takes');
const analyzeBtn=$('#analyze'),playNotes=$('#playNotes'),notesEl=$('#notes'),instrument=$('#instrument');
let bpm=120,metroOn=true,audioCtx=null,nextBeat=0,beatIndex=0,scheduler=null,recording=false,mediaRecorder=null,stream=null,chunks=[],currentBlob=null,currentUrl=null,recStart=0,recTimer=null,analyser=null,raf=null,taps=[],detected=[],metroGeneration=0;
for(let i=0;i<60;i++){const b=document.createElement('i');b.className='bar';wave.appendChild(b)}
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function stopMetronome(){metroOn=false;metroGeneration++;clearInterval(scheduler);scheduler=null;beatIndex=0;[...beatline.children].forEach(x=>x.classList.remove('on'));metroBtn.classList.remove('active');metroBtn.textContent='♪ メトロノーム OFF'}
function setBpm(v){bpm=Math.max(40,Math.min(240,Math.round(v)));bpmRange.value=bpm;bpmText.textContent=bpm;if(metroOn)restartMetronome()}
$('#minus').onclick=()=>setBpm(bpm-1);$('#plus').onclick=()=>setBpm(bpm+1);bpmRange.oninput=()=>setBpm(+bpmRange.value);
function drawBeats(){beatline.innerHTML='';const n=+meter.value;for(let i=0;i<n;i++){const d=document.createElement('i');d.className='beat';beatline.appendChild(d)}}
meter.onchange=()=>{drawBeats();if(metroOn)restartMetronome()};drawBeats();
function clickBeat(time,accent=false){if(!metroOn)return;const ctx=ensureAudio(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=accent?1250:900;gain.gain.setValueAtTime(0.0001,time);gain.gain.exponentialRampToValueAtTime(accent?0.22:0.12,time+0.002);gain.gain.exponentialRampToValueAtTime(0.0001,time+0.055);osc.connect(gain).connect(ctx.destination);osc.start(time);osc.stop(time+0.06)}
function scheduleMetro(gen){if(!metroOn||!audioCtx||gen!==metroGeneration)return;while(nextBeat<audioCtx.currentTime+0.075){const n=+meter.value;const idx=beatIndex%n;clickBeat(nextBeat,idx===0);const wait=Math.max(0,(nextBeat-audioCtx.currentTime)*1000);setTimeout(()=>{if(!metroOn||gen!==metroGeneration)return;[...beatline.children].forEach(x=>x.classList.remove('on'));if(beatline.children[idx])beatline.children[idx].classList.add('on')},wait);nextBeat+=60/bpm;beatIndex++}}
function restartMetronome(){clearInterval(scheduler);scheduler=null;if(!metroOn)return;metroGeneration++;const gen=metroGeneration,ctx=ensureAudio();nextBeat=ctx.currentTime+0.05;beatIndex=0;scheduleMetro(gen);scheduler=setInterval(()=>scheduleMetro(gen),25)}
metroBtn.onclick=()=>{if(metroOn){stopMetronome()}else{metroOn=true;metroBtn.classList.add('active');metroBtn.textContent='♪ メトロノーム ON';restartMetronome()}};
$('#tap').onclick=()=>{const t=performance.now();taps=taps.filter(x=>t-x<3000);taps.push(t);if(taps.length>1){let total=0;for(let i=1;i<taps.length;i++)total+=taps[i]-taps[i-1];setBpm(60000/(total/(taps.length-1)))}};
function fmt(ms){let s=ms/1000,m=Math.floor(s/60),ss=Math.floor(s%60),d=Math.floor((s%1)*10);return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'.'+d}
async function prepareMic(){if(stream)return stream;stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});const ctx=ensureAudio();const src=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=256;src.connect(analyser);return stream}
function animateWave(){if(!recording||!analyser)return;const data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);const bars=[...wave.children];bars.forEach((bar,i)=>{const v=data[Math.floor(i*data.length/bars.length)]||0;bar.style.height=(8+v/255*66)+'px';bar.classList.add('live')});raf=requestAnimationFrame(animateWave)}
async function beginRecord(){try{await prepareMic()}catch(e){statusEl.textContent='マイクを許可してください';recordLabel.textContent='録音する';return}chunks=[];currentBlob=null;detected=[];notesEl.innerHTML='<span class="small">録音後に解析できます。</span>';playNotes.disabled=true;mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=()=>{currentBlob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'});if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(currentBlob);audioEl.src=currentUrl;audioEl.hidden=false;analyzeBtn.disabled=false;saveTake.disabled=false;redo.disabled=false;statusEl.textContent='録音できました。再生または音階解析ができます。'};mediaRecorder.start();recording=true;recStart=performance.now();recordBtn.classList.add('recording');recordLabel.textContent='停止';statusEl.textContent='録音中 — メロディを歌ってください';recTimer=setInterval(()=>timer.textContent=fmt(performance.now()-recStart),100);animateWave()}
function stopRecord(){if(!recording)return;recording=false;clearInterval(recTimer);cancelAnimationFrame(raf);mediaRecorder.stop();recordBtn.classList.remove('recording');recordLabel.textContent='もう一度録音';[...wave.children].forEach(x=>x.classList.remove('live'))}
async function startWithCount(){ensureAudio();if(metroOn)restartMetronome();const c=+countIn.value;if(!c){beginRecord();return}statusEl.textContent='カウントイン…';for(let i=c;i>0;i--){recordLabel.textContent=String(i);await new Promise(r=>setTimeout(r,60000/bpm))}beginRecord()}
recordBtn.onclick=()=>recording?stopRecord():startWithCount();
redo.onclick=()=>{if(recording)stopRecord();currentBlob=null;detected=[];audioEl.hidden=true;audioEl.removeAttribute('src');timer.textContent='00:00.0';recordLabel.textContent='録音する';saveTake.disabled=true;redo.disabled=true;analyzeBtn.disabled=true;playNotes.disabled=true;notesEl.innerHTML='<span class="small">録音後に「音階を解析」を押してください。</span>';statusEl.textContent='録り直せます'};
saveTake.onclick=()=>{if(!currentBlob)return;const url=URL.createObjectURL(currentBlob);const row=document.createElement('div');row.className='take';const n=takesEl.children.length+1;row.innerHTML='<span>Take '+n+' ・ BPM '+bpm+'</span>';const p=document.createElement('audio');p.controls=true;p.src=url;p.style.width='min(360px,62%)';row.appendChild(p);takesEl.prepend(row);statusEl.textContent='テイクを残しました'};
function autoCorrelate(buf,sampleRate){let size=buf.length,rms=0;for(let i=0;i<size;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/size);if(rms<0.012)return -1;let r1=0,r2=size-1,th=.2;for(let i=0;i<size/2;i++){if(Math.abs(buf[i])<th){r1=i;break}}for(let i=1;i<size/2;i++){if(Math.abs(buf[size-i])<th){r2=size-i;break}}buf=buf.slice(r1,r2);size=buf.length;const c=new Array(size).fill(0);for(let i=0;i<size;i++)for(let j=0;j<size-i;j++)c[i]+=buf[j]*buf[j+i];let d=0;while(d+1<size&&c[d]>c[d+1])d++;let max=-1,pos=-1;for(let i=d;i<size;i++){if(c[i]>max){max=c[i];pos=i}}if(pos<=0)return -1;return sampleRate/pos}
function freqToMidi(f){return Math.round(69+12*Math.log2(f/440))}
function midiName(m){const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];return names[(m%12+12)%12]+(Math.floor(m/12)-1)}
async function decodeBlob(blob){const ab=await blob.arrayBuffer();return await ensureAudio().decodeAudioData(ab.slice(0))}
async function analyzeAudio(){if(!currentBlob)return;statusEl.textContent='音階を解析中…';analyzeBtn.disabled=true;try{const b=await decodeBlob(currentBlob);const data=b.getChannelData(0),sr=b.sampleRate,windowSize=2048,hop=Math.max(512,Math.floor(sr*(60/bpm)/8));let raw=[];for(let i=0;i+windowSize<data.length;i+=hop){const f=autoCorrelate(data.slice(i,i+windowSize),sr);raw.push(f>70&&f<1200?freqToMidi(f):null)}let compact=[];for(const m of raw){if(m==null)continue;const last=compact[compact.length-1];if(last&&last.m===m){last.count++}else compact.push({m,count:1})}compact=compact.filter(x=>x.count>=2);detected=compact.map(x=>({midi:x.m,beats:Math.max(.25,Math.round((x.count*hop/sr)/(60/bpm)*4)/4)}));notesEl.innerHTML='';if(!detected.length){notesEl.innerHTML='<span class="small">音程を安定して検出できませんでした。伴奏なしで、少し長めにはっきり歌うと改善します。</span>'}else detected.forEach(n=>{const s=document.createElement('span');s.className='note';s.textContent=midiName(n.midi)+'  '+n.beats+'拍';notesEl.appendChild(s)});playNotes.disabled=!detected.length;statusEl.textContent=detected.length?'音階を解析しました':'音階を検出できませんでした'}catch(e){console.error(e);statusEl.textContent='この録音形式を解析できませんでした'}finally{analyzeBtn.disabled=false}}
analyzeBtn.onclick=analyzeAudio;
function midiFreq(m){return 440*Math.pow(2,(m-69)/12)}
function connectPanner(ctx,input,pan){if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;input.connect(p);return p}return input}
function playPiano(m,start,dur){const ctx=ensureAudio(),f=midiFreq(m),master=ctx.createGain();master.gain.value=.72;master.connect(ctx.destination);const harmonics=[[1,.30],[2,.12],[3,.065],[4,.028],[5,.014]];harmonics.forEach(([h,a],i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f*h,start);o.detune.value=(i-2)*1.2;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(a,start+.006+i*.001);g.gain.exponentialRampToValueAtTime(Math.max(.0001,a*.22),start+.12);g.gain.exponentialRampToValueAtTime(.0001,start+Math.max(.45,dur*1.5));o.connect(g);connectPanner(ctx,g,i%2?.08:-.08).connect(master);o.start(start);o.stop(start+Math.max(.5,dur*1.6))});const noise=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.025),ctx.sampleRate),d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const ns=ctx.createBufferSource(),ng=ctx.createGain(),hp=ctx.createBiquadFilter();ns.buffer=noise;hp.type='highpass';hp.frequency.value=1800;ng.gain.setValueAtTime(.06,start);ng.gain.exponentialRampToValueAtTime(.0001,start+.025);ns.connect(hp).connect(ng).connect(master);ns.start(start)}
function playEPiano(m,start,dur){const ctx=ensureAudio(),f=midiFreq(m),master=ctx.createGain();master.connect(ctx.destination);master.gain.setValueAtTime(.0001,start);master.gain.exponentialRampToValueAtTime(.32,start+.018);master.gain.exponentialRampToValueAtTime(.11,start+.22);master.gain.exponentialRampToValueAtTime(.0001,start+Math.max(.5,dur*1.15));const carrier=ctx.createOscillator(),mod=ctx.createOscillator(),modGain=ctx.createGain();carrier.type='sine';carrier.frequency.value=f;mod.type='sine';mod.frequency.value=f*2;modGain.gain.setValueAtTime(f*.9,start);modGain.gain.exponentialRampToValueAtTime(Math.max(1,f*.08),start+.38);mod.connect(modGain).connect(carrier.frequency);carrier.connect(master);carrier.start(start);mod.start(start);carrier.stop(start+Math.max(.55,dur*1.2));mod.stop(start+Math.max(.55,dur*1.2));const bell=ctx.createOscillator(),bg=ctx.createGain();bell.type='sine';bell.frequency.value=f*4;bg.gain.setValueAtTime(.07,start);bg.gain.exponentialRampToValueAtTime(.0001,start+.28);bell.connect(bg).connect(ctx.destination);bell.start(start);bell.stop(start+.3)}
function playSynth(m,start,dur){const ctx=ensureAudio(),f=midiFreq(m),filter=ctx.createBiquadFilter(),master=ctx.createGain();filter.type='lowpass';filter.Q.value=7;filter.frequency.setValueAtTime(500,start);filter.frequency.exponentialRampToValueAtTime(Math.min(5000,f*8),start+.08);filter.frequency.exponentialRampToValueAtTime(Math.max(700,f*2),start+Math.max(.2,dur*.8));filter.connect(master).connect(ctx.destination);master.gain.setValueAtTime(.0001,start);master.gain.exponentialRampToValueAtTime(.22,start+.025);master.gain.setValueAtTime(.18,start+Math.max(.04,dur*.65));master.gain.exponentialRampToValueAtTime(.0001,start+dur);[-7,0,7].forEach((det,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=i===1?'sawtooth':'square';o.frequency.value=f;o.detune.value=det;g.gain.value=i===1?.6:.18;o.connect(g).connect(filter);o.start(start);o.stop(start+dur+.03)})}
function playTone(m,start,dur,type){if(type==='piano')playPiano(m,start,dur);else if(type==='epiano')playEPiano(m,start,dur);else playSynth(m,start,dur)}
function playInstrumentPreview(){const ctx=ensureAudio(),t=ctx.currentTime+.04;[60,64,67,72].forEach((m,i)=>playTone(m,t+i*.23,.36,instrument.value));statusEl.textContent=instrument.options[instrument.selectedIndex].text+' の音色を試聴中'}
$('#previewTone').onclick=playInstrumentPreview;
instrument.onchange=()=>{statusEl.textContent='音色：'+instrument.options[instrument.selectedIndex].text};
playNotes.onclick=()=>{if(!detected.length)return;const ctx=ensureAudio();let t=ctx.currentTime+.08;const beat=60/bpm;for(const n of detected){const dur=Math.max(.12,n.beats*beat*.92);playTone(n.midi,t,dur,instrument.value);t+=n.beats*beat}statusEl.textContent=instrument.options[instrument.selectedIndex].text+'で再生中'};
window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());clearInterval(scheduler);clearInterval(recTimer);if(currentUrl)URL.revokeObjectURL(currentUrl)});
</script>
</body>
</html>
