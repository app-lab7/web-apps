<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文書エディター</title><style>*{box-sizing:border-box}body{margin:0}#app{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;background:#e9edf3;color:#202124;overflow:hidden}button,select,input{font:inherit}button{cursor:pointer}.title{height:38px;background:#185abd;color:#fff;display:flex;align-items:center;padding:0 12px;gap:10px}.actions{margin-left:auto}.title button{background:transparent;color:#fff;border:0;padding:6px 10px}.title .newBtn{background:#fff;color:#185abd;font-weight:700}.tabs{height:36px;background:#fff;border-bottom:1px solid #ddd;display:flex}.tab{border:0;background:#fff;padding:0 15px;border-bottom:3px solid transparent}.tab.active{color:#185abd;font-weight:700;border-bottom-color:#185abd}.ribbon{height:130px;background:#fff;border-bottom:1px solid #ccd2da;overflow-x:auto}.panel{display:none;height:100%;padding:6px}.panel.active{display:flex}.group{position:relative;display:flex;align-items:center;gap:5px;padding:3px 10px 21px;border-right:1px solid #ddd;min-width:max-content}.gtitle{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:#667085}.col,.row{display:flex;gap:4px}.col{flex-direction:column}.mini{height:30px;border:1px solid #cbd1d9;background:#fff;border-radius:3px;padding:3px 7px}.wide{width:185px}.num{width:68px}.styleGallery{display:flex;gap:3px}.styleBtn{width:92px;height:66px;border:1px solid #d3d8df;background:#fff;border-radius:3px;padding:5px;text-align:left}.styleBtn:hover{background:#edf4ff;border-color:#8fb5e8}.styleBtn span{display:block;white-space:nowrap;overflow:hidden}.styleBtn small{color:#667085}.s-normal span{font-family:"Yu Mincho",serif;font-size:12px}.s-title span{font-family:"Yu Gothic",sans-serif;font-size:19px;font-weight:600;color:#1f4e79}.s-subtitle span{font-family:"Yu Gothic",sans-serif;font-size:1 font-size:18pt!important;font-weight:700!important;color:#1f4e79!important;margin:14pt 0 6pt!important}.word-h2{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif!important;font-size:14pt!important;font-weight:700!important;color:#2f5597!important;margin:10pt 0 5pt!important}.word-normal{font-family:"Yu Mincho","Hiragino Mincho ProN",serif!important;font-size:12pt!important;line-height:1.6!important;font-weight:400!important;color:#111!important}.status{height:29px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;padding:0 12px;gap:12px;font-size:11px}.grow{flex:1}#zoom{width:120px}@media print{.title,.tabs,.ribbon,.nav,.vRuler,.hRuler,.status,.pageLabel,.marginGuide{display:none!important}.workspace,.editorArea,.stage,.pages{display:block!important;padding:0!important;background:#fff!important}.paper{box-shadow:none!important;transform:none!important}.paperWrap{page-break-after:always}@page{size:A4;margin:0}}</style></head><body><div id="app"><div class="title"><b>文書エディター</b><span id="saveState">✓ 自動保存済み</span><div class="actions"><button class="newBtn" id="newDocTop">＋ 新規作成</button><button id="quickSave">保存</button><button id="printBtn">印刷</button></div></div><div class="tabs"><button class="tab active" data-tab="home">ホーム</button><button class="tab" data-tab="insert">挿入</button><button class="tab" data-tab="layout">レイアウト</button></div><div class="ribbon"><div class="panel active" data-panel="home"><div class="group"><div class="col"><button class="mini" id="undoBtn">↶ 元に戻す</button><button class="mini" id="redoBtn">↷ やり直す</button></div><span class="gtitle">編集</span></div><div class="group"><div class="col"><div class="row"><select id="fontName" class="mini wide"><option>Yu Mincho</option><option>Yu Gothic</option><option>Hiragino Mincho ProN</option><option>Hiragino Kaku Gothic ProN</option><option>Meiryo</option><option>Noto Serif JP</option><option>Noto Sans JP</option><option>Arial</option><option>Times New Roman</option></select><select id="fontSize" class="mini num"><option>8</option><option>9</option><option>10</option><option>10.5</option><option>11</option><option selected>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option><option>48</option><option>72</option></select></div><div class="row"><button class="mini" id="boldBtn"><b>B</b></button><button class="mini" id="italicBtn"><i>I</i></button><button class="mini" id="underlineBtn"><u>U</u></button><input id="fontColor" type="color" value="#111111"></div></div><span class="gtitle">フォント</span></div><div class="group"><div class="col"><div class="row"><button class="mini" id="alignLeft">左揃え</button><button class="mini" id="alignCenter">中央</button><button class="mini" id="alignRight">右揃え</button></div><div class="row"><button class="mini" id="bulletBtn">• 箇条書き</button><button class="mini" id="numberBtn">1. 番号</button></div></div><span class="gtitle">段落</span></div><div class="group"><div class="styleGallery"><button class="styleBtn s-normal" data-style="normal"><span>あいうえお</span><small>標準</small></button><button class="styleBtn s-title" data-style="title"><span>タイトル</span><small>タイトル</small></button><button class="styleBtn s-subtitle" data-style="subtitle"><span>サブタイトル</span><small>サブタイトル</small></button><button class="styleBtn s-h1" data-style="h1"><span>見出し 1</span><small>見出し 1</small></button><button class="styleBtn s-h2" data-style="h2"><span>見出し 2</span><small>見出し 2</small></button></div><span class="gtitle">スタイル</span></div></div><div class="panel" data-panel="insert"><div class="group"><label class="mini">画像を挿入<input id="fileInput" type="file" accept="image/*" hidden></label><button class="mini" id="addPage">空白ページ</button></div></div><div class="panel" data-panel="layout"><div class="group">左余白<input id="marginLeft" class="mini num" type="number" value="20">右余白<input id="marginRight" class="mini num" type="number" value="20">上余白<input id="marginTop" class="mini num" type="number" value="20">下余白<input id="marginBottom" class="mini num" type="number" value="20"></div></div></div><div class="workspace"><aside class="nav"><b>ページ</b><div id="thumbs"></div></aside><div class="vRuler"></div><section class="editorArea"><div class="hRuler"></div><main class="stage"><div class="pages" id="pages"></div></main></section></div><div class="status"><span>準備完了</span><span id="styleStatus">スタイル: 標準</span><span class="grow"></span>ズーム<input id="zoom" type="range" min="40" max="150" value="100"><span id="zoomLabel">100%</span></div><script>(()=>{const q=s=>document.querySelector('#app '+s),qa=s=>[...document.querySelectorAll('#app '+s)],MM=3.7795,AUTO='wordLikeEditorV3';let currentPage=0,zoom=1,mL=20,mR=20,mT=20,mB=20,history=[],future=[],range=null,timer;const pagesEl=q('#pages'),pages=()=>qa('.paper'),bodies=()=>qa('.docBody'),active=()=>bodies()[currentPage];function snap(){return JSON.stringify({currentPage,mL,mR,mT,mB,pages:bodies().map(x=>x.innerHTML)})}function save(){localStorage.setItem(AUTO,snap());q('#saveState').textContent='✓ 自動保存済み'}function push(){const s=snap();if(history.at(-1)!==s){history.push(s);future=[];clearTimeout(timer);timer=setTimeout(save,200)}}function remember(){const s=getSelection();if(s.rangeCount&&active()?.contains(s.anchorNode))range=s.getRangeAt(0).cloneRange()}function restore(){if(range){const s=getSelection();s.removeAllRanges();s.addRange(range)}}function layout(p){p.querySelector('.marginGuide').style.cssText=`left:${mL*MM}px;right:${mR*MM}px;top:${mT*MM}px;bottom:${mB*MM}px`;Object.assign(p.querySelector('.docBody').style,{left:mL*MM+'px',right:mR*MM+'px',top:mT*MM+'px',bottom:mB*MM+'px'})}function createPage(html=''){const w=document.createElement('div');w.className='paperWrap';const l=document.createElement('div');l.className='pageLabel';l.textContent='ページ '+(pages().length+1);const p=document.createElement('div');p.className='paper';const g=document.createElement('div');g.className='marginGuide';const b=document.createElement('div');b.className='docBody';b.contentEditable='true';b.innerHTML=html;b.onfocus=()=>{currentPage=pages().indexOf(p);renderThumbs()};b.oninput=push;b.onmouseup=remember;b.onkeyup=remember;p.append(g,b);w.append(l,p);pagesEl.append(w);layout(p);renderThumbs()}function renderThumbs(){q('#thumbs').innerHTML='';pages().forEach((p,i)=>{const d=document.createElement('div');d.className='thumb'+(i===currentPage?' active':'');d.innerHTML='<div class="thumbPaper"></div>ページ '+(i+1);d.onclick=()=>{currentPage=i;p.scrollIntoView({behavior:'smooth'});renderThumbs()};q('#thumbs').append(d)})}function exec(c,v=null){active().focus();restore();document.execCommand(c,false,v);remember();push()}function setSize(pt){active().focus();restore();document.execCommand('fontSize',false,'7');qa('.docBody font[size="7"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=pt+'pt'});remember();push()}function block(){if(!range)return null;let n=range.startContainer.nodeType===3?range.startContainer.parentElement:range.startContainer;while(n&&n!==active()&&!/^(P|DIV|H1|H2|H3|LI)$/.test(n.tagName))n=n.parentElement;return n===active()?null:n}function style(type){active().focus();restore();let el=block();if(!el){document.execCommand('formatBlock',false,'p');remember();el=block()}if(!el)return;el.classList.remove('word-normal','word-title','word-subtitle','word-h1','word-h2');el.classList.add({normal:'word-normal',title:'word-title',subtitle:'word-subtitle',h1:'word-h1',h2:'word-h2'}[type]);q('#styleStatus').textContent='スタイル: '+({normal:'標準',title:'タイトル',subtitle:'サブタイトル',h1:'見出し 1',h2:'見出し 2'}[type]);push()}q('#fontName').onchange=()=>exec('fontName',q('#fontName').value);q('#fontSize').onchange=()=>setSize(q('#fontSize').value);q('#boldBtn').onclick=()=>exec('bold');q('#italicBtn').onclick=()=>exec('italic');q('#underlineBtn').onclick=()=>exec('underline');q('#fontColor').onchange=()=>exec('foreColor',q('#fontColor').value);q('#alignLeft').onclick=()=>exec('justifyLeft');q('#alignCenter').onclick=()=>exec('justifyCenter');q('#alignRight').onclick=()=>exec('justifyRight');q('#bulletBtn').onclick=()=>exec('insertUnorderedList');q('#numberBtn').onclick=()=>exec('insertOrderedList');qa('.styleBtn').forEach(b=>b.onclick=()=>style(b.dataset.style));qa('.tab').forEach(t=>t.onclick=()=>{qa('.tab,.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');q(`[data-panel="${t.dataset.tab}"]`).classList.add('active')});q('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=x=>exec('insertImage',x.target.result);r.readAsDataURL(f)};q('#addPage').onclick=()=>{createPage();currentPage=pages().length-1;push()};['marginLeft','marginRight','marginTop','marginBottom'].forEach(id=>q('#'+id).onchange=()=>{mL=+q('#marginLeft').value||20;mR=+q('#marginRight').value||20;mT=+q('#marginTop').value||20;mB=+q('#marginBottom').value||20;pages().forEach(layout);push()});q('#zoom').oninput=()=>{zoom=+q('#zoom').value/100;pages().forEach(p=>{p.style.transform=`scale(${zoom})`;p.closest('.paperWrap').style.height=p.offsetHeight*zoom+25+'px'});q('#zoomLabel').textContent=Math.round(zoom*100)+'%'};q('#quickSave').onclick=save;q('#printBtn').onclick=()=>print();q('#newDocTop').onclick=()=>{if(confirm('新しい文書を作成しますか？')){pagesEl.innerHTML='';history=[];createPage();push()}};q('#undoBtn').onclick=()=>{if(history.length<2)return;future.push(history.pop());load(JSON.parse(history.at(-1)))};q('#redoBtn').onclick=()=>{if(!future.length)return;const s=future.pop();history.push(s);load(JSON.parse(s))};function load(d){pagesEl.innerHTML='';mL=d.mL||20;mR=d.mR||20;mT=d.mT||20;mB=d.mB||20;(d.pages||['']).forEach(createPage);currentPage=d.currentPage||0}document.addEventListener('selectionchange',remember);const saved=localStorage.getItem(AUTO);if(saved){try{load(JSON.parse(saved))}catch(e){createPage()}}else createPage();push()})();</script></div></body></html>
