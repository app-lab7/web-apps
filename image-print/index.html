<head>

<style>
*{box-sizing:border-box}body{margin:0}#app{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#e9edf3;color:#202124}button,input,select{font:inherit}button{cursor:pointer}.title{height:38px;background:#185abd;color:#fff;display:flex;align-items:center;padding:0 12px;gap:10px;flex:0 0 auto}.title .name{font-weight:700}.title .doc,.title .saveState{font-size:12px;opacity:.9}.title .actions{margin-left:auto;display:flex;gap:4px}.title button{background:transparent;color:#fff;border:1px solid transparent;border-radius:3px;padding:5px 9px}.title .newBtn{background:#fff;color:#185abd;font-weight:700}.tabs{height:36px;background:#fff;border-bottom:1px solid #d5d9df;display:flex;align-items:end;padding-left:8px;flex:0 0 auto}.tab{height:35px;border:0;background:#fff;padding:0 14px;border-bottom:3px solid transparent}.tab.active{color:#185abd;font-weight:700;border-bottom-color:#185abd}.ribbon{height:124px;background:#fff;border-bottom:1px solid #cfd4dc;overflow-x:auto;overflow-y:hidden;white-space:nowrap;flex:0 0 auto}.panel{display:none;height:100%;align-items:stretch;padding:6px 8px}.panel.active{display:flex}.group{display:flex;gap:5px;align-items:center;position:relative;padding:2px 10px 20px;border-right:1px solid #dde2e8;min-width:max-content}.gtitle{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10px;color:#667085}.col{display:flex;flex-direction:column;gap:4px}.row{display:flex;gap:4px;align-items:center}.mini{height:29px;border:1px solid #cbd1d9;background:#fff;border-radius:3px;padding:3px 7px}.wide{width:190px}.num{width:68px}.color{width:36px;height:29px;padding:1px}.big{height:72px;min-width:68px;border:1px solid transparent;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.ico{font-size:23px}.fileLabel input{display:none}.workspace{display:grid;grid-template-columns:170px 28px minmax(0,1fr);flex:1;min-height:0}.nav{background:#fafbfc;border-right:1px solid #d7dce2;overflow:auto;padding:10px 8px}.navTitle{font-size:12px;font-weight:700;color:#475467;margin:0 4px 8px}.thumb{padding:7px;border:2px solid transparent;margin-bottom:8px;text-align:center;font-size:11px;background:#fff;cursor:pointer}.thumb.active{border-color:#185abd}.thumbPaper{width:72px;height:102px;margin:0 auto 5px;background:#fff;border:1px solid #c9ced6}.vRuler{background:#f8f9fb;border-right:1px solid #cfd4dc}.editorArea{min-width:0;min-height:0;display:flex;flex-direction:column;background:#dfe4ea}.hRuler{height:32px;background:#f8f9fb;border-bottom:1px solid #cfd4dc;position:relative;flex:0 0 auto;overflow:hidden}.hTicks{position:absolute;inset:0}.hTick{position:absolute;top:17px;height:15px;border-left:1px solid #9aa3af;font-size:8px;color:#667085}.rMarker{position:absolute;top:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid #185abd}.rMarker.right{border-top-color:#d97706}.indentMarker{position:absolute;top:11px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid #7c3aed}.stage{flex:1;overflow:auto;padding:30px 40px 90px}.pages{display:flex;flex-direction:column;align-items:center;gap:36px;min-width:max-content}.paperWrap{position:relative}.pageLabel{text-align:center;font-size:11px;color:#667085;margin-bottom:7px}.paper{position:relative;background:#fff;box-shadow:0 3px 16px #0003;transform-origin:top left;overflow:hidden}.paper.p{width:794px;height:1123px}.paper.l{width:1123px;height:794px}.marginGuide{position:absolute;border:1px dashed #b8c5d3;pointer-events:none}.docBody{position:absolute;z-index:1;outline:none;overflow:hidden;word-break:break-word;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif CJK JP",serif;font-size:16px;line-height:1.6;color:#111}.docBody:empty:before{content:"ここをクリックして入力";color:#b7bec7}.docBody p,.docBody div{margin:0 0 .55em}.docBody img{max-width:100%;height:auto;cursor:pointer}.docBody img.selectedImage{outline:2px solid #185abd}.status{height:29px;background:#fff;border-top:1px solid #d5d9df;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:11px;color:#475467}.status .grow{flex:1}#zoom{width:120px}.toast{position:fixed;right:18px;bottom:45px;background:#111827;color:#fff;padding:9px 13px;border-radius:5px;font-size:12px;opacity:0;pointer-events:none}.toast.show{opacity:1}.hidden{display:none!important}@media print{.title,.tabs,.ribbon,.nav,.vRuler,.hRuler,.status,.pageLabel,.marginGuide,.toast{display:none!important}.workspace,.editorArea,.stage,.pages{display:block!important;padding:0!important;background:#fff!important}.paperWrap{page-break-after:always}.paper{box-shadow:none!important;transform:none!important}@page{size:A4;margin:0}}
</style></head><body><div id="app">
<div class="title"><span class="name">文書エディター</span><span class="doc">文書1</span><span class="saveState" id="saveState">✓ 自動保存済み</span><div class="actions"><button class="newBtn" id="newDocTop">＋ 新規作成</button><button id="quickSave">保存</button><button id="printBtn">印刷</button></div></div>
<div class="tabs"><button class="tab active" data-tab="home">ホーム</button><button class="tab" data-tab="insert">挿入</button><button class="tab" data-tab="layout">レイアウト</button><button class="tab" data-tab="view">表示</button><button class="tab" data-tab="picture">図の形式</button></div>
<div class="ribbon"><div class="panel active" data-panel="home"><div class="group"><div class="col"><div class="row"><button class="mini" id="undoBtn">↶ 元に戻す</button><button class="mini" id="redoBtn">↷ やり直す</button></div></div><span class="gtitle">編集</span></div><div class="group"><div class="col"><div class="row"><select id="fontName" class="mini wide"><optgroup label="日本語・明朝"><option value="Yu Mincho">游明朝</option><option value="Hiragino Mincho ProN">ヒラギノ明朝 ProN</option><option value="Noto Serif JP">Noto Serif JP</option><option value="MS Mincho">MS 明朝</option></optgroup><optgroup label="日本語・ゴシック"><option value="Yu Gothic">游ゴシック</option><option value="Hiragino Kaku Gothic ProN">ヒラギノ角ゴ ProN</option><option value="Meiryo">メイリオ</option><option value="Noto Sans JP">Noto Sans JP</option><option value="MS Gothic">MS ゴシック</option></optgroup><optgroup label="欧文"><option value="Arial">Arial</option><option value="Times New Roman">Times New Roman</option><option value="Georgia">Georgia</option><option value="Verdana">Verdana</option></optgroup></select><select id="fontSize" class="mini num"><option>8</option><option>9</option><option>10</option><option>10.5</option><option>11</option><option selected>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option><option>36</option><option>48</option><option>72</option></select></div><div class="row"><button class="mini" id="boldBtn"><b>B</b></button><button class="mini" id="italicBtn"><i>I</i></button><button class="mini" id="underlineBtn"><u>U</u></button><input id="fontColor" class="color" type="color" value="#111111"><input id="highlightColor" class="color" type="color" value="#fff59d"></div></div><span class="gtitle">フォント</span></div><div class="group"><div class="col"><div class="row"><button class="mini" id="alignLeft">左揃え</button><button class="mini" id="alignCenter">中央</button><button class="mini" id="alignRight">右揃え</button></div><div class="row"><button class="mini" id="bulletBtn">• 箇条書き</button><button class="mini" id="numberBtn">1. 番号</button></div></div><span class="gtitle">段落</span></div></div>
<div class="panel" data-panel="insert"><div class="group"><label class="big fileLabel"><span class="ico">🖼</span>画像<input id="fileInput" type="file" accept="image/*"></label><button class="big" id="addPage">＋ 空白ページ</button></div></div><div class="panel" data-panel="layout"><div class="group"><div class="col"><div class="row">左余白<input id="marginLeft" class="mini num" type="number" value="20">右余白<input id="marginRight" class="mini num" type="number" value="20"></div><div class="row">上余白<input id="marginTop" class="mini num" type="number" value="20">下余白<input id="marginBottom" class="mini num" type="number" value="20"></div></div></div></div><div class="panel" data-panel="view"><div class="group">表示設定</div></div><div class="panel" data-panel="picture"><div class="group">画像を本文中に挿入できます</div></div></div>
<div class="workspace"><aside class="nav"><div class="navTitle">ページ</div><div id="thumbs"></div></aside><div class="vRuler"></div><section class="editorArea"><div class="hRuler"><div class="hTicks" id="hTicks"></div><span class="rMarker" id="leftMarginMarker"></span><span class="rMarker right" id="rightMarginMarker"></span><span class="indentMarker" id="indentMarker"></span></div><main class="stage" id="stage"><div class="pages" id="pages"></div></main></section></div><div class="status"><span id="status">準備完了</span><span id="fontStatus">フォント: 自動判定</span><span class="grow"></span><span>ズーム</span><input id="zoom" type="range" min="40" max="150" value="100"><span id="zoomLabel">100%</span></div><div class="toast" id="toast"></div>
<script>(()=>{const q=s=>document.querySelector('#app '+s),qa=s=>[...document.querySelectorAll('#app '+s)],MM=3.7795275591,AUTO='wordLikeEditorV2';let currentPage=0,userZoom=1,marginLeft=20,marginRight=20,marginTop=20,marginBottom=20,history=[],future=[],timer=null,lastRange=null;const pagesEl=q('#pages'),stage=q('#stage'),pages=()=>qa('.paper'),bodies=()=>qa('.docBody');
const fontStacks={"Yu Mincho":'"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP","Noto Serif CJK JP",serif',"Hiragino Mincho ProN":'"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif',"Noto Serif JP":'"Noto Serif JP","Noto Serif CJK JP","Yu Mincho",serif',"MS Mincho":'"MS Mincho","Yu Mincho","Noto Serif JP",serif',"Yu Gothic":'"Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN","Meiryo","Noto Sans JP",sans-serif',"Hiragino Kaku Gothic ProN":'"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif',"Meiryo":'Meiryo,"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif',"Noto Sans JP":'"Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif',"MS Gothic":'"MS Gothic","Yu Gothic","Meiryo",sans-serif',Arial:'Arial,"Helvetica Neue",sans-serif',"Times New Roman":'"Times New Roman",Times,serif',Georgia:'Georgia,serif',Verdana:'Verdana,sans-serif'};
function active(){return bodies()[currentPage]}function toast(m){q('#toast').textContent=m;q('#toast').classList.add('show');setTimeout(()=>q('#toast').classList.remove('show'),1300)}function snap(){return JSON.stringify({currentPage,marginLeft,marginRight,marginTop,marginBottom,pages:bodies().map(b=>b.innerHTML)})}function save(){localStorage.setItem(AUTO,snap());q('#saveState').textContent='✓ 自動保存済み'}function push(){const s=snap();if(history.at(-1)!==s){history.push(s);future=[];clearTimeout(timer);timer=setTimeout(save,200)}}function remember(){const s=getSelection();if(s.rangeCount&&active()?.contains(s.anchorNode))lastRange=s.getRangeAt(0).cloneRange()}function restoreRange(){if(lastRange){const s=getSelection();s.removeAllRanges();s.addRange(lastRange)}}
function createPage(html=''){const w=document.createElement('div');w.className='paperWrap';const l=document.createElement('div');l.className='pageLabel';l.textContent='ページ '+(pages().length+1);const p=document.createElement('div');p.className='paper p';const g=document.createElement('div');g.className='marginGuide';const b=document.createElement('div');b.className='docBody';b.contentEditable='true';b.innerHTML=html;b.onfocus=()=>{currentPage=pages().indexOf(p)};b.oninput=()=>push();b.onmouseup=remember;b.onkeyup=remember;p.append(g,b);w.append(l,p);pagesEl.append(w);layout(p);renderThumbs();return p}function layout(p){p.querySelector('.marginGuide').style.cssText=`left:${marginLeft*MM}px;right:${marginRight*MM}px;top:${marginTop*MM}px;bottom:${marginBottom*MM}px`;const b=p.querySelector('.docBody');b.style.cssText+=`;left:${marginLeft*MM}px;right:${marginRight*MM}px;top:${marginTop*MM}px;bottom:${marginBottom*MM}px`}
function renderThumbs(){q('#thumbs').innerHTML='';pages().forEach((p,i)=>{const d=document.createElement('div');d.className='thumb'+(i===currentPage?' active':'');d.innerHTML='<div class="thumbPaper"></div>ページ '+(i+1);d.onclick=()=>{currentPage=i;p.scrollIntoView({behavior:'smooth'});renderThumbs()};q('#thumbs').append(d)})}function exec(cmd,val=null){active().focus();restoreRange();document.execCommand(cmd,false,val);remember();push()}function setFont(name){active().focus();restoreRange();document.execCommand('fontName',false,name);qa(`.docBody font[face="${name}"]`).forEach(f=>{f.removeAttribute('face');f.style.fontFamily=fontStacks[name]||name});remember();q('#fontStatus').textContent='フォント: '+q('#fontName').selectedOptions[0].textContent;push()}function setSize(pt){active().focus();restoreRange();document.execCommand('fontSize',false,'7');qa('.docBody font[size="7"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=pt+'pt'});remember();push()}
q('#fontName').onchange=()=>setFont(q('#fontName').value);q('#fontSize').onchange=()=>setSize(q('#fontSize').value);q('#boldBtn').onclick=()=>exec('bold');q('#italicBtn').onclick=()=>exec('italic');q('#underlineBtn').onclick=()=>exec('underline');q('#fontColor').onchange=()=>exec('foreColor',q('#fontColor').value);q('#highlightColor').onchange=()=>exec('hiliteColor',q('#highlightColor').value);q('#alignLeft').onclick=()=>exec('justifyLeft');q('#alignCenter').onclick=()=>exec('justifyCenter');q('#alignRight').onclick=()=>exec('justifyRight');q('#bulletBtn').onclick=()=>exec('insertUnorderedList');q('#numberBtn').onclick=()=>exec('insertOrderedList');qa('.tab').forEach(t=>t.onclick=()=>{qa('.tab,.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');q(`[data-panel="${t.dataset.tab}"]`).classList.add('active')});q('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{active().focus();restoreRange();document.execCommand('insertImage',false,ev.target.result);push()};r.readAsDataURL(f)};q('#addPage').onclick=()=>{createPage();currentPage=pages().length-1;push()};['marginLeft','marginRight','marginTop','marginBottom'].forEach(id=>q('#'+id).onchange=()=>{window[id]=+q('#'+id).value||20;marginLeft=+q('#marginLeft').value||20;marginRight=+q('#marginRight').value||20;marginTop=+q('#marginTop').value||20;marginBottom=+q('#marginBottom').value||20;pages().forEach(layout);push()});q('#zoom').oninput=()=>{userZoom=+q('#zoom').value/100;pages().forEach(p=>{p.style.transform=`scale(${userZoom})`;p.closest('.paperWrap').style.height=p.offsetHeight*userZoom+25+'px'});q('#zoomLabel').textContent=Math.round(userZoom*100)+'%'};q('#quickSave').onclick=()=>{save();toast('保存しました')};q('#printBtn').onclick=()=>print();q('#newDocTop').onclick=()=>{if(confirm('新しい文書を作成しますか？')){pagesEl.innerHTML='';history=[];createPage();push()}};q('#undoBtn').onclick=()=>{if(history.length<2)return;future.push(history.pop());const d=JSON.parse(history.at(-1));pagesEl.innerHTML='';d.pages.forEach(createPage);currentPage=d.currentPage||0};q('#redoBtn').onclick=()=>{};document.addEventListener('selectionchange',remember);const saved=localStorage.getItem(AUTO);if(saved){try{const d=JSON.parse(saved);marginLeft=d.marginLeft||20;marginRight=d.marginRight||20;marginTop=d.marginTop||20;marginBottom=d.marginBottom||20;(d.pages||['']).forEach(createPage);currentPage=d.currentPage||0}catch(e){createPage()}}else createPage();push();})();</script></div></body></html>
