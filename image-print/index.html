<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>DocStock</title></head><body><script>(async()=>{const u='https://raw.githubusercontent.com/app-lab7/web-apps/d4d48d3b10e01dd4c1c47b23386b473b373dd8f2/image-print/index.html';let h=await(await fetch(u,{cache:'no-store'})).text();const marker='document.open();document.write(h);document.close()';const repair=`h=h.replace("editTarget=activeBody();applyZoom();updateUndo();})();","if(!pages().length){createPage();currentPage=0}editTarget=activeBody();bodies().forEach(b=>{b.contentEditable='true';b.setAttribute('contenteditable','true');b.style.pointerEvents='auto'});pagesEl.addEventListener('pointerdown',e=>{const b=e.target.closest('.docBody');if(b){b.contentEditable='true';b.setAttribute('contenteditable','true');currentPage=bodies().indexOf(b);editTarget=b;setTimeout(()=>b.focus(),0)}});applyZoom();updateUndo();})();");`;if(h.includes(marker))h=h.replace(marker,repair+marker);document.open();document.write(h);document.close()})().catch(()=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:24px">DocStockの読み込みに失敗しました。再読み込みしてください。</p>'})</script></body></html>
