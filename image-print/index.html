<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文書エディター</title><style>*{box-sizing:border-box}body{margin:0}#app{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;background:#e9edf3;color:#202124;overflow:hidden}button,select,input{font:inherit}button{cursor:pointer}.title{height:38px;background:#185abd;color:#fff;display:flex;align-items:center;padding:0 12px;gap:10px;flex:0 0 auto}.actions{margin-left:auto;display:flex;gap:5px}.title button,.topLabel{background:transparent;color:#fff;border:0;padding:6px 10px}.title .newBtn{background:#fff;color:#185abd;font-weight:700}.docxBtn{background:#107c41!important;color:#fff!important;font-weight:700;border-radius:3px;cursor:pointer}.notesBtn{background:#6d4aff!important;color:#fff!important;font-weight:700;border-radius:3px}.tabs{height:36px;background:#fff;border-bottom:1px solid #ddd;display:flex;flex:0 0 auto}.tab{border:0;background:#fff;padding:0 15px;border-bottom:3px solid transparent}.tab.active{color:#185abd;font-weight:700;border-bottom-color:#185abd}.ribbon{height:130px;background:#fff;border-bottom:1px solid #ccd2da;overflow-x:auto;flex:0 0 auto}.panel{display:none;height:100%;padding:6px}.panel.active{display:flex}.group{position:relative;display:flex;align-items:center;gap:5px;padding:3px 10px 21px;border-right:1px solid #ddd;min-width:max-content}.gtitle{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:#667085}.col,.row{display:flex;gap:4px}.col{flex-direction:column}.mini{height:30px;border:1px solid #cbd1d9;background:#fff;border-radius:3px;padding:3px 7px}.wide{width:185px}.num{width:68px}.styleGallery{display:flex;gap:3px}.styleBtn{width:92px;height:66px;border:1px solid #d3d8df;background:#fff;border-radius:3px;padding:5px;text-align:left}.styleBtn:hover{background:#edf4ff}.styleBtn span{display:block;white-space:nowrap;overflow:hidden}.styleBtn small{color:#667085}.s-title span,.s-h1 span,.s-h2 span{font-family:"Yu Gothic",sans-serif;color:#1f4e79;font-weight:700}.s-title span{font-size:19px}.s-h1 span{font-size:16px}.s-h2 span{font-size:14px}.workspace{display:grid;grid-template-columns:170px 28px 1fr;flex:1;min-height:0}.nav{background:#fafbfc;border-right:1px solid #ddd;padding:10px;overflow:auto}.thumb{background:#fff;border:2px solid transparent;padding:8px;margin:8px 0;text-align:center;font-size:11px;cursor:pointer}.thumb.active{border-color:#185abd}.thumbPaper{height:95px;border:1px solid #ccc;background:#fff}.vRuler{background:#f8f9fb;border-right:1px solid #ccc}.editorArea{display:flex;flex-direction:column;min-width:0;min-height:0}.hRuler{height:30px;background:#f8f9fb;border-bottom:1px solid #ccc}.stage{flex:1;overflow:auto;padding:30px 40px 90px;background:#dfe4ea}.pages{display:flex;flex-direction:column;align-items:center;gap:35px;min-width:max-content}.pageLabel{text-align:center;font-size:11px;color:#667085;margin-bottom:6px}.paper{width:794px;height:1123px;background:#fff;box-shadow:0 3px 16px #0003;position:relative;transform-origin:top left;overflow:hidden}.marginGuide{position:absolute;border:1px dashed #bdc7d4;pointer-events:none}.docBody{position:absolute;outline:none;overflow:hidden;word-break:break-word;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;font-size:12pt;line-height:1.6;color:#111}.docBody:empty:before{content:"ここをクリックして入力";color:#b7bec7}.docBody p,.docBody div{margin:0 0 .55em}.docBody img{max-width:100%;height:auto}.word-title{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif!important;font-size:26pt!important;font-weight:600!important;color:#1f4e79!important}.word-h1{font-size:18pt!important;font-weight:700!important;color:#1f4e79!important}.word-h2{font-size:14pt!important;font-weight:700!important;color:#2f5597!important}.status{height:29px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;padding:0 12px;gap:12px;font-size:11px;flex:0 0 auto}.grow{flex:1}#zoom{width:120px}.toast{position:fixed;right:18px;bottom:44px;background:#111827;color:#fff;padding:9px 13px;border-radius:5px;opacity:0;transition:.15s;z-index:10}.toast.show{opacity:1}@media print{.title,.tabs,.ribbon,.nav,.vRuler,.hRuler,.status,.pageLabel,.marginGuide,.toast{display:none!important}.workspace,.editorArea,.stage,.pages{display:block!important;padding:0!important;background:#fff!important}.paper{box-shadow:none!important;transform:none!important}.paperWrap{page-break-after:always}}</style></head><body><div id="app"><div class="title"><b>文書エディター</b><span id="saveState">✓ 自動保存済み</span><div class="actions"><button class="newBtn" id="newDocTop">＋ 新規作成</button><button id="quickSave">保存</button><button class="notesBtn" id="sendNotes">📝 SyncNotesに保存</button><label class="topLabel docxBtn">Wordを開く<input id="importDocx" type="file" accept=".docx" hidden></label><button class="docxBtn" id="exportDocx">Word (.docx)</button><button id="printBtn">印刷</button></div></div><div class="tabs"><button class="tab active" data-tab="home">ホーム</button><button class="tab" data-tab="insert">挿入</button><button class="tab" data-tab="layout">レイアウト</button></div><div class="ribbon"><div class="panel active" data-panel="home"><div class="group"><div class="col"><button class="mini" id="undoBtn">↶ 元に戻す</button><button class="mini" id="redoBtn">↷ やり直す</button></div><span class="gtitle">編集</span></div><div class="group"><div class="col"><div class="row"><select id="fontName" class="mini wide"><option value="Yu Mincho">游明朝</option><option value="Yu Gothic">游ゴシック</option><option value="Meiryo">メイリオ</option><option value="Arial">Arial</option></select><select id="fontSize" class="mini num"><option>8</option><option>10</option><option selected>12</option><option>14</option><option>16</option><option>18</option><option>24</option><option>36</option></select></div><div class="row"><button class="mini" id="boldBtn"><b>B</b></button><button class="mini" id="italicBtn"><i>I</i></button><button class="mini" id="underlineBtn"><u>U</u></button><input id="fontColor" type="color" value="#111111"></div></div><span class="gtitle">フォント</span></div><div class="group"><div class="col"><div class="row"><button class="mini" id="alignLeft">左揃え</button><button class="mini" id="alignCenter">中央</button><button class="mini" id="alignRight">右揃え</button></div><div class="row"><button class="mini" id="bulletBtn">• 箇条書き</button><button class="mini" id="numberBtn">1. 番号</button></div></div><span class="gtitle">段落</span></div><div class="group"><div class="styleGallery"><button class="styleBtn" data-style="normal"><span>標準</span><small>標準</small></button><button class="styleBtn s-title" data-style="title"><span>タイトル</span><small>タイトル</small></button><button class="styleBtn s-h1" data-style="h1"><span>見出し 1</span><small>見出し 1</small></button><button class="styleBtn s-h2" data-style="h2"><span>見出し 2</span><small>見出し 2</small></button></div><span class="gtitle">スタイル</span></div></div><div class="panel" data-panel="insert"><div class="group"><label class="mini">画像を挿入<input id="fileInput" type="file" accept="image/*" hidden></label><button class="mini" id="addPage">空白ページ</button></div></div><div class="panel" data-panel="layout"><div class="group">左余白<input id="marginLeft" class="mini num" type="number" value="20">右余白<input id="marginRight" class="mini num" type="number" value="20">上余白<input id="marginTop" class="mini num" type="number" value="20">下余白<input id="marginBottom" class="mini num" type="number" value="20"></div></div></div><div class="workspace"><aside class="nav"><b>ページ</b><div id="thumbs"></div></aside><div class="vRuler"></div><section class="editorArea"><div class="hRuler"></div><main class="stage"><div class="pages" id="pages"></div></main></section></div><div class="status"><span id="status">準備完了</span><span class="grow"></span>ズーム<input id="zoom" type="range" min="40" max="150" value="100"><span id="zoomLabel">100%</span></div><div class="toast" id="toast"></div><script>(()=>{const q=s=>document.querySelector('#app '+s),qa=s=>[...document.querySelectorAll('#app '+s)],MM=3.7795,AUTO='wordLikeEditorV6';let currentPage=0,zoom=1,mL=20,mR=20,mT=20,mB=20,history=[],future=[],savedRange=null,timer=null,loading=false;const pagesEl=q('#pages'),pages=()=>qa('.paper'),bodies=()=>qa('.docBody'),active=()=>bodies()[currentPage];function toast(t){const el=q('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}function snapshot(){return JSON.stringify({currentPage,mL,mR,mT,mB,pages:bodies().map(x=>x.innerHTML)})}function save(){try{localStorage.setItem(AUTO,snapshot());q('#saveState').textContent='✓ 自動保存済み'}catch(e){q('#saveState').textContent='保存容量不足'}}function push(){if(loading)return;const s=snapshot();if(history.at(-1)!==s){history.push(s);future=[];clearTimeout(timer);timer=setTimeout(save,200)}}function remember(){const s=getSelection();if(s.rangeCount&&active()?.contains(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange()}function restore(){if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange)}}function layout(p){const b=p.querySelector('.docBody'),g=p.querySelector('.marginGuide');g.style.cssText=`left:${mL*MM}px;right:${mR*MM}px;top:${mT*MM}px;bottom:${mB*MM}px`;Object.assign(b.style,{left:mL*MM+'px',right:mR*MM+'px',top:mT*MM+'px',bottom:mB*MM+'px'})}function createPage(html=''){const w=document.createElement('div');w.className='paperWrap';const l=document.createElement('div');l.className='pageLabel';const p=document.createElement('div');p.className='paper';const g=document.createElement('div');g.className='marginGuide';const b=document.createElement('div');b.className='docBody';b.contentEditable='true';b.innerHTML=html;b.onfocus=()=>{currentPage=pages().indexOf(p);render()};b.oninput=push;b.onmouseup=remember;b.onkeyup=remember;p.append(g,b);w.append(l,p);pagesEl.append(w);layout(p);renumber()}function renumber(){pages().forEach((p,i)=>p.closest('.paperWrap').querySelector('.pageLabel').textContent='ページ '+(i+1));render()}function render(){q('#thumbs').innerHTML='';pages().forEach((p,i)=>{const d=document.createElement('div');d.className='thumb'+(i===currentPage?' active':'');d.innerHTML='<div class="thumbPaper"></div>ページ '+(i+1);d.onclick=()=>{currentPage=i;render();p.scrollIntoView({behavior:'smooth'})};q('#thumbs').append(d)})}function exec(c,v=null){active()?.focus();restore();document.execCommand(c,false,v);remember();push()}function load(d){loading=true;pagesEl.innerHTML='';mL=d.mL||20;mR=d.mR||20;mT=d.mT||20;mB=d.mB||20;(d.pages||['']).forEach(createPage);currentPage=d.currentPage||0;loading=false;renumber()}qa('.tab').forEach(t=>t.onclick=()=>{qa('.tab,.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');q(`[data-panel="${t.dataset.tab}"]`)?.classList.add('active')});q('#newDocTop').onclick=()=>{if(confirm('新しい文書を作成しますか？')){pagesEl.innerHTML='';history=[];createPage();push();save()}};q('#quickSave').onclick=()=>{save();toast('保存しました')};q('#printBtn').onclick=()=>print();q('#addPage').onclick=()=>{createPage();currentPage=pages().length-1;push()};q('#fontName').onchange=()=>exec('fontName',q('#fontName').value);q('#fontSize').onchange=()=>exec('fontSize','4');q('#boldBtn').onclick=()=>exec('bold');q('#italicBtn').onclick=()=>exec('italic');q('#underlineBtn').onclick=()=>exec('underline');q('#fontColor').onchange=()=>exec('foreColor',q('#fontColor').value);q('#alignLeft').onclick=()=>exec('justifyLeft');q('#alignCenter').onclick=()=>exec('justifyCenter');q('#alignRight').onclick=()=>exec('justifyRight');q('#bulletBtn').onclick=()=>exec('insertUnorderedList');q('#numberBtn').onclick=()=>exec('insertOrderedList');qa('.styleBtn').forEach(b=>b.onclick=()=>toast(b.dataset.style+' スタイル'));q('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=x=>exec('insertImage',x.target.result);r.readAsDataURL(f)};['marginLeft','marginRight','marginTop','marginBottom'].forEach(id=>q('#'+id).onchange=()=>{mL=+q('#marginLeft').value||20;mR=+q('#marginRight').value||20;mT=+q('#marginTop').value||20;mB=+q('#marginBottom').value||20;pages().forEach(layout);push()});q('#zoom').oninput=()=>{zoom=+q('#zoom').value/100;pages().forEach(p=>p.style.transform=`scale(${zoom})`);q('#zoomLabel').textContent=Math.round(zoom*100)+'%'};q('#sendNotes').onclick=()=>{save();const text=bodies().map((b,i)=>{const t=b.innerText.trim();return t?(bodies().length>1?`【ページ ${i+1}】\n${t}`:t):''}).filter(Boolean).join('\n\n');if(!text){toast('送る文章がありません');return}const first=text.replace(/^【ページ \d+】\n/,'').split('\n').find(x=>x.trim())||'文書メモ';const payload={title:first.trim().slice(0,80),content:text,source:'document-editor',createdAt:Date.now()};try{localStorage.setItem('syncnotes-incoming',JSON.stringify(payload));toast('SyncNotesへ送ります');setTimeout(()=>location.href='../syncnotes/?import=1',350)}catch(e){toast('メモへの受け渡しに失敗しました')}};q('#exportDocx').onclick=()=>toast('Word書き出し機能を準備中です');q('#importDocx').onchange=()=>toast('Word読み込み機能を準備中です');document.addEventListener('selectionchange',remember);const old=localStorage.getItem(AUTO);if(old){try{load(JSON.parse(old));history=[snapshot()]}catch(e){createPage()}}else createPage();push()})();</script></div></body></html>
