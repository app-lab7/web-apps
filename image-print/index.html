<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>DocStock</title></head><body><script>(async()=>{const u='https://raw.githubusercontent.com/app-lab7/web-apps/d4d48d3b10e01dd4c1c47b23386b473b373dd8f2/image-print/index.html';let h=await(await fetch(u,{cache:'no-store'})).text();const marker='document.open();document.write(h);document.close()';const repair=`h=h.replace("editTarget=activeBody();applyZoom();updateUndo();})();","if(!pages().length){createPage();currentPage=0}editTarget=activeBody();bodies().forEach(b=>{b.contentEditable='true';b.setAttribute('contenteditable','true');b.style.pointerEvents='auto'});pagesEl.addEventListener('pointerdown',e=>{const b=e.target.closest('.docBody');if(b){b.contentEditable='true';b.setAttribute('contenteditable','true');currentPage=bodies().indexOf(b);editTarget=b;setTimeout(()=>b.focus(),0)}});applyZoom();updateUndo();})();");`;if(h.includes(marker))h=h.replace(marker,repair+marker);const install=()=>{if(document.getElementById('dsTableTools')||!document.querySelector('.panel[data-panel="insert"]'))return;const style=document.createElement('style');style.textContent='.dsTable{border-collapse:collapse;width:100%;margin:.5em 0}.dsTable td,.dsTable th{border:1px solid #333;min-width:42px;padding:5px;vertical-align:middle}.dsTable td:focus{outline:2px solid #185abd;outline-offset:-2px}.dsTable.noBorder td,.dsTable.noBorder th{border-color:transparent}.dsTable.center td,.dsTable.center th{text-align:center}#dsTableTools{display:flex;gap:4px;flex-wrap:wrap}.dsTableTip{font-size:11px;color:#667085;margin:3px 0}';document.head.append(style);const panel=document.querySelector('.panel[data-panel="insert"]');const group=document.createElement('div');group.className='group';group.id='dsTableTools';group.innerHTML='<div class="col"><div class="row"><button class="mini" data-a="new">▦ 表を挿入</button><button class="mini" data-a="row">＋ 行</button><button class="mini" data-a="col">＋ 列</button></div><div class="row"><button class="mini" data-a="delrow">− 行</button><button class="mini" data-a="delcol">− 列</button><button class="mini" data-a="center">中央揃え</button><button class="mini" data-a="border">罫線</button></div><div class="dsTableTip">表内のセルをクリックして操作</div></div><span class="gtitle">表</span>';panel.append(group);const cell=()=>document.activeElement?.closest?.('td,th')||document.querySelector('.dsTable td');const table=()=>cell()?.closest('table');const changed=()=>document.querySelector('.docBody')?.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:null}));group.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;if(a==='new'){let r=+prompt('行数（1〜20）','3'),c=+prompt('列数（1〜12）','3');if(!r||!c)return;r=Math.min(20,Math.max(1,r));c=Math.min(12,Math.max(1,c));let s='<table class="dsTable"><tbody>';for(let i=0;i<r;i++){s+='<tr>';for(let j=0;j<c;j++)s+='<td><br></td>';s+='</tr>'}s+='</tbody></table><p><br></p>';const b=document.activeElement?.closest?.('.docBody')||document.querySelector('.docBody');b?.focus();document.execCommand('insertHTML',false,s);changed();return}const x=cell(),t=table();if(!x||!t){alert('表のセルをクリックしてから選んでください');return}const row=x.parentElement;if(a==='row'){const n=row.cloneNode(true);n.querySelectorAll('td,th').forEach(z=>z.innerHTML='<br>');row.after(n)}if(a==='col')t.querySelectorAll('tr').forEach(z=>{const n=document.createElement(z.children[0]?.tagName||'td');n.innerHTML='<br>';z.append(n)});if(a==='delrow'&&t.rows.length>1)row.remove();if(a==='delcol'&&t.rows[0].cells.length>1){const i=x.cellIndex;t.querySelectorAll('tr').forEach(z=>z.cells[i]?.remove())}if(a==='center')t.classList.toggle('center');if(a==='border')t.classList.toggle('noBorder');changed()})};const timer=setInterval(install,250);setTimeout(()=>clearInterval(timer),15000);document.open();document.write(h);document.close()})().catch(()=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:24px">DocStockの読み込みに失敗しました。再読み込みしてください。</p>'})</script></body></html>
