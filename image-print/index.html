function syncUI(){if(!pages().length)createPage(false);currentPage=Math.max(0,Math.min(currentPage,pages().length-1));pageSelect.innerHTML='';pages().forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent='ページ '+(i+1);pageSelect.append(o);p.closest('.paperWrap').querySelector('.pageLabel').textContent='ページ '+(i+1);p.querySelector('.placeholder').style.display=p.querySelector('.item')?'none':'grid';applyGuides(p)});pageSelect.value=currentPage;q('#pageStatus').textContent=(currentPage+1)+' / '+pages().length;q('#status').textContent=pages().length+'ページ / '+pages().reduce((n,p)=>n+p.querySelectorAll('.item').length,0)+'要素';renderThumbs();syncRulerInputs();requestAnimationFrame(applyZoom)}
function restore(s){restoring=true;const d=JSON.parse(s);orientation.value=d.orientation||'portrait';marginLeft=d.marginLeft??20;marginRight=d.marginRight??20;indentLeft=d.indentLeft??0;tabStops=d.tabStops||[];pagesEl.innerHTML='';(d.pages||[]).forEach(arr=>{const p=createPage(false);arr.forEach(o=>make(o,p))});if(!pages().length)createPage(false);currentPage=Math.min(d.currentPage||0,pages().length-1);restoring=false;select(null);syncUI()}
qa('.tab').forEach(t=>t.onclick=()=>{qa('.tab').forEach(x=>x.classList.remove('active'));qa('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');q('[data-panel="'+t.dataset.tab+'"]').classList.add('active')});q('#fileInput').onchange=()=>{[...q('#fileInput').files].forEach((f,i)=>{const r=new FileReader();r.onload=e=>addImage(e.target.result,i);r.readAsDataURL(f)});q('#fileInput').value=''};q('#addText').onclick=addText;q('#addPage').onclick=()=>{createPage(false);currentPage=pages().length-1;push();syncUI()};pageSelect.onchange=()=>{currentPage=+pageSelect.value;syncUI()};q('#prevPage').onclick=()=>{if(currentPage>0){currentPage--;syncUI();pages()[currentPage].closest('.paperWrap').scrollIntoView({behavior:'smooth'})}};q('#nextPage').onclick=()=>{if(currentPage<pages().length-1){currentPage++;syncUI();pages()[currentPage].closest('.paperWrap').scrollIntoView({behavior:'smooth'})}};
q('#marginLeft').onchange=()=>{marginLeft=Math.max(0,+q('#marginLeft').value||0);qa('.paper').forEach(applyGuides);renderRuler();push()};q('#marginRight').onchange=()=>{marginRight=Math.max(0,+q('#marginRight').value||0);qa('.paper').forEach(applyGuides);renderRuler();push()};q('#indentLeft').onchange=()=>{indentLeft=Math.max(0,+q('#indentLeft').value||0);qa('.paper').forEach(applyGuides);renderRuler();push()};q('#addTabStop').onclick=()=>{const usable=Math.max(10,(pages()[currentPage].clientWidth/MM)-marginLeft-marginRight);const next=tabStops.length?Math.min(usable,tabStops.at(-1)+12.5):12.5;tabStops.push(next);qa('.paper').forEach(applyGuides);renderRuler();push()};q('#clearTabs').onclick=()=>{tabStops=[];qa('.paper').forEach(applyGuides);renderRuler();push()};
[posX,posY].forEach(inp=>inp.onchange=()=>{if(!selected)return toast('先に選択してください');selected.style.left=(Math.max(0,+posX.value||0)*MM)+'px';selected.style.top=(Math.max(0,+posY.value||0)*MM)+'px';syncControls();updateObjectGuide();push()});widthMm.onchange=()=>{if(!selected)return;selected.style.width=Math.max(5,+widthMm.value||5)*MM+'px';syncControls();push()};heightMm.onchange=()=>{if(!selected)return;selected.style.height=Math.max(5,+heightMm.value||5)*MM+'px';syncControls();push()};rotation.oninput=()=>setRot(rotation.value);rotation.onchange=push;q('#rotLeft').onclick=()=>{if(selected){setRot((+selected.dataset.rot||0)-90);push()}};q('#rotRight').onclick=()=>{if(selected){setRot((+selected.dataset.rot||0)+90);push()}};
q('#textContent').oninput=()=>{if(selected?.classList.contains('text')){selected.childNodes[0].nodeValue=q('#textContent').value;schedule()}};q('#fontSize').onchange=()=>{if(selected?.classList.contains('text')){selected.dataset.fontSize=q('#fontSize').value;selected.style.fontSize=q('#fontSize').value+'px';push()}};q('#boldText').onclick=()=>{if(selected?.classList.contains('text')){const on=selected.dataset.bold!=='1';selected.dataset.bold=on?'1':'0';selected.style.fontWeight=on?'700':'400';push()}};q('#textColor').onchange=()=>{if(selected?.classList.contains('text')){selected.dataset.textColor=q('#textColor').value;selected.style.color=q('#textColor').value;push()}};
q('#copyBtn').onclick=()=>{if(!selected)return;clipboard=ser(selected)};q('#pasteBtn').onclick=()=>{if(!clipboard)return;const d=JSON.parse(JSON.stringify(clipboard));d.left=(parseFloat(d.left)+20)+'px';d.top=(parseFloat(d.top)+20)+'px';d.z=String(z++);select(make(d,pages()[currentPage]));push();syncUI()};q('#undoBtn').onclick=()=>{if(history.length<2)return;future.push(history.pop());restore(history.at(-1));autoSave()};q('#redoBtn').onclick=()=>{if(!future.length)return;const s=future.pop();history.push(s);restore(s);autoSave()};q('#quickSave').onclick=()=>{localStorage.setItem(AUTO,snap());toast('保存しました')};q('#printBtn').onclick=()=>window.print();q('#newDocTop').onclick=()=>{if(confirm('新しい文書を作成しますか？')){pagesEl.innerHTML='';currentPage=0;tabStops=[];createPage(false);history=[];future=[];push();syncUI()}};q('#zoom').oninput=()=>{userZoom=+q('#zoom').value/100;applyZoom()};q('#zoom100').onclick=()=>{userZoom=1;q('#zoom').value=100;applyZoom()};q('#fitWidth').onclick=()=>{const p=pages()[currentPage];userZoom=Math.max(.4,Math.min(1.5,(stage.clientWidth-100)/p.offsetWidth));q('#zoom').value=Math.round(userZoom*100);applyZoom()};q('#showRuler').onchange=e=>{q('.hRuler').classList.toggle('hidden',!e.target.checked);q('.vRuler').classList.toggle('hidden',!e.target.checked)};q('#showMargins').onchange=e=>qa('.marginGuide').forEach(x=>x.classList.toggle('hidden',!e.target.checked));q('#showNav').onchange=e=>q('.nav').classList.toggle('hidden',!e.target.checked);orientation.onchange=()=>{pages().forEach(p=>{p.classList.toggle('p',orientation.value==='portrait');p.classList.toggle('l',orientation.value==='landscape')});syncUI();push()};stage.addEventListener('scroll',()=>{renderRuler();updateObjectGuide()});dragMarker(q('#leftMarginMarker'),'left');dragMarker(q('#rightMarginMarker'),'right');dragMarker(q('#indentMarker'),'indent');const saved=localStorage.getItem(AUTO);if(saved){try{restore(saved);history=[snap()]}catch(e){createPage(false)}}else createPage(false);syncUI();push()})();
