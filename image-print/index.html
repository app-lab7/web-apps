<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>DocStock</title></head><body><script>(async()=>{const BASE='https://raw.githubusercontent.com/app-lab7/web-apps/5d8a8e395eb37080a86d1c700a77644780c54ea4/image-print/index.html';const DOCS='docstock-documents-v1',CURRENT='docstock-current-id',AUTO='wordLikeEditorV8';const blank=()=>JSON.stringify({currentPage:0,mL:20,mR:20,mT:20,mB:20,pages:[{html:'',boxes:[]}]});try{const ds=JSON.parse(localStorage.getItem(DOCS)||'[]'),id=localStorage.getItem(CURRENT),d=ds.find(x=>x.id===id);if(d&&d.data){JSON.parse(d.data);localStorage.setItem(AUTO,d.data)}}catch(e){}let h=await(await fetch(BASE,{cache:'no-store'})).text();h=h.replace('.paper{width:794px;height:1123px','.paper{width:793.7008px;height:1122.5197px');h=h.replace('MM=3.7795','MM=3.7795275591');h=h.replace('.toast.show{opacity:1}',`.toast.show{opacity:1}.dsModal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9999}.dsModal.open{display:flex}.dsCard{width:min(760px,92vw);max-height:82vh;background:#fff;border-radius:10px;box-shadow:0 20px 70px #0005;display:flex;flex-direction:column;overflow:hidden}.dsHead{padding:14px 16px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px}.dsHead h2{margin:0;font-size:19px}.dsHead .grow{flex:1}.dsHead button,.dsBtns button{border:1px solid #cbd1d9;background:#fff;border-radius:5px;padding:7px 10px}.dsBody{padding:12px;overflow:auto;background:#f6f8fb}.dsItem{background:#fff;border:1px solid #d9dee7;border-radius:8px;padding:11px 13px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.dsName{font-weight:700}.dsMeta{font-size:11px;color:#667085;margin-top:3px}.dsBtns{display:flex;gap:5px;flex-wrap:wrap}.dsBtns .dsOpen{background:#185abd;color:#fff;border-color:#185abd}.dsEmpty{text-align:center;color:#667085;padding:32px}`);h=h.replace('<div class="actions">','<div class="actions"><button id="dsFiles">📁 ファイル</button>');h=h.replace('<div class="toast" id="toast"></div>',`<div class="toast" id="toast"></div><div class="dsModal" id="dsModal"><div class="dsCard"><div class="dsHead"><h2>DocStock ファイル</h2><span class="grow"></span><button id="dsNew">＋ 新規作成</button><button id="dsClose">閉じる</button></div><div class="dsBody" id="dsList"></div></div></div>`);const a=h.indexOf('@media print{'),b=h.indexOf('</style>',a);if(a>=0&&b>a){h=h.slice(0,a)+`@media print{@page{size:A4 portrait;margin:0}html,body{margin:0!important;padding:0!important;width:auto!important;height:auto!important;overflow:visible!important;background:#fff!important}#app{display:block!important;width:auto!important;height:auto!important;overflow:visible!important;background:#fff!important}.title,.tabs,.ribbon,.nav,.vRuler,.hRuler,.status,.pageLabel,.marginGuide,.toast,.tbResize,.tbRotate,.tbRotateLine,.dsModal{display:none!important}.workspace,.editorArea,.stage,.pages{display:block!important;width:auto!important;height:auto!important;min-height:0!important;margin:0!important;padding:0!important;overflow:visible!important;background:#fff!important}.paperWrap{display:block!important;position:relative!important;width:210mm!important;height:296.9mm!important;margin:0!important;padding:0!important;overflow:hidden!important;break-inside:avoid!important;page-break-inside:avoid!important;break-after:page!important;page-break-after:always!important}.paperWrap:last-child{break-after:auto!important;page-break-after:auto!important}.paper{display:block!important;position:relative!important;width:210mm!important;height:296.9mm!important;margin:0!important;padding:0!important;box-shadow:none!important;transform:none!important;transform-origin:top left!important;overflow:hidden!important}.docBody,.textBox,.tbContent{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}.textBox{border:1px solid #666!important}}`+h.slice(b)}const extra=`<script>(function(){const DOCS='docstock-documents-v1',CURRENT='docstock-current-id',AUTO='wordLikeEditorV8';const blank=()=>JSON.stringify({currentPage:0,mL:20,mR:20,mT:20,mB:20,pages:[{html:'',boxes:[]}]});const getDocs=()=>{try{return JSON.parse(localStorage.getItem(DOCS)||'[]')}catch(e){return[]}};const putDocs=d=>localStorage.setItem(DOCS,JSON.stringify(d));const nameNow=()=>{const d=new Date();return '文書 '+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};let cid=localStorage.getItem(CURRENT)||'';function ensure(){let ds=getDocs();if(!cid||!ds.some(x=>x.id===cid)){cid='doc-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);localStorage.setItem(CURRENT,cid);ds.unshift({id:cid,name:nameNow(),updatedAt:Date.now(),data:localStorage.getItem(AUTO)||blank()});putDocs(ds)}return ds}function sync(){const data=localStorage.getItem(AUTO);if(!data)return;let ds=ensure(),i=ds.findIndex(x=>x.id===cid);if(i<0)return;if(ds[i].data!==data){ds[i].data=data;ds[i].updatedAt=Date.now();const d=ds.splice(i,1)[0];ds.unshift(d);putDocs(ds)}}function openDoc(id){sync();const d=getDocs().find(x=>x.id===id);if(!d)return;localStorage.setItem(CURRENT,id);localStorage.setItem(AUTO,d.data||blank());location.reload()}function newDoc(){sync();let ds=getDocs();const id='doc-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),data=blank();ds.unshift({id,name:nameNow(),updatedAt:Date.now(),data});putDocs(ds);localStorage.setItem(CURRENT,id);localStorage.setItem(AUTO,data);location.reload()}function render(){sync();const list=document.getElementById('dsList'),ds=getDocs();list.innerHTML='';if(!ds.length){list.innerHTML='<div class="dsEmpty">保存された文書はありません</div>';return}ds.forEach(d=>{const r=document.createElement('div');r.className='dsItem';r.innerHTML='<div><div class="dsName"></div><div class="dsMeta"></div></div><div class="dsBtns"><button class="dsOpen">開く</button><button class="dsRename">名前変更</button><button class="dsCopy">複製</button><button class="dsDelete">削除</button></div>';r.querySelector('.dsName').textContent=d.name+(d.id===cid?'　● 開いています':'');r.querySelector('.dsMeta').textContent='更新: '+new Date(d.updatedAt||0).toLocaleString('ja-JP');r.querySelector('.dsOpen').onclick=()=>openDoc(d.id);r.querySelector('.dsRename').onclick=()=>{const n=prompt('文書名を入力してください',d.name);if(!n||!n.trim())return;const all=getDocs(),x=all.find(v=>v.id===d.id);if(x)x.name=n.trim();putDocs(all);render()};r.querySelector('.dsCopy').onclick=()=>{const all=getDocs();all.unshift({...d,id:'doc-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:d.name+' - コピー',updatedAt:Date.now()});putDocs(all);render()};r.querySelector('.dsDelete').onclick=()=>{if(d.id===cid){alert('開いている文書は削除できません');return}if(!confirm('「'+d.name+'」を削除しますか？'))return;putDocs(getDocs().filter(x=>x.id!==d.id));render()};list.appendChild(r)})}ensure();document.addEventListener('click',e=>{if(e.target&&e.target.id==='newDocTop'){e.preventDefault();e.stopImmediatePropagation();if(confirm('新しい文書を作成しますか？\\n現在の文書は保存済み文書として残ります。'))newDoc()}},true);const files=document.getElementById('dsFiles'),modal=document.getElementById('dsModal');files.onclick=()=>{document.getElementById('quickSave')?.click();setTimeout(()=>{render();modal.classList.add('open')},30)};document.getElementById('dsClose').onclick=()=>modal.classList.remove('open');document.getElementById('dsNew').onclick=()=>{if(confirm('新しい文書を作成しますか？'))newDoc()};modal.addEventListener('pointerdown',e=>{if(e.target===modal)modal.classList.remove('open')});document.addEventListener('input',()=>setTimeout(sync,350),true);document.getElementById('quickSave').addEventListener('click',()=>setTimeout(sync,40));setInterval(sync,1200)})();<\/script>`;h=h.replace('</body>',extra+'</body>');document.open();document.write(h);document.close()})().catch(e=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:24px">DocStockの読み込みに失敗しました。再読み込みしてください。</p>'})</script></body></html>
