<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>画像レイアウト印刷</title>
</head>
<body style="margin:0">
<div id="imgprint-app">
<style>
#imgprint-app{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e9edf2;color:#1f2937;height:100vh;min-height:0;overflow:hidden;display:flex;flex-direction:column}
#imgprint-app *{box-sizing:border-box}
#imgprint-app button,#imgprint-app select,#imgprint-app input,#imgprint-app textarea{font:inherit}
#imgprint-app button{border:1px solid transparent;background:transparent;color:inherit;border-radius:4px;padding:5px 9px;cursor:pointer;white-space:nowrap}
#imgprint-app button:hover{background:#edf3fa;border-color:#cbd5e1}
#imgprint-app button:disabled{opacity:.35;cursor:not-allowed}
#imgprint-app .titlebar{height:38px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#185abd;color:#fff;flex:0 0 auto}
#imgprint-app .appname{font-weight:700;font-size:14px}
#imgprint-app .autosave{font-size:12px;opacity:.88}
#imgprint-app .title-actions{margin-left:auto;display:flex;gap:2px}
#imgprint-app .title-actions button{color:#fff;border-color:rgba(255,255,255,.16);padding:4px 9px}
#imgprint-app .title-actions button:hover{background:rgba(255,255,255,.12)}
#imgprint-app .tabs{height:34px;background:#fff;display:flex;align-items:end;padding:0 10px;border-bottom:1px solid #d6dbe1;flex:0 0 auto}
#imgprint-app .tab{height:33px;border-radius:0;padding:0 15px;border:0;border-bottom:3px solid transparent}
#imgprint-app .tab.active{color:#185abd;border-bottom-color:#185abd;font-weight:700}
#imgprint-app .ribbon{height:112px;background:#fff;border-bottom:1px solid #cfd5dc;display:flex;gap:0;overflow-x:auto;overflow-y:hidden;padding:6px 8px;flex:0 0 auto}
#imgprint-app .ribbon-panel{display:none;align-items:stretch;min-width:max-content}
#imgprint-app .ribbon-panel.active{display:flex}
#imgprint-app .rgroup{position:relative;display:flex;align-items:center;gap:5px;padding:3px 10px 20px;border-right:1px solid #dde2e8;min-width:max-content}
#imgprint-app .rgroup-title{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:10px;color:#64748b}
#imgprint-app .rcol{display:flex;flex-direction:column;gap:4px}
#imgprint-app .rrow{display:flex;gap:4px;align-items:center}
#imgprint-app .bigbtn,#imgprint-app .file-label{height:68px;min-width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid transparent;border-radius:5px;background:transparent;cursor:pointer;font-size:12px;font-weight:600}
#imgprint-app .bigbtn:hover,#imgprint-app .file-label:hover{background:#edf3fa;border-color:#cbd5e1}
#imgprint-app .ico{font-size:23px;line-height:1}
#imgprint-app input[type=file]{display:none}
#imgprint-app .mini{height:29px;background:#fff;border:1px solid #cbd5e1;border-radius:4px;padding:3px 7px;min-width:54px}
#imgprint-app button.mini{background:#fff}
#imgprint-app .num{width:72px}
#imgprint-app .wide{width:122px}
#imgprint-app .color{width:38px;height:29px;padding:1px;border:1px solid #cbd5e1;border-radius:4px;background:#fff}
#imgprint-app .check{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
#imgprint-app .workspace{display:grid;grid-template-columns:150px minmax(0,1fr);flex:1 1 auto;min-height:0;overflow:hidden}
#imgprint-app .nav{background:#f8fafc;border-right:1px solid #d6dbe1;min-height:0;overflow:auto;padding:10px 8px}
#imgprint-app .nav-title{font-size:12px;font-weight:700;color:#475569;margin:0 4px 8px}
#imgprint-app .thumb{background:#fff;border:2px solid transparent;border-radius:4px;padding:6px;margin-bottom:8px;cursor:pointer;text-align:center;font-size:11px;color:#64748b}
#imgprint-app .thumb.active{border-color:#185abd;background:#eff6ff;color:#185abd;font-weight:700}
#imgprint-app .thumb-paper{width:68px;height:96px;background:#fff;border:1px solid #cbd5e1;box-shadow:0 1px 4px rgba(0,0,0,.08);margin:0 auto 4px;position:relative;overflow:hidden}
#imgprint-app .thumb-dot{position:absolute;width:9px;height:7px;background:#93c5fd;border-radius:1px}
#imgprint-app .stage-wrap{position:relative;overflow:auto;background:#dfe4ea;min-width:0;min-height:0;padding:24px;display:flex;justify-content:center;align-items:flex-start}
#imgprint-app .pages{display:flex;flex-direction:column;align-items:center;min-width:max-content}
#imgprint-app .paper-wrap{position:relative}
#imgprint-app .page-label{font-size:11px;color:#64748b;text-align:center;margin-bottom:6px}
#imgprint-app .paper{position:relative;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.22);overflow:hidden;touch-action:none;transform-origin:top center}
#imgprint-app .paper.a4p{width:794px;height:1123px}
#imgprint-app .paper.a4l{width:1123px;height:794px}
#imgprint-app .placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#c0c7d0;font-size:16px;padding:30px;pointer-events:none}
#imgprint-app .item{position:absolute;left:40px;top:40px;transform-origin:center;user-select:none;touch-action:none;border:1px solid transparent;cursor:move}
#imgprint-app .item.selected{border:2px solid #185abd;outline:1px solid rgba(24,90,189,.18)}
#imgprint-app .item img{display:block;width:100%;height:100%;pointer-events:none}
#imgprint-app .text-item{display:flex;align-items:center;justify-content:center;padding:6px;white-space:pre-wrap;overflow:hidden;color:#111827;background:transparent}
#imgprint-app .text-item[contenteditable=true]{cursor:text;user-select:text;outline:2px solid #185abd}
#imgprint-app .handle{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #185abd;right:-8px;bottom:-8px;cursor:nwse-resize;display:none}
#imgprint-app .selected .handle{display:block}
#imgprint-app .statusbar{height:28px;background:#fff;border-top:1px solid #d6dbe1;display:flex;align-items:center;padding:0 12px;gap:12px;font-size:11px;color:#475569;flex:0 0 auto}
#imgprint-app .statusbar .spacer{flex:1}
#imgprint-app #zoom{width:120px}
#imgprint-app .print-help{display:none;position:fixed;right:15px;bottom:40px;background:#fff;border:1px solid #bfdbfe;padding:10px 12px;border-radius:6px;box-shadow:0 5px 20px rgba(0,0,0,.15);z-index:20;font-size:12px}
#imgprint-app .print-help.show{display:block}
@media(max-width:850px){#imgprint-app .workspace{grid-template-columns:1fr}#imgprint-app .nav{display:none}#imgprint-app .ribbon{height:105px}#imgprint-app .stage-wrap{padding:12px}}
@media print{body *{visibility:hidden!important}#imgprint-app,#imgprint-app .pages,#imgprint-app .paper,#imgprint-app .paper *{visibility:visible!important}#imgprint-app{position:absolute!important;left:0!important;top:0!important;height:auto!important;overflow:visible!important;background:#fff!important}#imgprint-app .titlebar,#imgprint-app .tabs,#imgprint-app .ribbon,#imgprint-app .nav,#imgprint-app .statusbar,#imgprint-app .handle,#imgprint-app .placeholder,#imgprint-app .page-label{display:none!important}#imgprint-app .workspace,#imgprint-app .stage-wrap,#imgprint-app .pages{display:block!important;padding:0!important;margin:0!important;background:#fff!important;overflow:visible!important}#imgprint-app .paper-wrap{page-break-after:always!important;margin:0!important}#imgprint-app .paper{box-shadow:none!important;transform:none!important}#imgprint-app .item{border:0!important;outline:0!important}@page{size:A4;margin:0}}
</style>

<div class="titlebar"><span class="appname">画像レイアウト印刷</span><span class="autosave" id="autoSaveLabel">✓ 自動保存</span><div class="title-actions"><button id="saveLayout">保存</button><button id="loadLayout">読込</button><button id="printBtn">印刷</button></div></div>
<div class="tabs"><button class="tab active" data-tab="home">ホーム</button><button class="tab" data-tab="insert">挿入</button><button class="tab" data-tab="layout">レイアウト</button><button class="tab" data-tab="format">図・文字の書式</button></div>

<div class="ribbon">
  <div class="ribbon-panel active" data-panel="home">
    <div class="rgroup"><div class="rcol"><div class="rrow"><button class="mini" id="undoBtn">↶ 元に戻す</button><button class="mini" id="redoBtn">↷ やり直す</button></div><div class="rrow"><button class="mini" id="duplicate">複製</button><button class="mini" id="deleteSelected">削除</button></div></div><span class="rgroup-title">編集</span></div>
    <div class="rgroup"><div class="rcol"><div class="rrow"><input id="fontSize" class="mini num" type="number" min="8" max="200" value="32"><button id="boldText" class="mini" type="button"><b>B</b></button><input id="textColor" class="color" type="color" value="#111111"></div><div class="rrow"><input id="textContent" class="mini wide" type="text" placeholder="文字を編集"><span style="font-size:11px;color:#64748b">文字はダブルクリックでも編集</span></div></div><span class="rgroup-title">フォント</span></div>
    <div class="rgroup"><div class="rcol"><div class="rrow"><button class="mini" data-align="left">左</button><button class="mini" data-align="center">中央</button><button class="mini" data-align="right">右</button></div><div class="rrow"><button class="mini" data-align="top">上</button><button class="mini" data-align="middle">上下中央</button><button class="mini" data-align="bottom">下</button></div></div><span class="rgroup-title">配置</span></div>
  </div>

  <div class="ribbon-panel" data-panel="insert">
    <div class="rgroup"><label class="file-label"><span class="ico">🖼</span>画像<input id="fileInput" type="file" accept="image/*" multiple></label><button class="bigbtn" id="addText"><span class="ico">T</span>テキスト</button><button class="bigbtn" id="addPage"><span class="ico">＋</span>新しいページ</button><span class="rgroup-title">挿入</span></div>
    <div class="rgroup"><div class="rcol"><button class="mini" id="duplicatePage">ページを複製</button><button class="mini" id="deletePage">ページを削除</button></div><span class="rgroup-title">ページ</span></div>
  </div>

  <div class="ribbon-panel" data-panel="layout">
    <div class="rgroup"><div class="rcol"><select id="orientation" class="mini wide"><option value="portrait">A4 縦</option><option value="landscape">A4 横</option></select><select id="pageSelect" class="mini wide"></select></div><span class="rgroup-title">ページ設定</span></div>
    <div class="rgroup"><div class="rcol"><button class="mini" id="fitAll">全体を自動整列</button><button class="mini" id="spaceEvenly">横に等間隔</button></div><span class="rgroup-title">自動配置</span></div>
    <div class="rgroup"><div class="rcol"><button class="mini" id="bringFront">前面へ</button><button class="mini" id="sendBack">背面へ</button></div><span class="rgroup-title">重なり</span></div>
  </div>

  <div class="ribbon-panel" data-panel="format">
    <div class="rgroup"><div class="rcol"><div class="rrow"><span style="font-size:11px">幅mm</span><input id="widthMm" class="mini num" type="number" min="5" max="500"><span style="font-size:11px">高さmm</span><input id="heightMm" class="mini num" type="number" min="5" max="500"></div><label class="check"><input id="lockRatio" type="checkbox" checked>縦横比を固定</label></div><span class="rgroup-title">サイズ</span></div>
    <div class="rgroup"><div class="rcol"><select id="presetSize" class="mini wide"><option value="">定型サイズ</option><option value="full">A4いっぱい</option><option value="half">A4 1/2</option><option value="quarter">A4 1/4</option><option value="postcard">はがき</option><option value="l">L判</option><option value="card">名刺</option></select><div class="rrow"><button class="mini" id="rotLeft">↺ 90°</button><button class="mini" id="rotRight">↻ 90°</button></div><input id="rotation" type="range" min="-180" max="180" value="0" style="width:150px"><span id="rotationLabel" style="font-size:10px;text-align:center">0°</span></div><span class="rgroup-title">サイズと回転</span></div>
    <div class="rgroup"><div class="rcol"><select id="fitMode" class="mini wide"><option value="contain">画像全体を表示</option><option value="cover">トリミング</option></select><div class="rrow"><span style="font-size:10px">左右</span><input id="cropX" type="range" min="0" max="100" value="50" style="width:90px"><span style="font-size:10px">上下</span><input id="cropY" type="range" min="0" max="100" value="50" style="width:90px"></div><button class="mini" id="resetCrop">トリミングをリセット</button></div><span class="rgroup-title">画像</span></div>
    <div class="rgroup"><div class="rcol"><div class="rrow"><span style="font-size:10px">枠</span><input id="borderWidth" class="mini num" type="number" min="0" max="20" value="0"><input id="borderColor" class="color" type="color" value="#111111"></div><div class="rrow"><span style="font-size:10px">角丸</span><input id="radius" class="mini num" type="number" min="0" max="80" value="0"><span style="font-size:10px">背景</span><input id="bgColor" class="color" type="color" value="#ffffff"></div></div><span class="rgroup-title">枠と背景</span></div>
  </div>
</div>

<div class="workspace"><aside class="nav"><div class="nav-title">ページ</div><div id="thumbs"></div></aside><main class="stage-wrap"><div class="pages" id="pages"></div></main></div>
<div class="statusbar"><span id="status">準備完了</span><span id="selectedStatus">選択なし</span><span class="spacer"></span><button id="prevPage">‹</button><span id="pageStatus">1 / 1</span><button id="nextPage">›</button><span>ズーム</span><input id="zoom" type="range" min="50" max="130" value="100"><span id="zoomLabel">100%</span></div>
<div class="print-help" id="printHelp"><strong>印刷画面を開けませんでした</strong><br>Macは ⌘ + P、Windowsは Ctrl + P を押してください。</div>

<script>
(()=>{
const root=document.getElementById('imgprint-app');if(root.dataset.ready)return;root.dataset.ready='1';
const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)],MM=3.7795275591;
const AUTO='imagePrintAutoSaveV1',MANUAL='imagePrintLayoutV2',pagesEl=q('#pages');
let selected=null,currentPage=0,zCounter=2,history=[],future=[],restoring=false,timer=null,userZoom=1;
const orientation=q('#orientation'),pageSelect=q('#pageSelect'),widthMm=q('#widthMm'),heightMm=q('#heightMm'),lockRatio=q('#lockRatio'),rotation=q('#rotation'),rotationLabel=q('#rotationLabel');
const pages=()=>qa('.paper'),items=(p=pages()[currentPage])=>p?[...p.querySelectorAll('.item')]:[];
function serializeItem(el){const text=el.classList.contains('text-item'),img=el.querySelector('img');return{type:text?'text':'image',left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height,z:el.style.zIndex,rot:el.dataset.rot||'0',text:text?(el.childNodes[0]?.nodeValue||''):'',fontSize:el.dataset.fontSize||'32',bold:el.dataset.bold||'0',textColor:el.dataset.textColor||'#111111',src:img?img.src:'',fit:img?img.style.objectFit||'contain':'',pos:img?img.style.objectPosition||'50% 50%':'',borderWidth:el.dataset.borderWidth||'0',borderColor:el.dataset.borderColor||'#111111',radius:el.dataset.radius||'0',bg:el.dataset.bg||'#ffffff'}}
function snapshot(){return JSON.stringify({orientation:orientation.value,currentPage,pages:pages().map(p=>[...p.querySelectorAll('.item')].map(serializeItem))})}
function autoSave(){if(restoring||!pages().length)return;try{localStorage.setItem(AUTO,snapshot());q('#autoSaveLabel').textContent='✓ 自動保存済み'}catch(e){q('#autoSaveLabel').textContent='保存できません'}}
function scheduleSave(){q('#autoSaveLabel').textContent='保存中…';clearTimeout(timer);timer=setTimeout(autoSave,220)}
function pushHistory(){if(restoring)return;const s=snapshot();if(history.at(-1)!==s){history.push(s);if(history.length>60)history.shift();future=[];scheduleSave()}updateUndo()}
function updateUndo(){q('#undoBtn').disabled=history.length<2;q('#redoBtn').disabled=!future.length}
function boxStyle(el){el.style.border=(el.dataset.borderWidth||0)+'px solid '+(el.dataset.borderColor||'#111111');el.style.borderRadius=(el.dataset.radius||0)+'px';el.style.background=el.dataset.bg||'#ffffff';el.style.overflow='hidden'}
function createPage(record=true){const wrap=document.createElement('div');wrap.className='paper-wrap';const label=document.createElement('div');label.className='page-label';const p=document.createElement('div');p.className='paper '+(orientation.value==='landscape'?'a4l':'a4p');const ph=document.createElement('div');ph.className='placeholder';ph.textContent='「挿入」から画像やテキストを追加';p.append(ph);wrap.append(label,p);pagesEl.append(wrap);p.addEventListener('pointerdown',e=>{if(e.target===p||e.target===ph){currentPage=pages().indexOf(p);select(null);syncPages()}});if(record)pushHistory();syncPages();return p}
function renderThumbs(){const box=q('#thumbs');box.innerHTML='';pages().forEach((p,i)=>{const t=document.createElement('div');t.className='thumb'+(i===currentPage?' active':'');const mini=document.createElement('div');mini.className='thumb-paper';const arr=[...p.querySelectorAll('.item')].slice(0,8);arr.forEach((el,j)=>{const d=document.createElement('span');d.className='thumb-dot';d.style.left=(10+(j%3)*18)+'px';d.style.top=(12+Math.floor(j/3)*18)+'px';mini.append(d)});t.append(mini,document.createTextNode('ページ '+(i+1)));t.onclick=()=>{currentPage=i;select(null);syncPages()};box.append(t)})}
function fitPage(){const p=pages()[currentPage],stage=q('.stage-wrap');if(!p)return;pages().forEach((pg,i)=>pg.closest('.paper-wrap').style.display=i===currentPage?'block':'none');p.style.transform='none';const availW=Math.max(120,stage.clientWidth-60),availH=Math.max(120,stage.clientHeight-60);const fit=Math.min(1,availW/p.offsetWidth,availH/p.offsetHeight);const scale=fit*userZoom;p.style.transform='scale('+scale+')';p.style.transformOrigin='top center';const wrap=p.closest('.paper-wrap');wrap.style.width=(p.offsetWidth*scale)+'px';wrap.style.height=(p.offsetHeight*scale+20)+'px'}
function syncPages(){pageSelect.innerHTML='';pages().forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent='ページ '+(i+1);pageSelect.append(o);p.closest('.paper-wrap').querySelector('.page-label').textContent='ページ '+(i+1)});pageSelect.value=currentPage;q('#pageStatus').textContent=(currentPage+1)+' / '+pages().length;q('#prevPage').disabled=currentPage===0;q('#nextPage').disabled=currentPage>=pages().length-1;renderThumbs();updateStatus();requestAnimationFrame(fitPage)}
function updateStatus(){const count=pages().reduce((n,p)=>n+p.querySelectorAll('.item').length,0);q('#status').textContent=pages().length+'ページ / '+count+'要素';pages().forEach(p=>{p.querySelector('.placeholder').style.display=p.querySelector('.item')?'none':'grid'})}
function select(el){qa('.item').forEach(x=>x.classList.remove('selected'));selected=el;if(el){el.classList.add('selected');currentPage=pages().indexOf(el.closest('.paper'));syncControls();q('#selectedStatus').textContent=el.classList.contains('text-item')?'テキストを選択中':'画像を選択中'}else{widthMm.value='';heightMm.value='';q('#textContent').value='';q('#selectedStatus').textContent='選択なし'}renderThumbs()}
function syncControls(){if(!selected)return;widthMm.value=Math.round(selected.offsetWidth/MM);heightMm.value=Math.round(selected.offsetHeight/MM);rotation.value=selected.dataset.rot||0;rotationLabel.textContent=(selected.dataset.rot||0)+'°';q('#borderWidth').value=selected.dataset.borderWidth||0;q('#borderColor').value=selected.dataset.borderColor||'#111111';q('#radius').value=selected.dataset.radius||0;q('#bgColor').value=selected.dataset.bg||'#ffffff';const img=selected.querySelector('img');if(img){q('#fitMode').value=img.style.objectFit||'contain';const pos=(img.style.objectPosition||'50% 50%').split(' ');q('#cropX').value=parseInt(pos[0])||50;q('#cropY').value=parseInt(pos[1])||50;q('#textContent').value=''}else{q('#textContent').value=selected.childNodes[0]?.nodeValue||'';q('#fontSize').value=selected.dataset.fontSize||32;q('#textColor').value=selected.dataset.textColor||'#111111';q('#boldText').classList.toggle('active',selected.dataset.bold==='1')}}
function setRot(v){if(!selected)return;const n=Math.max(-180,Math.min(180,Number(v)||0));selected.dataset.rot=n;selected.style.transform='rotate('+n+'deg)';rotation.value=n;rotationLabel.textContent=n+'°'}
function bindItem(el){const h=el.querySelector('.handle');el.addEventListener('pointerdown',e=>{if(el.getAttribute('contenteditable')==='true'||e.target===h)return;select(el);const p=el.closest('.paper'),sx=e.clientX,sy=e.clientY,sl=parseFloat(el.style.left)||0,st=parseFloat(el.style.top)||0;el.setPointerCapture(e.pointerId);const move=ev=>{el.style.left=Math.max(0,Math.min(p.clientWidth-el.offsetWidth,sl+ev.clientX-sx))+'px';el.style.top=Math.max(0,Math.min(p.clientHeight-el.offsetHeight,st+ev.clientY-sy))+'px'};const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);pushHistory()};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up)});h.addEventListener('pointerdown',e=>{e.stopPropagation();select(el);const sx=e.clientX,sy=e.clientY,sw=el.offsetWidth,sh=el.offsetHeight,ratio=sw/sh;h.setPointerCapture(e.pointerId);const move=ev=>{let nw=Math.max(30,sw+ev.clientX-sx),nh=Math.max(30,sh+ev.clientY-sy);if(lockRatio.checked)nh=nw/ratio;el.style.width=nw+'px';el.style.height=nh+'px';syncControls()};const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);pushHistory()};h.addEventListener('pointermove',move);h.addEventListener('pointerup',up)});if(el.classList.contains('text-item'))el.addEventListener('dblclick',e=>{e.stopPropagation();select(el);el.setAttribute('contenteditable','true');el.focus();const range=document.createRange();range.selectNodeContents(el);range.collapse(false);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range)});el.addEventListener('blur',()=>{if(el.getAttribute('contenteditable')==='true'){el.removeAttribute('contenteditable');syncControls();pushHistory()}})}
function createFromData(o,p){const el=document.createElement('div');el.className='item '+(o.type==='text'?'text-item':'');Object.assign(el.style,{left:o.left,top:o.top,width:o.width,height:o.height,zIndex:o.z,transform:'rotate('+(o.rot||0)+'deg)'});Object.assign(el.dataset,{rot:o.rot||0,borderWidth:o.borderWidth||0,borderColor:o.borderColor||'#111111',radius:o.radius||0,bg:o.bg||'#ffffff'});boxStyle(el);if(o.type==='text'){el.textContent=o.text;Object.assign(el.dataset,{fontSize:o.fontSize||32,bold:o.bold||0,textColor:o.textColor||'#111111'});el.style.fontSize=(o.fontSize||32)+'px';el.style.fontWeight=o.bold==='1'?'700':'400';el.style.color=o.textColor||'#111111'}else{const img=document.createElement('img');img.src=o.src;img.alt='配置画像';img.style.objectFit=o.fit||'contain';img.style.objectPosition=o.pos||'50% 50%';el.append(img)}const h=document.createElement('span');h.className='handle';el.append(h);p.append(el);bindItem(el);return el}
function restore(state){restoring=true;const d=JSON.parse(state);orientation.value=d.orientation||'portrait';pagesEl.innerHTML='';(d.pages||[]).forEach(arr=>{const p=createPage(false);arr.forEach(o=>createFromData(o,p))});if(!pages().length)createPage(false);currentPage=Math.max(0,Math.min(Number(d.currentPage)||0,pages().length-1));select(null);restoring=false;syncPages()}
function addImage(src,index=0){const p=pages()[currentPage],el=document.createElement('div');el.className='item';Object.assign(el.style,{width:'300px',height:'220px',left:(40+index*18)+'px',top:(40+index*18)+'px',zIndex:zCounter++});Object.assign(el.dataset,{rot:'0',borderWidth:'0',borderColor:'#111111',radius:'0',bg:'#ffffff'});const img=document.createElement('img');img.src=src;img.alt='配置画像';img.style.objectFit='contain';img.style.objectPosition='50% 50%';img.onload=()=>{const r=img.naturalWidth/img.naturalHeight;if(r>1)el.style.height=300/r+'px';else{el.style.height='300px';el.style.width=300*r+'px'}select(el);pushHistory();syncPages()};el.append(img);const h=document.createElement('span');h.className='handle';el.append(h);p.append(el);bindItem(el);select(el);syncPages()}
function addText(){const p=pages()[currentPage],el=document.createElement('div');el.className='item text-item';el.textContent='テキスト';Object.assign(el.style,{left:'60px',top:'60px',width:'300px',height:'90px',zIndex:zCounter++,fontSize:'32px'});Object.assign(el.dataset,{rot:'0',fontSize:'32',bold:'0',textColor:'#111111',borderWidth:'0',borderColor:'#111111',radius:'0',bg:'#ffffff'});boxStyle(el);const h=document.createElement('span');h.className='handle';el.append(h);p.append(el);bindItem(el);select(el);pushHistory();syncPages()}
function cloneSelected(){if(!selected)return;const d=serializeItem(selected),p=pages()[currentPage];d.left=(parseFloat(d.left)+18)+'px';d.top=(parseFloat(d.top)+18)+'px';d.z=String(zCounter++);select(createFromData(d,p));pushHistory();syncPages()}
qa('.tab').forEach(t=>t.onclick=()=>{qa('.tab').forEach(x=>x.classList.remove('active'));qa('.ribbon-panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');q('[data-panel="'+t.dataset.tab+'"]').classList.add('active')});
q('#fileInput').onchange=()=>{[...q('#fileInput').files].forEach((f,i)=>{if(!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=e=>addImage(e.target.result,i);r.readAsDataURL(f)});q('#fileInput').value=''};
q('#addText').onclick=addText;q('#addPage').onclick=()=>{createPage();currentPage=pages().length-1;syncPages()};
pageSelect.onchange=()=>{currentPage=Number(pageSelect.value);select(null);syncPages();scheduleSave()};q('#prevPage').onclick=()=>{if(currentPage>0){currentPage--;select(null);syncPages()}};q('#nextPage').onclick=()=>{if(currentPage<pages().length-1){currentPage++;select(null);syncPages()}};
orientation.onchange=()=>{pages().forEach(p=>{p.classList.toggle('a4p',orientation.value==='portrait');p.classList.toggle('a4l',orientation.value==='landscape')});pushHistory();syncPages()};
q('#duplicatePage').onclick=()=>{const data=items().map(serializeItem),p=createPage(false);data.forEach(d=>createFromData(d,p));currentPage=pages().length-1;pushHistory();syncPages()};q('#deletePage').onclick=()=>{if(pages().length===1){items().forEach(x=>x.remove())}else pages()[currentPage].closest('.paper-wrap').remove();currentPage=Math.max(0,Math.min(currentPage,pages().length-1));select(null);pushHistory();syncPages()};
widthMm.onchange=()=>{if(!selected)return;const ow=selected.offsetWidth,oh=selected.offsetHeight,nw=Math.max(5,Number(widthMm.value)||5)*MM;selected.style.width=nw+'px';if(lockRatio.checked)selected.style.height=nw*(oh/ow)+'px';syncControls();pushHistory()};heightMm.onchange=()=>{if(!selected)return;const ow=selected.offsetWidth,oh=selected.offsetHeight,nh=Math.max(5,Number(heightMm.value)||5)*MM;selected.style.height=nh+'px';if(lockRatio.checked)selected.style.width=nh*(ow/oh)+'px';syncControls();pushHistory()};
rotation.oninput=()=>setRot(rotation.value);rotation.onchange=pushHistory;q('#rotLeft').onclick=()=>{setRot((Number(selected?.dataset.rot)||0)-90);pushHistory()};q('#rotRight').onclick=()=>{setRot((Number(selected?.dataset.rot)||0)+90);pushHistory()};
q('#presetSize').onchange=e=>{if(!selected||!e.target.value)return;const p=selected.closest('.paper'),pw=p.clientWidth/MM,ph=p.clientHeight/MM,map={full:[pw,ph],half:[pw,ph/2],quarter:[pw/2,ph/2],postcard:[100,148],l:[89,127],card:[55,91]},s=map[e.target.value];selected.style.width=s[0]*MM+'px';selected.style.height=s[1]*MM+'px';syncControls();pushHistory();e.target.value=''};
q('#duplicate').onclick=cloneSelected;q('#deleteSelected').onclick=()=>{if(selected){selected.remove();selected=null;pushHistory();syncPages()}};q('#bringFront').onclick=()=>{if(selected){selected.style.zIndex=zCounter++;pushHistory()}};q('#sendBack').onclick=()=>{if(selected){selected.style.zIndex='1';pushHistory()}};
qa('[data-align]').forEach(b=>b.onclick=()=>{if(!selected)return;const p=selected.closest('.paper'),w=selected.offsetWidth,h=selected.offsetHeight,a=b.dataset.align;if(a==='left')selected.style.left='0px';if(a==='center')selected.style.left=(p.clientWidth-w)/2+'px';if(a==='right')selected.style.left=p.clientWidth-w+'px';if(a==='top')selected.style.top='0px';if(a==='middle')selected.style.top=(p.clientHeight-h)/2+'px';if(a==='bottom')selected.style.top=p.clientHeight-h+'px';pushHistory()});
q('#fitAll').onclick=()=>{const arr=items();if(!arr.length)return;const p=pages()[currentPage],cols=Math.ceil(Math.sqrt(arr.length)),rows=Math.ceil(arr.length/cols),gap=20,cw=(p.clientWidth-gap*(cols+1))/cols,ch=(p.clientHeight-gap*(rows+1))/rows;arr.forEach((el,i)=>{const img=el.querySelector('img'),r=img?((img.naturalWidth||1)/(img.naturalHeight||1)):3;let w=cw,h=w/r;if(h>ch){h=ch;w=h*r}el.style.width=Math.max(40,w)+'px';el.style.height=Math.max(40,h)+'px';el.style.left=(gap+(i%cols)*(cw+gap)+(cw-w)/2)+'px';el.style.top=(gap+Math.floor(i/cols)*(ch+gap)+(ch-h)/2)+'px'});select(arr[0]);pushHistory()};q('#spaceEvenly').onclick=()=>{const arr=items().sort((a,b)=>(parseFloat(a.style.left)||0)-(parseFloat(b.style.left)||0));if(arr.length<2)return;const p=pages()[currentPage],total=arr.reduce((s,e)=>s+e.offsetWidth,0),gap=Math.max(0,(p.clientWidth-total)/(arr.length+1));let x=gap;arr.forEach(el=>{el.style.left=x+'px';x+=el.offsetWidth+gap});pushHistory()};
q('#fitMode').onchange=()=>{const img=selected?.querySelector('img');if(img){img.style.objectFit=q('#fitMode').value;pushHistory()}};function crop(){const img=selected?.querySelector('img');if(img)img.style.objectPosition=q('#cropX').value+'% '+q('#cropY').value+'%'}q('#cropX').oninput=crop;q('#cropY').oninput=crop;q('#cropX').onchange=pushHistory;q('#cropY').onchange=pushHistory;q('#resetCrop').onclick=()=>{const img=selected?.querySelector('img');if(img){img.style.objectFit='contain';img.style.objectPosition='50% 50%';syncControls();pushHistory()}};
['borderWidth','borderColor','radius','bgColor'].forEach(id=>q('#'+id).onchange=()=>{if(!selected)return;if(id==='borderWidth')selected.dataset.borderWidth=q('#'+id).value;if(id==='borderColor')selected.dataset.borderColor=q('#'+id).value;if(id==='radius')selected.dataset.radius=q('#'+id).value;if(id==='bgColor')selected.dataset.bg=q('#'+id).value;boxStyle(selected);pushHistory()});
q('#textContent').oninput=()=>{if(selected?.classList.contains('text-item')){selected.childNodes[0].nodeValue=q('#textContent').value;scheduleSave()}};q('#textContent').onchange=pushHistory;q('#fontSize').onchange=()=>{if(selected?.classList.contains('text-item')){selected.dataset.fontSize=q('#fontSize').value;selected.style.fontSize=q('#fontSize').value+'px';pushHistory()}};q('#textColor').onchange=()=>{if(selected?.classList.contains('text-item')){selected.dataset.textColor=q('#textColor').value;selected.style.color=q('#textColor').value;pushHistory()}};q('#boldText').onclick=()=>{if(selected?.classList.contains('text-item')){const on=selected.dataset.bold!=='1';selected.dataset.bold=on?'1':'0';selected.style.fontWeight=on?'700':'400';q('#boldText').classList.toggle('active',on);pushHistory()}};
q('#undoBtn').onclick=()=>{if(history.length<2)return;future.push(history.pop());restore(history.at(-1));updateUndo();autoSave()};q('#redoBtn').onclick=()=>{if(!future.length)return;const s=future.pop();history.push(s);restore(s);updateUndo();autoSave()};
q('#saveLayout').onclick=()=>{try{const s=snapshot();localStorage.setItem(MANUAL,s);localStorage.setItem(AUTO,s);q('#autoSaveLabel').textContent='✓ 保存しました'}catch(e){q('#autoSaveLabel').textContent='保存できません'}};q('#loadLayout').onclick=()=>{const s=localStorage.getItem(MANUAL);if(s){restore(s);pushHistory();autoSave()}};
q('#printBtn').onclick=()=>{select(null);autoSave();q('#printHelp').classList.remove('show');try{window.print()}catch(e){q('#printHelp').classList.add('show')}};
q('#zoom').oninput=()=>{userZoom=Number(q('#zoom').value)/100;q('#zoomLabel').textContent=q('#zoom').value+'%';fitPage()};
window.addEventListener('resize',fitPage);window.addEventListener('pagehide',autoSave);window.addEventListener('beforeunload',autoSave);window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?q('#redoBtn').click():q('#undoBtn').click()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();q('#redoBtn').click()}else if((e.key==='Delete'||e.key==='Backspace')&&selected&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&document.activeElement.getAttribute('contenteditable')!=='true'){e.preventDefault();q('#deleteSelected').click()}});
const saved=localStorage.getItem(AUTO);if(saved){try{restore(saved);history=[snapshot()];q('#autoSaveLabel').textContent='✓ 前回の内容を復元';updateUndo()}catch(e){createPage(false);syncPages();pushHistory()}}else{createPage(false);syncPages();pushHistory()}syncPages();
})();
