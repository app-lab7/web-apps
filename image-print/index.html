;justify-content:center;gap:5px}.big:hover{background:#edf3fa;border-color:#cbd1d9}.ico{font-size:23px}.fileLabel input{display:none}.workspace{display:grid;grid-template-columns:170px 28px minmax(0,1fr);flex:1;min-height:0}.nav{background:#fafbfc;border-right:1px solid #d7dce2;overflow:auto;padding:10px 8px}.navTitle{font-size:12px;font-weight:700;color:#475467;margin:0 4px 8px}.thumb{padding:7px;border:2px solid transparent;border-radius:4px;margin-bottom:8px;text-align:center;font-size:11px;color:#667085;cursor:pointer;background:#fff}.thumb.active{border-color:#185abd;background:#eff6ff}.thumbPaper{width:72px;height:102px;margin:0 auto 5px;background:#fff;border:1px solid #c9ced6;box-shadow:0 1px 4px #0002;position:relative;overflow:hidden}.thumbLines{position:absolute;left:10px;right:10px;top:14px;height:60px;background:repeating-linear-gradient(to bottom,#cbd5e1 0 2px,transparent 2px 8px)}.vRuler{background:#f8f9fb;border-right:1px solid #cfd4dc;position:relative;overflow:hidden}.vRuler:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 9px,#9aa3af 10px 11px)}.editorArea{min-width:0;min-height:0;display:flex;flex-direction:column;background:#dfe4ea}.hRuler{height:32px;background:#f8f9fb;border-bottom:1px solid #cfd4dc;position:relative;flex:0 0 auto;overflow:hidden}.hTicks{position:absolute;inset:0}.hTick{position:absolute;top:17px;height:15px;border-left:1px solid #9aa3af;font-size:8px;color:#667085;padding-left:2px}.rMarker{position:absolute;top:0;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid #185abd;cursor:ew-resize;z-index:6}.rMarker.right{border-top-color:#d97706}.indentMarker{position:absolute;top:11px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid #7c3aed;cursor:ew-resize;z-index:7}.tabStop{position:absolute;top:4px;width:7px;height:12px;border-left:2px solid #047857;border-bot   <div class="group"><div class="col"><div class="row"><button class="mini" id="undoBtn">↶ 元に戻す</button><button class="mini" id="redoBtn">↷ やり直す</button></div><div class="row"><button class="mini" id="cutBtn">切り取り</button><button class="mini" id="copyBtn">コピー</button><button class="mini" id="pasteBtn">貼り付け</button></div></div><span class="gtitle">クリップボード</span></div>
  <div class="group"><div class="col"><div class="row"><select id="fontName" class="mini wide"><option value="Yu Mincho">游明朝</option><option value="Yu Gothic">游ゴシック</option><option value="Meiryo">メイリオ</option><option value="Arial">Arial</option><option value="Times New Roman">Times New Roman</option></select><select id="fontSize" class="mini num"><option>10</option><option>11</option><option selected>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option><option>36</option><option>48</option></select></div><div class="row"><button class="mini" id="boldBtn"><b>B</b></button><button class="mini" id="italicBtn"><i>I</i></button><button class="mini" id="underlineBtn"><u>U</u></button><input id="fontColor" class="color" type="color" value="#111111" title="文字色"><input id="highlightColor" class="color" type="color" value="#fff59d" title="蛍光ペン"></div></div><span class="gtitle">フォント</span></div>

<script>
(()=>{
const q=s=>document.querySelector('#app '+s),qa=s=>[...document.querySelectorAll('#app '+s)],MM=3.7795275591,AUTO='wordLikeEditorV1';
let currentPage=0,userZoom=1,marginLeft=20,marginRight=20,marginTop=20,marginBottom=20,indentLeft=0,tabStops=[],history=[],future=[],restoring=false,timer=null,lastRange=null,selectedImage=null;
const pagesEl=q('#pages'),stage=q('#stage'),orientation=q('#orientation'),pages=()=>qa('.paper'),bodies=()=>qa('.docBody');
function toast(m){const t=q('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1400)}
function activeBody(){return pages()[currentPage]?.querySelector('.docBody')||null}
function rememberRange(){const s=window.getSelection();if(s&&s.rangeCount){const r=s.getRangeAt(0);if(r.commonAncestorContainer&&activeBody()?.contains(r.commonAncestorContainer))lastRange=r.cloneRange()}}
function restoreRange(){if(!lastRange)return;const s=window.getSelection();s.removeAllRanges();s.addRange(lastRange)}
function snap(){return JSON.stringify({orientation:orientation.value,currentPage,marginLeft,marginRight,marginTop,marginBottom,indentLeft,tabStops,pages:bodies().map(b=>b.innerHTML)})}
function schedule(){q('#saveState').textContent='保存中…';clearTimeout(timer);timer=setTimeout(()=>{localStorage.setItem(AUTO,snap());q('#saveState').textContent='✓ 自動保存済み'},250)}
function push(){if(restoring)return;const s=snap();if(history.at(-1)!==s){history.push(s);if(history.length>70)history.shift();future=[];schedule()}updateUndo();updateStatus()}
function updateUndo(){q('#undoBtn').disabled=history.length<2;q('#redoBtn').disabled=!future.length}
function createPage(html='',record=true){const wrap=document.createElement('div');wrap.className='paperWrap';const label=document.createElement('div');label.className='pageLabel';const p=document.createElement('div');p.className='paper '+(orientation.value==='landscape'?'l':'p');const mg=document.createElement('div');mg.className='marginGuide';const body=document.createElement('div');body.className='docBody';body.contentEditable='true';body.spellcheck=false;body.innerHTML=html;p.append(mg,body);wrap.append(label,p);pagesEl.append(wrap);bindBody(body,p);applyLayout(p);if(record)push();return p}
function bindBody(body,p){body.addEventListener('focus',()=>{currentPage=pages().indexOf(p);syncUI()});body.addEventListener('mouseup',rememberRange);body.addEventListener('keyup',e=>{rememberRange();if(e.key==='Tab'){e.preventDefault()}});body.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand(e.shiftKey?'outdent':'indent',false,null);push()}});body.addEventListener('input',()=>{currentPage=pages().indexOf(p);schedule();updateStatus()});body.addEventListener('click',e=>{if(e.target.tagName==='IMG'){selectImage(e.target);e.preventDefault()}else selectImage(null)});body.addEventListener('blur',()=>{push()})}
function applyLayout(p){const pw=p.classList.contains('l')?297:210,ph=p.classList.contains('l')?210:297;const body=p.querySelector('.docBody'),mg=p.querySelector('.marginGuide');mg.style.left=marginLeft*MM+'px';mg.style.right=marginRight*MM+'px';mg.style.top=marginTop*MM+'px';mg.style.bottom=marginBottom*MM+'px';body.style.left=(marginLeft+indentLeft)*MM+'px';body.style.right=marginRight*MM+'px';body.style.top=marginTop*MM+'px';body.style.bottom=marginBottom*MM+'px';p.querySelectorAll('.tabGuide').forEach(x=>x.remove());tabStops.forEach(mm=>{if(marginLeft+mm<pw-marginRight){const g=document.createElement('div');g.className='tabGuide';g.style.left=(marginLeft+mm)*MM+'px';p.append(g)}});body.style.setProperty('--page-height',ph+'mm')}
function applyAllLayout(){pages().forEach(applyLayout);renderRuler();applyZoom()}
function restore(s){restoring=true;const d=JSON.parse(s);orientation.value=d.orientation||'portrait';marginLeft=d.marginLeft??20;marginRight=d.marginRight??20;marginTop=d.marginTop??20;marginBottom=d.marginBottom??20;indentLeft=d.indentLeft??0;tabStops=d.tabStops||[];pagesEl.innerHTML='';(d.pages||['']).forEach(h=>createPage(h,false));if(!pages().length)createPage('',false);currentPage=Math.max(0,Math.min(d.currentPage||0,pages().length-1));restoring=false;selectImage(null);syncUI()}
function exec(cmd,value=null){activeBody()?.focus();restoreRange();try{document.execCommand(cmd,false,value)}catch(e){}rememberRange();push()}
function setFontSize(px){activeBody()?.focus();restoreRange();document.execCommand('fontSize',false,'7');qa('.docBody font[size="7"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=px+'px'});rememberRange();push()}
function selectImage(img){qa('.docBody img').forEach(x=>x.classList.remove('selectedImage'));selectedImage=img||null;if(selectedImage){selectedImage.classList.add('selectedImage');q('#imageWidth').value=((selectedImage.getBoundingClientRect().width/userZoom)/MM).toFixed(1);q('#imageStatus').textContent='画像を選択中'}else{q('#imageWidth').value='';q('#imageStatus').textContent='画像選択なし'}}
function insertImage(src){const body=activeBody();body.focus();restoreRange();const img=document.createElement('img');img.src=src;img.alt='挿入画像';img.style.width='80mm';img.style.height='auto';img.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();selectImage(img)});let range=lastRange;if(!range||!body.contains(range.commonAncestorContainer)){range=document.createRange();range.selectNodeContents(body);range.collapse(false)}range.insertNode(img);range.setStartAfter(img);range.collapse(true);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);lastRange=range.cloneRange();push();selectImage(img)}
function applyZoom(){pages().forEach(p=>{p.style.transform='scale('+userZoom+')';const w=p.closest('.paperWrap');w.style.width=p.offsetWidth*userZoom+'px';w.style.height=p.offsetHeight*userZoom+22+'px'});q('#zoomLabel').textContent=Math.round(userZoom*100)+'%';requestAnimationFrame(renderRuler)}
function renderRuler(){const p=pages()[currentPage];if(!p)return;const stageRect=stage.getBoundingClientRect(),paperRect=p.getBoundingClientRect(),offset=paperRect.left-stageRect.left+stage.scrollLeft,scale=userZoom*MM,paperW=p.classList.contains('l')?297:210,h=q('#hTicks');h.innerHTML='';for(let mm=0;mm<=paperW;mm+=10){const t=document.createElement('span');t.className='hTick';t.style.left=(offset+mm*scale)+'px';t.textContent=mm%20===0?mm:'';h.append(t)}q('#leftMarginMarker').style.left=(offset+marginLeft*scale-6)+'px';q('#rightMarginMarker').style.left=(offset+(paperW-marginRight)*scale-6)+'px';q('#indentMarker').style.left=(offset+(marginLeft+indentLeft)*scale-6)+'px';qa('.tabStop').forEach(x=>x.remove());tabStops.forEach((mm,i)=>{const s=document.createElement('span');s.className='tabStop';s.style.left=(offset+(marginLeft+mm)*scale-3)+'px';s.dataset.i=i;q('#hRuler').append(s);dragTab(s,i,offset,scale,paperW)})}
function dragMarker(el,type){el.onpointerdown=e=>{const p=pages()[currentPage],paperW=p.classList.contains('l')?297:210,stageRect=stage.getBoundingClientRect(),paperRect=p.getBoundingClientRect(),offset=paperRect.left-stageRect.left+stage.scrollLeft,scale=userZoom*MM;el.setPointerCapture(e.pointerId);const mv=ev=>{let mm=(ev.clientX-stageRect.left+stage.scrollLeft-offset)/scale;mm=Math.max(0,Math.min(paperW,mm));if(type==='left')marginLeft=Math.min(mm,paperW-marginRight-20);if(type==='right')marginRight=Math.min(paperW-mm,paperW-marginLeft-20);if(type==='indent')indentLeft=Math.max(0,Math.min(mm-marginLeft,paperW-marginLeft-marginRight-10));syncLayoutInputs();applyAllLayout()};const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);push()};el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)}}
function dragTab(el,i,offset,scale,paperW){el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);const mv=ev=>{const sr=stage.getBoundingClientRect();let mm=(ev.clientX-sr.left+stage.scrollLeft-offset)/scale-marginLeft;tabStops[i]=Math.max(0,Math.min(paperW-marginLeft-marginRight,Math.round(mm*2)/2));applyAllLayout()};const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);push()};el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)}}
function syncLayoutInputs(){q('#marginLeft').value=marginLeft.toFixed(1);q('#marginRight').value=marginRight.toFixed(1);q('#marginTop').value=marginTop.toFixed(1);q('#marginBottom').value=marginBottom.toFixed(1);q('#indentLeft').value=indentLeft.toFixed(1)}
function renderThumbs(){const b=q('#thumbs');b.innerHTML='';pages().forEach((p,i)=>{const t=document.createElement('div');t.className='thumb'+(i===currentPage?' active':'');const m=document.createElement('div');m.className='thumbPaper';m.innerHTML='<span class="thumbLines"></span>';t.append(m,document.createTextNode('ページ '+(i+1)));t.onclick=()=>{currentPage=i;syncUI();p.closest('.paperWrap').scrollIntoView({behavior:'smooth',block:'start'})};b.append(t)})}
function updateStatus(){const text=bodies().map(b=>b.innerText).join('').replace(/\s/g,'');q('#wordCount').textContent=text.length+' 文字';q('#status').textContent=pages().length+'ページ';q('#pageStatus').textContent=(currentPage+1)+' / '+pages().length}
function syncUI(){if(!pages().length)createPage('',false);currentPage=Math.max(0,Math.min(currentPage,pages().length-1));pages().forEach((p,i)=>{p.classList.toggle('p',orientation.value==='portrait');p.classList.toggle('l',orientation.value==='landscape');p.closest('.paperWrap').querySelector('.pageLabel').textContent='ページ '+(i+1);applyLayout(p)});syncLayoutInputs();renderThumbs();updateStatus();requestAnimationFrame(applyZoom)}
qa('.tab').forEach(t=>t.onclick=()=>{qa('.tab').forEach(x=>x.classList.remove('active'));qa('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');q('[data-panel="'+t.dataset.tab+'"]').classList.add('active')});
q('#fontName').onchange=()=>exec('fontName',q('#fontName').value);q('#fontSize').onchange=()=>setFontSize(Math.round(Number(q('#fontSize').value)*96/72));q('#boldBtn').onclick=()=>exec('bold');q('#italicBtn').onclick=()=>exec('italic');q('#underlineBtn').onclick=()=>exec('underline');q('#fontColor').onchange=()=>exec('foreColor',q('#fontColor').value);q('#highlightColor').onchange=()=>exec('hiliteColor',q('#highlightColor').value);q('#alignLeft').onclick=()=>exec('justifyLeft');q('#alignCenter').onclick=()=>exec('justifyCenter');q('#alignRight').onclick=()=>exec('justifyRight');q('#alignJustify').onclick=()=>exec('justifyFull');q('#bulletBtn').onclick=()=>exec('insertUnorderedList');q('#numberBtn').onclick=()=>exec('insertOrderedList');q('#indentBtn').onclick=()=>exec('indent');q('#outdentBtn').onclick=()=>exec('outdent');q('#cutBtn').onclick=()=>exec('cut');q('#copyBtn').onclick=()=>exec('copy');q('#pasteBtn').onclick=async()=>{activeBody()?.focus();restoreRange();try{const txt=await navigator.clipboard.readText();document.execCommand('insertText',false,txt);push()}catch(e){toast('貼り付けは Ctrl/Cmd + V を使ってください')}};
q('#fileInput').onchange=()=>{[...q('#fileInput').files].forEach(f=>{if(!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=e=>insertImage(e.target.result);r.readAsDataURL(f)});q('#fileInput').value=''};q('#addPage').onclick=()=>{createPage('',false);currentPage=pages().length-1;push();syncUI();pages()[currentPage].closest('.paperWrap').scrollIntoView({behavior:'smooth'})};
['marginLeft','marginRight','marginTop','marginBottom','indentLeft'].forEach(id=>q('#'+id).onchange=()=>{const v=Math.max(0,Number(q('#'+id).value)||0);if(id==='marginLeft')marginLeft=v;if(id==='marginRight')marginRight=v;if(id==='marginTop')marginTop=v;if(id==='marginBottom')marginBottom=v;if(id==='indentLeft')indentLeft=v;applyAllLayout();push()});q('#addTabStop').onclick=()=>{const next=tabStops.length?tabStops.at(-1)+12.5:12.5;tabStops.push(next);applyAllLayout();push()};q('#clearTabs').onclick=()=>{tabStops=[];applyAllLayout();push()};orientation.onchange=()=>{syncUI();push()};
q('#imageWidth').onchange=()=>{if(!selectedImage)return toast('画像を選択してください');selectedImage.style.width=Math.max(10,Number(q('#imageWidth').value)||10)+'mm';push()};q('#imageSmall').onclick=()=>{if(selectedImage){selectedImage.style.width='40mm';push();selectImage(selectedImage)}};q('#imageMedium').onclick=()=>{if(selectedImage){selectedImage.style.width='80mm';push();selectImage(selectedImage)}};q('#imageLarge').onclick=()=>{if(selectedImage){selectedImage.style.width='140mm';push();selectImage(selectedImage)}};q('#deleteImage').onclick=()=>{if(!selectedImage)return toast('画像を選択してください');selectedImage.remove();selectedImage=null;push();selectImage(null)};
q('#undoBtn').onclick=()=>{if(history.length<2)return;future.push(history.pop());restore(history.at(-1));localStorage.setItem(AUTO,snap());updateUndo()};q('#redoBtn').onclick=()=>{if(!future.length)return;const s=future.pop();history.push(s);restore(s);localStorage.setItem(AUTO,snap());updateUndo()};q('#quickSave').onclick=()=>{localStorage.setItem(AUTO,snap());q('#saveState').textContent='✓ 保存しました';toast('保存しました')};q('#printBtn').onclick=()=>window.print();q('#newDocTop').onclick=()=>{if(!confirm('新しい文書を作成しますか？'))return;pagesEl.innerHTML='';currentPage=0;history=[];future=[];tabStops=[];createPage('',false);push();syncUI();activeBody().focus()};
q('#zoom').oninput=()=>{userZoom=Number(q('#zoom').value)/100;applyZoom()};q('#zoom100').onclick=()=>{userZoom=1;q('#zoom').value=100;applyZoom()};q('#fitWidth').onclick=()=>{const p=pages()[currentPage];userZoom=Math.max(.4,Math.min(1.5,(stage.clientWidth-100)/p.offsetWidth));q('#zoom').value=Math.round(userZoom*100);applyZoom()};q('#showRuler').onchange=e=>{q('.hRuler').classList.toggle('hidden',!e.target.checked);q('.vRuler').classList.toggle('hidden',!e.target.checked)};q('#showMargins').onchange=e=>qa('.marginGuide').forEach(x=>x.classList.toggle('hidden',!e.target.checked));q('#showNav').onchange=e=>q('.nav').classList.toggle('hidden',!e.target.checked);q('#prevPage').onclick=()=>{if(currentPage>0){currentPage--;syncUI();pages()[currentPage].closest('.paperWrap').scrollIntoView({behavior:'smooth'})}};q('#nextPage').onclick=()=>{if(currentPage<pages().length-1){currentPage++;syncUI();pages()[currentPage].closest('.paperWrap').scrollIntoView({behavior:'smooth'})}};
stage.addEventListener('scroll',()=>renderRuler());document.addEventListener('selectionchange',rememberRange);window.addEventListener('keydown',e=>{const cmd=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();if(cmd&&k==='s'){e.preventDefault();localStorage.setItem(AUTO,snap());toast('保存しました')}else if(cmd&&k==='p'){e.preventDefault();window.print()}else if(cmd&&k==='n'){e.preventDefault();q('#newDocTop').click()}else if(cmd&&k==='z'){e.preventDefault();q('#undoBtn').click()}else if(cmd&&k==='y'){e.preventDefault();q('#redoBtn').click()}});
dragMarker(q('#leftMarginMarker'),'left');dragMarker(q('#rightMarginMarker'),'right');dragMarker(q('#indentMarker'),'indent');const saved=localStorage.getItem(AUTO);if(saved){try{restore(saved);history=[snap()]}catch(e){createPage('',false)}}else createPage('',false);syncUI();push();setTimeout(()=>activeBody()?.focus(),100);
})();
