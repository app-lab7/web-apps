<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像レイアウト印刷</title>
</head>
<body style="margin:0">
<div id="imgprint-app" class="app-root">
  <style>
    #imgprint-app{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827;padding:10px;box-sizing:border-box;border-radius:0;height:100vh;min-height:0;overflow:hidden;display:flex;flex-direction:column}
    #imgprint-app *{box-sizing:border-box}
    #imgprint-app button,#imgprint-app select,#imgprint-app input,#imgprint-app textarea{font:inherit}
    #imgprint-app button{min-height:42px;border:1px solid #d1d5db;background:#fff;color:inherit;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:650;white-space:nowrap}
    #imgprint-app button.primary{background:#2563eb;color:white;border-color:#2563eb}
    #imgprint-app button.danger{color:#dc2626}
    #imgprint-app button:disabled{opacity:.45;cursor:not-allowed}
    #imgprint-app input[type=file]{display:none}
    #imgprint-app .file-label{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 12px;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
    #imgprint-app .topbar{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin-bottom:8px;flex:0 0 auto;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
    #imgprint-app .status{font-size:13px;color:#4b5563;margin-left:auto;white-space:nowrap}
    #imgprint-app .workspace{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px;align-items:stretch;flex:1 1 auto;height:auto;min-height:0;overflow:hidden}
    #imgprint-app .stage-wrap{overflow:hidden;background:#e5e7eb;border-radius:12px;padding:6px;min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
    #imgprint-app .pages{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;width:100%;height:100%;min-width:0;min-height:0}
    #imgprint-app .paper-wrap{position:relative}
    #imgprint-app .page-label{font-size:12px;color:#6b7280;margin-bottom:6px;text-align:center}
    #imgprint-app .paper{position:relative;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden;touch-action:none;transform-origin:center center}
    #imgprint-app .paper.a4p{width:794px;height:1123px}
    #imgprint-app .paper.a4l{width:1123px;height:794px}
    #imgprint-app .placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#9ca3af;font-size:17px;padding:30px;pointer-events:none}
    #imgprint-app .item{position:absolute;left:40px;top:40px;transform-origin:center center;user-select:none;touch-action:none;border:2px solid transparent;cursor:grab}
    #imgprint-app .item.selected{border-color:#2563eb;outline:2px solid rgba(37,99,235,.2)}
    #imgprint-app .item img{display:block;width:100%;height:100%;pointer-events:none}
    #imgprint-app .item.text-item{display:flex;align-items:center;justify-content:center;padding:8px;white-space:pre-wrap;overflow:hidden;color:#111827;background:transparent}
    #imgprint-app .handle{position:absolute;width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid white;right:-10px;bottom:-10px;cursor:nwse-resize;display:none}
    #imgprint-app .item.selected .handle{display:block}
    #imgprint-app .side{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;height:100%;min-height:0;overflow:auto}
    #imgprint-app .side h2{font-size:16px;margin:0 0 10px}
    #imgprint-app .group{border-top:1px solid #e5e7eb;padding-top:12px;margin-top:12px}
    #imgprint-app .group:first-of-type{border-top:0;padding-top:0;margin-top:0}
    #imgprint-app label.field{display:block;font-size:12px;font-weight:700;margin:8px 0 4px}
    #imgprint-app select,#imgprint-app input[type=number],#imgprint-app input[type=text],#imgprint-app textarea,#imgprint-app input[type=range]{width:100%;min-height:40px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:inherit;padding:7px 8px}
    #imgprint-app textarea{min-height:76px;resize:vertical}
    #imgprint-app .row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    #imgprint-app .actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
    #imgprint-app .actions3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}
    #imgprint-app .hint{font-size:11px;line-height:1.55;color:#6b7280;margin-top:7px}
    #imgprint-app .check{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:8px}
    #imgprint-app .swatch{width:100%;height:38px;padding:2px;border-radius:8px}
    #imgprint-app .print-help{display:none;width:100%;padding:10px 12px;border-radius:9px;background:#eff6ff;border:1px solid #bfdbfe;font-size:13px;line-height:1.5}
    #imgprint-app .print-help.show{display:block}
    @media(max-width:900px){#imgprint-app{height:auto;min-height:100vh;overflow:visible}#imgprint-app .topbar{flex-wrap:wrap;overflow:visible}#imgprint-app .workspace{grid-template-columns:1fr;height:auto;overflow:visible}#imgprint-app .side{height:auto;max-height:none}#imgprint-app .stage-wrap{height:70vh;max-height:70vh}}
    @media print{body *{visibility:hidden!important}#imgprint-app,#imgprint-app .pages,#imgprint-app .paper,#imgprint-app .paper *{visibility:visible!important}#imgprint-app{position:absolute!important;left:0!important;top:0!important;padding:0!important;background:#fff!important;height:auto!important;overflow:visible!important}#imgprint-app .workspace,#imgprint-app .stage-wrap,#imgprint-app .pages{display:block!important;padding:0!important;margin:0!important;background:#fff!important;overflow:visible!important}#imgprint-app .paper-wrap{page-break-after:always!important;margin:0!important;width:auto!important;height:auto!important}#imgprint-app .paper{box-shadow:none!important;margin:0!important;transform:none!important}#imgprint-app .topbar,#imgprint-app .side,#imgprint-app .handle,#imgprint-app .placeholder,#imgprint-app .page-label{display:none!important}#imgprint-app .item{border:0!important;outline:0!important}@page{size:A4;margin:0}}
  </style>

  <div class="topbar">
    <label class="file-label">＋ 画像を追加<input id="fileInput" type="file" accept="image/*" multiple></label>
    <button type="button" id="addText">＋ 文字</button>
    <button type="button" id="addPage">＋ ページ</button>
    <button type="button" id="undoBtn">↶ 元に戻す</button>
    <button type="button" id="redoBtn">↷ やり直す</button>
    <button type="button" id="saveLayout">保存</button>
    <button type="button" id="loadLayout">読込</button>
    <button type="button" class="primary" id="printBtn">印刷する</button>
    <span class="status" id="status">画像を追加してください</span>
    <div class="print-help" id="printHelp" role="status" aria-live="polite"><strong>印刷画面を開けませんでした</strong><br>Macは <strong>⌘ + P</strong>、Windowsは <strong>Ctrl + P</strong> を押してください。</div>
  </div>

  <div class="workspace">
    <div class="stage-wrap"><div class="pages" id="pages"></div></div>
    <aside class="side">
      <h2>レイアウト設定</h2>
      <div class="group">
        <div class="row"><div><label class="field" for="orientation">用紙</label><select id="orientation"><option value="portrait">A4 縦</option><option value="landscape">A4 横</option></select></div><div><label class="field" for="pageSelect">ページ</label><select id="pageSelect"></select></div></div>
        <div class="actions"><button type="button" id="duplicatePage">ページ複製</button><button type="button" id="deletePage" class="danger">ページ削除</button></div>
      </div>
      <div class="group"><strong>選択中の要素</strong><div class="row"><div><label class="field" for="widthMm">横幅 mm</label><input id="widthMm" type="number" min="5" max="500" step="1"></div><div><label class="field" for="heightMm">高さ mm</label><input id="heightMm" type="number" min="5" max="500" step="1"></div></div><label class="check"><input id="lockRatio" type="checkbox" checked> 縦横比を固定</label><label class="field" for="presetSize">定型サイズ</label><select id="presetSize"><option value="">選択してください</option><option value="full">A4いっぱい</option><option value="half">A4 1/2</option><option value="quarter">A4 1/4</option><option value="postcard">はがき 100×148mm</option><option value="l">L判 89×127mm</option><option value="card">名刺 55×91mm</option></select><label class="field" for="rotation">回転</label><input id="rotation" type="range" min="-180" max="180" step="1" value="0"><div class="hint" id="rotationLabel">0°</div><div class="actions"><button type="button" id="rotLeft">↺ 90°</button><button type="button" id="rotRight">↻ 90°</button></div><label class="field" for="copies">複製数</label><input id="copies" type="number" min="1" max="30" value="1"><div class="actions"><button type="button" id="duplicate">指定数で複製</button><button type="button" class="danger" id="deleteSelected">削除</button></div></div>
      <div class="group"><strong>整列</strong><div class="actions3"><button type="button" data-align="left">左</button><button type="button" data-align="center">中央</button><button type="button" data-align="right">右</button></div><div class="actions3"><button type="button" data-align="top">上</button><button type="button" data-align="middle">上下中央</button><button type="button" data-align="bottom">下</button></div><div class="actions"><button type="button" id="fitAll">全体を自動整列</button><button type="button" id="spaceEvenly">等間隔に並べる</button></div></div>
      <div class="group"><strong>画像</strong><label class="field" for="fitMode">表示方法</label><select id="fitMode"><option value="contain">全体を表示</option><option value="cover">トリミング</option></select><div class="row"><div><label class="field" for="cropX">左右位置</label><input id="cropX" type="range" min="0" max="100" value="50"></div><div><label class="field" for="cropY">上下位置</label><input id="cropY" type="range" min="0" max="100" value="50"></div></div><button type="button" id="resetCrop">トリミングをリセット</button></div>
      <div class="group"><strong>枠・背景</strong><div class="row"><div><label class="field" for="borderWidth">枠線 px</label><input id="borderWidth" type="number" min="0" max="20" value="0"></div><div><label class="field" for="radius">角丸 px</label><input id="radius" type="number" min="0" max="80" value="0"></div></div><div class="row"><div><label class="field" for="borderColor">枠色</label><input id="borderColor" class="swatch" type="color" value="#111111"></div><div><label class="field" for="bgColor">背景</label><input id="bgColor" class="swatch" type="color" value="#ffffff"></div></div></div>
      <div class="group"><strong>文字</strong><label class="field" for="textContent">内容</label><textarea id="textContent" placeholder="文字要素を選択すると編集できます"></textarea><div class="row"><div><label class="field" for="fontSize">文字サイズ</label><input id="fontSize" type="number" min="8" max="200" value="32"></div><div><label class="field" for="textColor">文字色</label><input id="textColor" class="swatch" type="color" value="#111111"></div></div><label class="check"><input id="boldText" type="checkbox"> 太字</label></div>
      <div class="group"><div class="actions"><button type="button" id="bringFront">前面へ</button><button type="button" id="sendBack">背面へ</button></div><button type="button" id="clearAll" class="danger" style="width:100%;margin-top:8px">全ページを空にする</button><p class="hint">ドラッグで移動、右下の青い丸で拡大縮小。レイアウトはブラウザ内に保存できます。</p></div>
    </aside>
  </div>

  <script>
  (()=>{
    const root=document.getElementById('imgprint-app'); if(root.dataset.ready)return; root.dataset.ready='1';
    const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)],MM=3.7795275591;
    const pagesEl=q('#pages'),status=q('#status');
    let selected=null,currentPage=0,zCounter=2,history=[],future=[],restoring=false;
    const orientation=q('#orientation'),pageSelect=q('#pageSelect'),widthMm=q('#widthMm'),heightMm=q('#heightMm'),lockRatio=q('#lockRatio'),rotation=q('#rotation'),rotationLabel=q('#rotationLabel');
    function pages(){return qa('.paper')}
    function items(page=pages()[currentPage]){return page?[...page.querySelectorAll('.item')]:[]}
    function serializeItem(el){const isText=el.classList.contains('text-item'),img=el.querySelector('img');return{type:isText?'text':'image',left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height,z:el.style.zIndex,rot:el.dataset.rot||'0',text:isText?(el.childNodes[0]?.nodeValue||''):'',fontSize:el.dataset.fontSize||'32',bold:el.dataset.bold||'0',textColor:el.dataset.textColor||'#111111',src:img?img.src:'',fit:img?img.style.objectFit||'contain':'',pos:img?img.style.objectPosition||'50% 50%':'',borderWidth:el.dataset.borderWidth||'0',borderColor:el.dataset.borderColor||'#111111',radius:el.dataset.radius||'0',bg:el.dataset.bg||'#ffffff'}}
    function snapshot(){return JSON.stringify({orientation:orientation.value,currentPage,pages:pages().map(p=>[...p.querySelectorAll('.item')].map(serializeItem))})}
    function pushHistory(){if(restoring)return;const s=snapshot();if(history[history.length-1]!==s){history.push(s);if(history.length>50)history.shift();future=[]}updateUndo()}
    function updateUndo(){q('#undoBtn').disabled=history.length<2;q('#redoBtn').disabled=!future.length}
    function applyBoxStyle(el){el.style.border=(el.dataset.borderWidth||0)+'px solid '+(el.dataset.borderColor||'#111111');el.style.borderRadius=(el.dataset.radius||0)+'px';el.style.background=el.dataset.bg||'#ffffff';el.style.overflow='hidden'}
    function bindPaper(p){p.addEventListener('pointerdown',e=>{if(e.target===p||e.target.classList.contains('placeholder')){currentPage=pages().indexOf(p);syncPageSelect();select(null)}})}
    function createPage(record=true){const wrap=document.createElement('div');wrap.className='paper-wrap';const label=document.createElement('div');label.className='page-label';const p=document.createElement('div');p.className='paper '+(orientation.value==='landscape'?'a4l':'a4p');const ph=document.createElement('div');ph.className='placeholder';ph.textContent='ここに画像や文字を配置';p.append(ph);wrap.append(label,p);pagesEl.append(wrap);bindPaper(p);syncPageLabels();if(record)pushHistory();return p}
    function syncPageLabels(){qa('.page-label').forEach((el,i)=>el.textContent='ページ '+(i+1))}
    function fitCurrentPage(){const p=pages()[currentPage],wrap=q('.stage-wrap');if(!p||!wrap)return;pages().forEach((pg,i)=>{const w=pg.closest('.paper-wrap');w.style.display=i===currentPage?'block':'none';pg.style.transform='none'});const pw=p.closest('.paper-wrap'),label=pw.querySelector('.page-label'),labelH=label?label.offsetHeight+6:0,availW=Math.max(80,wrap.clientWidth-12),availH=Math.max(80,wrap.clientHeight-labelH-12),scale=Math.min(1,availW/p.offsetWidth,availH/p.offsetHeight);p.style.transform='scale('+scale+')';p.style.transformOrigin='top left';pw.style.width=(p.offsetWidth*scale)+'px';pw.style.height=(p.offsetHeight*scale+labelH)+'px';pw.style.overflow='hidden'}
    function syncPageSelect(){pageSelect.innerHTML='';pages().forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent='ページ '+(i+1);pageSelect.append(o)});pageSelect.value=currentPage;syncPageLabels();requestAnimationFrame(fitCurrentPage)}
    function updateStatus(){const count=pages().reduce((n,p)=>n+p.querySelectorAll('.item').length,0);status.textContent=pages().length+'ページ / '+count+'要素';pages().forEach(p=>{const ph=p.querySelector('.placeholder');ph.style.display=p.querySelector('.item')?'none':'grid'});requestAnimationFrame(fitCurrentPage)}
    function clearControls(){widthMm.value='';heightMm.value='';q('#textContent').value=''}
    function select(el){qa('.item').forEach(x=>x.classList.remove('selected'));selected=el;if(el){el.classList.add('selected');currentPage=pages().indexOf(el.closest('.paper'));syncPageSelect();syncControls()}else clearControls()}
    function syncControls(){if(!selected)return;widthMm.value=Math.round(selected.offsetWidth/MM);heightMm.value=Math.round(selected.offsetHeight/MM);rotation.value=selected.dataset.rot||0;rotationLabel.textContent=(selected.dataset.rot||0)+'°';q('#borderWidth').value=selected.dataset.borderWidth||0;q('#borderColor').value=selected.dataset.borderColor||'#111111';q('#radius').value=selected.dataset.radius||0;q('#bgColor').value=selected.dataset.bg||'#ffffff';const img=selected.querySelector('img');if(img){q('#fitMode').value=img.style.objectFit||'contain';const pos=(img.style.objectPosition||'50% 50%').split(' ');q('#cropX').value=parseInt(pos[0])||50;q('#cropY').value=parseInt(pos[1])||50;q('#textContent').value=''}else{q('#textContent').value=selected.childNodes[0]?.nodeValue||'';q('#fontSize').value=selected.dataset.fontSize||32;q('#textColor').value=selected.dataset.textColor||'#111111';q('#boldText').checked=selected.dataset.bold==='1'}}
    function setRot(v){if(!selected)return;let n=Math.max(-180,Math.min(180,Number(v)||0));selected.dataset.rot=n;selected.style.transform='rotate('+n+'deg)';rotation.value=n;rotationLabel.textContent=n+'°'}
    function bindItem(el){const h=el.querySelector('.handle');el.addEventListener('pointerdown',e=>{if(e.target===h)return;select(el);const p=el.closest('.paper'),sx=e.clientX,sy=e.clientY,sl=parseFloat(el.style.left)||0,st=parseFloat(el.style.top)||0;el.setPointerCapture(e.pointerId);const move=ev=>{el.style.left=Math.max(0,Math.min(p.clientWidth-el.offsetWidth,sl+ev.clientX-sx))+'px';el.style.top=Math.max(0,Math.min(p.clientHeight-el.offsetHeight,st+ev.clientY-sy))+'px'};const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);pushHistory()};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up)});h.addEventListener('pointerdown',e=>{e.stopPropagation();select(el);const sx=e.clientX,sy=e.clientY,sw=el.offsetWidth,sh=el.offsetHeight,ratio=sw/sh;h.setPointerCapture(e.pointerId);const move=ev=>{let nw=Math.max(30,sw+ev.clientX-sx),nh=Math.max(30,sh+ev.clientY-sy);if(lockRatio.checked)nh=nw/ratio;el.style.width=nw+'px';el.style.height=nh+'px';syncControls()};const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);pushHistory()};h.addEventListener('pointermove',move);h.addEventListener('pointerup',up)})}
    function createFromData(obj,p){const el=document.createElement('div');el.className='item '+(obj.type==='text'?'text-item':'');el.style.left=obj.left;el.style.top=obj.top;el.style.width=obj.width;el.style.height=obj.height;el.style.zIndex=obj.z;el.dataset.rot=obj.rot;el.style.transform='rotate('+obj.rot+'deg)';el.dataset.borderWidth=obj.borderWidth;el.dataset.borderColor=obj.borderColor;el.dataset.radius=obj.radius;el.dataset.bg=obj.bg;applyBoxStyle(el);if(obj.type==='text'){el.textContent=obj.text;el.dataset.fontSize=obj.fontSize;el.dataset.bold=obj.bold;el.dataset.textColor=obj.textColor;el.style.fontSize=obj.fontSize+'px';el.style.fontWeight=obj.bold==='1'?'700':'400';el.style.color=obj.textColor}else{const img=document.createElement('img');img.src=obj.src;img.alt='配置画像';img.style.objectFit=obj.fit||'contain';img.style.objectPosition=obj.pos||'50% 50%';el.append(img)}const h=document.createElement('span');h.className='handle';el.append(h);p.append(el);bindItem(el);return el}
    function restore(state){restoring=true;const d=JSON.parse(state);orientation.value=d.orientation;pagesEl.innerHTML='';d.pages.forEach(arr=>{const p=createPage(false);arr.forEach(obj=>createFromData(obj,p))});currentPage=Math.min(d.currentPage,pages().length-1);syncPageSelect();select(null);restoring=false;updateStatus()}
    function addImage(src,index=0){const p=pages()[currentPage],el=document.createElement('div');el.className='item';el.style.width='300px';el.style.height='220px';el.style.left=(35+index*18)+'px';el.style.top=(35+index*18)+'px';el.style.zIndex=zCounter++;el.dataset.rot='0';el.dataset.borderWidth='0';el.dataset.borderColor='#111111';el.dataset.radius='0';el.dataset.bg='#ffffff';const img=document.createElement('img');img.src=src;img.alt='配置画像';img.style.objectFit='contain';img.style.objectPosition='50% 50%';img.onload=()=>{const r=img.naturalWidth/img.naturalHeight;if(r>1)el.style.height=300/r+'px';else{el.style.height='300px';el.style.width=300*r+'px'}syncControls();pushHistory()};el.append(img);const h=document.createElement('span');h.className='handle';el.append(h);p.append(el);bindItem(el);select(el);updateStatus()}
    function addText(){const p=pages()[currentPage],el=document.createElement('div');el.className='item text-item';el.textContent='テキスト';el.style.left='60px';el.style.top='60px';el.style.width='300px';el.style.height='90px';el.style.zIndex=zCounter++;el.dataset.rot='0';el.dataset.fontSize='32';el.dataset.bold='0';el.dataset.textColor='#111111';el.dataset.borderWidth='0';el.dataset.borderColor='#111111';el.dataset.radius='0';el.dataset.bg='#ffffff';applyBoxStyle(el);el.style.fontSize='32px';const h=document.createElement('span');h.className='handle';el.append(h);p.append(el);bindItem(el);select(el);updateStatus();pushHistory()}
    function cloneItem(el,dx=18,dy=18){const data=serializeItem(el),p=pages()[currentPage];data.left=(parseFloat(data.left)+dx)+'px';data.top=(parseFloat(data.top)+dy)+'px';data.z=String(zCounter++);const c=createFromData(data,p);select(c);return c}
    q('#fileInput').addEventListener('change',()=>{[...q('#fileInput').files].forEach((f,i)=>{if(!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=e=>addImage(e.target.result,i);r.readAsDataURL(f)});q('#fileInput').value=''})
    q('#addText').onclick=addText;q('#addPage').onclick=()=>{createPage();currentPage=pages().length-1;syncPageSelect();updateStatus()};
    pageSelect.onchange=()=>{currentPage=Number(pageSelect.value);select(null)};
    orientation.onchange=()=>{pages().forEach(p=>{p.classList.toggle('a4p',orientation.value==='portrait');p.classList.toggle('a4l',orientation.value==='landscape')});requestAnimationFrame(fitCurrentPage);pushHistory()};
    q('#duplicatePage').onclick=()=>{const src=pages()[currentPage],data=[...src.querySelectorAll('.item')].map(serializeItem),p=createPage(false);data.forEach(d=>createFromData(d,p));currentPage=pages().length-1;syncPageSelect();updateStatus();pushHistory()};
    q('#deletePage').onclick=()=>{if(pages().length===1){items().forEach(x=>x.remove());updateStatus();pushHistory();return}pages()[currentPage].closest('.paper-wrap').remove();currentPage=Math.max(0,currentPage-1);syncPageSelect();select(null);updateStatus();pushHistory()};
    widthMm.onchange=()=>{if(!selected)return;const oldW=selected.offsetWidth,oldH=selected.offsetHeight,newW=Math.max(5,Number(widthMm.value)||5)*MM;selected.style.width=newW+'px';if(lockRatio.checked)selected.style.height=(newW*(oldH/oldW))+'px';syncControls();pushHistory()};
    heightMm.onchange=()=>{if(!selected)return;const oldW=selected.offsetWidth,oldH=selected.offsetHeight,newH=Math.max(5,Number(heightMm.value)||5)*MM;selected.style.height=newH+'px';if(lockRatio.checked)selected.style.width=(newH*(oldW/oldH))+'px';syncControls();pushHistory()};
    rotation.oninput=()=>setRot(rotation.value);rotation.onchange=pushHistory;q('#rotLeft').onclick=()=>{setRot((Number(selected?.dataset.rot)||0)-90);pushHistory()};q('#rotRight').onclick=()=>{setRot((Number(selected?.dataset.rot)||0)+90);pushHistory()};
    q('#presetSize').onchange=e=>{if(!selected||!e.target.value)return;const p=selected.closest('.paper'),pw=p.clientWidth/MM,ph=p.clientHeight/MM,map={full:[pw,ph],half:[pw,ph/2],quarter:[pw/2,ph/2],postcard:[100,148],l:[89,127],card:[55,91]},s=map[e.target.value];selected.style.width=s[0]*MM+'px';selected.style.height=s[1]*MM+'px';syncControls();pushHistory();e.target.value=''};
    q('#duplicate').onclick=()=>{if(!selected)return;const n=Math.max(1,Math.min(30,Number(q('#copies').value)||1)),base=selected;for(let i=1;i<n;i++)cloneItem(base,i*12,i*12);updateStatus();pushHistory()};
    q('#deleteSelected').onclick=()=>{if(selected){selected.remove();selected=null;updateStatus();pushHistory()}};
    q('#bringFront').onclick=()=>{if(selected){selected.style.zIndex=zCounter++;pushHistory()}};q('#sendBack').onclick=()=>{if(selected){selected.style.zIndex='1';pushHistory()}};
    qa('[data-align]').forEach(btn=>btn.onclick=()=>{if(!selected)return;const p=selected.closest('.paper'),a=btn.dataset.align,w=selected.offsetWidth,h=selected.offsetHeight;if(a==='left')selected.style.left='0px';if(a==='center')selected.style.left=(p.clientWidth-w)/2+'px';if(a==='right')selected.style.left=p.clientWidth-w+'px';if(a==='top')selected.style.top='0px';if(a==='middle')selected.style.top=(p.clientHeight-h)/2+'px';if(a==='bottom')selected.style.top=p.clientHeight-h+'px';pushHistory()});
    q('#fitAll').onclick=()=>{const arr=items();if(!arr.length)return;const p=pages()[currentPage],cols=Math.ceil(Math.sqrt(arr.length)),rows=Math.ceil(arr.length/cols),gap=20,cw=(p.clientWidth-gap*(cols+1))/cols,ch=(p.clientHeight-gap*(rows+1))/rows;arr.forEach((el,i)=>{const img=el.querySelector('img');let r=img?((img.naturalWidth||1)/(img.naturalHeight||1)):3;let w=cw,h=w/r;if(h>ch){h=ch;w=h*r}el.style.width=Math.max(40,w)+'px';el.style.height=Math.max(40,h)+'px';el.style.left=(gap+(i%cols)*(cw+gap)+(cw-w)/2)+'px';el.style.top=(gap+Math.floor(i/cols)*(ch+gap)+(ch-h)/2)+'px'});select(arr[0]);pushHistory()};
    q('#spaceEvenly').onclick=()=>{const arr=items().sort((a,b)=>(parseFloat(a.style.left)||0)-(parseFloat(b.style.left)||0));if(arr.length<2)return;const p=pages()[currentPage],total=arr.reduce((s,e)=>s+e.offsetWidth,0),gap=Math.max(0,(p.clientWidth-total)/(arr.length+1));let x=gap;arr.forEach(el=>{el.style.left=x+'px';x+=el.offsetWidth+gap});pushHistory()};
    q('#fitMode').onchange=()=>{const img=selected?.querySelector('img');if(img){img.style.objectFit=q('#fitMode').value;pushHistory()}};function crop(){const img=selected?.querySelector('img');if(img)img.style.objectPosition=q('#cropX').value+'% '+q('#cropY').value+'%'}q('#cropX').oninput=crop;q('#cropY').oninput=crop;q('#cropX').onchange=pushHistory;q('#cropY').onchange=pushHistory;q('#resetCrop').onclick=()=>{const img=selected?.querySelector('img');if(img){img.style.objectFit='contain';img.style.objectPosition='50% 50%';syncControls();pushHistory()}};
    ['borderWidth','borderColor','radius','bgColor'].forEach(id=>q('#'+id).onchange=()=>{if(!selected)return;if(id==='borderWidth')selected.dataset.borderWidth=q('#'+id).value;if(id==='borderColor')selected.dataset.borderColor=q('#'+id).value;if(id==='radius')selected.dataset.radius=q('#'+id).value;if(id==='bgColor')selected.dataset.bg=q('#'+id).value;applyBoxStyle(selected);pushHistory()});
    q('#textContent').oninput=()=>{if(selected?.classList.contains('text-item'))selected.childNodes[0].nodeValue=q('#textContent').value};q('#textContent').onchange=pushHistory;q('#fontSize').onchange=()=>{if(selected?.classList.contains('text-item')){selected.dataset.fontSize=q('#fontSize').value;selected.style.fontSize=q('#fontSize').value+'px';pushHistory()}};q('#textColor').onchange=()=>{if(selected?.classList.contains('text-item')){selected.dataset.textColor=q('#textColor').value;selected.style.color=q('#textColor').value;pushHistory()}};q('#boldText').onchange=()=>{if(selected?.classList.contains('text-item')){selected.dataset.bold=q('#boldText').checked?'1':'0';selected.style.fontWeight=q('#boldText').checked?'700':'400';pushHistory()}};
    q('#clearAll').onclick=()=>{pages().forEach(p=>p.querySelectorAll('.item').forEach(x=>x.remove()));select(null);updateStatus();pushHistory()};
    q('#undoBtn').onclick=()=>{if(history.length<2)return;future.push(history.pop());restore(history[history.length-1]);updateUndo()};q('#redoBtn').onclick=()=>{if(!future.length)return;const s=future.pop();history.push(s);restore(s);updateUndo()};
    q('#saveLayout').onclick=()=>{try{localStorage.setItem('imagePrintLayoutV2',snapshot());status.textContent='レイアウトを保存しました'}catch(e){status.textContent='保存できませんでした'}};q('#loadLayout').onclick=()=>{const s=localStorage.getItem('imagePrintLayoutV2');if(s){restore(s);pushHistory();status.textContent='レイアウトを読み込みました'}else status.textContent='保存データがありません'};
    q('#printBtn').onclick=()=>{if(!pages().some(p=>p.querySelector('.item'))){status.textContent='先に画像や文字を追加してください';return}select(null);q('#printHelp').classList.remove('show');try{window.print()}catch(e){q('#printHelp').classList.add('show')}};
    window.addEventListener('resize',()=>requestAnimationFrame(fitCurrentPage));
    createPage(false);syncPageSelect();updateStatus();pushHistory();updateUndo();
  })();
  </script>
</div>
</body>
