<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef7ff"><title>App Shelf</title><style>
:root{--text:#33415c;--muted:#73829b;--glass:rgba(255,255,255,.24);--glass2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.72);--edge2:rgba(255,255,255,.34);--shadow:0 22px 70px rgba(93,111,148,.16)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}body{background:#eef7ff}.shell{min-height:100vh;position:relative;overflow-x:hidden;background:radial-gradient(circle at 7% 10%,rgba(255,193,222,.9),transparent 27%),radial-gradient(circle at 92% 12%,rgba(169,224,255,.92),transparent 29%),radial-gradient(circle at 80% 86%,rgba(201,183,255,.76),transparent 31%),radial-gradient(circle at 17% 88%,rgba(174,241,211,.78),transparent 27%),linear-gradient(135deg,#fbfdff,#edf6ff 50%,#faf3ff)}.shell:before,.shell:after{content:"";position:fixed;border-radius:50%;filter:blur(4px);pointer-events:none}.shell:before{width:280px;height:280px;left:22%;top:27%;background:rgba(255,255,255,.34)}.shell:after{width:230px;height:230px;right:18%;bottom:13%;background:rgba(255,255,255,.28)}
.header{position:sticky;top:0;z-index:20;padding:22px 28px 16px;background:linear-gradient(to bottom,rgba(245,250,255,.58),rgba(245,250,255,.20),transparent);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%)}.top{max-width:1440px;margin:auto;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:13px;min-width:max-content}.logo{width:45px;height:45px;border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.9);display:grid;place-items:center;color:#6679a5;font-weight:950;box-shadow:0 12px 35px rgba(91,111,150,.14),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.28);backdrop-filter:blur(18px) saturate(160%)}.brand h1{font-size:20px;margin:0}.brand p{font-size:10px;color:#8a98af;margin:3px 0 0;letter-spacing:.15em;text-transform:uppercase}.searchWrap,.addBtn,.sort,.reorderHint,.chip{backdrop-filter:blur(22px) saturate(165%);-webkit-backdrop-filter:blur(22px) saturate(165%)}.searchWrap{flex:1;display:flex;align-items:center;gap:10px;height:49px;padding:0 16px;border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.13));border:1px solid rgba(255,255,255,.76);box-shadow:0 10px 34px rgba(93,112,150,.09),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.18)}.searchWrap:focus-within{background:linear-gradient(145deg,rgba(255,255,255,.50),rgba(255,255,255,.20));box-shadow:0 0 0 4px rgba(159,185,234,.12),0 12px 36px rgba(93,112,150,.11)}.searchWrap input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}.searchWrap input::placeholder{color:#96a3b7}.addBtn{height:49px;border:1px solid rgba(255,255,255,.82);border-radius:18px;padding:0 18px;background:linear-gradient(145deg,rgba(255,255,255,.46),rgba(255,255,255,.18));color:#52617f;font-weight:800;box-shadow:0 10px 30px rgba(93,112,150,.10),inset 0 1px white}
.main{max-width:1440px;margin:0 auto;padding:10px 28px 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;padding:26px 2px 20px}.hero h2{font-size:clamp(28px,3vw,43px);line-height:1.12;margin:0 0 8px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:14px}.count{color:#8290a8;font-size:13px}.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 22px}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid rgba(255,255,255,.72);background:linear-gradient(145deg,rgba(255,255,255,.30),rgba(255,255,255,.11));color:#74829a;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:750;box-shadow:0 7px 22px rgba(95,115,150,.07),inset 0 1px white}.chip.active{background:linear-gradient(145deg,rgba(255,255,255,.70),rgba(255,255,255,.34));color:#52617f;box-shadow:0 9px 28px rgba(95,115,150,.11),inset 0 1px white}.rightControls{display:flex;align-items:center;gap:9px}.sort,.reorderHint{border:1px solid rgba(255,255,255,.76);background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.12));color:#68768f;border-radius:14px;padding:9px 12px;outline:0;box-shadow:inset 0 1px white}.reorderHint{display:none;font-size:11px}.reorderHint.show{display:block}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{position:relative;min-height:228px;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.72);background:linear-gradient(145deg,var(--card1),var(--card2));box-shadow:0 20px 60px rgba(83,104,145,.14),inset 0 1px 0 rgba(255,255,255,.94),inset 1px 0 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.16);transition:.22s;isolation:isolate;backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%)}.card:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(125deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.22) 16%,rgba(255,255,255,.06) 42%,rgba(255,255,255,.20) 72%,rgba(255,255,255,.36) 100%)}.card:after{content:"";position:absolute;z-index:-1;width:180px;height:180px;border-radius:50%;right:-46px;top:-58px;background:radial-gradient(circle,var(--glow),transparent 68%);filter:blur(3px);opacity:.75}.card:hover{transform:translateY(-7px) scale(1.01);border-color:rgba(255,255,255,.94);box-shadow:0 28px 78px rgba(76,98,140,.19),inset 0 1px white}.card[draggable="true"]{cursor:grab}.card.dragging{opacity:.40;transform:scale(.97);cursor:grabbing}.card.drag-over{outline:3px solid rgba(123,151,211,.30);outline-offset:5px}.cardBody{height:100%;padding:21px;display:flex;flex-direction:column}.cardTop{display:flex;align-items:flex-start}.icon{width:56px;height:56px;border-radius:19px;background:linear-gradient(145deg,rgba(255,255,255,.48),rgba(255,255,255,.16));border:1px solid rgba(255,255,255,.82);display:grid;place-items:center;font-size:25px;box-shadow:0 10px 26px rgba(91,110,145,.10),inset 0 1px white,inset 0 -1px rgba(255,255,255,.16);backdrop-filter:blur(18px)}.more{width:35px;height:35px;border:1px solid rgba(255,255,255,.64);border-radius:12px;background:linear-gradient(145deg,rgba(255,255,255,.30),rgba(255,255,255,.10));color:#6d7a91;font-size:20px;display:grid;place-items:center;margin-left:auto;backdrop-filter:blur(16px)}.more:hover{background:rgba(255,255,255,.44)}.dragHandle{display:none;align-items:center;gap:5px;color:#7d8ca5;font-size:11px;font-weight:800;background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.10));border:1px solid rgba(255,255,255,.70);border-radius:10px;padding:5px 8px;margin-left:auto;margin-right:7px;backdrop-filter:blur(16px)}.manual .dragHandle{display:flex}.title{margin-top:auto}.tag{display:inline-flex;border:1px solid rgba(255,255,255,.70);background:linear-gradient(145deg,rgba(255,255,255,.30),rgba(255,255,255,.10));color:#6e7c93;padding:5px 9px;border-radius:10px;font-size:10px;font-weight:800;box-shadow:inset 0 1px rgba(255,255,255,.8);backdrop-filter:blur(15px)}.title h3{font-size:21px;margin:11px 0 5px;color:#40506b}.title p{font-size:12px;color:#718097;margin:0;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.openRow{display:flex;align-items:center;justify-content:space-between;margin-top:15px}.open{border:1px solid rgba(255,255,255,.82);background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.22));color:#53627b;border-radius:13px;padding:9px 13px;font-weight:850;font-size:12px;box-shadow:0 7px 20px rgba(90,110,145,.08),inset 0 1px white;backdrop-filter:blur(18px)}.fav{border:0;background:transparent;color:#8c99ad;font-size:19px;opacity:.65;padding:6px}.fav.on{opacity:1;color:#daa84e}.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(101,117,149,.17);backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(560px,100%);background:linear-gradient(145deg,rgba(255,255,255,.52),rgba(255,255,255,.20));border:1px solid rgba(255,255,255,.84);border-radius:30px;padding:24px;box-shadow:0 34px 100px rgba(80,99,135,.24),inset 0 1px white;backdrop-filter:blur(34px) saturate(170%)}.dialogHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.dialog h3{font-size:22px;margin:0}.close{width:38px;height:38px;border:1px solid rgba(255,255,255,.82);border-radius:13px;background:rgba(255,255,255,.28);color:#68758b;font-size:20px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;color:#7a879c;font-size:11px;font-weight:800;margin:0 0 7px 2px}.field input{width:100%;height:46px;border:1px solid rgba(255,255,255,.84);border-radius:14px;background:rgba(255,255,255,.30);color:#43516a;padding:0 13px;outline:0;backdrop-filter:blur(18px)}.palette{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:36px;height:36px;border-radius:11px;border:2px solid transparent}.swatch.sel{border-color:white;box-shadow:0 0 0 3px rgba(113,133,170,.18)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.actionsRight{display:flex;gap:10px;margin-left:auto}.btn{height:43px;border:1px solid rgba(255,255,255,.8);border-radius:13px;padding:0 15px;font-weight:800;backdrop-filter:blur(18px)}.btn.secondary{background:rgba(255,255,255,.20);color:#718099}.btn.primary{background:rgba(255,255,255,.58);color:#53617a}.btn.danger{background:rgba(255,210,218,.30);color:#c26f7b}.menu{position:fixed;z-index:50;min-width:130px;background:linear-gradient(145deg,rgba(255,255,255,.60),rgba(255,255,255,.24));border:1px solid rgba(255,255,255,.84);border-radius:15px;padding:6px;box-shadow:0 20px 60px rgba(77,96,130,.20);backdrop-filter:blur(28px) saturate(170%);display:none}.menu.show{display:block}.menu button{width:100%;text-align:left;border:0;background:transparent;color:#66758e;padding:9px 10px;border-radius:8px;font-size:12px}.menu button:hover{background:rgba(255,255,255,.38)}.menu .red{color:#cf7885}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.header{padding:16px}.top{flex-wrap:wrap}.brand{width:100%}.searchWrap{order:3;width:100%;flex-basis:100%}.addBtn{margin-left:auto}.main{padding:4px 16px 50px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.controls{align-items:flex-start;flex-direction:column}.rightControls{width:100%}.sort{flex:1}}@media(max-width:520px){.grid{grid-template-columns:1fr}.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{display:block}.count{margin-top:8px}}
</style></head><body><div class="shell"><header class="header"><div class="top"><div class="brand"><div class="logo">A</div><div><h1>App Shelf</h1><p>my web app library</p></div></div><div class="searchWrap"><span>⌕</span><input id="search" placeholder="アプリ名・説明・ジャンルで検索"></div><button class="addBtn" id="addBtn">＋ アプリを追加</button></div></header><main class="main"><section class="hero"><div><h2>作ったものを、<br>ひとつの場所に。</h2><p>よく使うWebアプリへ、最短でアクセス。</p></div><div class="count" id="count"></div></section><div class="controls"><div class="chips" id="chips"></div><div class="rightControls"><div class="reorderHint" id="reorderHint">↕ カードをドラッグして並び替え</div><select class="sort" id="sort"><option value="manual">自由に並べる</option><option value="new">新しい順</option><option value="name">名前順</option><option value="fav">お気に入り優先</option></select></div></div><section class="grid" id="grid"></section></main></div><div class="menu" id="menu"><button data-act="edit">編集</button><button data-act="copy">URLをコピー</button><button class="red" data-act="delete">削除</button></div><div class="modal" id="modal"><div class="dialog"><div class="dialogHead"><h3 id="modalTitle">アプリを追加</h3><button class="close" id="close">×</button></div><div class="formGrid"><div class="field full"><label>アプリ名</label><input id="fName"></div><div class="field full"><label>URL</label><input id="fUrl" placeholder="https://..."></div><div class="field"><label>ジャンル</label><input id="fGenre" list="genreList"><datalist id="genreList"></datalist></div><div class="field"><label>アイコン</label><input id="fIcon" maxlength="4" placeholder="🧩"></div><div class="field full"><label>ひとこと説明</label><input id="fDesc"></div><div class="field full"><label>カードカラー</label><div class="palette" id="palette"></div></div></div><div class="actions"><button class="btn danger" id="deleteInModal" style="display:none">削除</button><div class="actionsRight"><button class="btn secondary" id="cancel">キャンセル</button><button class="btn primary" id="save">保存</button></div></div></div></div><script>
const KEY='appShelf_v1',SORTKEY='appShelf_sort_v1';const palettes=[['rgba(167,210,255,.30)','rgba(220,238,255,.15)','rgba(123,184,255,.52)'],['rgba(161,236,209,.28)','rgba(221,248,239,.14)','rgba(93,214,171,.48)'],['rgba(212,181,255,.30)','rgba(240,225,255,.14)','rgba(176,117,255,.48)'],['rgba(255,191,164,.30)','rgba(255,230,218,.14)','rgba(255,143,98,.48)'],['rgba(205,218,242,.30)','rgba(238,244,252,.14)','rgba(158,179,221,.44)'],['rgba(255,181,206,.30)','rgba(255,227,238,.14)','rgba(255,122,169,.46)'],['rgba(155,220,246,.30)','rgba(222,244,252,.14)','rgba(83,191,235,.46)'],['rgba(255,226,145,.30)','rgba(255,245,210,.14)','rgba(231,191,70,.44)']];const seeds=[{id:1,name:'画像印刷アプリ',url:'https://app-lab7.github.io/web-apps/image-print/',genre:'ツール',icon:'🖼️',desc:'画像の配置・編集・印刷をまとめて行うツール',pal:0,fav:true,created:8},{id:2,name:'Melody Compose',url:'https://app-lab7.github.io/web-apps/melody-compose/',genre:'音楽',icon:'🎙️',desc:'歌ったメロディを録音して作曲をサポート',pal:2,fav:true,created:7},{id:3,name:'Sync Notes',url:'https://app-lab7.github.io/web-apps/syncnotes/',genre:'仕事・管理',icon:'📝',desc:'シンプルに使えるノート・同期ツール',pal:1,fav:false,created:6},{id:4,name:'Todo Sync',url:'https://app-lab7.github.io/web-apps/todo-sync/',genre:'仕事・管理',icon:'✓',desc:'やることを素早く整理するTodoツール',pal:6,fav:false,created:5},{id:5,name:'PrintStock',url:'https://printstock-app.github.io/',genre:'教育',icon:'📚',desc:'教材PDFを整理・検索して印刷する教材ライブラリ',pal:0,fav:true,created:4},{id:6,name:'進学コンパス',url:'https://study-navi.github.io/university-navi/',genre:'教育',icon:'🧭',desc:'進学先を探すための情報ナビゲーション',pal:1,fav:false,created:3},{id:7,name:'Study Room',url:'https://study-navi.github.io/study-room/',genre:'教育',icon:'⏱️',desc:'自習室の入退室・学習記録を管理',pal:7,fav:false,created:2},{id:8,name:'SukeDeco',url:'https://study-navi.github.io/sukedeco/',genre:'教育',icon:'🗓️',desc:'スケジュール表を手軽に作成',pal:3,fav:false,created:1}];let apps=JSON.parse(localStorage.getItem(KEY)||'null')||seeds,genre='すべて',editing=null,selectedPal=0,menuId=null,dragId=null;const $=s=>document.querySelector(s),grid=$('#grid'),chips=$('#chips'),search=$('#search'),sort=$('#sort'),modal=$('#modal'),menu=$('#menu');sort.value=localStorage.getItem(SORTKEY)||'manual';function persist(){localStorage.setItem(KEY,JSON.stringify(apps))}function genres(){return ['すべて','お気に入り',...new Set(apps.map(a=>a.genre).filter(Boolean))]}function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function renderChips(){chips.innerHTML=genres().map(g=>`<button class="chip ${g===genre?'active':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{genre=b.dataset.g;render()});$('#genreList').innerHTML=[...new Set(apps.map(a=>a.genre))].map(g=>`<option value="${esc(g)}">`).join('')}function filtered(){const q=search.value.trim().toLowerCase();let a=apps.filter(x=>(genre==='すべて'||(genre==='お気に入り'&&x.fav)||x.genre===genre)&&(!q||[x.name,x.genre,x.desc].join(' ').toLowerCase().includes(q)));if(sort.value==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'ja'));else if(sort.value==='fav')a.sort((x,y)=>(y.fav-x.fav)||(y.created-x.created));else if(sort.value==='new')a.sort((x,y)=>y.created-x.created);return a}function canDrag(){return sort.value==='manual'&&genre==='すべて'&&!search.value.trim()}function render(){renderChips();const list=filtered(),drag=canDrag();grid.classList.toggle('manual',drag);$('#reorderHint').classList.toggle('show',drag);$('#count').textContent=`${list.length} apps`;grid.innerHTML=list.length?list.map(a=>{const p=palettes[a.pal]||palettes[0];return `<article class="card" data-id="${a.id}" draggable="${drag}" style="--card1:${p[0]};--card2:${p[1]};--glow:${p[2]}"><div class="cardBody"><div class="cardTop"><div class="icon">${esc(a.icon||'◈')}</div><div class="dragHandle">↕ 移動</div><button class="more" data-more="${a.id}">⋯</button></div><div class="title"><span class="tag">${esc(a.genre||'その他')}</span><h3>${esc(a.name)}</h3><p>${esc(a.desc||'')}</p><div class="openRow"><button class="open" data-open="${a.id}">開く ↗</button><button class="fav ${a.fav?'on':''}" data-fav="${a.id}">★</button></div></div></div></article>`}).join(''):'<div class="empty">条件に合うアプリがありません。</div>';grid.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const a=apps.find(x=>x.id==b.dataset.open);if(a)window.open(a.url,'_blank','noopener')});grid.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const a=apps.find(x=>x.id==b.dataset.fav);a.fav=!a.fav;persist();render()});grid.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>showMenu(e,b.dataset.more));if(drag)bindDrag()}function bindDrag(){grid.querySelectorAll('.card').forEach(c=>{c.addEventListener('dragstart',()=>{dragId=Number(c.dataset.id);c.classList.add('dragging')});c.addEventListener('dragend',()=>{dragId=null;c.classList.remove('dragging');grid.querySelectorAll('.card').forEach(x=>x.classList.remove('drag-over'))});c.addEventListener('dragover',e=>{e.preventDefault();if(Number(c.dataset.id)!==dragId)c.classList.add('drag-over')});c.addEventListener('dragleave',()=>c.classList.remove('drag-over'));c.addEventListener('drop',e=>{e.preventDefault();c.classList.remove('drag-over');const targetId=Number(c.dataset.id);if(!dragId||dragId===targetId)return;const from=apps.findIndex(a=>a.id===dragId),to=apps.findIndex(a=>a.id===targetId);if(from<0||to<0)return;const[moved]=apps.splice(from,1);apps.splice(to,0,moved);persist();render()})})}function showMenu(e,id){menuId=Number(id);const r=e.currentTarget.getBoundingClientRect();menu.style.left=Math.min(r.left,innerWidth-150)+'px';menu.style.top=(r.bottom+7)+'px';menu.classList.add('show')}function hideMenu(){menu.classList.remove('show')}function openModal(id=null){hideMenu();editing=id;const a=id?apps.find(x=>x.id===id):null;$('#modalTitle').textContent=a?'アプリを編集':'アプリを追加';$('#fName').value=a?.name||'';$('#fUrl').value=a?.url||'';$('#fGenre').value=a?.genre||'';$('#fIcon').value=a?.icon||'';$('#fDesc').value=a?.desc|
