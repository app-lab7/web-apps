<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef7ff">
<title>App Shelf</title>
<style>
:root{--text:#33415c;--muted:#73829b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}body{background:#eef7ff}.shell{min-height:100vh;position:relative;overflow-x:hidden;background:radial-gradient(circle at 7% 10%,rgba(255,193,222,.9),transparent 27%),radial-gradient(circle at 92% 12%,rgba(169,224,255,.92),transparent 29%),radial-gradient(circle at 80% 86%,rgba(201,183,255,.76),transparent 31%),radial-gradient(circle at 17% 88%,rgba(174,241,211,.78),transparent 27%),linear-gradient(135deg,#fbfdff,#edf6ff 50%,#faf3ff)}
.header{position:sticky;top:0;z-index:20;padding:18px 28px 14px;background:linear-gradient(to bottom,rgba(245,250,255,.62),rgba(245,250,255,.22),transparent);backdrop-filter:blur(28px) saturate(160%)}.top{max-width:1440px;margin:auto;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:12px;min-width:max-content}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.9);display:grid;place-items:center;color:#6679a5;font-weight:950;box-shadow:0 12px 35px rgba(91,111,150,.14),inset 0 1px white;backdrop-filter:blur(20px)}.brand h1{font-size:20px;margin:0}.brand p{font-size:10px;color:#8a98af;margin:3px 0 0;letter-spacing:.15em;text-transform:uppercase}.glass{border:1px solid rgba(255,255,255,.78);background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(255,255,255,.13));box-shadow:0 10px 34px rgba(93,112,150,.09),inset 0 1px white;backdrop-filter:blur(24px) saturate(170%)}.searchWrap{flex:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 15px;border-radius:17px}.searchWrap input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}.addBtn{height:48px;border-radius:17px;padding:0 17px;color:#52617f;font-weight:800}.sizeCtl{display:flex;align-items:center;gap:4px;height:48px;border-radius:17px;padding:4px}.sizeCtl span{font-size:11px;color:#78869c;padding:0 6px 0 5px;font-weight:800}.sizeBtn{border:0;background:transparent;color:#7d8aa0;height:36px;min-width:40px;padding:0 10px;border-radius:12px;font-size:11px;font-weight:850}.sizeBtn.active{background:rgba(255,255,255,.64);color:#52617f;box-shadow:0 4px 14px rgba(91,110,145,.10),inset 0 1px white}
.main{max-width:1440px;margin:0 auto;padding:8px 28px 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;padding:24px 2px 18px}.hero h2{font-size:clamp(28px,3vw,43px);line-height:1.12;margin:0 0 8px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:14px}.count{color:#8290a8;font-size:13px}.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 20px}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px}.chips::-webkit-scrollbar{display:none}.chip,.sort,.reorderHint{border:1px solid rgba(255,255,255,.74);background:linear-gradient(145deg,rgba(255,255,255,.31),rgba(255,255,255,.11));color:#74829a;box-shadow:inset 0 1px white;backdrop-filter:blur(20px)}.chip{white-space:nowrap;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:750}.chip.active{background:rgba(255,255,255,.66);color:#52617f}.rightControls{display:flex;align-items:center;gap:8px}.sort,.reorderHint{border-radius:13px;padding:9px 12px;outline:0}.reorderHint{display:none;font-size:11px}.reorderHint.show{display:block}
.grid{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));grid-auto-flow:dense;gap:16px}.card{grid-column:span 4;position:relative;min-height:218px;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.76);background:linear-gradient(145deg,var(--card1),var(--card2));box-shadow:0 20px 60px rgba(83,104,145,.14),inset 0 1px rgba(255,255,255,.96),inset 1px 0 rgba(255,255,255,.32);transition:.22s;isolation:isolate;backdrop-filter:blur(34px) saturate(185%)}.card:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(125deg,rgba(255,255,255,.60),rgba(255,255,255,.20) 18%,rgba(255,255,255,.05) 44%,rgba(255,255,255,.28))}.card:after{content:"";position:absolute;z-index:-1;width:180px;height:180px;border-radius:50%;right:-46px;top:-58px;background:radial-gradient(circle,var(--glow),transparent 68%);opacity:.8}.card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.96);box-shadow:0 28px 78px rgba(76,98,140,.18),inset 0 1px white}.card.size-small{grid-column:span 2;min-height:158px}.card.size-large{grid-column:span 6;min-height:278px}.card.size-wide{grid-column:span 8;min-height:190px}.grid.density-compact{gap:12px}.grid.density-compact .card{grid-column:span 3;min-height:176px}.grid.density-compact .card.size-small{grid-column:span 2;min-height:148px}.grid.density-compact .card.size-large{grid-column:span 5;min-height:238px}.grid.density-compact .card.size-wide{grid-column:span 6;min-height:172px}.grid.density-roomy{gap:20px}.grid.density-roomy .card{grid-column:span 5;min-height:250px}.grid.density-roomy .card.size-small{grid-column:span 3;min-height:182px}.grid.density-roomy .card.size-large{grid-column:span 7;min-height:320px}.grid.density-roomy .card.size-wide{grid-column:span 10;min-height:225px}
.cardBody{height:100%;padding:20px;display:flex;flex-direction:column;min-width:0}.cardTop{display:flex;align-items:flex-start;gap:8px}.icon{width:56px;height:56px;flex:0 0 auto;border-radius:19px;background:linear-gradient(145deg,rgba(255,255,255,.48),rgba(255,255,255,.16));border:1px solid rgba(255,255,255,.82);display:grid;place-items:center;font-size:25px;box-shadow:0 10px 26px rgba(91,110,145,.10),inset 0 1px white;backdrop-filter:blur(18px)}.more{width:35px;height:35px;flex:0 0 auto;border:1px solid rgba(255,255,255,.64);border-radius:12px;background:rgba(255,255,255,.20);color:#6d7a91;font-size:20px;display:grid;place-items:center;margin-left:auto}.dragHandle{display:none;color:#7d8ca5;font-size:11px;font-weight:800;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.68);border-radius:10px;padding:5px 8px;margin-left:auto;white-space:nowrap}.manual .dragHandle{display:block}.title{margin-top:auto;min-width:0}.tag{display:inline-flex;border:1px solid rgba(255,255,255,.70);background:rgba(255,255,255,.20);color:#6e7c93;padding:5px 9px;border-radius:10px;font-size:10px;font-weight:800}.title h3{font-size:21px;margin:11px 0 5px;color:#40506b;line-height:1.2;overflow-wrap:anywhere}.title p{font-size:12px;color:#718097;margin:0;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.openRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}.open{border:1px solid rgba(255,255,255,.82);background:rgba(255,255,255,.42);color:#53627b;border-radius:13px;padding:9px 13px;font-weight:850;font-size:12px;white-space:nowrap}.fav{border:0;background:transparent;color:#8c99ad;font-size:19px;opacity:.65;padding:6px;flex:0 0 auto}.fav.on{opacity:1;color:#daa84e}
/* Small tile: information is intentionally simplified for readability. */
.size-small .cardBody{padding:11px}.size-small .cardTop{gap:5px}.size-small .icon{width:36px;height:36px;border-radius:12px;font-size:17px}.size-small .more{width:27px;height:27px;border-radius:9px;font-size:16px}.size-small .dragHandle{display:none!important}.size-small .title{margin-top:9px;display:flex;flex-direction:column;min-height:0}.size-small .tag{font-size:8px;padding:3px 6px;border-radius:7px;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.size-small .title h3{font-size:13px;line-height:1.18;margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.size-small .title p{display:none}.size-small .openRow{margin-top:auto;padding-top:7px;gap:4px}.size-small .open{padding:5px 7px;border-radius:8px;font-size:9px}.size-small .fav{font-size:14px;padding:2px}.grid.density-compact .size-small .tag{display:none}.grid.density-compact .size-small .title h3{font-size:12px;margin-top:4px}.grid.density-compact .size-small .cardBody{padding:9px}.grid.density-compact .size-small .icon{width:33px;height:33px;font-size:15px}.grid.density-compact .size-small .more{width:25px;height:25px;font-size:14px}
.card[draggable="true"]{cursor:grab}.card.dragging{opacity:.4;transform:scale(.97)}.card.drag-over{outline:3px solid rgba(123,151,211,.3);outline-offset:5px}.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.menu{position:fixed;z-index:50;min-width:190px;background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.28));border:1px solid rgba(255,255,255,.86);border-radius:16px;padding:7px;box-shadow:0 20px 60px rgba(77,96,130,.20);backdrop-filter:blur(30px) saturate(175%);display:none}.menu.show{display:block}.menu button{width:100%;text-align:left;border:0;background:transparent;color:#66758e;padding:9px 10px;border-radius:9px;font-size:12px}.menu button:hover{background:rgba(255,255,255,.38)}.menu .red{color:#cf7885}.menuLabel{font-size:10px;font-weight:850;color:#8b98aa;padding:9px 10px 5px}.sizeMenu{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 5px 6px}.sizeMenu button{text-align:center;border:1px solid rgba(255,255,255,.58);background:rgba(255,255,255,.18);padding:7px 5px}.sizeMenu button.active{background:rgba(255,255,255,.62);color:#52617f;font-weight:850}
.modal{position:fixed;inset:0;z-index:60;background:rgba(101,117,149,.17);backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(560px,100%);background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.22));border:1px solid rgba(255,255,255,.86);border-radius:30px;padding:24px;box-shadow:0 34px 100px rgba(80,99,135,.24);backdrop-filter:blur(34px) saturate(170%)}.dialogHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.dialog h3{font-size:22px;margin:0}.close{width:38px;height:38px;border:1px solid rgba(255,255,255,.82);border-radius:13px;background:rgba(255,255,255,.28);color:#68758b;font-size:20px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;color:#7a879c;font-size:11px;font-weight:800;margin:0 0 7px 2px}.field input,.field select{width:100%;height:46px;border:1px solid rgba(255,255,255,.84);border-radius:14px;background:rgba(255,255,255,.30);color:#43516a;padding:0 13px;outline:0}.palette{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:36px;height:36px;border-radius:11px;border:2px solid transparent}.swatch.sel{border-color:white;box-shadow:0 0 0 3px rgba(113,133,170,.18)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.actionsRight{display:flex;gap:10px;margin-left:auto}.btn{height:43px;border:1px solid rgba(255,255,255,.8);border-radius:13px;padding:0 15px;font-weight:800}.btn.secondary{background:rgba(255,255,255,.20);color:#718099}.btn.primary{background:rgba(255,255,255,.58);color:#53617a}.btn.danger{background:rgba(255,210,218,.30);color:#c26f7b}
@media(max-width:1100px){.grid{grid-template-columns:repeat(12,minmax(0,1fr))}.card,.grid.density-roomy .card{grid-column:span 4}.card.size-small,.grid.density-compact .card.size-small{grid-column:span 2}.grid.density-compact .card{grid-column:span 3}.grid.density-roomy .card.size-small{grid-column:span 3}.card.size-large,.card.size-wide,.grid.density-roomy .card.size-large,.grid.density-roomy .card.size-wide{grid-column:span 6}}
@media(max-width:800px){.header{padding:14px 16px}.top{flex-wrap:wrap}.brand{width:auto}.sizeCtl{order:2;margin-left:auto}.searchWrap{order:3;width:100%;flex-basis:100%}.addBtn{order:1;margin-left:auto}.main{padding:4px 16px 50px}.controls{align-items:flex-start;flex-direction:column}.rightControls{width:100%}.sort{flex:1}.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card,.grid.density-compact .card,.grid.density-roomy .card{grid-column:span 3}.card.size-small,.grid.density-compact .card.size-small,.grid.density-roomy .card.size-small{grid-column:span 2;min-height:145px}.card.size-large,.card.size-wide,.grid.density-compact .card.size-large,.grid.density-compact .card.size-wide,.grid.density-roomy .card.size-large,.grid.density-roomy .card.size-wide{grid-column:span 6}}
@media(max-width:520px){.brand p{display:none}.sizeCtl span{display:none}.sizeBtn{min-width:34px;padding:0 7px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card,.grid.density-compact .card,.grid.density-roomy .card{grid-column:span 2}.card.size-small,.grid.density-compact .card.size-small,.grid.density-roomy .card.size-small{grid-column:span 2;min-height:140px}.card.size-large,.card.size-wide,.grid.density-compact .card.size-large,.grid.density-compact .card.size-wide,.grid.density-roomy .card.size-large,.grid.density-roomy .card.size-wide{grid-column:span 4}.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{display:block}.count{margin-top:8px}}
</style>
</head>
<body>
<div class="shell"><header class="header"><div class="top"><div class="brand"><div class="logo">A</div><div><h1>App Shelf</h1><p>my web app library</p></div></div><div class="searchWrap glass"><span>⌕</span><input id="search" placeholder="アプリ名・説明・ジャンルで検索"></div><div class="sizeCtl glass" id="sizeCtl"><span>パネル</span><button class="sizeBtn" data-density="compact">小</button><button class="sizeBtn" data-density="normal">標準</button><button class="sizeBtn" data-density="roomy">大</button></div><button class="addBtn glass" id="addBtn">＋ アプリを追加</button></div></header><main class="main"><section class="hero"><div><h2>作ったものを、<br>ひとつの場所に。</h2><p>よく使うWebアプリへ、最短でアクセス。</p></div><div class="count" id="count"></div></section><div class="controls"><div class="chips" id="chips"></div><div class="rightControls"><div class="reorderHint" id="reorderHint">↕ ドラッグして並び替え</div><select class="sort" id="sort"><option value="manual">自由に並べる</option><option value="new">新しい順</option><option value="name">名前順</option><option value="fav">お気に入り優先</option></select></div></div><section class="grid" id="grid"></section></main></div>
<div class="menu" id="menu"><div class="menuLabel">このアプリのサイズ</div><div class="sizeMenu"><button data-size="small">小</button><button data-size="normal">標準</button><button data-size="large">大</button><button data-size="wide">横長</button></div><button data-act="edit">編集</button><button data-act="copy">URLをコピー</button><button class="red" data-act="delete">削除</button></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialogHead"><h3 id="modalTitle">アプリを追加</h3><button class="close" id="close">×</button></div><div class="formGrid"><div class="field full"><label>アプリ名</label><input id="fName"></div><div class="field full"><label>URL</label><input id="fUrl" placeholder="https://..."></div><div class="field"><label>ジャンル</label><input id="fGenre" list="genreList"><datalist id="genreList"></datalist></div><div class="field"><label>アイコン</label><input id="fIcon" maxlength="4" placeholder="🧩"></div><div class="field"><label>パネルサイズ</label><select id="fSize"><option value="small">小</option><option value="normal">標準</option><option value="large">大</option><option value="wide">横長</option></select></div><div class="field full"><label>ひとこと説明</label><input id="fDesc"></div><div class="field full"><label>カードカラー</label><div class="palette" id="palette"></div></div></div><div class="actions"><button class="btn danger" id="deleteInModal" style="display:none">削除</button><div class="actionsRight"><button class="btn secondary" id="cancel">キャンセル</button><button class="btn primary" id="save">保存</button></div></div></div></div>
<script>
const KEY='appShelf_v1',SORTKEY='appShelf_sort_v1',DENSITYKEY='appShelf_density_v1';
const palettes=[['rgba(167,210,255,.30)','rgba(220,238,255,.15)','rgba(123,184,255,.52)'],['rgba(161,236,209,.28)','rgba(221,248,239,.14)','rgba(93,214,171,.48)'],['rgba(212,181,255,.30)','rgba(240,225,255,.14)','rgba(176,117,255,.48)'],['rgba(255,191,164,.30)','rgba(255,230,218,.14)','rgba(255,143,98,.48)'],['rgba(205,218,242,.30)','rgba(238,244,252,.14)','rgba(158,179,221,.44)'],['rgba(255,181,206,.30)','rgba(255,227,238,.14)','rgba(255,122,169,.46)'],['rgba(155,220,246,.30)','rgba(222,244,252,.14)','rgba(83,191,235,.46)'],['rgba(255,226,145,.30)','rgba(255,245,210,.14)','rgba(231,191,70,.44)']];
const seeds=[{id:1,name:'画像印刷アプリ',url:'https://app-lab7.github.io/web-apps/image-print/',genre:'ツール',icon:'🖼️',desc:'画像の配置・編集・印刷をまとめて行うツール',pal:0,fav:true,created:8,size:'normal'},{id:2,name:'Melody Compose',url:'https://app-lab7.github.io/web-apps/melody-compose/',genre:'音楽',icon:'🎙️',desc:'歌ったメロディを録音して作曲をサポート',pal:2,fav:true,created:7,size:'normal'},{id:3,name:'Sync Notes',url:'https://app-lab7.github.io/web-apps/syncnotes/',genre:'仕事・管理',icon:'📝',desc:'シンプルに使えるノート・同期ツール',pal:1,fav:false,created:6,size:'normal'},{id:4,name:'Todo Sync',url:'https://app-lab7.github.io/web-apps/todo-sync/',genre:'仕事・管理',icon:'✓',desc:'やることを素早く整理するTodoツール',pal:6,fav:false,created:5,size:'normal'},{id:5,name:'PrintStock',url:'https://printstock-app.github.io/',genre:'教育',icon:'📚',desc:'教材PDFを整理・検索して印刷する教材ライブラリ',pal:0,fav:true,created:4,size:'normal'},{id:6,name:'進学コンパス',url:'https://study-navi.github.io/university-navi/',genre:'教育',icon:'🧭',desc:'進学先を探すための情報ナビゲーション',pal:1,fav:false,created:3,size:'normal'},{id:7,name:'Study Room',url:'https://study-navi.github.io/study-room/',genre:'教育',icon:'⏱️',desc:'自習室の入退室・学習記録を管理',pal:7,fav:false,created:2,size:'normal'},{id:8,name:'SukeDeco',url:'https://study-navi.github.io/sukedeco/',genre:'教育',icon:'🗓️',desc:'スケジュール表を手軽に作成',pal:3,fav:false,created:1,size:'normal'}];
let apps=JSON.parse(localStorage.getItem(KEY)||'null')||seeds,genre='すべて',editing=null,selectedPal=0,menuId=null,dragId=null,density=localStorage.getItem(DENSITYKEY)||'normal';apps=apps.map(a=>({...a,size:a.size||'normal'}));
const $=s=>document.querySelector(s),grid=$('#grid'),chips=$('#chips'),search=$('#search'),sort=$('#sort'),modal=$('#modal'),menu=$('#menu');sort.value=localStorage.getItem(SORTKEY)||'manual';
function persist(){localStorage.setItem(KEY,JSON.stringify(apps))}function esc(s=''){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]||c))}function genres(){return ['すべて','お気に入り',...new Set(apps.map(a=>a.genre).filter(Boolean))]}
function renderChips(){chips.innerHTML=genres().map(g=>`<button class="chip ${g===genre?'active':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{genre=b.dataset.g;render()});$('#genreList').innerHTML=[...new Set(apps.map(a=>a.genre))].map(g=>`<option value="${esc(g)}">`).join('')}
function filtered(){const q=search.value.trim().toLowerCase();let a=apps.filter(x=>(genre==='すべて'||(genre==='お気に入り'&&x.fav)||x.genre===genre)&&(!q||[x.name,x.genre,x.desc].join(' ').toLowerCase().includes(q)));if(sort.value==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'ja'));else if(sort.value==='fav')a.sort((x,y)=>(y.fav-x.fav)||(y.created-x.created));else if(sort.value==='new')a.sort((x,y)=>y.created-x.created);return a}
function canDrag(){return sort.value==='manual'&&genre==='すべて'&&!search.value.trim()}function renderDensity(){grid.classList.remove('density-compact','density-normal','density-roomy');grid.classList.add('density-'+density);document.querySelectorAll('[data-density]').forEach(b=>b.classList.toggle('active',b.dataset.density===density))}
function render(){renderChips();renderDensity();const list=filtered(),drag=canDrag();grid.classList.toggle('manual',drag);$('#reorderHint').classList.toggle('show',drag);$('#count').textContent=`${list.length} apps`;grid.innerHTML=list.length?list.map(a=>{const p=palettes[a.pal]||palettes[0],sz=a.size||'normal';return `<article class="card size-${sz}" data-id="${a.id}" draggable="${drag}" style="--card1:${p[0]};--card2:${p[1]};--glow:${p[2]}"><div class="cardBody"><div class="cardTop"><div class="icon">${esc(a.icon||'◈')}</div><div class="dragHandle">↕ 移動</div><button class="more" data-more="${a.id}">⋯</button></div><div class="title"><span class="tag">${esc(a.genre||'その他')}</span><h3>${esc(a.name)}</h3><p>${esc(a.desc||'')}</p><div class="openRow"><button class="open" data-open="${a.id}">開く ↗</button><button class="fav ${a.fav?'on':''}" data-fav="${a.id}">★</button></div></div></div></article>`}).join(''):'<div class="empty">条件に合うアプリがありません。</div>';grid.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const a=apps.find(x=>x.id==b.dataset.open);if(a)window.open(a.url,'_blank','noopener')});grid.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const a=apps.find(x=>x.id==b.dataset.fav);a.fav=!a.fav;persist();render()});grid.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>showMenu(e,b.dataset.more));if(drag)bindDrag()}
function bindDrag(){grid.querySelectorAll('.card').forEach(c=>{c.addEventListener('dragstart',()=>{dragId=Number(c.dataset.id);c.classList.add('dragging')});c.addEventListener('dragend',()=>{dragId=null;c.classList.remove('dragging');grid.querySelectorAll('.card').forEach(x=>x.classList.remove('drag-over'))});c.addEventListener('dragover',e=>{e.preventDefault();if(Number(c.dataset.id)!==dragId)c.classList.add('drag-over')});c.addEventListener('dragleave',()=>c.classList.remove('drag-over'));c.addEventListener('drop',e=>{e.preventDefault();const targetId=Number(c.dataset.id);if(!dragId||dragId===targetId)return;const from=apps.findIndex(a=>a.id===dragId),to=apps.findIndex(a=>a.id===targetId);if(from<0||to<0)return;const[moved]=apps.splice(from,1);apps.splice(to,0,moved);persist();render()})})}
function showMenu(e,id){menuId=Number(id);const a=apps.find(x=>x.id===menuId);menu.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b.dataset.size===(a?.size||'normal')));const r=e.currentTarget.getBoundingClientRect();menu.style.left=Math.min(r.left,innerWidth-205)+'px';menu.style.top=Math.min(r.bottom+7,innerHeight-260)+'px';menu.classList.add('show')}function hideMenu(){menu.classList.remove('show')}
function openModal(id=null){hideMenu();editing=id;const a=id?apps.find(x=>x.id===id):null;$('#modalTitle').textContent=a?'アプリを編集':'アプリを追加';$('#fName').value=a?.name||'';$('#fUrl').value=a?.url||'';$('#fGenre').value=a?.genre||'';$('#fIcon').value=a?.icon||'';$('#fDesc').value=a?.desc||'';$('#fSize').value=a?.size||'normal';selectedPal=a?.pal??Math.floor(Math.random()*palettes.length);$('#deleteInModal').style.display=a?'block':'none';renderPalette();modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}
function renderPalette(){$('#palette').innerHTML=palettes.map((p,i)=>`<button class="swatch ${i===selectedPal?'sel':''}" style="background:linear-gradient(145deg,${p[0]},${p[1]})" data-p="${i}"></button>`).join('');$('#palette').querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{selectedPal=Number(b.dataset.p);renderPalette()})}
function save(){const name=$('#fName').value.trim(),url=$('#fUrl').value.trim();if(!name||!url){alert('アプリ名とURLを入力してください');return}const data={name,url,genre:$('#fGenre').value.trim()||'その他',icon:$('#fIcon').value.trim()||'◈',desc:$('#fDesc').value.trim(),pal:selectedPal,size:$('#fSize').value};if(editing)Object.assign(apps.find(x=>x.id===editing),data);else apps.unshift({id:Date.now(),...data,fav:false,created:Date.now()});persist();closeModal();render()}function del(id){if(!confirm('このアプリを一覧から削除しますか？'))return;apps=apps.filter(x=>x.id!==id);persist();closeModal();hideMenu();render()}
document.querySelectorAll('[data-density]').forEach(b=>b.onclick=()=>{density=b.dataset.density;localStorage.setItem(DENSITYKEY,density);renderDensity()});$('#addBtn').onclick=()=>openModal();$('#close').onclick=closeModal;$('#cancel').onclick=closeModal;$('#save').onclick=save;$('#deleteInModal').onclick=()=>editing&&del(editing);search.oninput=render;sort.onchange=()=>{localStorage.setItem(SORTKEY,sort.value);render()};modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!e.target.closest('[data-more]'))hideMenu()});menu.onclick=e=>{const size=e.target.dataset.size;if(size){const a=apps.find(x=>x.id===menuId);if(a){a.size=size;persist();hideMenu();render()}return}const act=e.target.dataset.act;if(!act)return;const a=apps.find(x=>x.id===menuId);if(act==='edit')openModal(menuId);if(act==='delete')del(menuId);if(act==='copy'&&a){navigator.clipboard?.writeText(a.url);hideMenu()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();hideMenu()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}});render();
</script>
</body>
