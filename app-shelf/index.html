<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#10141d" />
<title>App Shelf</title>
<style>
:root{--bg:#0b0d12;--panel:#121620;--panel2:#171c28;--text:#f5f7fb;--muted:#8e98aa;--line:rgba(255,255,255,.08);--accent:#7c9cff;--accent2:#63e6be;--shadow:0 24px 70px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;background:radial-gradient(circle at 12% -8%,rgba(124,156,255,.18),transparent 30%),radial-gradient(circle at 92% 2%,rgba(99,230,190,.12),transparent 28%),var(--bg)}
.header{position:sticky;top:0;z-index:20;padding:22px 28px 16px;background:linear-gradient(to bottom,rgba(11,13,18,.96),rgba(11,13,18,.86),rgba(11,13,18,0));backdrop-filter:blur(14px)}
.top{max-width:1440px;margin:auto;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:13px;min-width:max-content}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#88a4ff,#6b7eff 56%,#71e5c1);display:grid;place-items:center;color:#07101c;font-weight:950;box-shadow:0 10px 30px rgba(124,156,255,.25)}.brand h1{font-size:20px;margin:0;letter-spacing:.02em}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0;letter-spacing:.14em;text-transform:uppercase}.searchWrap{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:16px;padding:0 15px;height:48px;transition:.2s}.searchWrap:focus-within{border-color:rgba(124,156,255,.55);background:rgba(255,255,255,.075);box-shadow:0 0 0 4px rgba(124,156,255,.08)}.searchWrap svg{opacity:.55}.searchWrap input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:15px}.searchWrap input::placeholder{color:#6f7888}.addBtn{height:48px;border:0;border-radius:16px;padding:0 18px;background:#f5f7fb;color:#0b0d12;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.main{max-width:1440px;margin:0 auto;padding:10px 28px 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;padding:26px 2px 20px}.hero h2{font-size:clamp(27px,3vw,42px);line-height:1.12;margin:0 0 8px;letter-spacing:-.035em}.hero p{margin:0;color:var(--muted);font-size:14px}.count{color:#c5cbe0;font-size:13px;white-space:nowrap}.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 22px}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.035);color:#b8c0d0;padding:9px 13px;border-radius:999px;font-size:12px;font-weight:700}.chip.active{background:#f5f7fb;color:#0b0d12;border-color:#f5f7fb}.sort{border:1px solid var(--line);background:#121620;color:#cbd2df;border-radius:12px;padding:9px 12px;outline:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{position:relative;min-height:228px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,var(--card1),var(--card2));box-shadow:0 8px 34px rgba(0,0,0,.16);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;isolation:isolate}.card:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-56px;top:-62px;background:var(--glow);filter:blur(10px);opacity:.58;z-index:-1}.card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.17);box-shadow:var(--shadow)}.cardBody{height:100%;padding:21px;display:flex;flex-direction:column}.cardTop{display:flex;justify-content:space-between;align-items:flex-start}.icon{width:55px;height:55px;border-radius:17px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;font-size:25px;box-shadow:inset 0 1px rgba(255,255,255,.1)}.more{width:34px;height:34px;border:0;border-radius:10px;background:rgba(0,0,0,.15);color:#fff;font-size:20px;display:grid;place-items:center;opacity:.7}.more:hover{background:rgba(0,0,0,.28);opacity:1}.title{margin-top:auto}.tag{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.15);color:rgba(255,255,255,.7);padding:5px 8px;border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.04em}.title h3{font-size:21px;margin:11px 0 5px;letter-spacing:-.02em}.title p{font-size:12px;color:rgba(255,255,255,.62);margin:0;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.openRow{display:flex;align-items:center;justify-content:space-between;margin-top:15px}.open{border:0;background:rgba(255,255,255,.92);color:#0d1117;border-radius:11px;padding:9px 12px;font-weight:850;font-size:12px}.fav{border:0;background:transparent;color:white;font-size:19px;opacity:.58;padding:6px}.fav.on{opacity:1;color:#ffe27a}.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.58);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{width:min(560px,100%);background:#151a24;border:1px solid rgba(255,255,255,.11);border-radius:26px;padding:24px;box-shadow:0 35px 100px rgba(0,0,0,.5)}.dialogHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.dialog h3{font-size:22px;margin:0}.close{width:38px;height:38px;border:0;border-radius:12px;background:#222938;color:white;font-size:20px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;color:#929cad;font-size:11px;font-weight:800;margin:0 0 7px 2px}.field input,.field select{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;background:#0f131b;color:white;padding:0 13px;outline:0}.field input:focus,.field select:focus{border-color:#708cff}.palette{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:36px;height:36px;border-radius:11px;border:2px solid transparent}.swatch.sel{border-color:white;box-shadow:0 0 0 3px rgba(255,255,255,.1)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.actionsRight{display:flex;gap:10px;margin-left:auto}.btn{height:43px;border:0;border-radius:12px;padding:0 15px;font-weight:800}.btn.secondary{background:#242b3a;color:#cbd2df}.btn.primary{background:#f4f6fb;color:#0b0d12}.btn.danger{background:rgba(255,93,115,.12);color:#ff8294}.menu{position:fixed;z-index:50;min-width:130px;background:#1a202c;border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:6px;box-shadow:0 18px 60px rgba(0,0,0,.4);display:none}.menu.show{display:block}.menu button{width:100%;text-align:left;border:0;background:transparent;color:#d8deea;padding:9px 10px;border-radius:8px;font-size:12px}.menu button:hover{background:#262e3d}.menu .red{color:#ff8b99}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.header{padding:16px}.top{flex-wrap:wrap}.brand{width:100%}.searchWrap{order:3;width:100%;flex-basis:100%}.addBtn{margin-left:auto}.main{padding:4px 16px 50px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hero{padding-top:18px}.controls{align-items:flex-start}.sort{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{min-height:206px}.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{display:block}.count{margin-top:8px}.dialog{padding:19px;border-radius:22px}}
</style>
</head>
<body>
<div class="shell">
<header class="header"><div class="top">
  <div class="brand"><div class="logo">A</div><div><h1>App Shelf</h1><p>my web app library</p></div></div>
  <div class="searchWrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.7-3.7"/></svg><input id="search" placeholder="アプリ名・説明・ジャンルで検索" /></div>
  <button class="addBtn" id="addBtn">＋ アプリを追加</button>
</div></header>
<main class="main">
  <section class="hero"><div><h2>作ったものを、<br>ひとつの場所に。</h2><p>よく使うWebアプリへ、最短でアクセス。</p></div><div class="count" id="count"></div></section>
  <div class="controls"><div class="chips" id="chips"></div><select class="sort" id="sort"><option value="new">新しい順</option><option value="name">名前順</option><option value="fav">お気に入り優先</option></select></div>
  <section class="grid" id="grid"></section>
</main>
</div>
<div class="menu" id="menu"><button data-act="edit">編集</button><button data-act="copy">URLをコピー</button><button class="red" data-act="delete">削除</button></div>
<div class="modal" id="modal"><div class="dialog">
  <div class="dialogHead"><h3 id="modalTitle">アプリを追加</h3><button class="close" id="close">×</button></div>
  <div class="formGrid">
    <div class="field full"><label>アプリ名</label><input id="fName" placeholder="例：画像印刷アプリ" /></div>
    <div class="field full"><label>URL</label><input id="fUrl" placeholder="https://..." /></div>
    <div class="field"><label>ジャンル</label><input id="fGenre" list="genreList" placeholder="教育 / ツール / 音楽..." /><datalist id="genreList"></datalist></div>
    <div class="field"><label>アイコン</label><input id="fIcon" maxlength="4" placeholder="🧩" /></div>
    <div class="field full"><label>ひとこと説明</label><input id="fDesc" placeholder="どんなアプリか短く" /></div>
    <div class="field full"><label>カードカラー</label><div class="palette" id="palette"></div></div>
  </div>
  <div class="actions"><button class="btn danger" id="deleteInModal" style="display:none">削除</button><div class="actionsRight"><button class="btn secondary" id="cancel">キャンセル</button><button class="btn primary" id="save">保存</button></div></div>
</div></div>
<script>
const KEY='appShelf_v1';
const palettes=[
 ['#18243a','#101723','rgba(92,137,255,.35)'],['#17312f','#101d1c','rgba(74,222,192,.34)'],['#35213c','#1d1423','rgba(207,102,255,.33)'],['#3a241c','#211713','rgba(255,153,92,.34)'],['#2d2e39','#171820','rgba(201,208,255,.22)'],['#352628','#1f1618','rgba(255,101,122,.28)'],['#1f3040','#121c26','rgba(78,190,255,.30)'],['#33301e','#1d1b12','rgba(242,214,88,.28)']
];
const seeds=[
 {id:1,name:'画像印刷アプリ',url:'https://app-lab7.github.io/web-apps/image-print/',genre:'ツール',icon:'🖼️',desc:'画像の配置・編集・印刷をまとめて行うツール',pal:0,fav:true,created:8},
 {id:2,name:'Melody Compose',url:'https://app-lab7.github.io/web-apps/melody-compose/',genre:'音楽',icon:'🎙️',desc:'歌ったメロディを録音して作曲をサポート',pal:2,fav:true,created:7},
 {id:3,name:'Sync Notes',url:'https://app-lab7.github.io/web-apps/syncnotes/',genre:'仕事・管理',icon:'📝',desc:'シンプルに使えるノート・同期ツール',pal:1,fav:false,created:6},
 {id:4,name:'Todo Sync',url:'https://app-lab7.github.io/web-apps/todo-sync/',genre:'仕事・管理',icon:'✓',desc:'やることを素早く整理するTodoツール',pal:6,fav:false,created:5},
 {id:5,name:'PrintStock',url:'https://printstock-app.github.io/',genre:'教育',icon:'📚',desc:'教材PDFを整理・検索して印刷する教材ライブラリ',pal:0,fav:true,created:4},
 {id:6,name:'進学コンパス',url:'https://study-navi.github.io/university-navi/',genre:'教育',icon:'🧭',desc:'進学先を探すための情報ナビゲーション',pal:1,fav:false,created:3},
 {id:7,name:'Study Room',url:'https://study-navi.github.io/study-room/',genre:'教育',icon:'⏱️',desc:'自習室の入退室・学習記録を管理',pal:7,fav:false,created:2},
 {id:8,name:'SukeDeco',url:'https://study-navi.github.io/sukedeco/',genre:'教育',icon:'🗓️',desc:'スケジュール表を手軽に作成',pal:3,fav:false,created:1}
];
let apps=JSON.parse(localStorage.getItem(KEY)||'null')||seeds;let genre='すべて';let editing=null;let selectedPal=0;let menuId=null;
const $=s=>document.querySelector(s),grid=$('#grid'),chips=$('#chips'),search=$('#search'),sort=$('#sort'),modal=$('#modal'),menu=$('#menu');
function persist(){localStorage.setItem(KEY,JSON.stringify(apps))}
function genres(){return ['すべて','お気に入り',...new Set(apps.map(a=>a.genre).filter(Boolean))]}
function renderChips(){chips.innerHTML=genres().map(g=>`<button class="chip ${g===genre?'active':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{genre=b.dataset.g;render()});$('#genreList').innerHTML=[...new Set(apps.map(a=>a.genre))].map(g=>`<option value="${esc(g)}">`).join('')}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function filtered(){const q=search.value.trim().toLowerCase();let a=apps.filter(x=>(genre==='すべて'||(genre==='お気に入り'&&x.fav)||x.genre===genre)&&(!q||[x.name,x.genre,x.desc].join(' ').toLowerCase().includes(q)));if(sort.value==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'ja'));else if(sort.value==='fav')a.sort((x,y)=>(y.fav-x.fav)||(y.created-x.created));else a.sort((x,y)=>y.created-x.created);return a}
function render(){renderChips();const list=filtered();$('#count').textContent=`${list.length} apps`;grid.innerHTML=list.length?list.map(a=>{const p=palettes[a.pal]||palettes[0];return `<article class="card" style="--card1:${p[0]};--card2:${p[1]};--glow:${p[2]}"><div class="cardBody"><div class="cardTop"><div class="icon">${esc(a.icon||'◈')}</div><button class="more" data-more="${a.id}" aria-label="メニュー">⋯</button></div><div class="title"><span class="tag">${esc(a.genre||'その他')}</span><h3>${esc(a.name)}</h3><p>${esc(a.desc||'')}</p><div class="openRow"><button class="open" data-open="${a.id}">開く ↗</button><button class="fav ${a.fav?'on':''}" data-fav="${a.id}" aria-label="お気に入り">★</button></div></div></div></article>`}).join(''):'<div class="empty">条件に合うアプリがありません。</div>';
grid.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const a=apps.find(x=>x.id==b.dataset.open);if(a)window.open(a.url,'_blank','noopener')});grid.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const a=apps.find(x=>x.id==b.dataset.fav);a.fav=!a.fav;persist();render()});grid.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>showMenu(e,b.dataset.more))}
function showMenu(e,id){menuId=Number(id);const r=e.currentTarget.getBoundingClientRect();menu.style.left=Math.min(r.left,innerWidth-150)+'px';menu.style.top=(r.bottom+7)+'px';menu.classList.add('show')}
function hideMenu(){menu.classList.remove('show')}
function openModal(id=null){hideMenu();editing=id;const a=id?apps.find(x=>x.id===id):null;$('#modalTitle').textContent=a?'アプリを編集':'アプリを追加';$('#fName').value=a?.name||'';$('#fUrl').value=a?.url||'';$('#fGenre').value=a?.genre||'';$('#fIcon').value=a?.icon||'';$('#fDesc').value=a?.desc||'';selectedPal=a?.pal??Math.floor(Math.random()*palettes.length);$('#deleteInModal').style.display=a?'block':'none';renderPalette();modal.classList.add('show');setTimeout(()=>$('#fName').focus(),30)}
function closeModal(){modal.classList.remove('show')}
function renderPalette(){$('#palette').innerHTML=palettes.map((p,i)=>`<button class="swatch ${i===selectedPal?'sel':''}" style="background:linear-gradient(145deg,${p[0]},${p[1]})" data-p="${i}" aria-label="カラー${i+1}"></button>`).join('');$('#palette').querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{selectedPal=Number(b.dataset.p);renderPalette()})}
function save(){const name=$('#fName').value.trim(),url=$('#fUrl').value.trim();if(!name||!url){alert('アプリ名とURLを入力してください');return}const data={name,url,genre:$('#fGenre').value.trim()||'その他',icon:$('#fIcon').value.trim()||'◈',desc:$('#fDesc').value.trim(),pal:selectedPal};if(editing){Object.assign(apps.find(x=>x.id===editing),data)}else apps.push({id:Date.now(),...data,fav:false,created:Date.now()});persist();closeModal();render()}
function del(id){if(!confirm('このアプリを一覧から削除しますか？'))return;apps=apps.filter(x=>x.id!==id);persist();closeModal();hideMenu();render()}
$('#addBtn').onclick=()=>openModal();$('#close').onclick=closeModal;$('#cancel').onclick=closeModal;$('#save').onclick=save;$('#deleteInModal').onclick=()=>editing&&del(editing);search.oninput=render;sort.onchange=render;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!e.target.closest('[data-more]'))hideMenu()});menu.onclick=e=>{const act=e.target.dataset.act;if(!act)return;const a=apps.find(x=>x.id===menuId);if(act==='edit')openModal(menuId);if(act==='delete')del(menuId);if(act==='copy'&&a){navigator.clipboard?.writeText(a.url);hideMenu()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();hideMenu()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}});
render();
</script>
</body>
</html>
