<style>
html,body{margin:0;height:100%;background:#050d17;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;width:min(100vw,calc(100vh*0.5625));height:min(100vh,calc(100vw/0.5625))}

<body>
<div id="stage"><canvas id="c" width="360" height="640"></canvas></div>
<script>
(function(){
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=640;
let DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}
resize();window.addEventListener('resize',resize);

/* ---------- 定数 ---------- */
const BASE_FT=90;
const SPEED=62,ACC=0.5,MAXLEAD=12,LEAD_RATE=13,BACK_RATE=70,PICK_FLY=0.28;
/* 球場は真上から見た配置: ホームが下、一塁が右、二塁が上、三塁が左 */
const HOME={x:180,y:448},B1={x:300,y:328},B2={x:180,y:208},B3={x:60,y:328},MOUND={x:180,y:334};
const FBM={x:324,y:322},SSM={x:148,y:226},SECM={x:240,y:252},TBM={x:44,y:324},BAT={x:142,y:452},CATCH={x:180,y:472};
const HP={x:MOUND.x+6,y:MOUND.y-30};            // 投手の手元
const FBG={x:FBM.x-12,y:FBM.y-22};              // 一塁手のグラブ
const CGL={x:CATCH.x,y:CATCH.y-24};             // 捕手のミット
const TG={x:B2.x-8,y:B2.y-14};                  // 二塁でのタッチ位置
const INSET={x:12,y:62,w:200,h:130};
const FOOT={x:218,y:62,w:130,h:130};            // 足元アップ(脚上げ=GOの合図を見る窓)            // 投手アップ(クセを見る窓)
const SHARE_BTN={x:30,y:404,w:300,h:52},RETRY_BTN={x:30,y:470,w:300,h:52};
function pathPos(s){const u=s/BASE_FT;return {x:B1.x+(B2.x-B1.x)*u,y:B1.y+(B2.y-B1.y)*u};}
const MSG={
 pick:['アウト!','牽制に刺された…'],
 pickgo:['アウト!','牽制に釣られた!!'],
 caught:['アウト!','スタートが遅かった…'],
 read:['アウト!','投球前にスタート!読まれた…']
};
const CAUSE={pick:'牽制死',pickgo:'牽制に釣られた',caught:'盗塁死',read:'フライング'};

/* ---------- 状態 ---------- */
const S={phase:'title',time:0,steals:0,outs:0,lv:0,introLv:-1,intro:false,L:0,picks:0,ab:0,
 setT:0,holdTime:1,planned:false,action:'pitch',tellOn:false,tellKind:null,tellStart:0,tellEnd:0,
 t:0,goT:null,runL:0,runTe:0,eta:0,willSafe:false,resolved:false,timer:0,banner:null,after:'',cause:'',
 resS:0,resBall:{x:0,y:0},slideDir:1,toast:'',toastT:0,overAt:0,best:0,newBest:false,goFlash:0};
if(location.search.indexOf('debug')>=0)window.__stealGame={S:S,makePitcher:function(n){return makePitcher(n);}}; // テスト用(?debug の時だけ公開)
try{S.best=parseInt(localStorage.getItem('tourui_best')||'0',10)||0;}catch(e){}
function saveBest(){try{localStorage.setItem('tourui_best',String(S.best));}catch(e){}}

const P=()=>S.pitcher;
const clamp01=x=>x<0?0:x>1?1:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
function runS(L0,te){if(te<=0)return L0;if(te<ACC)return L0+SPEED*te*te/(2*ACC);return L0+SPEED*(te-ACC/2);}
function runTime(L0){return (BASE_FT-L0)/SPEED+ACC/2;}
function rankOf(n){if(n>=25)return '伝説の盗塁王';if(n>=15)return '盗塁王';if(n>=10)return '韋駄天';if(n>=6)return '盗塁職人';if(n>=3)return '俊足レギュラー';if(n>=1)return '代走要員';return '一塁ベース番';}

/* ---------- 音・振動 ---------- */
let AC=null;
function audioInit(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,type,vol,f2){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(vol||.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- ゲーム進行 ---------- */
function resetAB(){S.L=0;S.picks=0;S.ab=0;S.goT=null;S.resolved=false;}
function startGame(){
 S.steals=0;S.outs=0;S.pitcher=makePitcher(0);camPose=null;S.cause='';S.banner=null;S.toastT=0;
 resetAB();enterReady(1.7);
}
function enterReady(t){
 S.phase='ready';S.intro=true;S.timer=Math.max(t,(S.steals===0&&S.outs===0)?1.8:1.2);
}
function startSet(){
 const p=P();
 S.phase='set';S.setT=0;S.holdTime=rand(p.hold[0],p.hold[1]);S.planned=false;
 S.tellOn=false;S.tellKind=null;S.goT=null;S.t=0;S.resolved=false;S.fakeLift=false;S.dv=0;S.pRel=p.pickRel;S.t1=T1(p);
}
const T1=p=>p.lift+(p.deliv-p.lift)*.22; // 踏み込み(ホームへ脚が出る)開始時刻
function plan(){
 const p=P();
 const can=S.picks<2;
 const pp=can?Math.min(.85,p.pBase+.15):0;
 S.action=Math.random()<pp?'pickoff':'pitch';
 S.fakeLift=S.action==='pickoff'&&Math.random()<p.ambig;
 // 左腕は脚を上げても(前に踏み出して=クロスさせなければ)一塁へ牽制できる。右腕は脚を上げたら投球が基本
 S.t1=T1(p);S.dv=0;S.pRel=p.pickRel;
 if(S.fakeLift){
  if(p.rh){S.dv=Math.max(p.dir,.1);}
  else{S.dv=S.t1;S.pRel=S.t1+p.pickRel*.5;}
 }
 const show=false; // クセは廃止(手がかりは脚の動きだけ)
 if(show){
  S.tellOn=true;
  S.tellKind=p.tell==='any'?TELLS[Math.floor(Math.random()*TELLS.length)]:p.tell;
  S.tellStart=S.setT;S.tellEnd=S.setT+Math.min(.32,p.tellLead-.02);
 }
}
function moveLead(dt,hold){
 if(hold)S.L=Math.min(MAXLEAD,S.L+LEAD_RATE*dt);
 else S.L=Math.max(0,S.L-BACK_RATE*dt);
}
function updateSet(dt){
 const p=P();S.setT+=dt;moveLead(dt,holding());
 const planAt=S.holdTime-p.tellLead;
 if(!S.planned&&S.setT>=planAt){S.planned=true;plan();}
 if(S.tellOn&&S.setT>S.tellEnd)S.tellOn=false;
 if(S.setT>=S.holdTime){
  if(!S.planned){S.planned=true;plan();}
  S.t=S.setT-S.holdTime;S.goT=null;S.resolved=false;S.tellOn=false;
  if(S.action==='pickoff'){S.phase='pickoff';S.picks++;tone(700,.12,'triangle',.03,300);}
  else S.phase='pitch';
 }
}
function updatePickoff(dt){
 const p=P();S.t+=dt;
 if(S.goT===null)moveLead(dt,holding());
 const arrive=S.pRel+PICK_FLY;
 if(!S.resolved&&S.t>=arrive){
  S.resolved=true;
  if(S.goT!==null)resolveOut('pickgo',0,Math.min(BASE_FT-1,runS(S.runL,S.t-S.goT)));
  else if(S.L>0.05)resolveOut('pick',0,S.L);
  else{S.phase='recover';S.timer=.9;S.resBall=FBG;S.toast='牽制をかわした!';S.toastT=.9;}
 }
}
function updatePitch(dt){
 const p=P();S.t+=dt;
 const tc=p.deliv+p.flight,ballAt=tc+p.pop;
 if(S.goT===null){
  moveLead(dt,holding());
  if(S.t>=tc)passPitch();
 }else if(!S.resolved){
  if(S.willSafe){if(S.t>=S.eta){S.resolved=true;resolveSafe(ballAt-S.eta);}}
  else if(S.t>=ballAt){S.resolved=true;resolveOut('caught',S.eta-ballAt,Math.min(BASE_FT-1,runS(S.runL,S.t-S.goT)));}
 }
}
function passPitch(){
 S.ab++;let msg='見送り';
 if(S.ab>=3){S.ab=0;S.picks=0;msg='打者交代 牽制回数リセット';}
 S.toast=msg;S.toastT=1.1;
 S.phase='recover';S.timer=.8;S.resBall=CGL;
}
function pressGo(){
 const ph=S.phase,p=P();
 if(ph==='set'){S.phase='busted';S.runL=S.L;S.runTe=0;S.timer=.9;S.tellOn=false;S.goFlash=.2;tone(500,.1,'square',.04,900);return;}
 if(ph==='pickoff'&&S.goT===null){S.goT=S.t;S.runL=S.L;S.goFlash=.2;tone(500,.1,'square',.04,900);return;}
 if(ph==='pitch'&&S.goT===null){
  S.goT=S.t;S.runL=S.L;S.goFlash=.2;
  S.eta=S.goT+runTime(S.L);
  S.willSafe=S.eta<=(p.deliv+p.flight+p.pop);
  tone(500,.1,'square',.04,900);
 }
}
function resolveSafe(margin){
 S.steals++;S.phase='result';S.after='safe';S.timer=1.3;
 let rec='';S.resS=BASE_FT;S.slideDir=1;
 S.resBall=TG;
 S.banner={t:'SAFE!',s:(margin<.08?'ギリギリセーフ!!':'盗塁成功! (余裕'+margin.toFixed(2)+'秒)')+rec,c:'#4ade80'};
 tone(660,.1,'square',.05);setTimeout(()=>tone(990,.18,'square',.05),110);vib(30);
}
function resolveOut(cause,extra,s){
 S.outs++;S.cause=cause;S.phase='result';S.after='out';S.timer=1.4;
 const m=MSG[cause];let sub=m[1];
 if(cause==='caught'&&extra>0)sub+=' (あと'+extra.toFixed(2)+'秒)';
 S.banner={t:m[0],s:sub,c:'#f87171'};
 S.resS=(s==null?S.L:s);S.slideDir=(cause==='pick')?-1:1;
 S.resBall=(cause==='pick'||cause==='pickgo')?FBG:TG;
 tone(320,.5,'sawtooth',.06,70);vib([60,40,90]);
}
function afterResult(){
 S.pitcher=makePitcher(S.steals);camPose=null;
 if(S.outs>=3){gameOver();return;}
 resetAB();enterReady(.9);
}
function gameOver(){
 S.phase='over';S.overAt=S.time;S.newBest=false;
 if(S.steals>S.best){S.best=S.steals;S.newBest=true;saveBest();}
}
function update(dt){
 if(S.toastT>0)S.toastT-=dt;if(S.goFlash>0)S.goFlash-=dt;
 switch(S.phase){
  case 'ready':moveLead(dt,false);S.timer-=dt;if(S.timer<=0)startSet();break;
  case 'set':updateSet(dt);break;
  case 'pickoff':updatePickoff(dt);break;
  case 'pitch':updatePitch(dt);break;
  case 'busted':S.runTe+=dt;S.timer-=dt;if(S.timer<=0)resolveOut('read',0,Math.min(BASE_FT-2,runS(S.runL,S.runTe)));break;
  case 'recover':moveLead(dt,holding());S.timer-=dt;if(S.timer<=0)startSet();break;
  case 'result':S.timer-=dt;if(S.timer<=0)afterResult();break;
 }
}

/* ---------- 入力 ---------- */
const ptr=new Map(),keys=new Set();
// ボタンは1つ(GO)。リードは自動で取り、牽制の送球が始まったら自動で帰塁する
function holding(){if(S.phase==='pickoff')return S.t<S.pRel;return S.phase!=='ready'&&S.phase!=='over'&&S.phase!=='title';}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function hit(b,p){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;}
function share(){
 const n=S.steals;
 const text='盗塁王で'+n+'盗塁! 称号「'+rankOf(n)+'」 死因:'+(CAUSE[S.cause]||'不明')+' 牽制をかいくぐれ! #盗塁王ゲーム';
 const url='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(location.href.split('#')[0]);
 try{window.open(url,'_blank','noopener');}catch(e){}
}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();audioInit();try{cv.setPointerCapture(e.pointerId);}catch(_){}
 const p=toLocal(e);
 if(S.phase==='title'){ptr.set(e.pointerId,'ui:start');return;}
 if(S.phase==='over'){
  if(S.time-S.overAt<.7)return;
  if(hit(SHARE_BTN,p))ptr.set(e.pointerId,'ui:share');
  else if(hit(RETRY_BTN,p))ptr.set(e.pointerId,'ui:retry');
  return;
 }
 if(p.y<190)return;
 ptr.set(e.pointerId,'go');pressGo();
});
cv.addEventListener('pointerup',e=>{
 const v=ptr.get(e.pointerId);ptr.delete(e.pointerId);if(!v)return;
 if(v==='ui:start'&&S.phase==='title')startGame();
 else if(v==='ui:retry'&&S.phase==='over')startGame();
 else if(v==='ui:share'&&S.phase==='over')share();
});
cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function uiStart(){
 if(S.phase==='title')startGame();
 else if(S.phase==='over'&&S.time-S.overAt>.7)startGame();
}
window.addEventListener('keydown',e=>{
 const k=e.key;
 if(k===' '||k==='Enter'||k==='ArrowRight'||k==='ArrowLeft'||k==='a'||k==='A'||k==='l'||k==='L'){
  e.preventDefault();audioInit();
  if(S.phase==='title'||S.phase==='over'){if(!e.repeat)uiStart();}else if(!e.repeat)pressGo();
 }
});
window.addEventListener('blur',()=>{ptr.clear();keys.clear();});

/* ---------- 描画ヘルパー ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,color,align,weight,stroke){
 ctx.font=(weight||'bold')+' '+size+'px "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif';
 ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
 if(stroke){ctx.lineWidth=stroke.w;ctx.strokeStyle=stroke.c;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
 ctx.fillStyle=color;ctx.fillText(s,x,y);
}
/* ---------- 投手のモーション(左腕: 腕は画面右、牽制は一塁側=画面右へ) ---------- */
const easeIO=u=>{u=clamp01(u);return u*u*(3-2*u);};
const easeOut=u=>{u=clamp01(u);return 1-(1-u)*(1-u);};
const easeIn=u=>{u=clamp01(u);return u*u;};
const POSE_SET={ys:1,lean:0,tw:0,hdy:0,z:1,hipDy:0,hx:16,hy:-32,gx:13,gy:-32,pox:30,poy:-6,
 kfx:-4,kfy:42,ffx:-4,ffy:68,kbx:5,kby:42,fbx:5,fby:62,capDy:0,pup:0,hdx:0,tgy:0,tnod:0,tsh:0};
const mk=o=>Object.assign({},POSE_SET,o);
const TELLS=['cap','glance','glove','nod','shrug'];
const FORM_LABEL={over:'上手投げ',three:'スリークォーター',side:'横手投げ',under:'下手投げ',tornado:'トルネード'};
const FORMS={
 over:{cock:{hx:56,hy:-66,pox:74,poy:-60},rel:{hx:28,hy:-98,pox:62,poy:-80,lean:-.2,hdy:6},fol:{hx:-6,hy:-16,lean:-.28}},
 three:{cock:{hx:62,hy:-58,pox:76,poy:-50},rel:{hx:50,hy:-80,pox:70,poy:-62,lean:-.16,hdy:5},fol:{hx:6,hy:-18,lean:-.2}},
 side:{cock:{hx:68,hy:-44,pox:80,poy:-36},rel:{hx:78,hy:-50,pox:70,poy:-20,lean:-.08,hdy:3},fol:{hx:30,hy:-26,lean:-.12}},
 under:{cock:{hx:44,hy:-10,pox:70,poy:-6,lean:.12},rel:{hx:72,hy:-6,pox:70,poy:6,lean:.22,hdy:2},fol:{hx:44,hy:-44,lean:.12}},
 tornado:{cock:{hx:30,hy:-52,pox:50,poy:-60,tw:-.9,lean:.05,gx:-30,gy:-50},rel:{hx:28,hy:-98,pox:62,poy:-80,lean:-.2,hdy:6},fol:{hx:-6,hy:-16,lean:-.28}}
};
const KICKS={
 quick:{kfy:36,kfx:-8,ffy:54,ffx:-6,hipDy:0},
 low:{kfy:30,kfx:-8,ffy:50,ffx:-6,hipDy:-1},
 mid:{kfy:22,kfx:-9,ffy:44,ffx:-6,hipDy:-2},
 high:{kfy:8,kfx:-9,ffy:34,ffx:-6,hipDy:-4},
 big:{kfy:6,kfx:-9,ffy:32,ffx:-6,hipDy:-4,hx:12,hy:-90,gx:-6,gy:-90,pox:40,poy:-60}
};
const MIRX=['ys','hx','gx','pox','kfx','kbx','ffx','fbx','hdx','pup','tw'];
function mirrorPose(o){const r=Object.assign({},o);MIRX.forEach(k=>{r[k]=-o[k];});r.lean=-o.lean;return r;}
function buildPoses(form,kick,rh){
 const f=FORMS[form],k=KICKS[kick];
 const P0={
  set:mk({}),
  lift:mk(Object.assign({ys:.8,lean:.05,hdy:-2,hx:16,hy:-38,gx:12,gy:-38,pox:30,poy:-12},k)),
  cock:mk(Object.assign({ys:.25,lean:.1,z:1.02,hipDy:2,gx:-40,gy:-60,kfx:-8,kfy:40,ffx:-6,ffy:62,fbx:10},f.cock)),
  rel:mk(Object.assign({ys:0,z:1.1,hipDy:8,gx:-12,gy:-38,kfx:-8,kfy:48,ffx:-8,ffy:70,kbx:14,kby:40,fbx:16,fby:58},f.rel)),
  fol:mk(Object.assign({ys:0,hdy:8,z:1.12,hipDy:10,gx:-16,gy:-28,pox:30,poy:10,kfx:-8,kfy:48,ffx:-8,ffy:70,kbx:14,kby:40,fbx:16,fby:58},f.fol))
 };
 if(!rh){
  P0.pcock=mk({ys:.7,tw:.5,hx:36,hy:-58,gx:-26,gy:-36,pox:62,poy:-52,ffx:14,ffy:52});
  P0.prel=mk({ys:.9,lean:.12,tw:1,hx:78,hy:-36,gx:-14,gy:-30,pox:60,poy:-14,ffx:28,ffy:66,fbx:0,fby:62});
  P0.pfol=mk({ys:.9,lean:.14,tw:1,hx:84,hy:-26,gx:-10,gy:-26,pox:62,poy:-6,ffx:30,ffy:66,fbx:2,fby:60});
  return P0;
 }
 const R={};
 ['set','lift','cock','rel','fol'].forEach(n=>{R[n]=mirrorPose(P0[n]);});
 // 右投手の牽制: 体をひねり、投げ腕を体の前から一塁側へ
 R.pcock=mk({ys:-.2,tw:.5,hx:-52,hy:-52,gx:40,gy:-40,pox:-70,poy:-44,ffx:14,ffy:54,fbx:-12,fby:52});
 R.prel=mk({ys:.9,lean:.18,tw:1,hx:46,hy:-38,gx:30,gy:-30,pox:20,poy:-10,ffx:28,ffy:66,fbx:-14,fby:52});
 R.pfol=mk({ys:.9,lean:.2,tw:1,hx:54,hy:-26,gx:26,gy:-26,pox:24,poy:-4,ffx:30,ffy:66,fbx:-14,fby:52});
 return R;
}
function shade(hex,f){
 const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,t=f<0?0:255,a=Math.abs(f);

function mixP(a,b,u){const o={};for(const k in a)o[k]=a[k]+(b[k]-a[k])*u;return o;}
function pitchPose(p,t){
 // 本物の投球: 脚をゆっくり上げる → 踏み込み → リリース
 const lt=p.lift;let b;
 if(t<lt)b=mixP(p.poses.set,p.poses.lift,easeOut(t/lt));
 else{
  const k=clamp01((t-lt)/(p.deliv-lt));
  b=k<.5?mixP(p.poses.lift,p.poses.cock,easeIO(k*2)):mixP(p.poses.cock,p.poses.rel,easeIn((k-.5)*2));
 }
 if(t>p.deliv)b=mixP(p.poses.rel,p.poses.fol,easeOut((t-p.deliv)/.35));
 return b;
}
function computePose(){
 const p=P(),ph=S.phase,t=S.t;let b;
 const action=(ph==='pickoff'||ph==='pitch');
 if(action){
  if(ph==='pitch')b=pitchPose(p,t);
  else{
   // 牽制: 右腕は脚を上げずに振り向く(ベテランはフェイントで一度脚を上げる)。
   // 左腕は投球と同じ脚上げのまま、踏み出す直前に一塁へ向く
   const dv=S.dv,pr=S.pRel;
   if(t<dv)b=pitchPose(p,t);
   else{
    const k=clamp01((t-dv)/(pr-dv));
    const from=S.fakeLift?pitchPose(p,dv):p.poses.set;
    b=k<.4?mixP(from,p.poses.pcock,easeIO(k/.4)):mixP(p.poses.pcock,p.poses.prel,easeIn((k-.4)/.6));
    if(t>pr)b=mixP(p.poses.prel,p.poses.pfol,easeOut((t-pr)/.3));
   }
  }
  b.pup=b.tw*3;
 }else{
  b=Object.assign({},p.poses.set);
  b.hipDy+=Math.sin(S.time*3)*1.2;b.hy+=Math.sin(S.time*3+1)*.8;b.gy+=Math.sin(S.time*3+1)*.8;
  if(ph==='set'&&S.tellOn){
   const e=Math.sin(clamp01((S.setT-S.tellStart)/Math.max(.01,S.tellEnd-S.tellStart))*Math.PI),amp=p.amp;
   if(S.tellKind==='cap')b.capDy=-13*e*amp;
   if(S.tellKind==='glance'){const a=Math.max(.7,amp);b.pup=4.5*e*a;b.hdx=5*e*a;}
   if(S.tellKind==='glove')b.tgy=18*e*amp;
   if(S.tellKind==='nod')b.tnod=9*e*amp;
   if(S.tellKind==='shrug')b.tsh=7*e*amp;
  }
 }
 return b;
}
let camPose=null;
function updatePose(dt){
 const target=computePose(),ph=S.phase;
 if(!camPose||ph==='pickoff'||ph==='pitch'||ph==='title'){camPose=target;return;}
 const a=Math.min(1,dt*9);
 for(const k in target)camPose[k]+=(target[k]-camPose[k])*a;
 // クセは即座に出す(なまらせない)
 camPose.capDy=target.capDy;camPose.pup=target.pup;camPose.hdx=target.hdx;camPose.tgy=target.tgy;camPose.tnod=target.tnod;camPose.tsh=target.tsh;
}
function ballInHand(){
 const p=P(),ph=S.phase;
 if(ph==='pickoff')return S.t<S.pRel;
 if(ph==='pitch')return S.t<p.deliv;
 if(ph==='busted')return S.runTe<.1;
 if(ph==='recover')return S.timer<=.4;
 if(ph==='result')return false;
 return true;
}
/* フィールド上のボール位置(真上から見た座標) */
function ballPos(){
 const p=P(),ph=S.phase;
 const arc=(a,b,u,h)=>({x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u)-Math.sin(u*Math.PI)*h});
 if(ph==='pickoff'){
  if(S.t<S.pRel)return HP;
  return arc(HP,FBG,clamp01((S.t-S.pRel)/PICK_FLY),10);
 }
 if(ph==='pitch'){
  const t=S.t,tc=p.deliv+p.flight,ballAt=tc+p.pop;
  if(t<p.deliv)return HP;
  if(t<tc)return arc(HP,CGL,clamp01((t-p.deliv)/p.flight),5);
  if(S.goT!==null){
   const tr=tc+p.pop*.45;if(t<tr)return CGL;
   return arc(CGL,TG,clamp01((t-tr)/(ballAt-tr)),34);
  }
  return CGL;
 }
 if(ph==='result')return S.resBall;
 if(ph==='recover')return S.timer>.4?S.resBall:HP;
 if(ph==='busted'){const u=clamp01((S.runTe-.1)/.5);return u<=0?HP:arc(HP,TG,u,30);}
 return HP;
}
function runnerFt(){
 if((S.phase==='pickoff'||S.phase==='pitch')&&S.goT!==null)return Math.min(BASE_FT,runS(S.runL,S.t-S.goT));
 if(S.phase==='busted')return Math.min(BASE_FT-2,runS(S.runL,S.runTe));
 if(S.phase==='result')return S.resS;
 return S.L;
}
function goEnabled(){
 return S.phase==='set'||(S.phase==='pickoff'&&S.goT===null)||(S.phase==='pitch'&&S.goT===null);
}

function ik(sx,sy,tx,ty,l1,l2,px,py){
 let dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy);const mx=l1+l2-1;
 if(d>mx){const f=mx/d;dx*=f;dy*=f;d=mx;tx=sx+dx;ty=sy+dy;}
 if(d<10){dx=dx||1;const f=10/Math.hypot(dx,dy);dx*=f;dy*=f;d=10;tx=sx+dx;ty=sy+dy;}
 const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a)),ux=dx/d,uy=dy/d;
 const e1=[sx+ux*a-uy*h,sy+uy*a+ux*h],e2=[sx+ux*a+uy*h,sy+uy*a-ux*h];
 const d1=(e1[0]-px)*(e1[0]-px)+(e1[1]-py)*(e1[1]-py),d2=(e2[0]-px)*(e2[0]-px)+(e2[1]-py)*(e2[1]-py);
 return {e:d1<d2?e1:e2,h:[tx,ty]};
}

 const a2=ik(ST[0],ST[1],po.hx,po.hy,33,33,po.pox,po.poy);
 drawLimb([ST,a2.e],12,L.jersey);drawLimb([a2.e,a2.h],9,fore);
 ctx.fillStyle=L.skin;ctx.beginPath();ctx.arc(a2.h[0],a2.h[1],6.5,0,7);ctx.fill();
 if(withBall)ballAt(a2.h[0],a2.h[1],8.5);
 ctx.restore();
}
function ballAt(x,y,r){
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
 ctx.strokeStyle='#d33';ctx.lineWidth=Math.max(1,r*.22);
 ctx.beginPath();ctx.arc(x-r*.65,y,r*.75,-1,1);ctx.stroke();
 ctx.beginPath();ctx.arc(x+r*.65,y,r*.75,Math.PI-1,Math.PI+1);ctx.stroke();
}
/* 投手アップ: マウンドの投手を拡大して、クセと牽制/投球の向きを見せる */
function drawPitcherCam(){
 if(!camPose)return;
 const I=INSET;
 ctx.save();
 rr(I.x,I.y,I.w,I.h,14);ctx.clip();
 const g=ctx.createLinearGradient(0,I.y,0,I.y+I.h);g.addColorStop(0,'#1a3a5e');g.addColorStop(1,'#1d5c33');
 ctx.fillStyle=g;ctx.fillRect(I.x,I.y,I.w,I.h);
 ctx.translate(I.x+I.w/2,I.y+82);ctx.scale(.6,.6);
 drawPitcher(camPose,ballInHand());
 ctx.restore();
 ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;rr(I.x,I.y,I.w,I.h,14);ctx.stroke();
 drawFootCam();
 txt('投手',I.x+10,I.y+17,11,'rgba(255,255,255,.8)','left');
 {const rh=P().rh;ctx.fillStyle=rh?'#dc2626':'#2563eb';rr(I.x+8,I.y+26,50,20,10);ctx.fill();
  txt(rh?'右腕':'左腕',I.x+33,I.y+41,13,'#fff','center','bold');}
}
/* 足元アップ(真横から): 脚上げ→踏み込み、牽制は脚を上げない */
function pitchFoot(p,t){
 let lh=0,stride=0,sink=0;
 const kl={quick:.55,low:.7,mid:.85,high:1,big:1.05}[p.kick]||.85;
 const lt=p.lift,dl=p.deliv,t1=T1(p),t2=dl*.92;
 if(t<lt)lh=easeOut(t/lt)*kl;
 else if(t<t1)lh=kl;
 else if(t<t2){const u=clamp01((t-t1)/(t2-t1));lh=kl*(1-easeIn(u));stride=easeOut(u);}
 else{stride=1;sink=clamp01((t-t2)/.2);}
 return {lh:lh,stride:stride,sink:sink,side:0,off:0};
}
function footParams(){
 const p=P(),ph=S.phase,t=S.t;
 if(ph==='pitch')return pitchFoot(p,t);
 if(ph==='pickoff'){
  const dv=S.dv;
  if(S.fakeLift){
   if(t<dv)return pitchFoot(p,t);
   const f=pitchFoot(p,dv),u=clamp01((t-dv)/.25);
   // 左腕: ホームへ踏み出さず、一塁側(手前)へ足を下ろす
   return {lh:f.lh*(1-u),stride:0,sink:0,side:p.rh?0:easeOut(u),off:0};
  }
  return {lh:p.rh?.25*Math.sin(clamp01(t/S.pRel)*Math.PI):.2*Math.sin(clamp01(t/S.pRel)*Math.PI),stride:0,sink:0,side:easeIO(clamp01(t/S.pRel)),off:p.rh?easeOut(clamp01(t/(S.pRel*.55))):0};
 }
 return {lh:0,stride:0,sink:0,side:0,off:0};
}
function shoe(x,y,ang,dir,sq){
 ctx.save();ctx.translate(x,y);ctx.rotate(ang*dir);ctx.scale(dir*sq,1);
 ctx.fillStyle='#1f2937';rr(-11,-7,32,13,6);ctx.fill();
 ctx.fillStyle='#f3f4f6';ctx.fillRect(-10,4,30,2);
 ctx.restore();
}
/* 足元アップ: 画面右=一塁(ランナー)。右腕は三塁側(左)、左腕は一塁側(右)を向いて立つ。
   投球=脚を上げてホーム(手前)へ踏み出す / 左腕の牽制=一塁側(右)へ踏み出す / 右腕の牽制=軸足(右足)をプレートから外して振り向く */
function drawFootCam(){
 const F=FOOT,p=P(),L=p.look,fp=footParams(),fd=p.rh?-1:1;
 ctx.save();rr(F.x,F.y,F.w,F.h,14);ctx.clip();
 const g=ctx.createLinearGradient(0,F.y,0,F.y+F.h);g.addColorStop(0,'#1a3a5e');g.addColorStop(1,'#245c36');
 ctx.fillStyle=g;ctx.fillRect(F.x,F.y,F.w,F.h);
 const gy=F.y+F.h-22,cx=F.x+F.w/2,bob=(S.phase==='set'||S.phase==='ready')?Math.sin(S.time*3)*1.2:0;
 ctx.fillStyle='#8a5a32';ctx.fillRect(F.x,gy,F.w,F.h);
 ctx.fillStyle='#f3f4f6';rr(cx-34,gy-2,68,6,3);ctx.fill();   // ピッチャープレート(一塁-三塁方向に長い)
 const hipY=F.y+28+5*fp.stride+5*fp.sink+bob,hx=fd*6*fp.stride;
 const hipB=[cx-3+hx,hipY],hipF=[cx+3+hx,hipY];
 const fy0=gy-6,topY=hipY+26;
 const pivot=[cx-2,fy0-13*fp.off-fp.lh*2];
 const front=[cx+4-fd*8*fp.lh+fd*8*fp.stride+34*fp.side,fy0+5-fp.lh*(fy0+5-topY)+12*fp.stride];
 const toR=p.rh&&fp.side>.4,dF=toR?1:fd,pd=toR?1:fd;
 const legs=[[hipB,pivot,'#c9c9c9',0,fd,1],[hipF,front,'#e8e8e8',fp.lh*.4,dF,1-.45*fp.stride]];
 for(let i=0;i<2;i++){
  const lg=legs[i],k=ik(lg[0][0],lg[0][1],lg[1][0],lg[1][1],41,41,lg[0][0]+pd*200,lg[0][1]);
  drawLimb([lg[0],k.e],19,lg[2]);drawLimb([k.e,k.h],17,lg[2]);
  const m=[k.e[0]+(k.h[0]-k.e[0])*.45,k.e[1]+(k.h[1]-k.e[1])*.45];
  drawLimb([m,k.h],14,L.jersey);
  shoe(k.h[0]+lg[4]*2,k.h[1]+2,lg[3],lg[4],lg[5]);
 }
 const bx=(hipB[0]+hipF[0])/2;
 ctx.fillStyle=L.jersey;rr(bx-24,hipY-34,48,28,8);ctx.fill();
 ctx.fillStyle='#222';ctx.fillRect(bx-24,hipY-8,48,5);
 ctx.fillStyle='#dcdcdc';rr(bx-24,hipY-3,48,12,5);ctx.fill();
 // 画面端のランナー側表示
 txt('→一塁',F.x+F.w-8,F.y+F.h-6,10,'rgba(255,255,255,.75)','right');
 ctx.restore();
 ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;rr(F.x,F.y,F.w,F.h,14);ctx.stroke();
 txt('足元',F.x+10,F.y+17,11,'rgba(255,255,255,.85)','left');
}
function drawBall(){const b=ballPos();ballAt(b.x,b.y,5);}
function drawHUD(){
 const p=P();
 txt('盗塁 '+S.steals,14,34,28,'#fde047','left','bold',{w:4,c:'rgba(0,0,0,.5)'});
 txt(p.grade+'  '+p.name,14,56,13,'#cbd5e1','left');
 txt('OUT',214,24,13,'#cbd5e1','left');
 for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(262+i*24,19,8,0,7);if(i<S.outs){ctx.fillStyle='#ef4444';ctx.fill();}else{ctx.strokeStyle='#64748b';ctx.lineWidth=2;ctx.stroke();}}
 if(S.toastT>0)txt(S.toast,W/2,204,16,'#fff','center','bold',{w:4,c:'rgba(0,0,0,.7)'});
 else if(S.steals<2&&(S.phase==='set'||S.phase==='pitch'||S.phase==='pickoff')&&S.goT===null){
  const ph=S.phase,rh=p.rh;let m,c='#fff';
  if(ph==='set')m=rh?'脚が上がったらタップ! 牽制のときは押さない!':'左腕は脚を上げても牽制あり! 前へ踏み出したらタップ!';
  else if(ph==='pitch'){
   if(rh){m='▲ 脚が上がった!タップ!';c='#fde047';}
   else if(S.t>=S.t1){m='▲ 踏み出した!タップ!';c='#fde047';}
   else m='脚が上がった…踏み出す向きを見ろ!';
  }else{
   if(S.fakeLift&&S.t<S.dv)m='脚が上がった…踏み出す向きを見ろ!';
   else{m='牽制だ!押すな!';c='#fca5a5';}
  }
  txt(m,W/2,204,15,c,'center','bold',{w:4,c:'rgba(0,0,0,.7)'});
 }
}
function btn(x,y,w,h,col,label,sub,on){
 ctx.fillStyle=col;rr(x,y,w,h,18);ctx.fill();
 ctx.strokeStyle=on?'#fff':'rgba(255,255,255,.25)';ctx.lineWidth=on?4:2;rr(x,y,w,h,18);ctx.stroke();
 txt(label,x+w/2,y+h/2+4,30,'#fff','center','bold');
 txt(sub,x+w/2,y+h-18,11,'rgba(255,255,255,.8)','center','normal');
}
function drawControls(){
 const go=goEnabled();
 btn(12,492,336,130,S.goFlash>0?'#fbbf24':(go?'#d97706':'#5a3f10'),'GO!','脚が上がったらタップ(牽制のときは押さない)',S.goFlash>0);
}
function drawBanner(){
 let big=null,sub='',col='#fff';
 if(S.phase==='result'&&S.banner){big=S.banner.t;sub=S.banner.s;col=S.banner.c;}
 else if(S.phase==='ready'){
  const p=P();
  big=p.grade+' 登板!';sub=p.name+'('+p.style+')'; col='#fde047';
 }
 if(!big)return;
 ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,70,W,84);
 txt(big,W/2,114,36,col,'center','bold',{w:5,c:'rgba(0,0,0,.6)'});
 txt(sub,W/2,140,14,'#e5e7eb','center');
}
function drawTitle(){
 ctx.fillStyle='rgba(5,12,20,.78)';ctx.fillRect(0,0,W,H);
 txt('盗塁王',W/2,150,68,'#fde047','center','bold',{w:8,c:'#7c2d12'});
 txt('牽制をかいくぐれ!',W/2,190,20,'#fff','center');
 const r=['投手が脚を上げたら','タップで盗塁!','牽制のときは押すな!','3アウトで終了'];
 r.forEach((s,i)=>txt(s,W/2,262+i*38,i<3?22:15,i==2?'#fca5a5':(i<3?'#e5e7eb':'#94a3b8'),'center',i<3?'bold':'normal'));
 const a=.55+.45*Math.sin(S.time*4);
 ctx.globalAlpha=a;txt('TAP TO START',W/2,452,26,'#fff','center');ctx.globalAlpha=1;
 if(S.best>0)txt('ベスト '+S.best+' 盗塁',W/2,490,15,'#93c5fd','center');
}
function drawOver(){
 ctx.fillStyle='rgba(5,12,20,.84)';ctx.fillRect(0,0,W,H);
 txt('GAME OVER',W/2,96,26,'#f87171','center','bold');
 txt('盗塁',W/2,140,18,'#cbd5e1','center');
 txt(String(S.steals),W/2,214,76,'#fde047','center','bold',{w:6,c:'#7c2d12'});
 txt('「'+rankOf(S.steals)+'」',W/2,262,26,'#fff','center','bold');
 txt('死因:'+(CAUSE[S.cause]||'-'),W/2,302,17,'#fca5a5','center');
 txt('ベスト '+S.best+(S.newBest?'  NEW!':''),W/2,336,16,S.newBest?'#fde047':'#93c5fd','center');
 txt('Xでシェアして友達に挑戦させよう',W/2,382,13,'#94a3b8','center','normal');
 ctx.fillStyle='#1d9bf0';rr(SHARE_BTN.x,SHARE_BTN.y,SHARE_BTN.w,SHARE_BTN.h,14);ctx.fill();
 txt('Xでシェア',W/2,SHARE_BTN.y+34,22,'#fff','center');
 ctx.fillStyle='#16a34a';rr(RETRY_BTN.x,RETRY_BTN.y,RETRY_BTN.w,RETRY_BTN.h,14);ctx.fill();
 txt('もう一回',W/2,RETRY_BTN.y+34,22,'#fff','center');
}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 drawBG();drawActors();drawBall();drawPitcherCam();
 if(S.phase==='title'){drawTitle();return;}
 drawHUD();drawControls();drawBanner();
 if(S.phase==='over')drawOver();
}

/* ---------- ループ ---------- */
let last=0;
function frame(ts){
 const dt=Math.min(.033,Math.max(0,(ts-last)/1000||0));last=ts;
 S.time+=dt;update(dt);updatePose(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
