<script>
(function(){
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=640;
let DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}
resize();window.addEventListener('resize',resize);

/* ---------- 定数 ---------- */
const BASE_FT=90;
const SPEED=62,ACC=0.5,MAXLEAD=12,LEAD_RATE=26,BACK_RATE=70,PICK_FLY=0.28;
/* 球場は真上から見た配置: ホームが下、一塁が右、二塁が上、三塁が左 */
const HOME={x:180,y:448},B1={x:300,y:328},B2={x:180,y:208},B3={x:60,y:328},MOUND={x:180,y:334};
const FBM={x:324,y:322},SSM={x:148,y:226},SECM={x:240,y:252},TBM={x:44,y:324},BAT={x:142,y:452},CATCH={x:180,y:472};
const HP={x:MOUND.x+6,y:MOUND.y-30};            // 投手の手元
const FBG={x:FBM.x-12,y:FBM.y-22};              // 一塁手のグラブ
const CGL={x:CATCH.x,y:CATCH.y-24};             // 捕手のミット
const TG={x:B2.x-8,y:B2.y-14};                  // 二塁でのタッチ位置
const INSET={x:12,y:62,w:200,h:130};
const FOOT={x:218,y:62,w:130,h:130};            // 足元アップ(脚上げ=GOの合図を見る窓)            // 投手アップ(クセを見る窓)
/* ---------- ランキング(Supabase / 未設定ならボタンごと非表示) ---------- */
const RANK_CFG={url:'https://sqtgtzouaodytpkapmqn.supabase.co',key:'sb_publishable_nJIR_zrTyJArCVLRjlrQfQ__wvnmUag'}; // ← Supabaseの Project URL と anon key を入れると有効化
const RANK_ON=()=>!!(RANK_CFG.url&&RANK_CFG.key);
const RANK_BTN={x:30,y:536,w:300,h:48};
const RK={my:null,open:false,tab:'score',rows:null,loading:false,err:'',submitted:false,sending:false,name:''};
try{RK.name=localStorage.getItem('tourui_name')||'';}catch(e){}
function rkHeaders(extra){const h={apikey:RANK_CFG.key};if(RANK_CFG.key.indexOf('sb_')!==0)h.Authorization='Bearer '+RANK_CFG.key;return Object.assign(h,extra||{});}
function rkFetch(tab){
 RK.tab=tab;RK.loading=true;RK.err='';RK.rows=null;
 const ord=tab==='score'?'score.desc,steals.desc':'steals.desc,score.desc';
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
 fetch(RANK_CFG.url+'/rest/v1/tourui_scores?select=name,steals,score&order='+ord+'&limit=15',{headers:rkHeaders(),signal:ctl.signal})
  .then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{if(RK.tab===tab){RK.rows=j;RK.loading=false;}})
  .catch(()=>{RK.err='ランキングを取得できません';RK.loading=false;}).finally(()=>clearTimeout(to));
}
function rkCount(q){
 return fetch(RANK_CFG.url+'/rest/v1/tourui_scores?select=id&'+q,{headers:rkHeaders({Prefer:'count=exact',Range:'0-0'})})
  .then(r=>{const m=(r.headers.get('content-range')||'').match(/\/(\d+)/);if(!m)throw 0;return +m[1];});
}
// 今回のスコアが全国で何位になるか(登録済みの記録との比較)
function rkMyRank(){
 if(!RANK_ON()||S.score<=0){RK.my=null;return;}
 const sc=S.score,id=++RK.myId||(RK.myId=1);RK.my={loading:true};
 Promise.all([rkCount('score=gt.'+sc),rkCount('score=gte.0')]).then(a=>{if(RK.myId===id)RK.my={rank:a[0]+1,total:a[1]};}).catch(()=>{if(RK.myId===id)RK.my=null;});
}
function rkSubmit(){
 if(RK.sending||RK.submitted||S.score<=0)return;
 let nm=RK.name;
 try{nm=window.prompt('ランキングに載せる名前(12文字まで)',RK.name||'');}catch(e){}
 if(nm===null||nm===undefined)return;
 nm=String(nm).trim().slice(0,12);if(!nm)return;
 RK.name=nm;try{localStorage.setItem('tourui_name',nm);}catch(e){}
 RK.sending=true;RK.err='';
 fetch(RANK_CFG.url+'/rest/v1/tourui_scores',{method:'POST',headers:rkHeaders({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({name:nm,steals:S.steals,score:S.score})})
  .then(r=>{if(!r.ok)throw 0;RK.submitted=true;rkFetch(RK.tab);rkMyRank();}).catch(()=>{RK.err='送信できませんでした';}).finally(()=>{RK.sending=false;});
}
const RK_TAB1={x:20,y:66,w:155,h:36},RK_TAB2={x:185,y:66,w:155,h:36},RK_SUB={x:30,y:508,w:300,h:48},RK_CLOSE={x:30,y:566,w:300,h:46};
function drawRank(){
 ctx.fillStyle='#050c14';ctx.fillRect(0,0,W,H);
 txt('ランキング',W/2,48,26,'#fde047','center','bold');
 [[RK_TAB1,'スコア順','score'],[RK_TAB2,'盗塁数順','steals']].forEach(([b,l,k])=>{ctx.fillStyle=RK.tab===k?'#d97706':'rgba(255,255,255,.1)';rr(b.x,b.y,b.w,b.h,10);ctx.fill();txt(l,b.x+b.w/2,b.y+24,16,'#fff','center','bold');});
 if(RK.my&&RK.my.rank)txt('今回のスコアは全国 '+RK.my.rank+'位',W/2,122,13,'#fde047','center','bold');
 if(RK.loading)txt('読み込み中…',W/2,300,16,'#cbd5e1','center');
 else if(RK.rows&&RK.rows.length===0)txt('まだ記録がありません',W/2,300,16,'#cbd5e1','center');
 else if(RK.rows)RK.rows.forEach((r,i)=>{
  const y=134+i*24,col=i===0?'#fde047':(i<3?'#fff':'#cbd5e1');
  txt(String(i+1),40,y,14,col,'right','bold');
  txt(String(r.name||'').slice(0,12),52,y,14,col,'left','bold');
  txt(r.score+'点',250,y,14,col,'right','bold');
  txt(r.steals+'盗塁',322,y,13,col,'right','normal');
 });
 if(RK.err)txt(RK.err,W/2,492,13,'#fca5a5','center');
 const can=S.score>0&&!RK.submitted;
 ctx.fillStyle=can?'#16a34a':'#374151';rr(RK_SUB.x,RK_SUB.y,RK_SUB.w,RK_SUB.h,14);ctx.fill();
 txt(RK.submitted?'登録しました!':(can?'今回の記録を登録('+S.score+'点)':'登録できる記録がありません'),W/2,RK_SUB.y+31,17,'#fff','center','bold');
 ctx.fillStyle='rgba(255,255,255,.12)';rr(RK_CLOSE.x,RK_CLOSE.y,RK_CLOSE.w,RK_CLOSE.h,14);ctx.fill();
 txt('閉じる',W/2,RK_CLOSE.y+30,18,'#fff','center','bold');
}
const SHARE_BTN={x:30,y:404,w:300,h:52},RETRY_BTN={x:30,y:470,w:300,h:52};
function pathPos(s){const u=s/BASE_FT;return {x:B1.x+(B2.x-B1.x)*u,y:B1.y+(B2.y-B1.y)*u};}
const MSG={
 pick:['アウト!','牽制に刺された…'],
 pickgo:['アウト!','牽制に釣られた!!'],
 caught:['アウト!','スタートが遅かった…'],
 read:['アウト!','投球前にスタート!読まれた…'],
 pass:['アウト!','見送りはアウト!投球なら走れ!']
};
const CAUSE={pick:'牽制死',pickgo:'牽制に釣られた',caught:'盗塁死',read:'フライング',pass:'見送り'};

/* ---------- 状態 ---------- */
const S={phase:'title',paused:false,time:0,steals:0,outs:0,lv:0,introLv:-1,intro:false,L:0,picks:0,ab:0,
 setT:0,holdTime:1,planned:false,action:'pitch',tellOn:false,tellKind:null,tellStart:0,tellEnd:0,
 t:0,goT:null,runL:0,runTe:0,eta:0,willSafe:false,resolved:false,timer:0,banner:null,after:'',cause:'',
 resS:0,resT:0,tagT:99,bannerAt:0,arr:0,u0:0,tagDone:false,resBall:{x:0,y:0},slideDir:1,toast:'',toastT:0,pops:[],disp:0,waitNext:false,waitT:0,tier:0,tierUp:false,overAt:0,best:0,bestScore:0,bestTime:0,score:0,gain:0,dodges:0,lastTime:0,newBest:false,newBestScore:false,goFlash:0};
if(location.search.indexOf('debug')>=0)window.__stealGame={S:S,makePitcher:function(n){return makePitcher(n);}}; // テスト用(?debug の時だけ公開)
try{S.best=parseInt(localStorage.getItem('tourui_best')||'0',10)||0;}catch(e){}
try{S.bestScore=parseInt(localStorage.getItem('tourui_best_score')||'0',10)||0;S.bestTime=parseFloat(localStorage.getItem('tourui_best_time')||'0')||0;}catch(e){}
function saveBest(){try{localStorage.setItem('tourui_best',String(S.best));localStorage.setItem('tourui_best_score',String(S.bestScore));localStorage.setItem('tourui_best_time',String(S.bestTime));}catch(e){}}

const P=()=>S.pitcher;
const clamp01=x=>x<0?0:x>1?1:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
function runS(L0,te){if(te<=0)return L0;if(te<ACC)return L0+SPEED*te*te/(2*ACC);return L0+SPEED*(te-ACC/2);}
function runTime(L0){return (BASE_FT-L0)/SPEED+ACC/2;}
function rankOf(n){const T=[[100,'伝説の盗塁王'],[70,'神速の怪物'],[50,'プロ級の足'],[35,'盗塁王'],[20,'韋駄天'],[10,'盗塁職人'],[5,'俊足レギュラー'],[1,'盗塁デビュー']];for(const t of T)if(n>=t[0])return t[1];return '一塁ベース番';}

/* ---------- 音・振動 ---------- */
let AC=null;
function audioInit(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,type,vol,f2){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(vol||.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* ---------- ゲーム進行 ---------- */
function addPop(text,col,delay,hold){S.pops.push({text:text,col:col,t:-(delay||0),hold:!!hold});}
function resetAB(){S.L=0;S.picks=0;S.ab=0;S.goT=null;S.resolved=false;}
function startGame(){
 S.pops=[];S.disp=0;S.tier=0;S.tierUp=false;RK.open=false;RK.submitted=false;RK.err='';S.paused=false;S.score=0;S.gain=0;S.dodges=0;S.steals=0;S.outs=0;S.pitcher=makePitcher(0);camPose=null;S.cause='';S.banner=null;S.toastT=0;
 resetAB();enterReady(1.2);
}
function enterReady(t){
 S.readyT=0;S.phase='ready';S.intro=true;S.timer=Math.max(t,(S.steals===0&&S.outs===0)?1.2:.55);
}
function startSet(){
 const p=P();
 S.phase='set';S.setT=0;S.holdTime=rand(p.hold[0],p.hold[1]);S.planned=false;
 S.tellOn=false;S.tellKind=null;S.goT=null;S.t=0;S.resolved=false;S.fakeLift=false;S.dv=0;S.pRel=p.pickRel;S.t1=T1(p);
}
const T1=p=>p.lift+(p.deliv-p.lift)*.22; // 踏み込み(ホームへ脚が出る)開始時刻
function plan(){
 const p=P();
 const can=S.picks<2;
 const pp=can?Math.min(.85,p.pBase+.15):0;
 S.action=Math.random()<pp?'pickoff':'pitch';
 S.fakeLift=S.action==='pickoff'&&Math.random()<p.ambig;
 // 左腕は脚を上げても(前に踏み出して=クロスさせなければ)一塁へ牽制できる。右腕は脚を上げたら投球が基本
 S.t1=T1(p);S.dv=0;S.pRel=p.pickRel;
 if(S.fakeLift){
  if(p.rh){S.dv=Math.max(p.dir,.1);}
  else{S.dv=S.t1;S.pRel=S.t1+p.pickRel*.5;}
 }
 const show=false; // クセは廃止(手がかりは脚の動きだけ)
 if(show){
  S.tellOn=true;
  S.tellKind=p.tell==='any'?TELLS[Math.floor(Math.random()*TELLS.length)]:p.tell;
  S.tellStart=S.setT;S.tellEnd=S.setT+Math.min(.32,p.tellLead-.02);
 }
}
function moveLead(dt,hold){
 if(hold)S.L=Math.min(MAXLEAD,S.L+LEAD_RATE*dt);
 else S.L=Math.max(0,S.L-BACK_RATE*dt);
}
function updateSet(dt){
 const p=P();S.setT+=dt;moveLead(dt,holding());
 const planAt=S.holdTime-p.tellLead;
 if(!S.planned&&S.setT>=planAt){S.planned=true;plan();}
 if(S.tellOn&&S.setT>S.tellEnd)S.tellOn=false;
 if(S.setT>=S.holdTime){
  if(!S.planned){S.planned=true;plan();}
  S.t=S.setT-S.holdTime;S.goT=null;S.resolved=false;S.tellOn=false;
  if(S.action==='pickoff'){S.phase='pickoff';S.picks++;tone(700,.12,'triangle',.03,300);}
  else S.phase='pitch';
 }
}
function updatePickoff(dt){
 const p=P();S.t+=dt;
 if(S.goT===null)moveLead(dt,holding());
 const arrive=S.pRel+PICK_FLY;
 if(!S.resolved&&S.t>=arrive){
  S.resolved=true;
  if(S.goT!==null)resolveOut('pickgo',0,Math.min(BASE_FT-1,runS(S.runL,S.t-S.goT)));
  else if(S.L>0.05)resolveOut('pick',0,S.L);
  else{S.phase='recover';S.timer=.55;S.resBall=FBG;S.dodges++;S.score+=50;addPop('牽制回避 +50','#7dd3fc',0);S.toast='牽制をかわした!';S.toastT=.9;}
 }
}
function updatePitch(dt){
 const p=P();S.t+=dt;
 const tc=p.deliv+p.flight,ballAt=tc+p.pop;
 if(S.goT===null){
  moveLead(dt,holding());
  if(S.t>=tc){S.resolved=true;resolveOut('pass',0,S.L);}
 }else if(!S.resolved){
  if(S.willSafe){if(S.t>=S.eta){S.resolved=true;resolveSafe(ballAt-S.eta);}}
  else if(S.t>=ballAt){S.resolved=true;resolveOut('caught',S.eta-ballAt,Math.min(BASE_FT-1,runS(S.runL,S.t-S.goT)));}
 }
}
function passPitch(){
 S.ab++;let msg='見送り';
 if(S.ab>=3){S.ab=0;S.picks=0;msg='打者交代 牽制回数リセット';}
 S.toast=msg;S.toastT=1.1;
 S.phase='recover';S.timer=.5;S.resBall=CGL;
}
function pressGo(){
 const ph=S.phase,p=P();
 if(ph==='result'){if(S.waitNext&&S.waitT>.25)afterResult();return;}
 if(ph==='set'){S.phase='busted';S.runL=S.L;S.runTe=0;S.timer=.9;S.tellOn=false;S.goFlash=.2;tone(500,.1,'square',.04,900);return;}
 if(ph==='pickoff'&&S.goT===null){S.goT=S.t;S.runL=S.L;S.goFlash=.2;tone(500,.1,'square',.04,900);return;}
 if(ph==='pitch'&&S.goT===null){
  S.goT=S.t;S.runL=S.L;S.goFlash=.2;
  S.eta=S.goT+runTime(S.L);
  S.willSafe=S.eta<=(p.deliv+p.flight+p.pop);
  tone(500,.1,'square',.04,900);
 }
}
function resolveSafe(margin){
 S.steals++;S.phase='result';S.after='safe';S.waitNext=false;S.waitT=0;
 {const tm=S.eta,base=100,tier=tm<=1.9?['神速',300]:(tm<=2.1?['快速',200]:(tm<=2.3?['好タイム',100]:['',0])),tb=tier[1];
  S.lastTime=tm;S.gain=base+tb;S.score+=S.gain;S.safeBase=base;S.safeTb=tb;S.safeTier=tier[0];
  if(S.bestTime===0||tm<S.bestTime)S.bestTime=tm;}
 let rec='';S.resS=BASE_FT;S.slideDir=1;
 S.resBall=TG;
 {const p=P(),tc=p.deliv+p.flight,tr=tc+p.pop*.45,ba=tc+p.pop;
  S.u0=clamp01((S.t-tr)/(ba-tr));S.arr=Math.min(margin,.45)+.1;
  S.resT=0;S.tagDone=false;S.tagT=S.arr+.05+.12;S.bannerAt=S.tagT+.08;S.timer=S.bannerAt+.75;}
 addPop('盗塁成功 +'+S.safeBase,'#4ade80',S.bannerAt,true);if(S.safeTb)addPop('【'+S.safeTier+'】二塁到達 '+S.lastTime.toFixed(2)+'秒 +'+S.safeTb,'#fde047',S.bannerAt+.45,true);
 S.banner={t:'SAFE!',s:'盗塁 +'+S.safeBase+'  /  二塁到達 '+S.lastTime.toFixed(2)+'秒'+(S.safeTb?'【'+S.safeTier+'】 +'+S.safeTb:'(ボーナスなし)'),c:'#4ade80'};
 tone(660,.1,'square',.05);setTimeout(()=>tone(990,.18,'square',.05),110);vib(30);
}
function resolveOut(cause,extra,s){
 S.outs++;S.cause=cause;S.phase='result';S.after='out';S.timer=1.1;S.waitNext=false;S.waitT=0;
 S.resT=0;S.tagDone=false;S.tagT=99;S.bannerAt=0;S.arr=0;
 if(cause==='caught'||cause==='read'){S.tagT=.2;S.bannerAt=.28;S.timer=1.3;}
 const m=MSG[cause];let sub=m[1];
 if(cause==='caught'&&extra>0)sub+=' (あと'+extra.toFixed(2)+'秒)';
 S.banner={t:m[0],s:sub,c:'#f87171'};
 S.resS=(s==null?S.L:s);S.slideDir=(cause==='pick')?-1:1;
 S.resBall=(cause==='pick'||cause==='pickgo')?FBG:(cause==='pass'?CGL:TG);
 tone(320,.5,'sawtooth',.06,70);vib([60,40,90]);
}
function afterResult(){
 S.pops=S.pops.filter(q=>!q.hold);
 S.waitNext=false;S.waitT=0;
 S.pitcher=makePitcher(S.steals);camPose=null;
 if(S.outs>=3){gameOver();return;}
 resetAB();{const nt=tierOf(S.steals).id;S.tierUp=nt>S.tier;S.tier=nt;}
 enterReady(S.tierUp?1.8:1.3);
}
function gameOver(){
 S.phase='over';S.overAt=S.time;S.newBest=false;S.newBestScore=false;rkMyRank();
 if(S.steals>S.best){S.best=S.steals;S.newBest=true;}
 if(S.score>S.bestScore){S.bestScore=S.score;S.newBestScore=true;}
 saveBest();
}
function update(dt){
 S.pops.forEach(q=>q.t+=dt);S.pops=S.pops.filter(q=>q.hold||q.t<1.9);
 if(S.disp!==S.score){const d=S.score-S.disp;S.disp+=Math.abs(d)<2?d:d*Math.min(1,dt*5);S.disp=Math.abs(S.score-S.disp)<1?S.score:S.disp;}
 if(S.toastT>0)S.toastT-=dt;if(S.goFlash>0)S.goFlash-=dt;
 switch(S.phase){
  case 'ready':moveLead(dt,false);S.readyT+=dt;S.timer-=dt;if(S.timer<=0)startSet();break;
  case 'set':updateSet(dt);break;
  case 'pickoff':updatePickoff(dt);break;
  case 'pitch':updatePitch(dt);break;

/* フィールド上のボール位置(真上から見た座標) */
function ballPos(){
 const p=P(),ph=S.phase;
 const arc=(a,b,u,h)=>({x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u)-Math.sin(u*Math.PI)*h});
 if(ph==='pickoff'){
  if(S.t<S.pRel)return HP;
  return arc(HP,FBG,clamp01((S.t-S.pRel)/PICK_FLY),10);
 }
 if(ph==='pitch'){
  const t=S.t,tc=p.deliv+p.flight,ballAt=tc+p.pop;
  if(t<p.deliv)return HP;
  if(t<tc)return arc(HP,CGL,clamp01((t-p.deliv)/p.flight),5);
  if(S.goT!==null){
   const tr=tc+p.pop*.45;if(t<tr)return CGL;
   return arc(CGL,TG,clamp01((t-tr)/(ballAt-tr)),34);
  }
  return CGL;
 }
 if(ph==='result')return S.resBall;
 if(ph==='recover')return S.timer>.4?S.resBall:HP;
 if(ph==='busted'){const u=clamp01((S.runTe-.1)/.5);return u<=0?HP:arc(HP,TG,u,30);}
 return HP;
}
function runnerFt(){
 if((S.phase==='pickoff'||S.phase==='pitch')&&S.goT!==null)return Math.min(BASE_FT,runS(S.runL,S.t-S.goT));
 if(S.phase==='busted')return Math.min(BASE_FT-2,runS(S.runL,S.runTe));
 if(S.phase==='result')return S.resS;
 return S.L;
}
function goEnabled(){
 return S.phase==='set'||(S.phase==='pickoff'&&S.goT===null)||(S.phase==='pitch'&&S.goT===null);
}

/* 足元アップ(真横から): 脚上げ→踏み込み、牽制は脚を上げない */
function pitchFoot(p,t){
 let lh=0,stride=0,sink=0;
 const kl={quick:.55,low:.7,mid:.85,high:1,big:1.05}[p.kick]||.85;
 const lt=p.lift,dl=p.deliv,t1=T1(p),t2=dl*.92;

 else if(t<t1)lh=kl;
 else if(t<t2){const u=clamp01((t-t1)/(t2-t1));lh=kl*(1-easeIn(u));stride=easeOut(u);}
 else{stride=1;sink=clamp01((t-t2)/.2);}
 return {lh:lh,stride:stride,sink:sink,side:0,off:0};
}
function footParams(){
 const p=P(),ph=S.phase,t=S.t;
 if(ph==='pitch')return pitchFoot(p,t);

  const dv=S.dv;
  if(S.fakeLift){
   if(t<dv)return pitchFoot(p,t);
   const f=pitchFoot(p,dv),u=clamp01((t-dv)/.25);
   // 左腕: ホームへ踏み出さず、一塁側(手前)へ足を下ろす
   return {lh:f.lh*(1-u),stride:0,sink:0,side:p.rh?0:easeOut(u),off:0};
  }
  return {lh:p.rh?.25*Math.sin(clamp01(t/S.pRel)*Math.PI):.2*Math.sin(clamp01(t/S.pRel)*Math.PI),stride:0,sink:0,side:easeIO(clamp01(t/S.pRel)),off:p.rh?easeOut(clamp01(t/(S.pRel*.55))):0};
 }
 return {lh:0,stride:0,sink:0,side:0,off:0};
}

 ctx.fillStyle='rgba(5,12,20,.86)';ctx.fillRect(0,0,W,H);
 txt('盗塁王',W/2,100,64,'#fde047','center','bold',{w:8,c:'#7c2d12'});
 txt('牽制をかいくぐれ!',W/2,134,19,'#fff','center');
 ctx.fillStyle='rgba(255,255,255,.08)';rr(16,152,328,330,16);ctx.fill();
 ctx.strokeStyle='rgba(253,224,71,.5)';ctx.lineWidth=2;rr(16,152,328,330,16);ctx.stroke();
 txt('ルール',W/2,180,18,'#fde047','center','bold');
 txt('一塁から二塁へ盗塁!  3アウトで終了',W/2,206,14,'#cbd5e1','center','normal');
 const blk=(y,col,head,l1,l2)=>{
  ctx.fillStyle=col;rr(30,y-18,6,l2?56:38,3);ctx.fill();
  txt(head,46,y,18,col,'left','bold');
  txt(l1,46,y+22,14,'#e5e7eb','left','normal');
  if(l2)txt(l2,46,y+40,14,'#e5e7eb','left','normal');
 };
 blk(244,'#4ade80','押す(GO!)','投手が足を上げて投げたら、すぐ押して','二塁へ走る');
 blk(318,'#fca5a5','押さない','一塁へ牽制してきたときは押さない','(押すとアウト)');
 blk(392,'#fde047','見送りもアウト','投球なのに押さずに見送ると、アウト');
 txt('※左投手は足を上げても牽制あり。',W/2,452,13,'#93c5fd','center','normal');
 txt('踏み出す向きがホーム側なら投球、一塁側なら牽制',W/2,470,13,'#93c5fd','center','normal');
 txt('得点: 盗塁+100 / 牽制回避+50',W/2,508,13,'#fde047','center','bold');
 txt('二塁到達(足を上げてから) 1.9秒内+300 / 2.1秒内+200 / 2.3秒内+100',W/2,527,12,'#fde047','center','normal');
 const a=.55+.45*Math.sin(S.time*4);
 ctx.globalAlpha=a;txt('TAP TO START',W/2,566,26,'#fff','center');ctx.globalAlpha=1;
 if(S.best>0)txt('ベスト '+S.best+'盗塁 / '+S.bestScore+'点',W/2,596,15,'#93c5fd','center');
}
function drawOver(){
 ctx.fillStyle='rgba(5,12,20,.86)';ctx.fillRect(0,0,W,H);
 txt('GAME OVER',W/2,70,26,'#f87171','center','bold');
 txt('盗塁',W/2,106,16,'#cbd5e1','center');
 txt(String(S.steals),W/2,170,66,'#fde047','center','bold',{w:6,c:'#7c2d12'});
 txt('「'+rankOf(S.steals)+'」',W/2,208,23,'#fff','center','bold');
 txt('SCORE',W/2,244,14,'#cbd5e1','center');
 txt(String(S.score),W/2,286,44,'#4ade80','center','bold',{w:5,c:'#064e3b'});
 txt('死因:'+(CAUSE[S.cause]||'-')+'  /  牽制回避 '+S.dodges+'回',W/2,316,14,'#fca5a5','center');
 txt('ベスト 盗塁 '+S.best+(S.newBest?' NEW!':'')+'  スコア '+S.bestScore+(S.newBestScore?' NEW!':''),W/2,342,14,(S.newBest||S.newBestScore)?'#fde047':'#93c5fd','center');
 if(S.bestTime>0)txt('最速の二塁到達 '+S.bestTime.toFixed(2)+'秒',W/2,364,13,'#93c5fd','center','normal');
 if(RK.my&&RK.my.rank)txt('全国 '+RK.my.rank+'位 / '+(RK.my.total+(RK.submitted?0:1))+'件中'+(RK.submitted?'':'(登録で反映)'),W/2,392,15,'#fde047','center','bold');
 else if(RK.my&&RK.my.loading)txt('全国順位を確認中…',W/2,392,13,'#94a3b8','center','normal');
 else txt('Xでシェアして友達に挑戦させよう',W/2,392,13,'#94a3b8','center','normal');
 ctx.fillStyle='#1d9bf0';rr(SHARE_BTN.x,SHARE_BTN.y,SHARE_BTN.w,SHARE_BTN.h,14);ctx.fill();
 txt('Xでシェア',W/2,SHARE_BTN.y+34,22,'#fff','center');
 ctx.fillStyle='#16a34a';rr(RETRY_BTN.x,RETRY_BTN.y,RETRY_BTN.w,RETRY_BTN.h,14);ctx.fill();
 txt('もう一回',W/2,RETRY_BTN.y+34,22,'#fff','center');
 if(RANK_ON()){ctx.fillStyle='#d97706';rr(RANK_BTN.x,RANK_BTN.y,RANK_BTN.w,RANK_BTN.h,14);ctx.fill();txt('ランキング',W/2,RANK_BTN.y+31,20,'#fff','center','bold');}
 if(RK.open)drawRank();
}
function drawPops(){
 let idx=0;
 S.pops.forEach(q=>{
  if(q.t<0)return;
  const a=q.t<.18?q.t/.18:(!q.hold&&q.t>1.4?Math.max(0,(1.9-q.t)/.5):1);
  const y=262-Math.min(1,q.t/.5)*22+idx*30+(!q.hold&&q.t>1.4?-(q.t-1.4)*20:0);
  ctx.globalAlpha=a;txt(q.text,W/2,y,q.text.length>12?19:24,q.col,'center','bold',{w:5,c:'rgba(0,0,0,.7)'});ctx.globalAlpha=1;idx++;
 });
}
function drawPauseUI(){
 if(!canPause())return;
 if(!S.paused){
  ctx.fillStyle='rgba(0,0,0,.45)';rr(PAUSE_BTN.x,PAUSE_BTN.y,PAUSE_BTN.w,PAUSE_BTN.h,12);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;rr(PAUSE_BTN.x,PAUSE_BTN.y,PAUSE_BTN.w,PAUSE_BTN.h,12);ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(PAUSE_BTN.x+15,PAUSE_BTN.y+11,5,16);ctx.fillRect(PAUSE_BTN.x+26,PAUSE_BTN.y+11,5,16);
  txt('タイム',PAUSE_BTN.x+PAUSE_BTN.w/2,PAUSE_BTN.y+41,9,'#e5e7eb','center','bold');
  return;
 }
 ctx.fillStyle='rgba(5,12,20,.94)';ctx.fillRect(0,0,W,H);
 txt('TIME',W/2,190,56,'#fde047','center','bold',{w:7,c:'#7c2d12'});
 txt('一時停止中',W/2,226,18,'#fff','center');
 ctx.fillStyle='#d97706';rr(RESUME_BTN.x,RESUME_BTN.y,RESUME_BTN.w,RESUME_BTN.h,18);ctx.fill();
 ctx.strokeStyle='#fff';ctx.lineWidth=3;rr(RESUME_BTN.x,RESUME_BTN.y,RESUME_BTN.w,RESUME_BTN.h,18);ctx.stroke();
 txt('再開',W/2,RESUME_BTN.y+45,30,'#fff','center','bold');
 txt('脚が上がったらタップ / 牽制は押さない / 見送りはアウト',W/2,430,13,'#cbd5e1','center','normal');
 txt('(キーボード: P または Esc で停止・再開)',W/2,456,11,'#94a3b8','center','normal');
}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 if(VIEW==='fp')drawFP();else{drawBG();drawActors();drawBall();drawPitcherCam();}
 if(S.phase==='title'){drawTitle();return;}
 drawHUD();drawControls();drawBanner();drawPops();drawPauseUI();
 if(S.phase==='over')drawOver();
}

/* ---------- ループ ---------- */
let last=0;
function frame(ts){
 const dt=Math.min(.033,Math.max(0,(ts-last)/1000||0));last=ts;
 S.time+=dt;if(!S.paused){update(dt);updatePose(dt);updatePoseFP(dt);}draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
