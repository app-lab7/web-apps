<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>共和校 Score Input</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
header{background:#173b68;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:2}header b{font-size:20px}header small{display:block;opacity:.8;margin-top:3px}
main{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #18304c12}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#5c6878;margin:0 0 5px}
select,input,textarea{width:100%;font-size:16px;padding:12px;border:1px solid #cfd8e4;border-radius:10px;background:#fff}
.subject{border-top:4px solid #d7dde6}.subject h3{margin:0 0 12px}.subject .grid{grid-template-columns:repeat(3,1fr)}
button{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;background:#1769aa;color:#fff}.sub{background:#e9eef5;color:#25364a;margin-top:8px}
#status{font-size:14px;text-align:center;margin-top:10px;min-height:20px}.hint{font-size:12px;color:#738094;line-height:1.6}
@media(max-width:600px){main{padding:10px}.grid,.subject .grid{grid-template-columns:1fr 1fr}.subject .grid>div:last-child{grid-column:1/-1}}
</style></head><body>
<header><b>共和校 Score Input</b><small>中学生 テスト成績入力</small></header>
<main>
<div class="card"><div class="grid">
<div><label>年度</label><select id="year"></select></div>
<div><label>テスト</label><select id="test"><option value="">読み込み中…</option></select></div>
<div><label>学年</label><select id="grade"><option>中1</option><option>中2</option><option>中3</option></select></div>
<div><label>生徒</label><select id="student"><option value="">生徒を選択</option></select></div>
</div></div>
<div id="subjects"></div>
<div class="card"><div class="grid">
<div><label>順位</label><input id="rank" inputmode="numeric" placeholder="例：12"></div>
<div><label>回収状況</label><select id="collect"><option value="○">○ 回収済</option><option value="未">未回収</option></select></div>
<div class="full"><label>メモ</label><textarea id="memo" rows="3" placeholder="面談・テストについてのメモ"></textarea></div>
</div></div>
<div class="card"><button id="save">保存する</button><button class="sub" id="clear">入力をクリア</button><div id="status"></div>
<p class="hint">保存するとテスト履歴として蓄積します。同じ年度・テスト・生徒のデータは確認のうえ更新できる設計です。</p></div>
</main><script>
const CONFIG={apiUrl:"https://script.google.com/macros/s/AKfycbya7qViVMKVJau3fZ1fgyKF82jkAeQOtMMQSpzC8fqjhRBMgoB9h8cf0nCmWcVL7izntQ/exec"};
const subjects=["国語","数学","英語","理科","社会"];
let studentsByGrade={"中1":[],"中2":[],"中3":[]};
const y=new Date().getFullYear();document.querySelector("#year").innerHTML=[y-1,y,y+1].map(v=>`<option ${v===y?"selected":""}>${v}</option>`).join("");
let testSettings=[];
async function loadTests(){
 const testEl=document.querySelector("#test");
 testEl.innerHTML='<option value="">読み込み中…</option>';
 try{
   const r=await fetch(CONFIG.apiUrl+"?action=tests");
   const data=await r.json();
   if(!data.ok) throw new Error(data.message||"取得失敗");
   testSettings=data.tests||[];
   refreshTests();
 }catch(e){
   testEl.innerHTML='<option value="">テスト設定を取得できません</option>';
 }
}
function refreshTests(){
 const selectedYear=String(document.querySelector("#year").value);
 const list=testSettings.filter(t=>String(t.year)===selectedYear);
 const testEl=document.querySelector("#test");
 testEl.innerHTML=list.length
   ? '<option value="">テストを選択</option>'+list.map(t=>`<option value="${t.name}">${t.name}</option>`).join("")
   : '<option value="">この年度のテスト設定がありません</option>';
}
document.querySelector("#year").addEventListener("change",refreshTests);
loadTests();
async function loadStudents(){
 const el=document.querySelector("#student");
 el.innerHTML='<option value="">読み込み中…</option>';
 try{
  const r=await fetch(CONFIG.apiUrl+"?action=students");
  const data=await r.json();
  if(!data.ok) throw new Error(data.message||"取得失敗");
  studentsByGrade={"中1":[],"中2":[],"中3":[]};
  (data.students||[]).forEach(s=>{if(studentsByGrade[s.grade])studentsByGrade[s.grade].push(s.name)});
  refreshStudents();
 }catch(e){el.innerHTML='<option value="">名簿を取得できません</option>'}
}
loadStudents();
document.querySelector("#subjects").innerHTML=subjects.map(s=>`<div class="card subject"><h3>${s}</h3><div class="grid">
<div><label>本人点</label><input data-s="${s}" data-k="score" inputmode="decimal" placeholder="点"></div>
<div><label>学校平均</label><input data-s="${s}" data-k="avg" inputmode="decimal" placeholder="平均"></div>
<div><label>偏差値</label><input data-s="${s}" data-k="dev" inputmode="decimal" placeholder="偏差値"></div></div></div>`).join("");
function refreshStudents(){const g=document.querySelector("#grade").value;const list=studentsByGrade[g]||[];document.querySelector("#student").innerHTML='<option value="">生徒を選択</option>'+list.map(n=>`<option>${n}</option>`).join("")}
document.querySelector("#grade").addEventListener("change",refreshStudents);refreshStudents();
function payload(){const p={year:year.value,test:test.value,grade:grade.value,student:student.value,rank:rank.value,collect:collect.value,memo:memo.value,scores:{}};subjects.forEach(s=>{p.scores[s]={};document.querySelectorAll(`[data-s="${s}"]`).forEach(i=>p.scores[s][i.dataset.k]=i.value)});return p}
document.querySelector("#save").onclick=async()=>{const st=document.querySelector("#status");if(!test.value){st.textContent="テストを選択してください";return}if(!student.value){st.textContent="生徒を選択してください";return}if(!CONFIG.apiUrl){st.textContent="Google連携設定後に保存できます";return}st.textContent="保存中…";try{const r=await fetch(CONFIG.apiUrl,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(payload())});if(!r.ok)throw Error();st.textContent="保存しました"}catch(e){st.textContent="保存に失敗しました"}};
document.querySelector("#clear").onclick=()=>{document.querySelectorAll('input,textarea').forEach(x=>x.value="");document.querySelector("#status").textContent=""};
</script></body></html>
