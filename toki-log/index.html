<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2864dc">
  <title>Toki Log</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--blue:#2864dc;--pale:#edf4ff;--line:#dfe5ee;--bg:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans JP",sans-serif}button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}
    header{background:#fff;border-bottom:1px solid var(--line);padding:20px 28px}.brand{width:min(920px,100%);margin:auto;display:flex;align-items:center;gap:14px}.logo{display:grid;place-items:center;width:50px;height:50px;border-radius:15px;color:#fff;background:var(--blue);font-size:26px}.brand h1{font-size:22px;margin:0 0 3px}.brand p,.hint{margin:0;color:var(--muted);font-size:13px}
    .shell{width:min(920px,calc(100% - 32px));margin:32px auto}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px;background:#e8ecf3;border-radius:14px}.tab{height:48px;border:0;border-radius:10px;background:transparent;color:#596275;font-weight:700}.tab.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #22345b18}
    .panel{display:none;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 35px #2332540d;padding:40px;min-height:430px}.panel.active{display:flex;flex-direction:column;align-items:center;justify-content:center}.preset-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:28px}.preset{border:1px solid var(--line);background:#fff;color:#4b5568;font-weight:700;padding:9px 16px;border-radius:999px}.preset.active{border-color:#9ab9f3;background:var(--pale);color:var(--blue)}
    .clock{font-variant-numeric:tabular-nums;font-size:clamp(72px,14vw,150px);line-height:1;font-weight:750;letter-spacing:-.065em}.clock.finished{color:#dc3f3f}.status{margin:18px 0 30px;color:var(--muted);font-weight:700}.actions{display:flex;gap:12px}.btn{height:54px;border-radius:13px;padding:0 30px;font-weight:700;border:1px solid var(--line);background:#fff;color:#455065}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;min-width:170px}
    .record-form{width:min(560px,100%);display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}.record-form input{min-width:0;height:46px;border:1px solid var(--line);border-radius:11px;padding:0 14px;background:#fafbfc}.record-form button{height:46px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--blue);font-weight:700;padding:0 16px}.record-form button:disabled{opacity:.4;cursor:not-allowed}
    #multiple.active{display:block;padding:28px}.multi-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 4px 20px}.multi-head p{color:var(--muted);margin:0}.add{border:0;background:var(--blue);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700}.timer-list{display:grid;gap:12px}.mini{border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.mini-info{display:flex;align-items:center;gap:32px;flex:1}.mini-info input{width:200px;min-width:0;border:0;border-bottom:1px solid transparent;outline:0;padding:7px 2px;font-size:16px;font-weight:700}.mini-info input:focus{border-color:var(--blue)}.mini-info strong{font-size:40px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.mini-actions{display:flex;gap:8px}.round{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#536078}.round.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.round.save{color:var(--blue)}.round.danger{color:#d24646}.round:disabled{opacity:.35;cursor:not-allowed}
    .history{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 28px;box-shadow:0 8px 28px #2332540a}.history-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.history h2{margin:0 0 5px;font-size:19px}.history-head p{margin:0;color:var(--muted);font-size:13px}.count{color:var(--blue);background:var(--pale);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700}.record-list{display:grid;gap:9px}.record{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:18px;padding:14px 16px;border:1px solid var(--line);border-radius:13px}.record-main{min-width:0;display:grid;gap:5px}.record-main strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.record-main span{color:var(--muted);font-size:12px}.record>b{font-size:22px;font-variant-numeric:tabular-nums}.delete{border:0;background:transparent;color:#b34b4b;font-size:20px}.empty{padding:26px 12px 12px;color:var(--muted);text-align:center;font-size:14px}.hint{text-align:center;margin-top:20px}
    .now{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 30px;display:flex;align-items:center;justify-content:center;gap:34px;box-shadow:0 12px 35px #2332540d}.analog{position:relative;width:146px;height:146px;border:7px solid #edf2fb;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px #dfe5ee}.analog:after{content:"";position:absolute;z-index:5;width:11px;height:11px;border-radius:50%;background:var(--blue);left:50%;top:50%;transform:translate(-50%,-50%)}.tick{position:absolute;left:50%;top:5px;width:2px;height:8px;background:#92a0b8;transform-origin:1px 68px}.tick.major{width:3px;height:11px;background:#536078}.hand{position:absolute;z-index:3;left:50%;bottom:50%;transform-origin:bottom center;border-radius:99px;transform:translateX(-50%) rotate(0deg)}.hour{height:37px;width:7px;background:var(--ink)}.minute{height:52px;width:5px;background:#46536a}.second{z-index:4;height:58px;width:2px;background:#ed4d4d}.now-copy{min-width:190px}.now-label{margin:0 0 5px;color:var(--muted);font-size:13px;font-weight:700}.digital-now{font-variant-numeric:tabular-nums;font-size:clamp(36px,6vw,58px);font-weight:750;letter-spacing:-.055em}.today{margin:5px 0 0;color:var(--muted);font-size:14px}
    button:focus-visible,input:focus-visible{outline:3px solid #83aaf5;outline-offset:2px}
    @media(max-width:640px){header{padding:16px 18px}.logo{width:44px;height:44px}.shell{margin:20px auto;width:calc(100% - 20px)}.tab{font-size:12px;padding:0 5px;height:44px}.panel{border-radius:17px;padding:24px 16px;min-height:390px}.clock{font-size:23vw}.actions{width:100%;flex-direction:column}.btn{width:100%}.record-form{grid-template-columns:1fr}.record-form button{width:100%}#multiple.active{padding:20px 14px}.mini{align-items:stretch;flex-direction:column}.mini-info{justify-content:space-between;gap:10px}.mini-info input{width:46%}.mini-info strong{font-size:34px}.mini-actions{justify-content:flex-end}.history{padding:20px 14px}.record{gap:10px;padding:13px 11px}.record>b{font-size:19px}}
    @media(max-width:640px){.now{padding:20px;gap:20px}.analog{width:118px;height:118px;border-width:6px}.tick{top:4px;transform-origin:1px 55px}.hand.hour{height:29px}.hand.minute{height:42px}.hand.second{height:47px}.now-copy{min-width:0}.digital-now{font-size:34px}.today{font-size:12px}}
  </style>
</head>
<body>
  <header><div class="brand"><div class="logo">◷</div><div><h1>Toki Log</h1><p>集中する時間を、わかりやすく。</p></div></div></header>
  <main class="shell">
    <nav class="tabs" aria-label="タイマーの種類">
      <button class="tab active" data-panel="countdown">カウントダウン</button><button class="tab" data-panel="stopwatch">ストップウォッチ</button><button class="tab" data-panel="multiple">複数タイマー</button>
    </nav>
    <section class="now" aria-label="現在時刻"><div class="analog"><span class="hand hour"></span><span class="hand minute"></span><span class="hand second"></span></div><div class="now-copy"><p class="now-label">現在時刻</p><div class="digital-now">00:00:00</div><p class="today"></p></div></section>
    <section class="panel active" id="countdown">
      <div class="preset-row"></div><div class="clock">25:00</div><p class="status">準備できました</p>
      <div class="actions"><button class="btn primary start">▶ スタート</button><button class="btn reset">↻ リセット</button></div>
      <div class="record-form"><input placeholder="例：英語ワーク Unit 4" aria-label="この時間の内容"><button disabled>▣ この時間を記録</button></div>
    </section>
    <section class="panel" id="stopwatch">
      <div style="color:var(--blue);font-weight:700;margin-bottom:28px">◷ 経過時間</div><div class="clock">00:00</div><p class="status">準備できました</p>
      <div class="actions"><button class="btn primary start">▶ スタート</button><button class="btn reset">↻ リセット</button></div>
      <div class="record-form"><input placeholder="例：数学の宿題" aria-label="この時間の内容"><button disabled>▣ この時間を記録</button></div>
    </section>
    <section class="panel" id="multiple"><div class="multi-head"><p>複数の活動を同時に計れます</p><button class="add">＋ 追加</button></div><div class="timer-list"></div></section>
    <section class="history"><div class="history-head"><div><h2>▤ 時間の記録</h2><p>何に使った時間かを端末に保存します</p></div><span class="count">0件</span></div><div class="record-list"></div></section>
    <p class="hint">授業・自習・休憩時間の管理に</p>
  </main>
  <script>
    const pad=n=>String(n).padStart(2,"0"),fmt=s=>pad(Math.floor(s/60))+":"+pad(s%60);
    const records=()=>JSON.parse(localStorage.getItem("toki_log_records_v1")||"[]");
    const saveRecords=r=>{localStorage.setItem("toki_log_records_v1",JSON.stringify(r));renderRecords()};
    function addRecord(title,seconds,kind){if(!title.trim()||seconds<=0)return;saveRecords([{id:Date.now(),title:title.trim(),seconds,kind,createdAt:new Date().toISOString()},...records()])}
    function renderRecords(){const rs=records(),box=document.querySelector(".record-list");document.querySelector(".count").textContent=rs.length+"件";box.innerHTML=rs.length?rs.map(r=>`<article class="record"><div class="record-main"><strong></strong><span>${r.kind} ・ ${new Date(r.createdAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span></div><b>${fmt(r.seconds)}</b><button class="delete" data-id="${r.id}" aria-label="記録を削除">×</button></article>`).join(""):'<div class="empty">まだ記録はありません。計測後に「この時間を記録」を押してください。</div>';box.querySelectorAll(".record").forEach((el,i)=>el.querySelector("strong").textContent=rs[i].title);box.querySelectorAll(".delete").forEach(b=>b.onclick=()=>saveRecords(rs.filter(r=>r.id!=b.dataset.id)))}
    const analog=document.querySelector(".analog");for(let i=0;i<60;i++){const t=document.createElement("i");t.className="tick"+(i%5===0?" major":"");t.style.transform="translateX(-50%) rotate("+(i*6)+"deg)";analog.appendChild(t)}
    function updateNow(){const d=new Date(),s=d.getSeconds(),m=d.getMinutes(),h=d.getHours()%12;document.querySelector(".digital-now").textContent=[d.getHours(),m,s].map(pad).join(":");document.querySelector(".today").textContent=d.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});document.querySelector(".hour").style.transform="translateX(-50%) rotate("+(h*30+m*.5)+"deg)";document.querySelector(".minute").style.transform="translateX(-50%) rotate("+(m*6+s*.1)+"deg)";document.querySelector(".second").style.transform="translateX(-50%) rotate("+(s*6)+"deg)"}
    document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.panel).classList.add("active")});
    const cd={minutes:25,left:1500,running:false};let cdInt;
    const cdPanel=document.getElementById("countdown"),presetRow=cdPanel.querySelector(".preset-row");
    [5,10,25,45,60].forEach(m=>{const b=document.createElement("button");b.className="preset"+(m===25?" active":"");b.textContent=m+"分";b.onclick=()=>{cd.minutes=m;cd.left=m*60;cd.running=false;clearInterval(cdInt);presetRow.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderCd()};presetRow.appendChild(b)});
    function renderCd(){cdPanel.querySelector(".clock").textContent=fmt(cd.left);cdPanel.querySelector(".clock").classList.toggle("finished",cd.left===0);cdPanel.querySelector(".status").textContent=cd.left===0?"時間になりました":cd.running?"集中タイム":"準備できました";cdPanel.querySelector(".start").textContent=cd.running?"Ⅱ 一時停止":"▶ スタート";cdPanel.querySelector(".record-form button").disabled=!cdPanel.querySelector("input").value.trim()||cd.minutes*60-cd.left===0}
    cdPanel.querySelector(".start").onclick=()=>{if(!cd.left)return;cd.running=!cd.running;clearInterval(cdInt);if(cd.running)cdInt=setInterval(()=>{cd.left--;if(cd.left<=0){cd.left=0;cd.running=false;clearInterval(cdInt)}renderCd()},1000);renderCd()};cdPanel.querySelector(".reset").onclick=()=>{clearInterval(cdInt);cd.left=cd.minutes*60;cd.running=false;renderCd()};cdPanel.querySelector("input").oninput=renderCd;cdPanel.querySelector(".record-form button").onclick=()=>{const i=cdPanel.querySelector("input");addRecord(i.value,cd.minutes*60-cd.left,"カウントダウン");i.value="";renderCd()};
    const sw={elapsed:0,running:false};let swInt;const swPanel=document.getElementById("stopwatch");
    function renderSw(){swPanel.querySelector(".clock").textContent=fmt(sw.elapsed);swPanel.querySelector(".status").textContent=sw.running?"計測中":sw.elapsed?"一時停止中":"準備できました";swPanel.querySelector(".start").textContent=sw.running?"Ⅱ 一時停止":"▶ スタート";swPanel.querySelector(".record-form button").disabled=!swPanel.querySelector("input").value.trim()||!sw.elapsed}
    swPanel.querySelector(".start").onclick=()=>{sw.running=!sw.running;clearInterval(swInt);if(sw.running)swInt=setInterval(()=>{sw.elapsed++;renderSw()},1000);renderSw()};swPanel.querySelector(".reset").onclick=()=>{clearInterval(swInt);sw.elapsed=0;sw.running=false;renderSw()};swPanel.querySelector("input").oninput=renderSw;swPanel.querySelector(".record-form button").onclick=()=>{const i=swPanel.querySelector("input");addRecord(i.value,sw.elapsed,"ストップウォッチ");i.value="";renderSw()};
    let timers=[{id:1,name:"問題演習",duration:900,left:900,running:false},{id:2,name:"答え合わせ",duration:300,left:300,running:false}],nextId=3;
    function renderTimers(){const box=document.querySelector(".timer-list");box.innerHTML=timers.map(t=>`<article class="mini" data-id="${t.id}"><div class="mini-info"><input value=""><strong>${fmt(t.left)}</strong></div><div class="mini-actions"><button class="round primary play">${t.running?"Ⅱ":"▶"}</button><button class="round reset">↻</button><button class="round save" ${t.left===t.duration?"disabled":""}>▣</button><button class="round danger delete">×</button></div></article>`).join("");box.querySelectorAll(".mini").forEach((el,i)=>{const t=timers[i],inp=el.querySelector("input");inp.value=t.name;inp.onchange=()=>t.name=inp.value;el.querySelector(".play").onclick=()=>{if(t.left){t.running=!t.running;renderTimers()}};el.querySelector(".reset").onclick=()=>{t.left=t.duration;t.running=false;renderTimers()};el.querySelector(".save").onclick=()=>addRecord(t.name,t.duration-t.left,"複数タイマー");el.querySelector(".delete").onclick=()=>{timers=timers.filter(x=>x.id!==t.id);renderTimers()}})}
    setInterval(()=>{let changed=false;timers.forEach(t=>{if(t.running){t.left=Math.max(0,t.left-1);if(!t.left)t.running=false;changed=true}});if(changed)renderTimers()},1000);document.querySelector(".add").onclick=()=>{timers.push({id:nextId,name:"タイマー "+nextId,duration:600,left:600,running:false});nextId++;renderTimers()};
    renderCd();renderSw();renderTimers();renderRecords();updateNow();setInterval(updateNow,1000);
  </script>
</body>
</html>
