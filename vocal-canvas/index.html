<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Vocal Canvas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:820px;margin:auto;min-height:100dvh;background:white}
header{height:58px;padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e7eaf0;position:sticky;top:0;background:#fff;z-index:5}
.logo{font-weight:800;font-size:18px;flex:1}.logo small{font-weight:500;color:#8790a3;margin-left:6px}
.iconbtn,.btn{border:1px solid #dce1ea;background:#fff;border-radius:10px;padding:9px 12px}.btn.primary{background:#172033;color:white;border-color:#172033}
.screen{display:none}.screen.on{display:block}.library{padding:18px}.library h1{font-size:28px;margin:8px 0}.muted{color:#8790a3}.songcard{border:1px solid #e1e5ed;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #1720330a}.songcard h3{margin:0 0 5px}.songcard .meta{font-size:13px;color:#8790a3}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.editor{height:calc(100dvh - 58px);display:flex;flex-direction:column}.songbar{padding:10px 12px;border-bottom:1px solid #e7eaf0}.songtitle{font-weight:750}.tabs{display:flex;gap:7px;overflow:auto;padding-top:9px}.tab{white-space:nowrap;border:0;background:#eef1f6;padding:7px 11px;border-radius:999px;font-size:13px}.tab.on{background:#172033;color:#fff}
.score{flex:3;min-height:170px;overflow:auto;padding:18px 18px 28px;background:#fff}.scorehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sectionlabel{font-weight:800}.lyrics{font-size:22px;line-height:2.15;letter-spacing:.02em;white-space:pre-wrap;user-select:text;-webkit-user-select:text}.hint{font-size:12px;color:#929aac;margin-top:16px}.divider{height:9px;background:#edf0f5;position:relative;cursor:row-resize}.divider:after{content:"";position:absolute;width:42px;height:3px;border-radius:4px;background:#bcc3d0;left:50%;top:3px;transform:translateX(-50%)}
.detail{flex:2;min-height:205px;overflow:auto;padding:14px 16px 28px;background:#fafbfc}.selected{font-weight:700;margin-bottom:10px}.tools{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.chip{border:1px solid #dfe4ec;background:white;border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:13px}.chip[data-voice="chest"]{border-bottom:4px solid #3978f6}.chip[data-voice="mix"]{border-bottom:4px solid #9b51e0}.chip[data-voice="head"]{border-bottom:4px solid #4fc3d7}.chip[data-voice="air"]{border-bottom:4px solid #aeb5c2}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;color:#697386;margin-bottom:5px}.field textarea,.field input,.field select{width:100%;border:1px solid #dfe4ec;border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:64px;resize:vertical}
.mark{border-radius:4px;padding:1px 2px}.v-chest{background:#3978f62a;border-bottom:3px solid #3978f6}.v-mix{background:#9b51e02a;border-bottom:3px solid #9b51e0}.v-head{background:#4fc3d72f;border-bottom:3px solid #4fc3d7}.v-air{background:#aeb5c22d;border-bottom:3px solid #aeb5c2}.mark:after{font-size:11px;margin-left:2px;vertical-align:top}.sym-breath:after{content:" /";font-weight:800}.sym-accent:after{content:" >";font-weight:900}.sym-vibrato:after{content:" 〜";font-weight:800}.sym-up:after{content:" ↑";font-weight:800}.sym-down:after{content:" ↓";font-weight:800}.sym-warn:after{content:" ⚠";font-size:10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#697386}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px}.modal{position:fixed;inset:0;background:#17203388;z-index:20;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-width:820px;margin:auto;background:white;border-radius:20px 20px 0 0;padding:20px;max-height:88dvh;overflow:auto}.sheet h2{margin-top:0}.sectionsEdit{display:grid;grid-template-columns:100px 1fr;gap:7px;margin:8px 0}.sectionsEdit textarea{min-height:85px}.footerActions{display:flex;gap:8px;margin-top:14px}.practice .detail,.practice .divider{display:none}.practice .score{flex:1}.practice .lyrics{font-size:28px;line-height:2.3}.practice .songbar{padding-bottom:12px}
.empty{padding:40px 10px;text-align:center;color:#8790a3}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px;max-width:620px}.lyrics{font-size:24px}}
</style></head>
<body><div class="app">
<header><button class="iconbtn" id="back" style="display:none">‹</button><div class="logo">Vocal Canvas <small>歌唱設計ノート</small></div><button class="iconbtn" id="practiceBtn" style="display:none">練習</button></header>
<section id="library" class="screen on library"><h1>曲を仕上げる。</h1><p class="muted">歌詞に歌い方を描き、下のカルテに理由と課題を残します。</p><button class="btn primary" id="newSong">＋ 新しい曲</button><div id="songs"></div></section>
<section id="editor" class="screen"><div class="editor">
 <div class="songbar"><div class="row"><div class="grow"><div class="songtitle" id="songTitle"></div><div class="muted" style="font-size:12px" id="artist"></div></div><button class="btn" id="editSong">歌詞編集</button></div><div class="tabs" id="tabs"></div></div>
 <div class="score" id="score"><div class="scorehead"><span class="sectionlabel" id="sectionName"></span><div class="legend"><span><i class="dot" style="background:#3978f6"></i>地声</span><span><i class="dot" style="background:#9b51e0"></i>MIX</span><span><i class="dot" style="background:#4fc3d7"></i>裏声</span></div></div><div class="lyrics" id="lyrics"></div><div class="hint">歌詞を長押しして範囲選択 → 下から歌い方を指定</div></div>
 <div class="divider"></div>
 <div class="detail"><div class="selected" id="selected">フレーズを選択してください</div>
  <div class="tools">
   <button class="chip" data-voice="chest">● 地声</button><button class="chip" data-voice="mix">● MIX</button><button class="chip" data-voice="head">● 裏声</button><button class="chip" data-voice="air">● 息多め</button>
  </div><div class="tools">
   <button class="chip" data-symbol="breath">/ ブレス</button><button class="chip" data-symbol="accent">&gt; アクセント</button><button class="chip" data-symbol="vibrato">〜 ビブラート</button><button class="chip" data-symbol="up">↑ しゃくり</button><button class="chip" data-symbol="down">↓ フォール</button><button class="chip" data-symbol="warn">⚠ 注意</button>
  </div>
  <div class="field"><label>歌い方・表現</label><input id="expression" placeholder="例：少し弱く、語尾を抜く"></div>
  <div class="field"><label>留意点・現在の課題</label><textarea id="caution" placeholder="例：「もう」で力まない。音程が低くなりやすい。"></textarea></div>
  <div class="field"><label>練習メモ</label><textarea id="memo" placeholder="例：このフレーズだけ5回。息を残す。"></textarea></div>
 </div></div></section>
</div>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">曲を追加</h2>
<div class="field"><label>曲名</label><input id="mTitle"></div><div class="field"><label>アーティスト</label><input id="mArtist"></div>
<p style="font-weight:700;margin-bottom:4px">セクションと歌詞</p><p class="muted" style="font-size:12px;margin-top:0">Aメロ・Bメロ・サビなど、必要なだけ追加できます。</p><div id="sectionInputs"></div>
<button class="btn" id="addSection">＋ セクション追加</button><div class="footerActions"><button class="btn grow" id="cancel">キャンセル</button><button class="btn primary grow" id="saveSong">保存</button></div></div></div>
<script>
const KEY="vocal-canvas-v2";const demo={id:"demo",title:"声の向こうへ",artist:"Vocal Canvas DEMO",sections:[{id:"a",name:"1A",lyrics:"静かな夜に 声を探して\nひとつ深く 息を吸い込む"},{id:"b",name:"1B",lyrics:"届きそうで 届かないまま\n少しだけ強く 前を向く"},{id:"c",name:"1サビ",lyrics:"この声が響くなら\nもう一度 歌ってみよう"}],annotations:[{id:"d1",sectionId:"a",start:0,end:5,voice:"air",symbol:"breath",expression:"息を多めに、話すように静かに入る",caution:"最初から声量を出しすぎない。子音を強くしすぎない。",memo:"一度息だけで読んでから歌う。"},{id:"d2",sectionId:"a",start:6,end:11,voice:"chest",symbol:"accent",expression:"地声。『声』に軽くアクセント",caution:"低音を押し込まず、響きを前に保つ。",memo:"フレーズを3回ゆっくり確認。"},{id:"d3",sectionId:"b",start:0,end:5,voice:"mix",symbol:"up",expression:"MIXへ移行。少しずつ熱量を上げる",caution:"喉で持ち上げない。母音を縦に広げすぎない。",memo:"地声→MIXの切替だけ5回。"},{id:"d4",sectionId:"b",start:13,end:19,voice:"chest",symbol:"accent",expression:"サビ前なので前向きに、少し強く",caution:"強く＝叫ぶ、にならないよう注意。",memo:"最後の語尾で次のブレスを準備。"},{id:"d5",sectionId:"c",start:0,end:4,voice:"mix",symbol:"accent",expression:"MIXで芯を残す。サビの入りを明確に",caution:"『この』で力まない。音程を上から当てない。",memo:"サビ頭だけ録音してピッチ確認。"},{id:"d6",sectionId:"c",start:4,end:9,voice:"head",symbol:"vibrato",expression:"後半は裏声寄りに抜き、語尾は軽いビブラート",caution:"裏声に変わった瞬間に音量を落としすぎない。",memo:"MIX→裏声の接続を5回反復。"},{id:"d7",sectionId:"c",start:10,end:14,voice:"air",symbol:"breath",expression:"一度抜いて、柔らかく入り直す",caution:"ブレスを急がない。肩を上げない。",memo:"ブレス位置を固定する。"},{id:"d8",sectionId:"c",start:15,end:21,voice:"mix",symbol:"warn",expression:"最後はMIX。まっすぐ届ける",caution:"『歌って』でピッチが低くなりやすい。語尾を押さない。",memo:"ここを今日の重点フレーズにする。"}]};let data=JSON.parse(localStorage.getItem(KEY)||"null")||{songs:[demo]};let songId=null,secId=null,sel=null,practice=false;
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(data)),song=()=>data.songs.find(x=>x.id===songId),sec=()=>song()?.sections.find(x=>x.id===secId);
function library(){ $("library").classList.add("on");$("editor").classList.remove("on");$("back").style.display="none";$("practiceBtn").style.display="none";$("songs").innerHTML=data.songs.map(s=>`<div class="songcard" data-id="${s.id}"><h3>${esc(s.title)}</h3><div class="meta">${esc(s.artist||"")} ・ ${s.sections.length}セクション</div></div>`).join("")||'<div class="empty">まだ曲がありません</div>';document.querySelectorAll(".songcard").forEach(x=>x.onclick=()=>openSong(x.dataset.id))}
function openSong(id){songId=id;secId=song().sections[0]?.id;$("library").classList.remove("on");$("editor").classList.add("on");$("back").style.display="";$("practiceBtn").style.display="";render()}
function render(){let s=song(),q=sec();$("songTitle").textContent=s.title;$("artist").textContent=s.artist;$("tabs").innerHTML=s.sections.map(x=>`<button class="tab ${x.id===secId?"on":""}" data-id="${x.id}">${esc(x.name)}</button>`).join("");document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>{secId=x.dataset.id;sel=null;render()});$("sectionName").textContent=q?.name||"";renderLyrics();loadDetails()}
function renderLyrics(){let q=sec();if(!q){$("lyrics").textContent="";return}let anns=song().annotations.filter(a=>a.sectionId===q.id).sort((a,b)=>a.start-b.start);let out="",p=0;for(const a of anns){if(a.start<p)continue;out+=esc(q.lyrics.slice(p,a.start));let cls=["mark",a.voice?"v-"+a.voice:"",a.symbol?"sym-"+a.symbol:""].join(" ");out+=`<span class="${cls}" data-ann="${a.id}">${esc(q.lyrics.slice(a.start,a.end))}</span>`;p=a.end}out+=esc(q.lyrics.slice(p));$("lyrics").innerHTML=out;document.querySelectorAll("[data-ann]").forEach(x=>x.onclick=e=>{e.stopPropagation();let a=song().annotations.find(z=>z.id===x.dataset.ann);sel={start:a.start,end:a.end,id:a.id};loadDetails()})}
function capture(){let selection=window.getSelection();if(!selection||selection.isCollapsed)return;let text=selection.toString();let full=sec().lyrics;let start=full.indexOf(text);if(start<0)return;sel={start,end:start+text.length};$("selected").textContent="選択："+text;loadDetails(false)}
$("lyrics").addEventListener("mouseup",capture);$("lyrics").addEventListener("touchend",()=>setTimeout(capture,50));
function currentAnn(create=false){if(!sel)return null;let a=sel.id&&song().annotations.find(x=>x.id===sel.id);if(!a)a=song().annotations.find(x=>x.sectionId===secId&&x.start===sel.start&&x.end===sel.end);if(!a&&create){a={id:crypto.randomUUID(),sectionId:secId,start:sel.start,end:sel.end,voice:"",symbol:"",expression:"",caution:"",memo:""};song().annotations.push(a);sel.id=a.id}return a}
function loadDetails(reset=true){let a=currentAnn();if(!sel){$("selected").textContent="フレーズを選択してください"}else $("selected").textContent="選択："+sec().lyrics.slice(sel.start,sel.end);if(reset){$("expression").value=a?.expression||"";$("caution").value=a?.caution||"";$("memo").value=a?.memo||""}}
document.querySelectorAll("[data-voice]").forEach(b=>b.onclick=()=>{let a=currentAnn(true);if(!a)return;a.voice=b.dataset.voice;save();renderLyrics()});document.querySelectorAll("[data-symbol]").forEach(b=>b.onclick=()=>{let a=currentAnn(true);if(!a)return;a.symbol=a.symbol===b.dataset.symbol?"":b.dataset.symbol;save();renderLyrics()});
["expression","caution","memo"].forEach(id=>$(id).oninput=()=>{let a=currentAnn(true);if(!a)return;a[id]=$(id).value;save()});
$("back").onclick=()=>{if(practice)togglePractice();else library()};$("practiceBtn").onclick=togglePractice;function togglePractice(){practice=!practice;$("editor").classList.toggle("practice",practice);$("practiceBtn").textContent=practice?"編集":"練習";$("editSong").style.display=practice?"none":""}
function esc(s=""){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function openModal(edit=false){$("modal").classList.add("on");$("modalTitle").textContent=edit?"曲・歌詞を編集":"曲を追加";let s=edit?song():null;$("mTitle").value=s?.title||"";$("mArtist").value=s?.artist||"";$("sectionInputs").innerHTML="";(s?.sections||[{name:"1A",lyrics:""},{name:"1B",lyrics:""},{name:"1サビ",lyrics:""}]).forEach(addSecRow);$("saveSong").dataset.edit=edit?"1":""}
function addSecRow(v={name:"",lyrics:""}){let d=document.createElement("div");d.className="sectionsEdit";d.innerHTML=`<input class="sn" placeholder="1A" value="${esc(v.name)}"><textarea class="sl" placeholder="歌詞を入力">${esc(v.lyrics)}</textarea>`;$("sectionInputs").appendChild(d)}
$("newSong").onclick=()=>openModal(false);$("editSong").onclick=()=>openModal(true);$("addSection").onclick=()=>addSecRow();$("cancel").onclick=()=>$("modal").classList.remove("on");
$("saveSong").onclick=()=>{let title=$("mTitle").value.trim();if(!title)return alert("曲名を入力してください");let rows=[...document.querySelectorAll(".sectionsEdit")];let sections=rows.map((r,i)=>({id:"s"+Date.now()+i,name:r.querySelector(".sn").value.trim()||"セクション",lyrics:r.querySelector(".sl").value}));if($("saveSong").dataset.edit){let s=song();s.title=title;s.artist=$("mArtist").value;s.sections=sections;s.annotations=[];secId=sections[0]?.id}else{let s={id:crypto.randomUUID(),title,artist:$("mArtist").value,sections,annotations:[]};data.songs.unshift(s);songId=s.id;secId=sections[0]?.id}save();$("modal").classList.remove("on");openSong(songId)};
library();
</script></body></html>
