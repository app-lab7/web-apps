<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bye Bye BLUE｜1080p MP4ダウンロード</title><style>body{margin:0;background:#101c2d;color:#f2f6fa;font:17px/1.7 system-ui,-apple-system,sans-serif}main{max-width:740px;margin:auto;padding:30px 18px}h1{line-height:1.3}button{background:#d4ecff;color:#112031;border:0;border-radius:8px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}a{color:#b7deff}progress{width:100%;height:18px}small{color:#b9c9da}</style></head><body><main><h1>Bye Bye BLUE｜1080p MP4</h1><p>湊音ヒロ · 1920×1080 · 30fps · H.264＋AAC。約200 MBの本編をブラウザから保存できます。</p><button id="save">MP4を保存する</button><p id="message" role="status"></p><progress id="progress" max="1" value="0" hidden></progress><p><a href="index.html">MVの再生ページへ戻る</a> · <a href="thumbs-v38.html">4秒ごとのサムネイル</a></p><small>保存の準備中はこのページを閉じないでください。スマートフォンでは通信環境により時間がかかります。</small></main><script>
const btn=document.getElementById('save'),msg=document.getElementById('message'),bar=document.getElementById('progress');
btn.addEventListener('click',async()=>{
 btn.disabled=true;bar.hidden=false;msg.textContent='ファイルを準備しています…';
 try{
  const response=await fetch('hls/v38/index.m3u8');if(!response.ok)throw Error('再生データを取得できません');
  const manifest=await response.text(),files=['init.mp4',...manifest.split(/\r?\n/).filter(x=>x.endsWith('.m4s'))];
  let writer=null,parts=[];
  if(window.showSaveFilePicker){try{const handle=await showSaveFilePicker({suggestedName:'ByeByeBLUE_v38_1080p.mp4',types:[{description:'MP4 video',accept:{'video/mp4':['.mp4']}}]});writer=await handle.createWritable()}catch(e){if(e.name==='AbortError')throw e}}
  for(let i=0;i<files.length;i++){
   const r=await fetch('hls/v38/'+files[i]);if(!r.ok)throw Error('データ '+(i+1)+' を取得できません');
   const chunk=await r.blob();if(writer)await writer.write(chunk);else parts.push(chunk);
   bar.value=(i+1)/files.length;msg.textContent=`準備中 ${i+1} / ${files.length}`;
  }
  if(writer)await writer.close();else{const url=URL.createObjectURL(new Blob(parts,{type:'video/mp4'}));const a=document.createElement('a');a.href=url;a.download='ByeByeBLUE_v38_1080p.mp4';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
  msg.textContent='MP4を保存しました。';
 }catch(e){msg.textContent=e.name==='AbortError'?'保存をキャンセルしました。':'保存に失敗しました：'+e.message}
 finally{btn.disabled=false}
});
</script></body></html>
