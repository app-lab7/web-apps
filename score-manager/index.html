<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共和校 成績管理</title><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="共和校 管理"><meta name="theme-color" content="#16816D"><link rel="stylesheet" href="style.css?v=20261005-mobile"><style>body.locked>header,body.locked>main,body.locked>dialog{display:none}.gate[hidden]{display:none}.gate{min-height:100dvh;display:grid;place-items:center;padding:20px;background:#eef3f8;font-family:system-ui,sans-serif;color:#203047}.gate-card{width:min(100%,380px);background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 32px #183d6522}.gate-card h1{font-size:24px;color:#183d65;margin:0 0 8px}.gate-card p{line-height:1.6}.gate-card label{display:block;margin-bottom:8px}.gate-card input{width:100%;box-sizing:border-box;padding:12px;font-size:18px;border:1px solid #c8d3e0;border-radius:8px}.gate-card button{width:100%;margin-top:12px;padding:13px;background:#126d91;color:white;border:0;border-radius:8px;font-size:17px;font-weight:bold}.gate-error{color:#b42318;min-height:1.5em;font-size:14px}</style></head><body class="locked"><div id="gate" class="gate"><form id="gateForm" class="gate-card"><h1>共和校 成績管理</h1><p>アプリのパスワードを入力してください。</p><label for="gatePassword">パスワード</label><input id="gatePassword" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required><button>開く</button><p id="gateError" class="gate-error" role="alert"></p></form></div>
<header><a href="./" id="brand">共和校 <span>成績管理</span></a><button id="settings" class="quiet">登録・設定</button></header>
<main><div id="notice" role="status" aria-live="polite"></div><div id="app"></div></main>
<dialog id="registration"><form id="registerForm"><div class="dialog-top"><h2 id="registerTitle"></h2><button type="button" id="closeDialog" class="quiet">閉じる</button></div><div id="registerFields"></div><p id="registerStatus" role="status"></p><button class="primary" id="registerSubmit">登録する</button></form></dialog>
<script>
const GATE_KEY='kyowa-score-manager-unlocked-v1',GATE_HASH='52fca1c4244d415a9f7934878ec582a71099283471514360ff8976d1463118d9';
function unlock(){document.body.classList.remove('locked');document.getElementById('gate').hidden=true;const script=document.createElement('script');script.src='app.js?v=20261005-averages';document.body.appendChild(script)}
document.getElementById('gateForm').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('gatePassword'),bytes=new TextEncoder().encode(input.value),digest=await crypto.subtle.digest('SHA-256',bytes),value=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');if(value!==GATE_HASH){document.getElementById('gateError').textContent='パスワードが違います。';input.value='';input.focus();return}try{sessionStorage.setItem(GATE_KEY,'1')}catch(_){}unlock()};
try{if(sessionStorage.getItem(GATE_KEY)==='1')unlock()}catch(_){}
</script></body></html>
