 m.querySelectorAll(".card[data-id] button").forEach(b=>b.onclick=()=>{const c=b.closest(".card"),id=c.dataset.id,s=students.find(z=>z.id===id);const a=b.dataset.a;
  if(a==="open")location.hash="s-"+id;
  else if(a==="ren"){const v=prompt("名前を入力",s.name);if(v&&v.trim()){s.name=v.trim();saveStudents().then(drawList)}}
  else if(a==="del"){if(confirm("「"+s.name+"」を一覧から外します。記録そのものは消えません(リンクを知っていれば開けます)。よろしいですか?")){students=students.filter(z=>z.id!==id);saveStudents().then(drawList)}}
  else if(a==="link"){const pn=c.querySelector(".pn");if(pn.innerHTML){pn.innerHTML="";return}const u=studentUrl(s.code);pn.innerHTML='<div class="ln">'+esc(u)+'</div><div class="bt"><button data-a="copy">リンクをコピー</button></div><div class="qrbox"></div><div class="empty">このリンクとQRは、この生徒専用です。他の人に見せないでください。</div>';
   try{new QRCode(pn.querySelector(".qrbox"),{text:u,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}catch(e){pn.querySelector(".qrbox").remove()}
   pn.querySelector('[data-a=copy]').onclick=()=>{try{navigator.clipboard.writeText(u).then(()=>{pn.querySelector('[data-a=copy]').textContent="コピーしました"})}catch(e){}}}
 })}
async function addStudent(){const v=document.getElementById("nn").value.trim();if(!v)return;students.push({id:"s"+Date.now().toString(36),name:v,code:rand()});await saveStudents();sums={};loadList()}
/* ---- 生徒の詳細 ---- */
let data=null,detailCode="",detailName="";
async function loadDetail(){
 if(!detailCode){return}
 upd.textContent="更新中…";
 try{const a=await rpc("rika_get",{p_code:detailCode});data=a.length?a[0]:{checks:{},memo:{},countdowns:[],updated_at:null};err=""}catch(e){err="読み込めませんでした(通信を確認してください)"}
 drawDetail()}
function drawDetail(){
 let back=T?'<button class="bk" id="bk">← 生徒一覧</button>':"";
 if(err&&!data){m.innerHTML=back+'<div class="card warn">'+esc(err)+"</div>";bind();upd.textContent="";return}
 if(!data)return;
 const done=data.checks||{},memo=data.memo||{},cds=(data.countdowns||[]);
 const st=ITEMS.filter(isStudy),n=st.length,dn=st.filter(x=>done[x.d]).length;
 const past=st.filter(x=>x.d<today),exp=past.length,pd=past.filter(x=>done[x.d]).length;
 const missed=st.filter(x=>x.d<today&&!done[x.d]);
 const diff=dn-exp;
 const ts=data.updated_at?Date.parse(data.updated_at):0;
 upd.textContent=err?err:(ts?"最終入力 "+ago(ts):"まだ入力がありません");
 const exam=days("2027-02-24");
 let h=back+(detailName?'<h2 style="margin:8px 4px 0;font-size:18px;color:var(--n)">'+esc(detailName)+" さん</h2>":"");
 h+='<div class="big"><div class="l">愛知県公立高校入試 まで</div><div class="n">'+(exam>0?"あと "+exam+"<small>日</small>":(exam===0?"今日":"終了"))+"</div></div>";
 const others=cds.filter(c=>!c.fixed).sort((a,b)=>a.date<b.date?-1:1);
 if(others.length)h+='<div class="chips">'+others.map(c=>{const k=days(c.date);return '<div class="chip">'+esc(c.label)+" "+(k>0?"あと<b>"+k+"</b>日":(k===0?"<b>今日</b>":"終了"))+" ("+md(c.date)+")</div>"}).join("")+"</div>";
 h+='<div class="card"><h2>進み具合</h2><div class="kpi"><div><b>'+dn+"/"+n+"</b><span>完了(全体)</span></div><div class='"+(missed.length?"late":"ok")+"'><b>"+missed.length+"</b><span>未完了(過去分)</span></div><div class='"+(diff<0?"late":"ok")+"'><b>"+(diff>0?"+":"")+diff+"</b><span>予定との差</span></div></div><div class='bar'><i style='width:"+(n?dn/n*100:0)+"%'></i></div><div class='empty'>昨日までの予定 "+exp+" 件のうち "+pd+" 件完了</div>"+(ts&&(Date.now()-ts)>3*864e5?'<p class="warn">3日以上、入力がありません。</p>':"")+"</div>";
 const seen={};let mh="";for(const x of ITEMS){const k=mkey(x);if(memo[k]&&!seen[k]){seen[k]=1;mh+='<div class="li"><span class="d">'+esc(mlabel(x))+'</span><div class="memo">'+esc(memo[k])+"</div></div>"}}
 h+='<div class="card"><h2>わからないところ(メモ)</h2>'+(mh||'<div class="empty">メモはまだありません</div>')+"</div>";
 const td=ITEMS.filter(x=>x.d===today);
 h+='<div class="card"><h2>今日の予定</h2>'+(td.length?td.map(x=>'<div class="li"><span class="d">'+(isStudy(x)?(done[x.d]?"✅ 完了":"⬜ 未完了"):"—")+"</span> "+esc(x.t)+'<div class="m">'+(x.p&&x.p!=="—"?esc(x.p)+"・":"")+esc(x.m)+"</div></div>").join(""):'<div class="empty">学習期間外です</div>')+(()=>{if(!QUIZ[today])return"";const r=done["q:"+today];return '<div class="li"><span class="d">📝 今日のテスト</span> '+(r?(r.f?"⭕ 初回で正解":(r.ok?"❌→⭕ "+r.n+"回目で正解":"❌ 未正解("+r.n+"回)")):"⬜ まだ回答なし")+"</div>"})()+"</div>";
 h+='<div class="card"><h2>未完了(過去分) '+missed.length+" 件</h2>"+(missed.length?missed.slice(-15).reverse().map(x=>'<div class="li"><span class="d warn">'+md(x.d)+"("+x.w+")</span> "+esc(x.t)+"</div>").join("")+(missed.length>15?'<div class="empty">ほか '+(missed.length-15)+" 件(古いもの)</div>":""):'<div class="empty">遅れはありません</div>')+"</div>";
 const qk=Object.keys(done).filter(k=>k.startsWith("q:")).sort().reverse();
 const qdet=(d,r)=>{const q=QUIZ[d];if(!q)return"";return '<div class="qd"><div class="qq">'+esc(q.q)+"</div>"+q.o.map((o,i)=>'<div class="'+(i===q.a?"qa":"")+(r&&i===r.l&&!r.ok?" qw":"")+'">'+"アイウエ"[i]+" "+esc(o)+(i===q.a?" ✅正解":"")+(r&&i===r.l&&i!==q.a?" ← 生徒の選択":"")+"</div>").join("")+'<div class="qe">解説:'+esc(q.e)+"</div></div>"};
 if(qk.length){const f=qk.filter(k=>done[k].f).length;h+='<div class="card"><h2>今日のテスト(正誤)</h2><div class="empty" style="margin-bottom:6px">回答 '+qk.length+" 問・初回正解 "+f+" 問("+Math.round(f/qk.length*100)+"%)</div>"+qk.slice(0,10).map(k=>{const r=done[k],d=k.slice(2);const it=ITEMS.find(x=>x.d===d);return '<details class="li"><summary><span class="d">'+md(d)+'</span> '+(r.f?"⭕ 初回で正解":(r.ok?"❌→⭕ "+r.n+"回目で正解":"❌ 未正解("+r.n+"回)"))+(r.v?" ・解説を見た":"")+(it?'<div class="m">'+esc(it.t)+"</div>":"")+"</summary>"+qdet(d,r)+"</details>"}).join("")+"</div>"}
 const qall=Object.keys(QUIZ).sort();
 if(qall.length){h+='<details class="card"><summary><b style="color:var(--n)">問題一覧(解説つき・先生の確認用) '+qall.length+" 問</b></summary>"+qall.map(d=>'<div class="li"><span class="d">'+md(d)+'</span> '+esc(QUIZ[d].u)+qdet(d,done["q:"+d])+"</div>").join("")+"</details>"}
 const first=new Date(ITEMS[0].d+"T00:00:00");const pad=(first.getDay()+6)%7;
 let cal='<div class="cal">'+"月火水木金土日".split("").map(w=>'<div class="h">'+w+"</div>").join("")+'<div class="c off"></div>'.repeat(pad);
 const memoDays={};for(const x of ITEMS){if(memo[mkey(x)])memoDays[x.d]=1}
 for(const x of ITEMS){const cl=["c"];if(!isStudy(x))cl.push("rest");else if(done[x.d])cl.push("done");else if(x.d<today)cl.push("miss");if(x.d===today)cl.push("today");if(memoDays[x.d])cl.push("memo");cal+='<div class="'+cl.join(" ")+'">'+Number(x.d.slice(8))+"</div>"}
 cal+="</div>";
 h+='<div class="card"><h2>カレンダー</h2>'+cal+'<div class="leg"><span><i style="background:var(--ok)"></i>完了</span><span><i style="background:var(--warn)"></i>未完了</span><span><i style="background:var(--g)"></i>これから</span><span>📝 メモあり</span></div></div>';
 h+='<p class="empty" style="text-align:center">この画面は閲覧専用です。60秒ごとに自動更新されます。</p>';
 m.innerHTML=h;bind()}
function bind(){const b=document.getElementById("bk");if(b)b.onclick=()=>{location.hash=""}}
/* ---- 画面の切り替え ---- */
function route(){
 if(T){const h=location.hash;if(h.startsWith("#s-")){const id=h.slice(3);const s=students.find(z=>z.id===id);if(s){detailCode=s.code;detailName=s.name;data=null;m.innerHTML='<div class="card empty">読み込み中…</div>';loadDetail();return}}
  detailCode="";loadList();return}
 if(directCode){detailCode=directCode;detailName="";loadDetail();return}
 m.innerHTML='<div class="card"><h2>先生用キーまたは生徒のコード</h2><div class="form"><input id="ci" placeholder="先生用リンクの t= または 生徒の k= の文字列"><button id="cb">開く</button></div><p class="empty">先生用リンク(?t=…)で開くと、生徒の一覧が使えます。</p></div>';
 document.getElementById("cb").onclick=()=>{const v=document.getElementById("ci").value.trim();if(v.length>=24){ls.set(TK,v);T=v;route()}else if(v.length>=16){ls.set(CK,v);directCode=v;route()}};upd.textContent=""}
function refresh(){if(detailCode)loadDetail();else if(T)loadList()}
rf.onclick=refresh;
setInterval(()=>{if(document.visibilityState==="visible")refresh()},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});
window.addEventListener("hashchange",async()=>{if(T&&!students.length){try{const a=await rpc("rika_t_get",{p_key:T});students=a.length?a[0].students||[]:[]}catch(e){}}route()});
fetch('../rika-plan/quiz.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&typeof j==='object'){QUIZ=j;if(detailCode&&data)drawDetail()}}).catch(()=>{});
(async()=>{if(T){try{const a=await rpc("rika_t_get",{p_key:T});students=a.length?a[0].students||[]:[]}catch(e){}}route()})();
</script></body></html>
