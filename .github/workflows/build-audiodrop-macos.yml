name: Build AudioDrop macOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'audiodrop-mac/**'
      - '.github/workflows/build-audiodrop-macos.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build AudioDrop.app
        run: bash audiodrop-mac/build_mac.sh
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: AudioDrop-macOS
          path: audiodrop-mac/build/AudioDrop-macOS.zip
          if-no-files-found: error
