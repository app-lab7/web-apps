<script>/* New implementation: provisional balance, world facts, decisions, knowledge. */
const BALANCE = Object.freeze({initialPower:8,nudgeCost:4,powerCap:24,hoursPerYear:576,adaptationPerDay:0.12,illnessPerDay:0.002});
const ACTIONS={water:'水を探す',gather:'食料を採る',explore:'周囲を調べる',rest:'休む',social:'誰かと過ごす'};
const KNOWLEDGE_RADIUS=8;
function rng(w){w.rng=(Math.imul(w.rng,1664525)+1013904223)>>>0;return w.rng/4294967296;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function makeWorld(seed=Date.now()>>>0){
 const w={schema:4,seed,rng:seed,t:6,power:BALANCE.initialPower,groups:{1:{food:32},2:{food:32}},people:[],events:[],interventions:[],distortions:[],nextEvent:1,camera:{x:14,y:11,zoom:1.6},watched:{},notices:[],pause:true,
  knowledge:{god:{death:false,aging:false,immortality:'unknown',people:{},events:[],secrets:{deathOrigin:false,childOrigin:false}},maga:{deathMeaning:false,observations:[],voice:null}},
  facts:{genesis:{lifeCreatedBy:'god',deathCreatedBy:'maga',nearlySimultaneous:true,lifeDistortion:{amount:null,remaining:null},deathDistortion:{amount:null,remaining:null}},godImmortal:true,magaImmortal:true,child:{status:'not-instantiated-pending-birth-age-decision',automaticDeathSense:false}},
  tutorial:{step:0,reunion:false},savedAt:0};
 const specs=[['ナギ','m',13,11,true],['ミナ','f',15,12,true],['ユイ','f',29,7,false],['トワ','m',31,8,false]];
 for(let i=0;i<specs.length;i++){const [name,sex,x,y,founder]=specs[i];w.people.push({id:i+1,group:i<2?1:2,name,sex,x,y,age:18+(i>1?i:0),founder,origin:founder?'direct-genesis':'genesis-afterwave',alive:true,health:100,hunger:18,thirst:founder&&i===0?68:24,fatigue:i===1?35:15,curiosity:40+rng(w)*35,sociability:25+rng(w)*40,faith:0,sensesGod:founder,job:'採集',knownWater:false,attentionUntil:0,nextDecision:6,action:'explore',target:{x,y},decision:null,lastSeenAt:null,life:[],relations:{},appearance:{hue:i%4,mark:i===0?'blue':i===1?'red':'green'}});}
 initLife(w);fact(w,'genesis','最初の二人が生まれた瞬間、神も目覚めた。',{public:true});
 for(const p of w.people){fact(w,'birth',`${p.name}が創世の中で生まれた。`,{pid:p.id});decide(w,p);}
 observe(w);return w;
}
function fact(w,type,text,data={}){const e={id:w.nextEvent++,t:w.t,type,text,...data};w.events.push(e);for(const id of new Set([data.pid,...(data.related||[])].filter(Boolean))){const p=byId(w,id);if(p)p.life.push(e.id);}const p=byId(w,data.pid);if(data.public||p&&isObserved(w,p))revealEvent(w,e);if(p&&magaSees(w,p))w.knowledge.maga.events.push(e.id);return e;}
function revealEvent(w,e){const c=cached(w);if(!c.known.has(e.id)){c.known.add(e.id);w.knowledge.god.events.push(e.id);if(['birth','pregnancy','marriage','partner','job','migration','guardian','retire'].includes(e.type)){const ids=[e.pid,...(e.related||[])].filter(id=>w.watched[id]);if(ids.length){w.notices=w.notices.filter(n=>n.type!=='life'||n.pid!==ids[0]);w.notices.push({id:'life-'+e.id,pid:ids[0],event:e.id,type:'life'});if(!w.tutorial.onboardingActive&&['birth','partner','marriage','migration'].includes(e.type)&&w.t-(w.tutorial.lastImportantAt??-99999)>=48){w.pause=true;w.tutorial.lastImportantAt=w.t;}}}}}
function isObserved(w,p){return distance(w.camera,p)<=KNOWLEDGE_RADIUS;}
function land(x,y){return x>=0&&x<38&&y>=0&&y<26&&!waterTile(x,y);}
function waterTile(x,y){return Math.abs(x-(6+Math.round(Math.sin(y/5))))<1.2||Math.hypot(x-29,(y-19)*1.3)<2.5;}
const shoreCache=new Map();
function shore(p){const key=Math.floor(p.x)+','+Math.floor(p.y);if(shoreCache.has(key))return shoreCache.get(key);let best=null;for(let y=1;y<25;y++)for(let x=1;x<37;x++){if(!land(x,y))continue;if([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>waterTile(x+a,y+b))){const q={x:x+.5,y:y+.5};if(!best||distance(p,q)<distance(p,best))best=q;}}shoreCache.set(key,best);return best;}
function randomLand(w,p,r=4){for(let i=0;i<20;i++){const q={x:clamp(Math.round(p.x+(rng(w)-.5)*r*2),1,36)+.5,y:clamp(Math.round(p.y+(rng(w)-.5)*r*2),1,24)+.5};if(land(Math.floor(q.x),Math.floor(q.y))&&((p.x>8)===(q.x>8)))return q;}return {x:p.x,y:p.y};}
function decide(w,p){return lifeDecide(w,p);}

function move(w,p){return lifeMove(w,p);}

function advance(w){return lifeAdvance(w);}

function voice(w,text,pid,basis){if(w.knowledge.maga.voice)return;w.knowledge.maga.voice={text,pid,t:w.t,basis};fact(w,'voice',`？？？「${text}」`,{public:true});}
function nudgeAvailability(w,p){if(!p?.alive||!isObserved(w,p))return '現在、この人物を観察できません。';if(p.attentionUntil>w.t)return '注意はすでに水の手掛かりへ向いています。重ねても新しい効果はありません。';if(w.power<BALANCE.nudgeCost)return '神力が足りません。観察と記録は続けられます。';return null;}
function intervene(w,pid,use){const p=w.people.find(p=>p.id===pid);if(!p||!p.alive||!isObserved(w,p))return {ok:false,reason:'現在、この人物を観察できません。'};
 if(use){const reason=nudgeAvailability(w,p);if(reason)return {ok:false,reason};}
 const a={id:w.interventions.length+1,t:w.t,pid,use,cost:use?BALANCE.nudgeCost:0,effective:use,effect:use?'水の手掛かりへ注意が向きやすくなった':'超自然的な変更なし',perception:null,discovery:null,risk:use?'小':'なし',resolved:false,choice:'本人の次の判断を待っています',interpreted:false};w.interventions.push(a);

 dialog('小さな気づき',`<p><b>${escapeHTML(p.name)}</b>の注意を、水の手掛かりへ向けることができます。</p><dl><dt>変えられること</dt><dd>近くの手掛かりへ注意が向きやすくなる。水源の知識は直接与えない</dd><dt>決められないこと</dt><dd>知覚、発見、行き先、信仰。周囲の環境と本人の判断によります。</dd><dt>消費</dt><dd>神力 ${BALANCE.nudgeCost} ／ 今の残量 ${world.power}</dd><dt>運命への影響</dt><dd>小。世界が変化を受け止める負担が残ります。悲劇が決まるわけではありません。</dd></dl>${reason?`<p class="muted">${escapeHTML(reason)} 効果がない場合は消費しません。</p>`:''}<p class="muted">数値は仮設定です。注意への効果が成立すると、発見に至らなくても消費と小さな歪みが生じます。</p>`,[
 {label:'使う',primary:true,disabled:!!reason,run:()=>{const r=intervene(world,p.id,true);showToast(r.ok?'注意への働きかけが成立しました。進路は本人が選びます。':r.reason);}},
 {label:'使わずに見守る',run:()=>{const r=intervene(world,p.id,false);if(!r.ok)showToast(r.reason);}},
 {label:'戻る',run:()=>{world.tutorial.step=Math.max(world.tutorial.step,1);}}
 ]);
}
function life(id=selected){const k=world.knowledge.god.people[id];if(!k)return;const entries=knownLife(world,id);dialog(`${k.name}の人生`, `<p class="muted">観察して知った記録。知らない期間を埋める回想は作りません。</p>${k.firstSnapshot?`<div class="menugrid"><div><canvas id="firstPortrait" width="48" height="60" style="width:48px;height:60px"></canvas><p>記録に残る最初の姿<br>${k.firstSnapshot.age}歳 · ${escapeHTML(k.firstSnapshot.job)}<br>${escapeHTML(k.firstSnapshot.place)}</p></div><div><canvas id="lastPortrait" width="48" height="60" style="width:48px;height:60px"></canvas><p>最後に確認した姿<br>${k.snapshot.age}歳 · ${escapeHTML(k.snapshot.job)}<br>${escapeHTML(k.snapshot.place)}</p></div></div>`:''}<ol class="timeline">${entries.map(e=>`<li><time>${dateLabel(e.t)}</time>${escapeHTML(e.text)}</li>`).join('')||'<li>まだ詳しい出来事を確認できていません。</li>'}</ol>`,[{label:'世界へ戻る',run:()=>{}}]);if(k.firstSnapshot){drawPortrait($('firstPortrait'),k.firstSnapshot);drawPortrait($('lastPortrait'),k.snapshot);}}
function watch(){if(!selected)return;if(world.watched[selected])delete world.watched[selected];else world.watched[selected]={stopOnDeath:false};world.tutorial.step=Math.max(4,world.tutorial.step);persist();showToast(world.watched[selected]?'見守り登録しました。人生を変える力ではありません。':'見守り登録を解除しました。');updateUI();}
function menu(){dialog('メニュー', '<div class="menugrid" id="menuGrid"></div><p class="muted">保存はこの端末だけ。閉じている間、世界は完全停止します。年代進行は右端の「年」。重要事件で停止します。</p>',[{label:'世界へ戻る',run:()=>{}}]);
 const items=[['見守る人',()=>watchList()],['出会った人',()=>peopleList()],['暮らし・関係',()=>relationships(selected)],['歴史を見る',()=>history()],['保存する',async()=>{if(await persist())showToast('この端末に保存しました。');}],['保存ファイルを書き出す',exportSave],['保存ファイルを読み込む',importSave],['仮設定・開発状況',()=>settings()],['新しい世界',()=>dialog('新しい世界を始める', '<p>この試作版の保存を新しい世界で置き換えます。</p>',[{label:'新しく始める',run:()=>{world=makeWorld();selected=1;world.pause=false;accumulator=0;lastKnownSeen={},lastPersonMarkup=null,lastNamesMarkup=null;updateUI();}},{label:'戻る',run:menu}])]];
 for(const [title,run] of items){const b=document.createElement('button');b.textContent=title;b.onclick=()=>{dialogOpen=false;$('shade').hidden=true;run();};$('menuGrid').append(b);}}
function watchList(){const ids=Object.keys(world.watched);dialog('見守る人',`<div class="menugrid" id="watchGrid"></div>${ids.length?'':'<p>人物カードの「見守る」で登録できます。</p>'}`, [{label:'戻る',run:menu}]);for(const id of ids){const k=world.knowledge.god.people[id];const b=document.createElement('button');b.textContent=k.name+(k.deathConfirmed?' · 故人':'');b.onclick=()=>{dialogOpen=false;$('shade').hidden=true;choose(+id);};$('watchGrid').append(b);}}
function history(){const set=new Set(world.knowledge.god.events);const entries=world.events.filter(e=>set.has(e.id));dialog('知っている歴史',`<ol class="timeline">${entries.slice(-100).map(e=>`<li><time>${dateLabel(e.t)}</time>${escapeHTML(e.text)}</li>`).join('')}</ol><p class="muted">直近100件を表示。世界の内部事実すべてを公開する画面ではありません。</p>`,[{label:'戻る',run:menu}]);}
function settings(){dialog('調整用の仮設定',`<p>初期神力 ${BALANCE.initialPower} ／ 気づき ${BALANCE.nudgeCost} ／ 神力上限 ${BALANCE.powerCap}</p><p>神力は時間で回復しません。通常の生活による受け止め、病気と老化の速度は仮設定です。</p><p>今回動く部分：関係形成・恋愛・結婚・妊娠・出産・養育・世代交代、仕事・住居・対立・移住、観察・記録・保存。</p><p>今後接続する部分：医術、文明、禍の人格と負担の引き受け、世界観の追加要素、終局と8つの結末。</p><p>旧版の保存とは独立しています。</p>${world.knowledge.god.death&&selected?'<button id="deathSetting">この人物の死亡停止設定</button>':''}`, [{label:'戻る',run:menu}]);if($('deathSetting'))$('deathSetting').onclick=()=>{if(!world.watched[selected])world.watched[selected]={stopOnDeath:false};world.watched[selected].stopOnDeath=!world.watched[selected].stopOnDeath;persist();showToast(world.watched[selected].stopOnDeath?'死亡を知ったとき停止します。':'死亡を知ったとき通知します。');};}
function updateUI(){
 $('date').textContent=dateLabel(world.t);$('power').textContent=world.power;$('origin').textContent=world.interventions.some(a=>a.use)?'回復は祈り・感謝から':'創世の名残';$('population').textContent=Object.keys(world.knowledge.god.people).length;
 $('pause').textContent=world.pause?'▶ 再開':'Ⅱ';$('pause').setAttribute('aria-label',world.pause?'時間を進める':'時間を止める');
 const guides=['① ナギかミナをタップ。二人は命令しなくても生きています。','② 人物カードの「気づき」を開き、できることを確認しましょう。','③ 「使う」「見守る」のどちらかを選びましょう。正解はありません。','④ 時間を進めて「介入結果」を確認。神の効果と本人の判断は別です。','⑤ 「見守る」を登録。大切な転機があれば知らせます。'];$('guide').textContent=world.tutorial.reunion?'再会しました。以前と今の違いは人生記録で確かめられます。':guides[Math.min(4,world.tutorial.step)];
 const known=Object.values(world.knowledge.god.people);const names=known.filter(k=>!k.deathConfirmed&&(k.id===selected||world.watched[k.id]||isObserved(world,byId(world,k.id)))).slice(0,8).map(k=>`<button data-person="${k.id}" class="${k.id===selected?'active':''}">${escapeHTML(k.name)}</button>`).join('');if(lastNamesMarkup!==names){$('names').innerHTML=names;lastNamesMarkup=names;}
 const p=world.people.find(p=>p.id===selected),k=world.knowledge.god.people[selected];
 if(k){const current=isObserved(world,p),s=k.snapshot;const noLife=k.linkLostAt&&!k.deathConfirmed;let html=`<div class="eyebrow">${current?'今、観察している人':'最後に確認した姿'}</div><div class="personhead"><div class="portrait"><canvas width="48" height="60" id="portrait"></canvas></div><div><h2>${escapeHTML(k.name)}</h2><span class="muted">${s?.age??'？'}歳 · ${escapeHTML(s?.job||'暮らしは未確認')}</span></div></div><div class="controls"><button id="ability" class="primary" ${!current||!p.alive?'disabled':''}>✧ 気づき</button><button id="watch">${world.watched[selected]?'★ 見守り中':'☆ 見守る'}</button><button id="life">人生を見る</button><button id="relationships">関係を見る</button></div><div class="current"><p class="activity">${k.deathConfirmed?'生涯を終えた':noLife?'命のつながりを感じられない':current?(p.target&&distance(p,p.target)>.8?'移動中 · ':'')+ACTIONS[s.action]:'現在の暮らしは未確認'}</p><p>${current&&!k.deathConfirmed?escapeHTML(s?.decision||'周囲を見ている'):k.deathConfirmed?'実際に知った人生の記録を振り返れます。':`最後に観察したのは ${dateLabel(k.lastSeenAt)}。`}</p>${current&&p.alive?`<span class="muted">体調 ${s.health} ${s.sick?'· 体調を崩している':''}</span>`:''}</div><p class="muted">住まい：${escapeHTML(s?.place||'未確認')} ${s?.pregnant?'· 妊娠中':''}</p>${k.reunion?`<p class="guide">前回の再会（${dateLabel(k.reunion.t)}）<br>${k.reunion.before.age}歳 → ${k.reunion.after.age}歳<br>${escapeHTML(k.reunion.changes.join(' ／ ')||'変わらず暮らしています')}</p>`:''}`;
  if(lastPersonMarkup!==html){lastPersonMarkup=html;$('person').innerHTML=html;drawPortrait($('portrait'),{...s,action:s.action||'rest'});}
  $('ability').onclick=ability;$('watch').onclick=watch;$('life').onclick=()=>life();$('relationships').onclick=()=>relationships(selected);
 }else $('person').textContent='観察できる人物を選んでください。';
 const a=world.interventions.at(-1);const outcomeKnown=type=>a&&world.events.some(e=>e.intervention===a.id&&e.type===type&&cached(world).known.has(e.id));let result='';if(a){const d=world.distortions.find(d=>d.source===a.id);result=`<section class="section"><h3>直前の選択 · ${escapeHTML(world.knowledge.god.people[a.pid]?.name||'人物')}</h3><p>消費神力：${a.cost}</p><p>効果：${escapeHTML(a.effect)}</p><p>運命への影響：${a.risk}${d?d.remaining>0?' · 受け止めが続いている':' · 小さな負担は収束した':''}</p><p>知覚：${escapeHTML(outcomeKnown('perception')?a.perception:'まだ確認できていない')}</p><p>発見：${escapeHTML((isObserved(world,byId(world,a.pid))&&a.discovery)||'まだ確認できていない')}</p><p>本人の判断：${escapeHTML(!a.use||outcomeKnown('response')?a.choice:'本人の次の判断は未確認')}</p></section>`;}if($('outcome').innerHTML!==result)$('outcome').innerHTML=result;
 const v=world.knowledge.maga.voice;const voiceHTML=v?`<section class="voice"><b>？？？</b><p>「${escapeHTML(v.text)}」</p><small class="muted">あなたとは別の声。まだ応答できません。</small></section>`:'';if($('voice').innerHTML!==voiceHTML)$('voice').innerHTML=voiceHTML;
 const notice=world.notices.find(n=>n.type==='death')||world.notices.find(n=>['reunion','life'].includes(n.type));$('notice').hidden=!notice;if(notice){const text=notice.type==='death'?`${world.knowledge.god.people[notice.pid]?.name}が生涯を終えました。`:notice.type==='reunion'?`${world.knowledge.god.people[notice.pid]?.name}に再会しました。`:world.events[notice.event-1]?.text||'暮らしに変化がありました。';$('notice').innerHTML=`<span>${escapeHTML(text)}</span><button id="noticeLife">${notice.type==='reunion'?'変化を見る':'人生を見る'}</button><button id="noticeLater">あとで</button>`;$('noticeLater').onclick=()=>{world.notices=world.notices.filter(n=>n.id!==notice.id);updateUI();};$('noticeLife').onclick=()=>{world.notices=world.notices.filter(n=>n.id!==notice.id);if(notice.type==='reunion'){selected=notice.pid;reunionDialog(notice.pid);}else life(notice.pid);};}
 if(!dialogOpen){const n=world.notices.find(n=>!['death','reunion','life'].includes(n.type));if(n)importantEvent(n);else if(world.pause){const eventNotice=world.notices.find(n=>n.type==='life');if(eventNotice)importantEvent(eventNotice);}}
}
function importantEvent(n){const k=world.knowledge.god.people[n.pid],name=k?.name||'あの人';let title,body;
 if(n.type==='discovery'){title='知らなかった命';body=`<p>二人のほかにも、人が暮らしている。</p><p>「……誰だ？ 私が生み出したのは、あの二人だけのはずだ。」</p><p class="muted">${escapeHTML(name)}を初めて観察しました。出自の詳細はまだ分かりません。</p>`;}
 else if(n.type==='founder'&&!n.confirmed){title='命のつながり';body=`<p>「……${escapeHTML(name)}とのつながりが、途切れた。」</p><p>${n.knewDeath?'「もう、戻らないのか。」':'「どこへ行った？ 何が起きた？」'}</p><p class="muted">異変だけを感じました。場所、原因、最期の様子は確認できていません。</p>`;}
 else if(n.firstDeath||n.type==='firstDeath'){title='戻らない命';body=(k?.diedAt===world.t?'<p>それまで動いていた命が、戻らない。</p><p>「……眠っているのか？」</p><p>「なぜ、目を開けない？」</p>':'<p>以前会った人が、もう生きていないと確かに知った。</p><p>「……もう、会えないのか？」</p>')+'<p>「私にも、同じことが起こるのか？」</p><p class="muted">初めて確かに知った死。あなた自身が消滅するゲームオーバーはありません。</p>';}
 else if(n.type==='life'){const e=world.events[n.event-1];title='人生の転機';body=`<p><b>${escapeHTML(e?.text||name+'に変化がありました。')}</b></p><p class="muted">${dateLabel(e?.t||world.t)}。神が選ばせた行動ではありません。</p>`;}
 else if(n.type==='reunion'){title='再び会った人';body=`<p><b>${escapeHTML(name)}</b>の今の姿を確かめました。</p><p>${(k?.reunion?.changes||[]).map(escapeHTML).join('。')||'見ていない間も暮らしは続いていました。'}</p>`;}
 else {title='最初に創った命';body=`<p>${escapeHTML(name)}が生涯を終えた。</p><p>あなたが見てきた暮らしを、振り返ることができます。</p>`;}
 const buttons=[{label:n.type==='discovery'?'この人を観察する':'知っている人生を見る',primary:true,run:()=>{world.notices=world.notices.filter(x=>x.id!==n.id);selected=n.pid;if(n.type==='discovery'){world.pause=false;choose(n.pid);}else life(n.pid);}}, {label:'世界へ戻る',run:()=>{world.notices=world.notices.filter(x=>x.id!==n.id);world.pause=false;}}];dialog(title,body,buttons);
}
async function boot(){let loaded=false;try{const s=await readSaved();if(s){world=decodeWorld(s);loaded=true;}}catch{showToast('保存を読み込めませんでした。新しい世界を開始します。');}world??=makeWorld(Number(new URLSearchParams(location.search).get('seed'))||undefined);world.tutorial.lastImportantAt??=-99999;observe(world);updateUI();if(!loaded){world.pause=true;world.tutorial.onboardingActive=true;dialog('神は死なない','<p style="text-align:center;font-size:19px;letter-spacing:.12em;margin:15px 0">――まだ、名もない世界。</p><p>何かが生まれた。</p><p>それが何なのか、あなたはまだ知らない。</p><p class="muted">説明できないことは、これから見つければいい。</p>',[{label:'目を開く',primary:true,run:()=>dialog('二つの命','<p>草の上に、二人がいる。</p><p>一人が歩き出す。もう一人は、別の方向を見ている。</p><p>あなたは、その二人を知っている気がする。</p><p class="muted">人間はあなたの指示を待ちません。まず人物をタップして、何をしようとしているか観察しましょう。</p>',[{label:'世界を見守る',primary:true,run:()=>{world.tutorial.onboardingActive=false;world.pause=false;}}])},{label:'すぐ始める',run:()=>{world.tutorial.onboardingActive=false;world.pause=false;}}]);}else showToast('世界を再開しました。閉じていた間の時間は進んでいません。');requestAnimationFrame(frame);}
function frame(now){const dt=Math.min(150,now-(lastTime||now));lastTime=now;if(!world.pause&&!dialogOpen){accumulator+=dt;let ticks=0;while(accumulator>=speed&&ticks++<48){accumulator-=speed;advance(world);if(world.pause)break;}}renderWorld($('map'),world,selected,now);if(now-lastUI>250){updateUI();lastUI=now;}requestAnimationFrame(frame);}
$('names').addEventListener('click',e=>{const b=e.target.closest('[data-person]');if(b)choose(+b.dataset.person);});$('menu').onclick=menu;$('pause').onclick=()=>{world.pause=!world.pause;accumulator=0;updateUI();};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;world.pause=false;document.querySelectorAll('[data-speed]').forEach(q=>q.classList.toggle('active',q===b));updateUI();});$('zoomIn').onclick=()=>world.camera.zoom=clamp(world.camera.zoom+.3,.8,3);$('zoomOut').onclick=()=>world.camera.zoom=clamp(world.camera.zoom-.3,.8,3);$('return').onclick=()=>{world.camera.x=14;world.camera.y=11;observe(world);updateUI();};
let pointer=null;$('map').addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,camera:{...world.camera},moved:false};$('map').setPointerCapture(e.pointerId);});$('map').addEventListener('pointermove',e=>{if(!pointer)return;const v=$('map')._view,dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.hypot(dx,dy)>7)pointer.moved=true;if(pointer.moved){world.camera.x=clamp(pointer.camera.x-dx/v.scale,0,38);world.camera.y=clamp(pointer.camera.y-dy/v.scale,0,26);observe(world);}});$('map').addEventListener('pointerup',e=>{if(!pointer)return;if(!pointer.moved){const r=$('map').getBoundingClientRect(),v=$('map')._view,q={x:v.ox+(e.clientX-r.left)/v.scale,y:v.oy+(e.clientY-r.top)/v.scale};const p=world.people.filter(p=>isObserved(world,p)&&p.alive).sort((a,b)=>distance(a,q)-distance(b,q))[0];if(p&&distance(p,q)<.9)choose(p.id);}pointer=null;updateUI();});$('map').addEventListener('pointercancel',()=>pointer=null);
document.querySelectorAll('.mobile-tabs [data-panel]').forEach(b=>b.addEventListener('click',()=>{const side=document.querySelector('.sidebar');side.dataset.mobileTab=b.dataset.panel;document.querySelectorAll('.mobile-tabs [data-panel]').forEach(t=>t.classList.toggle('active',t===b));if(b.dataset.panel==='outcome'&&!world.interventions.length)$('outcome').innerHTML='<p class="muted">まだ介入結果はありません。人物を選んで「気づき」を試せます。</p>';if(b.dataset.panel==='voice'&&!world.knowledge.maga.voice)$('voice').innerHTML='<p class="muted">まだ声は聞こえていません。</p>'; }));
document.addEventListener('visibilitychange',()=>{if(document.hidden){persist();world.pause=true;accumulator=0;}});window.addEventListener('pagehide',persist);setInterval(persist,20000);boot();

function relationships(id){const k=world.knowledge.god.people[id],s=k?.snapshot;if(!s)return;const rows=[...(s.parents||[]).map(id=>({id,label:'親'})),...(s.children||[]).map(id=>({id,label:'子'})),...(s.caregivers||[]).map(id=>({id,label:'養育者'})),...(s.partner?[{id:s.partner,label:'交際している人'}]:[]),...(s.relations||[]).map(r=>({id:r.id,label:r.kind}))];const unique=[...new Map([...rows].reverse().map(r=>[r.id,r])).values()].filter(r=>world.knowledge.god.people[r.id]);dialog(`${k.name}の暮らしと関係`,`<p>${escapeHTML(s.place)} · ${escapeHTML(s.job)}</p><p class="muted">最後に観察した範囲。現在見えていない関係や、その人の未確認の過去は表示しません。</p><div class="menugrid" id="relationGrid"></div>${unique.length?'':'<p>関係をまだ確認できていません。</p>'}`,[{label:'世界へ戻る',run:()=>{}}]);for(const r of unique){const b=document.createElement('button');b.textContent=world.knowledge.god.people[r.id].name+' · '+r.label;b.onclick=()=>{dialogOpen=false;$('shade').hidden=true;choose(r.id);};$('relationGrid').append(b);}}
function peopleList(){dialog('出会った人','<input id="peopleSearch" placeholder="名前で探す" aria-label="人物の名前で探す"><div class="menugrid" id="peopleGrid"></div>',[{label:'戻る',run:menu}]);const draw=()=>{const term=$('peopleSearch').value;$('peopleGrid').replaceChildren();for(const k of Object.values(world.knowledge.god.people).filter(k=>k.name.includes(term))){const b=document.createElement('button');b.textContent=k.name+(k.deathConfirmed?' · 故人':` · ${k.snapshot?.age??'？'}歳（確認時）`);b.onclick=()=>{dialogOpen=false;$('shade').hidden=true;choose(k.id);};$('peopleGrid').append(b);}};$('peopleSearch').oninput=draw;draw();}
function reunionDialog(id){const k=world.knowledge.god.people[id],r=k?.reunion;if(!r){life(id);return;}dialog(`${k.name}との再会`,`<p class="muted">再会記録：${dateLabel(r.t)}</p><p>前に会った姿：${r.before.age}歳 · ${escapeHTML(r.before.job)}</p><p>再会時に確認した姿：${r.after.age}歳 · ${escapeHTML(r.after.job)}</p><p>${escapeHTML(r.changes.join('。')||'平穏な暮らしが続いています')}。</p><p class="muted">見ていなかった期間の出来事を補ってはいません。</p>`,[{label:'今の暮らしを見る',run:()=>choose(id)},{label:'人生を見る',run:()=>life(id)}]);}
