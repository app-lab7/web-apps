<main class="game"><header class="top"><h1>神は死なない</h1><span class="date" id="date"></span><button id="menu">☰ メニュー</button></header><div class="layout"><section class="world"><div class="stats"><div class="stat"><small>神力</small><b id="power">8</b><small id="origin">創世の名残</small></div><div class="stat"><small>出会った人</small><b id="population">2</b></div></div><div class="mapframe"><canvas id="map" aria-label="世界の地図。人物をタップして観察する"></canvas><div class="maptip">人物をタップ · ドラッグで視点移動</div><div class="names" id="names"></div></div><div class="toolbar"><button id="pause" aria-label="時間を止める">Ⅱ</button><button data-speed="800" class="active" aria-label="通常速度">▶</button><button data-speed="160" aria-label="高速">▶▶</button><button id="zoomOut" aria-label="縮小">−</button><button id="zoomIn" aria-label="拡大">＋</button><button id="return" aria-label="最初の場所へ視点を戻す">⌂</button><span class="hint">人間への移動命令はできません</span></div><div class="notice" id="notice" hidden></div><p class="note">動作検証版 · 神力は時間では回復しません。数値・老化・病気は仮設定です。</p></section><aside class="sidebar"><div class="guide" id="guide"></div><div id="person"></div><div id="outcome"></div><div id="voice"></div></aside></div></main>
<div class="shade" id="shade" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><span class="eyebrow">神は死なない</span><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="actions" id="dialogActions"></div></section></div><div class="toast" id="toast" hidden role="status"></div>
<script>/* New implementation: provisional balance, world facts, decisions, knowledge. */
const BALANCE = Object.freeze({initialPower:8,nudgeCost:4,powerCap:24,hoursPerYear:576,adaptationPerDay:0.12,illnessPerDay:0.002});
const ACTIONS={water:'水を探す',gather:'食料を採る',explore:'周囲を調べる',rest:'休む',social:'誰かと過ごす'};
const KNOWLEDGE_RADIUS=8;
function rng(w){w.rng=(Math.imul(w.rng,1664525)+1013904223)>>>0;return w.rng/4294967296;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function makeWorld(seed=Date.now()>>>0){
 const w={schema:2,seed,rng:seed,t:6,power:BALANCE.initialPower,groups:{1:{food:32},2:{food:32}},people:[],events:[],interventions:[],distortions:[],nextEvent:1,camera:{x:14,y:11,zoom:1.6},watched:{},notices:[],pause:true,
  knowledge:{god:{death:false,aging:false,immortality:'unknown',people:{},events:[],secrets:{deathOrigin:false,childOrigin:false}},maga:{deathMeaning:false,observations:[],voice:null}},
  facts:{genesis:{lifeCreatedBy:'god',deathCreatedBy:'maga',nearlySimultaneous:true,lifeDistortion:{amount:null,remaining:null},deathDistortion:{amount:null,remaining:null}},godImmortal:true,magaImmortal:true,child:{status:'not-instantiated-pending-birth-age-decision',automaticDeathSense:false}},
  tutorial:{step:0,reunion:false},savedAt:0};
 const specs=[['ナギ','m',13,11,true],['ミナ','f',15,12,true],['ユイ','f',29,7,false],['トワ','m',31,8,false]];
 for(let i=0;i<specs.length;i++){const [name,sex,x,y,founder]=specs[i];w.people.push({id:i+1,group:i<2?1:2,name,sex,x,y,age:18+(i>1?i:0),founder,origin:founder?'direct-genesis':'genesis-afterwave',alive:true,health:100,hunger:18,thirst:founder&&i===0?68:24,fatigue:i===1?35:15,curiosity:40+rng(w)*35,sociability:25+rng(w)*40,faith:0,sensesGod:founder,job:'採集',knownWater:false,attentionUntil:0,nextDecision:6,action:'explore',target:{x,y},decision:null,lastSeenAt:null,life:[],relations:{},appearance:{hue:i%4,mark:i===0?'blue':i===1?'red':'green'}});}
 fact(w,'genesis','最初の二人が生まれた瞬間、神も目覚めた。',{public:true});
 for(const p of w.people){fact(w,'birth',`${p.name}が創世の中で生まれた。`,{pid:p.id});decide(w,p);}
 observe(w);return w;
}
function fact(w,type,text,data={}){const e={id:w.nextEvent++,t:w.t,type,text,...data};w.events.push(e);const p=w.people.find(p=>p.id===data.pid);if(p)p.life.push(e.id);if(data.public||p&&isObserved(w,p))revealEvent(w,e);return e;}
function revealEvent(w,e){if(!w.knowledge.god.events.includes(e.id))w.knowledge.god.events.push(e.id);}
function isObserved(w,p){return distance(w.camera,p)<=KNOWLEDGE_RADIUS;}
function land(x,y){return x>=0&&x<38&&y>=0&&y<26&&!waterTile(x,y);}
function waterTile(x,y){return Math.abs(x-(6+Math.round(Math.sin(y/5))))<1.2||Math.hypot(x-29,(y-19)*1.3)<2.5;}
function shore(p){let best=null;for(let y=1;y<25;y++)for(let x=1;x<37;x++){if(!land(x,y))continue;if([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>waterTile(x+a,y+b))){const q={x:x+.5,y:y+.5};if(!best||distance(p,q)<distance(p,best))best=q;}}return best;}
function randomLand(w,p,r=4){for(let i=0;i<20;i++){const q={x:clamp(Math.round(p.x+(rng(w)-.5)*r*2),1,36)+.5,y:clamp(Math.round(p.y+(rng(w)-.5)*r*2),1,24)+.5};if(land(Math.floor(q.x),Math.floor(q.y)))return q;}return {x:p.x,y:p.y};}
function decide(w,p){
 if(!p.alive)return;
 const nighttime=w.t%24>=21||w.t%24<6;
 const choices=[{action:'rest',value:p.fatigue+(nighttime?65:0)+(p.health<50?35:0),reason:nighttime?'暗くなり、体を休めることにした':'疲れを感じ、休むことにした',target:{x:p.x,y:p.y}},
  {action:'water',value:p.thirst+(p.knownWater?20:0)+(p.attentionUntil>w.t?25:0),reason:p.attentionUntil>w.t?'水の手掛かりと喉の渇きを考え、水辺を調べることにした':'喉が渇き、水を探すことにした',target:shore(p)},
  {action:'gather',value:p.hunger+25+(w.groups[p.group].food<20?20:0),reason:'食べるものを確保したいと考え、採集へ向かった',target:randomLand(w,p,3)},
  {action:'explore',value:p.curiosity*.7+(p.knownWater?0:8),reason:'周囲を知りたいと思い、別の場所を調べることにした',target:randomLand(w,p,4)}];
 const friend=w.people.filter(q=>q.id!==p.id&&q.alive&&distance(p,q)<5).sort((a,b)=>(p.relations[b.id]||0)-(p.relations[a.id]||0))[0];
 if(friend)choices.push({action:'social',value:p.sociability*.6+(p.relations[friend.id]||0)*.25,reason:`${friend.name}と過ごしたいと思い、近くへ向かった`,target:{x:friend.x+.5,y:friend.y},other:friend.id});
 for(const c of choices)c.score=c.value+rng(w)*8;
 choices.sort((a,b)=>b.score-a.score);const c=choices[0],changed=p.action!==c.action;p.action=c.action;p.target=c.target;p.nextDecision=w.t+5;
 p.decision={t:w.t,reason:c.reason,options:choices.map(c=>({action:c.action,score:Math.round(c.score)})),other:c.other||null};
 if(changed||!p.life.length)fact(w,'decision',c.reason,{pid:p.id});
 for(const a of w.interventions.filter(a=>a.pid===p.id&&!a.resolved)){a.resolved=true;a.choice=c.reason;a.choiceAt=w.t;fact(w,'response',`${p.name}は、自分で次の行動を選んだ。${c.reason}`,{pid:p.id,intervention:a.id});}
}
function move(w,p){if(!p.alive||p.action==='rest')return;const d=distance(p,p.target);if(d<.1)return;const step=Math.min(d,p.health<40?.25:.7),dx=(p.target.x-p.x)/d*step,dy=(p.target.y-p.y)/d*step;
 if(land(Math.floor(p.x+dx),Math.floor(p.y+dy))){p.x+=dx;p.y+=dy;}else if(land(Math.floor(p.x+dx),Math.floor(p.y)))p.x+=dx;else if(land(Math.floor(p.x),Math.floor(p.y+dy)))p.y+=dy;else p.nextDecision=w.t;
}
function advance(w){
 w.t++;
 for(const p of w.people){if(!p.alive)continue;move(w,p);p.thirst=clamp(p.thirst+1,0,100);p.hunger=clamp(p.hunger+.7,0,100);p.fatigue=clamp(p.fatigue+(p.action==='rest'?-5:1),0,100);
  const arrived=distance(p,p.target)<.8;
  if(arrived&&p.action==='water'){p.thirst=Math.max(0,p.thirst-20);p.knownWater=true;
   const a=w.interventions.find(a=>a.pid===p.id&&!a.interpreted&&a.effective);if(a){a.interpreted=true;const attributed=p.sensesGod&&rng(w)<(.18+p.faith/150);const text=attributed?'感じていた存在に感謝を向けた':'水の発見を自分の探索の結果と受け止めた';fact(w,'interpretation',`${p.name}は${text}。`,{pid:p.id,intervention:a.id,godDirected:attributed});if(attributed){const gain=p.hunger<50?2:1;w.power=Math.min(BALANCE.powerCap,w.power+gain);fact(w,'power',`神へ向けられた感謝から、神力を${gain}得た。`,{public:true,pid:p.id});p.faith+=8;}}}
  if(arrived&&p.action==='gather')w.groups[p.group].food+=1.8;
  if(arrived&&p.action==='social'&&p.decision.other){const q=w.people.find(q=>q.id===p.decision.other);if(q?.alive&&distance(p,q)<2){p.relations[q.id]=clamp((p.relations[q.id]||0)+.5,0,100);}}
  if(w.t%24===7||w.t%24===18){if(w.groups[p.group].food>=1){w.groups[p.group].food--;p.hunger=Math.max(0,p.hunger-32);}}
  if(p.hunger>90||p.thirst>95)p.health-=.15;
  if(p.sick)p.health-=.06;else if(p.action==='rest'&&p.hunger<70)p.health=Math.min(100,p.health+.3);
  if(w.t%24===0){if(!p.sick&&rng(w)<BALANCE.illnessPerDay){p.sick=true;fact(w,'illness',`${p.name}は体調を崩した。`,{pid:p.id});}else if(p.sick&&rng(w)<.12){p.sick=false;fact(w,'recovery',`${p.name}の体調が戻った。`,{pid:p.id});}}
  if(w.t%BALANCE.hoursPerYear===0){p.age++;fact(w,'age',`${p.name}は${p.age}歳になった。`,{pid:p.id});if(p.age>=65&&p.job!=='日々の暮らし'){p.job='日々の暮らし';fact(w,'retire',`${p.name}は採集を減らし、休息の時間を増やした。`,{pid:p.id});p.curiosity*=.8;}if(p.age>70)p.health-=Math.max(.5,(p.age-70)/7);}
  if(p.health<=0){die(w,p,p.sick?'病気':'身体の衰弱');continue;}
  if(w.t>=p.nextDecision)decide(w,p);
 }
 if(w.t%24===0)for(const d of w.distortions){const prior=d.remaining;d.remaining=Math.max(0,d.remaining-BALANCE.adaptationPerDay);if(prior>0&&d.remaining===0)fact(w,'adaptation','小さな変化を暮らしと環境が受け止め、未適応の負担が落ち着いた。',{public:true,distortion:d.id});}
 observe(w);
 if(!w.knowledge.maga.voice&&w.t>=18){const p=w.people.find(p=>isObserved(w,p)&&p.alive);if(p)voice(w,'……あの者は、自分で行き先を選んだのか。',p.id,'観察した選択');}
}
function voice(w,text,pid,basis){if(w.knowledge.maga.voice)return;w.knowledge.maga.voice={text,pid,t:w.t,basis};fact(w,'voice',`？？？「${text}」`,{public:true,pid});}
function nudgeAvailability(w,p){if(!p?.alive||!isObserved(w,p))return '現在、この人物を観察できません。';if(p.attentionUntil>w.t)return '注意はすでに水の手掛かりへ向いています。重ねても新しい効果はありません。';if(w.power<BALANCE.nudgeCost)return '神力が足りません。観察と記録は続けられます。';return null;}
function intervene(w,pid,use){const p=w.people.find(p=>p.id===pid);if(!p||!p.alive||!isObserved(w,p))return {ok:false,reason:'現在、この人物を観察できません。'};
 if(use){const reason=nudgeAvailability(w,p);if(reason)return {ok:false,reason};}
 const a={id:w.interventions.length+1,t:w.t,pid,use,cost:use?BALANCE.nudgeCost:0,effective:use,effect:use?'水の手掛かりに注意が向いた':'超自然的な変更なし',risk:use?'小':'なし',resolved:false,choice:'本人の次の判断を待っています',interpreted:false};w.interventions.push(a);
 if(use){w.power-=a.cost;p.attentionUntil=w.t+8;p.knownWater=true;p.nextDecision=w.t+1;w.distortions.push({id:w.distortions.length+1,source:a.id,initial:1,remaining:1,holder:'world'});voice(w,'……今、何かが変わった。お前がしたのか？',pid,'介入の歪みを感知');}
 else {a.resolved=true;a.choice=p.decision.reason;voice(w,'……お前は、見ているだけなのか。',pid,'神が介入せず、人間が選んだ行動を観察');}
 fact(w,'intervention',use?`${p.name}の注意へ働きかけた。行動や信仰は強制しない。`:`${p.name}への介入を見送り、本人の判断を見守った。`,{pid,public:true,intervention:a.id});w.tutorial.step=3;return {ok:true,action:a};}
function die(w,p,cause){if(!p.alive)return;p.alive=false;p.health=0;p.diedAt=w.t;p.deathCause=cause;const e=fact(w,'death',`${p.name}が${p.age}歳で生涯を終えた。`,{pid:p.id,cause});
 if(p.founder){w.pause=true;const knew=w.knowledge.god.death;w.notices.push({id:'founder-'+p.id,pid:p.id,event:e.id,type:'founder',confirmed:isObserved(w,p),knewDeath:knew});w.knowledge.god.people[p.id]??={name:p.name,id:p.id};w.knowledge.god.people[p.id].linkLostAt=w.t;fact(w,'link',`${p.name}との命のつながりが途切れた。場所や原因は分からない。`,{pid:p.id,public:true});}
 if(isObserved(w,p))confirmDeath(w,p,e);
}
function confirmDeath(w,p,e){const k=w.knowledge.god.people[p.id];if(k?.deathConfirmed)return;const first=!w.knowledge.god.death;w.knowledge.god.death=true;w.knowledge.god.immortality=w.knowledge.god.immortality==='unknown'?'questioned':w.knowledge.god.immortality;if(p.diedAt===w.t)revealEvent(w,e);else fact(w,'death_discovery',`${p.name}が生涯を終えていたことを確認した。死亡の時刻や原因は未確認。`,{pid:p.id,public:true});
 if(k){k.deathConfirmed=true;k.deathKnownAt=w.t;k.diedAt=p.diedAt===w.t?p.diedAt:(k.linkLostAt??null);k.cause=p.diedAt===w.t?p.deathCause:null;}
 if(first){w.pause=true;const existing=w.notices.find(n=>n.pid===p.id&&n.type==='founder');if(existing){existing.firstDeath=true;existing.confirmed=true;}else w.notices.push({id:'first-death',pid:p.id,event:e.id,type:'firstDeath',confirmed:true});}
 else if(w.watched[p.id]&&!p.founder){w.notices.push({id:'death-'+p.id,pid:p.id,event:e.id,type:'death',confirmed:true});if(w.watched[p.id].stopOnDeath)w.pause=true;}
}
function observe(w){for(const p of w.people){if(!isObserved(w,p))continue;let k=w.knowledge.god.people[p.id];if(!k){k={id:p.id,name:p.name,firstSeen:w.t,seenEvents:[],deathConfirmed:false};w.knowledge.god.people[p.id]=k;if(!p.founder){w.pause=true;w.notices.push({id:'discovery-'+p.id,pid:p.id,type:'discovery'});}}
