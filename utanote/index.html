<style>
/* Layout: 一覧 → 曲ページ(歌う/記号/歌詞)。歌詞が主役、記号は文字の上に小さく、メモは行の下に控えめに。 */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --fg:#1C2030; --muted:#6B7188; --line:#DEE1EC;
  --accent:#3B4BD6; --accent-ink:#FFFFFF; --accent-soft:#E6E9FB;
  --dyn:#C2410C; --pitch:#1B66C9; --voice:#0E7F70; --brk:#6B7188; --att:#A86A00;
  --memo:#7A5A2E; --memo-bg:#F7EEDC;
  --s-intro:#7C8AA5; --s-a:#2F8F6B; --s-b:#C0801B; --s-sabi:#D2445A; --s-c:#7B52C9; --s-ochi:#B8369A; --s-dai:#C75B1D; --s-kan:#2A8AA8; --s-out:#7C8AA5; --s-etc:#7C8AA5;
  --h1:#FFE98A; --h2:#FFC4D0; --h3:#BFE0FF; --h4:#C6F0CF;
  --sel:#3B4BD6; --danger:#C0392B;
  --fs:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141D; --surface:#1B1E2B; --fg:#EDEFF7; --muted:#9AA0B8; --line:#2C3042;
  --accent:#8C98FF; --accent-ink:#12141D; --accent-soft:#262B4A;
  --dyn:#FF9266; --pitch:#6FB1FF; --voice:#4FD1BC; --brk:#9AA0B8; --att:#F0B445;
  --memo:#E6C48F; --memo-bg:#2C2619;
  --s-intro:#9AA7C0; --s-a:#4FC39A; --s-b:#E8A844; --s-sabi:#FF7088; --s-c:#A98BF0; --s-ochi:#E070C8; --s-dai:#FF9556; --s-kan:#58C2E0; --s-out:#9AA7C0; --s-etc:#9AA7C0;
  --h1:#5A4D10; --h2:#6B2C3A; --h3:#21456E; --h4:#245A34;
  --sel:#8C98FF; --danger:#FF7A6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141D; --surface:#1B1E2B; --fg:#EDEFF7; --muted:#9AA0B8; --line:#2C3042;
  --accent:#8C98FF; --accent-ink:#12141D; --accent-soft:#262B4A;
  --dyn:#FF9266; --pitch:#6FB1FF; --voice:#4FD1BC; --brk:#9AA0B8; --att:#F0B445;
  --memo:#E6C48F; --memo-bg:#2C2619;
  --s-intro:#9AA7C0; --s-a:#4FC39A; --s-b:#E8A844; --s-sabi:#FF7088; --s-c:#A98BF0; --s-ochi:#E070C8; --s-dai:#FF9556; --s-kan:#58C2E0; --s-out:#9AA7C0; --s-etc:#9AA7C0;
  --h1:#5A4D10; --h2:#6B2C3A; --h3:#21456E; --h4:#245A34;
  --sel:#8C98FF; --danger:#FF7A6B; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.5;
  padding-block:0 calc(var(--dock-h,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}

.wrap{max-width:640px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto}

/* section colors */
.t-intro{--sc:var(--s-intro)}.t-a{--sc:var(--s-a)}.t-b{--sc:var(--s-b)}.t-sabi{--sc:var(--s-sabi)}.t-c{--sc:var(--s-c)}.t-ochi{--sc:var(--s-ochi)}.t-dai{--sc:var(--s-dai)}.t-kan{--sc:var(--s-kan)}.t-out{--sc:var(--s-out)}.t-etc{--sc:var(--s-etc)}

/* lyrics view */
.songhead{padding:14px 0 4px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}

.ln{position:relative;font-size:var(--fs);line-height:1.5;padding-top:.2em;margin-top:.1em;word-break:break-all;overflow-wrap:anywhere}
.ln.hs{padding-top:.78em}
.nosym .ln.hs{padding-top:.2em}
.c{position:relative;display:inline;border-radius:3px}
.sy{position:absolute;left:50%;bottom:100%;transform:translate(-50%,.08em);display:flex;gap:1px;align-items:flex-end;line-height:1;pointer-events:none;white-space:nowrap}
.sy.af{left:100%}
.sy>*{display:block}
.sy svg{width:calc(var(--fs) * .52);height:calc(var(--fs) * .52);overflow:visible}
.sy svg.w{width:calc(var(--fs) * .8)}
.sy .tx{font-size:calc(var(--fs) * .42);font-weight:700;font-style:normal;border:1px solid currentColor;border-radius:4px;padding:0 2px;line-height:1.2}
.sy .it{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:calc(var(--fs) * .56)}
.k-dyn{color:var(--dyn)}.k-pitch{color:var(--pitch)}.k-voice{color:var(--voice)}.k-brk{color:var(--brk)}.k-att{color:var(--att)}
.hl1{background:var(--h1)}.hl2{background:var(--h2)}.hl3{background:var(--h3)}.hl4{background:var(--h4)}
.nohl .hl1,.nohl .hl2,.nohl .hl3,.nohl .hl4{background:none}
.wave{text-decoration:underline wavy var(--pitch);text-decoration-thickness:2px;text-underline-offset:.22em}
.long{box-shadow:inset 0 -3px 0 var(--voice)}
.bold{font-weight:700;color:var(--dyn)}
.soft{opacity:.5}
.memo{font-size:13px;line-height:1.45;color:var(--memo);margin:1px 0 4px;padding-left:2px}

.m1 .memo{display:none}

.mark .c{cursor:pointer;padding:0 .02em}
.mark .c.sel{box-shadow:0 0 0 2px var(--sel);border-radius:4px;z-index:1}
.mark .c.sel:not([class*="hl"]){background:var(--accent-soft)}
.mark .memo{cursor:pointer}
.mark .ln{margin-top:.2em}
/* dock / sheet */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dock .in{max-width:640px;margin:0 auto;min-width:0}
.drow{display:flex;gap:6px;align-items:center;justify-content:space-between}
.drow+.drow{margin-top:8px}

.tabs{display:flex;gap:4px;margin-bottom:6px}

.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.g .gi svg{width:18px;height:18px}.g .gi svg.w{width:26px}

.sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);display:inline-block}

.ln.lsel{background:var(--accent-soft);box-shadow:-6px 0 0 var(--accent-soft),6px 0 0 var(--accent-soft)}

/* Paper, ink and a small electric accent. */
:root,:root[data-theme="light"]{
 --bg:#f6f4ee;--surface:#fffef9;--fg:#23251f;--muted:#73766c;--line:#dedfd5;
 --accent:#292d24;--accent-ink:#f7f9ee;--accent-soft:#e9eddf;--memo:#626440;--memo-bg:#eeefce;
 --s-intro:#7c8177;--s-a:#6c805d;--s-b:#a17b4d;--s-sabi:#b56c7a;--s-c:#82719a;
 --s-ochi:#966983;--s-dai:#a76d50;--s-kan:#648a8b;--s-out:#7c8177;--s-etc:#7c8177;
 --electric:#d5ef7a;--ink:#292d24;--cover1:#dce6c6;--cover2:#eacbd3;--cover3:#cbd9e8;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;letter-spacing:.01em}
.wrap,.top .row,.seg,.dock .in,.mode-top .tools{max-width:680px}
button,input,textarea{-webkit-tap-highlight-color:transparent}
.btn{border-radius:9px;font-size:14px;font-weight:600;box-shadow:none}

.btn.sm{font-size:12px}
.ib{border-radius:50%}
.sub{font-size:12px;line-height:1.7}

.library-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}

<script>

var LS="utanote.v1.";
var Store={kind:"local",col:null,
  lsGet:function(k){try{return localStorage.getItem(LS+k)}catch(e){return null}},
  lsSet:function(k,v){try{localStorage.setItem(LS+k,v)}catch(e){}},
  init:function(){

    return race(Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(a){
      var db=a[0],user=a[1];if(!db||!user)return null;
      return user.id().then(function(id){if(!id)return null;self.col=db.collection("data/users/"+id);self.kind="db";return 1});
    })).catch(function(){return null});
  },
  loadAll:function(){

      return this.col.get().then(function(snap){var out=[],meta=null,pr=null;
        snap.docs.forEach(function(d){var v=d.data();if(d.id==="_meta")meta=v;else if(d.id==="_prefs")pr=v;else if(v&&v.secs)out.push(JSON.parse(JSON.stringify(v)))});

    }

function remapLine(l,nt){var ot=l.t;if(ot===nt)return;
  var p=0;while(p<ot.length&&p<nt.length&&ot[p]===nt[p])p++;
  var q=0;while(q<ot.length-p&&q<nt.length-p&&ot[ot.length-1-q]===nt[nt.length-1-q])q++;
  l.m=remapMap(l.m,p,q,ot.length,nt.length);l.r=remapMap(l.r,p,q,ot.length,nt.length);l.sp=remapSpans(l.sp||[],p,q,ot.length,nt.length);l.t=nt}

  var old=sec.lines,n=texts,i=0;

  var j=0;while(j<old.length-i&&j<n.length-i&&old[old.length-1-j].t===n[n.length-1-j])j++;
  var om=old.slice(i,old.length-j),nm=n.slice(i,n.length-j),mid=[];
  nm.forEach(function(t,k){if(k<om.length){remapLine(om[k],t);mid.push(om[k])}else mid.push(newLine(t))});
  sec.lines=old.slice(0,i).concat(mid,old.slice(old.length-j));

}

var HEAD=/^[\s　]*[【\[［(（]?\s*(イントロ|intro|Aメロ|Bメロ|Cメロ|プレサビ|落ちサビ|大サビ|ラスサビ|サビ|間奏|アウトロ|outro|ブリッジ|Aメロ[0-9０-９]*|Bメロ[0-9０-９]*)[^】\]］)）]*[】\]］)）]?[\s　]*$/i;
function headType(h){
  if(/イントロ|intro/i.test(h))return "intro";if(/落ちサビ/.test(h))return "ochi";if(/大サビ|ラスサビ/.test(h))return "dai";
  if(/サビ/.test(h))return "sabi";if(/^.?A/i.test(h.replace(/[【\[［(（\s]/g,"")))return "a";if(/B/i.test(h.replace(/[【\[［(（\s]/g,"")))return "b";
  if(/C/i.test(h.replace(/[【\[［(（\s]/g,"")))return "c";if(/間奏/.test(h))return "kan";if(/アウトロ|outro/i.test(h))return "out";return "etc"}
function parseLyrics(text,startIdx){
  var cyc=["a","b","sabi"],ci=startIdx||0,secs=[],curS=null,pendingLabel=null;
  var lines=text.replace(/\r/g,"").split("\n");
  var open=function(type,label){curS={type:type,label:label||"",lines:[]};secs.push(curS)};
  lines.forEach(function(raw){
    var l=raw.replace(/\s+$/,"");
    if(!l.trim()){curS=null;return}
    if(HEAD.test(l)&&(/^[\s　]*[【\[［(（]/.test(l)||l.trim().length<=8)){var h=l.replace(/[【\[［(（】\]］)）\s　]/g,"");var t=headType(h);
      open(t,(h===TNAME[t]||h.toLowerCase()===t)?"":h);return}
    if(!curS){open(cyc[ci%cyc.length]);ci++}
    curS.lines.push(l);
  });

}

function normSong(s){
  if(!s||typeof s!=="object"||!Array.isArray(s.secs))return null;
  var out={id:String(s.id||"").replace(/[^A-Za-z0-9_\-]/g,"").slice(0,40)||uid(),title:String(s.title||""),artist:String(s.artist||""),key:String(s.key||""),bpm:String(s.bpm||""),memo:String(s.memo||""),u:Date.now(),secs:[]};
  s.secs.forEach(function(x){
    if(!x||!Array.isArray(x.lines))return;
    var sec={id:uid(),type:TNAME[x.type]?x.type:"etc",label:String(x.label||""),memo:String(x.memo||""),lines:[]};
    x.lines.forEach(function(l){
      if(!l||typeof l.t!=="string")return;var m={},r={};
      Object.keys(l.m||{}).forEach(function(k){if(/^\d+$/.test(k))m[k]=String(l.m[k])});
      Object.keys(l.r||{}).forEach(function(k){if(/^\d+$/.test(k))r[k]=String(l.r[k])});
      var sp=(Array.isArray(l.sp)?l.sp:[]).filter(function(q){return q&&Number.isInteger(q.a)&&Number.isInteger(q.b)&&SYM[q.k]}).map(function(q){return {a:q.a,b:q.b,k:q.k}});
      sec.lines.push({id:uid(),t:l.t,m:m,r:r,sp:sp,n:String(l.n||"")});
    });
    if(!sec.lines.length)sec.lines=[newLine("")];out.secs.push(sec);
  });
  if(!out.secs.length)out.secs=[newSec("a")];return out;
}

    for(i=S.sel.a;i<=S.sel.b;i++){if(!all&&/^hl/.test(v))["hl1","hl2","hl3","hl4"].forEach(function(k){csvToggle(l.r,i,k,false)});csvToggle(l.r,i,v,!all)}
    touch();render();break;
  case "clr":l=selLine();if(!l||S.sel.lineOnly)break;for(i=S.sel.a;i<=S.sel.b;i++){delete l.m[i];delete l.r[i]}l.sp=(l.sp||[]).filter(function(x){return x.b<S.sel.a||x.a>S.sel.b});touch();render();break;
  case "phr":l=selLine();if(!l)break;var ph=S.phrases[+v],pa=(l.n||"").split("、").filter(Boolean),pk=pa.indexOf(ph);
    if(pk>=0)pa.splice(pk,1);else pa.push(ph);l.n=pa.join("、");touch();render();break;
  case "help":Store.lsSet("helpseen","1");$("#layer").insertAdjacentHTML("beforeend",helpModal());if(S.view==="list")render();break;
  case "hidehelp":Store.lsSet("helpseen","1");render();break;
  case "bk-copy":var bt=JSON.stringify({app:"utanote",v:1,songs:S.songs,phrases:S.phrases});
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(bt):Promise.reject()).then(function(){toast("バックアップをコピーしました")}).catch(function(){
      var w2=$(".sheetwrap");if(w2)w2.remove();
      $("#layer").insertAdjacentHTML("beforeend",'<div class="sheetwrap top" data-act="imp-x"><div class="modal"><h3>バックアップ</h3><div class="sub" style="margin-bottom:8px">全体をコピーして保管してください。</div><textarea id="cpTa" readonly>'+esc(bt)+'</textarea><div style="margin-top:10px"><button class="btn" data-act="imp-x">閉じる</button></div></div></div>');
      var c2=$("#cpTa");if(c2){c2.focus();c2.select()}});break;
  case "bk-open":var w3=$(".sheetwrap");if(w3)w3.remove();$("#layer").insertAdjacentHTML("beforeend",restoreModal());setTimeout(function(){var t=$("#bkTa");if(t)t.focus()},50);break;
  case "bk-go":var raw=$("#bkTa")?$("#bkTa").value:"",data=null;try{data=JSON.parse(raw)}catch(e){}
    if(!data||!Array.isArray(data.songs)){toast("バックアップの形式が正しくありません");break}
    var cnt=0;data.songs.forEach(function(x){var n=normSong(x);if(!n)return;var ix=S.songs.map(function(y){return y.id}).indexOf(n.id);
      if(ix>=0)S.songs[ix]=n;else S.songs.push(n);Store.save(n).catch(function(){});cnt++});
    if(Array.isArray(data.phrases)&&data.phrases.length){S.phrases=data.phrases.map(String).filter(Boolean).slice(0,60);savePh()}
    recordHistory();var w4=$(".sheetwrap");if(w4)w4.remove();render();toast(cnt+"曲を復元しました");break;
  case "memodone":if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();document.body.classList.remove("typing");render();break;
  case "pedit":S.pedit=!S.pedit;render();break;
  case "phnew":$("#layer").insertAdjacentHTML("beforeend",phraseModal());setTimeout(function(){var t=$("#phNew");if(t)t.focus()},50);break;
  case "phdel":S.phrases.splice(+v,1);savePh();render();break;
  case "phadd":var pn=$("#phNew"),pv=pn?pn.value.trim():"";if(!pv)break;if(S.phrases.indexOf(pv)<0){S.phrases.push(pv);savePh()}var pw=$(".sheetwrap");if(pw)pw.remove();render();toast("パレットに追加しました");break;
  case "type":commitEdits();sec=secById(s,sid);sec.type=v;touch();render();break;
  case "up":case "down":commitEdits();i=s.secs.map(function(x){return x.id}).indexOf(sid);var j=a==="up"?i-1:i+1;
    if(j>=0&&j<s.secs.length){var t=s.secs[i];s.secs[i]=s.secs[j];s.secs[j]=t;touch();render()}break;
  case "dup":commitEdits();i=s.secs.map(function(x){return x.id}).indexOf(sid);sec=JSON.parse(JSON.stringify(s.secs[i]));sec.id=uid();sec.lines.forEach(function(x){x.id=uid()});
    s.secs.splice(i+1,0,sec);touch();render();toast("複製しました");break;
  case "delsec":commitEdits();if(S.confirm!=="s"+sid){S.confirm="s"+sid;render();setTimeout(function(){if(S.confirm==="s"+sid){S.confirm=null;render()}},3000);break}
    S.confirm=null;s.secs=s.secs.filter(function(x){return x.id!==sid});if(!s.secs.length)s.secs=[newSec("a")];touch();render();break;
  case "addsec":commitEdits();var last=s.secs[s.secs.length-1],nt={a:"b",b:"sabi",sabi:"a",intro:"a",kan:"a",c:"sabi",ochi:"sabi",dai:"out"}[last?last.type:"a"]||"a";
    s.secs.push(newSec(nt));touch();render();var tas=document.querySelectorAll("textarea[data-sec]");if(tas.length){var ta=tas[tas.length-1];ta.focus();ta.scrollIntoView({block:"center"})}break;
  case "imp":commitEdits();$("#layer").insertAdjacentHTML("beforeend",importModal());setTimeout(function(){var t=$("#impTa");if(t)t.focus()},50);break;
  case "imp-x":var w=$(".sheetwrap");if(w)w.remove();break;
  case "imp-go":var txt=$("#impTa").value;var secs=parseLyrics(txt,v==="add"?s.secs.length:0);
    if(!secs.length){toast("歌詞が入力されていません");break}
    if(v==="rep")s.secs=secs;else{var empty=s.secs.length===1&&!s.secs[0].lines.some(function(x){return x.t});s.secs=empty?secs:s.secs.concat(secs)}
    $(".sheetwrap").remove();touch();render();toast(secs.length+"個のセクションを取り込みました");break;
  case "copy":commitEdits();var tx=toText(s);
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(tx):Promise.reject()).then(function(){toast("コピーしました")}).catch(function(){
      $("#layer").insertAdjacentHTML("beforeend",'<div class="sheetwrap top" data-act="imp-x"><div class="modal"><h3>歌詞テキスト</h3><textarea id="cpTa" readonly>'+esc(tx)+'</textarea><div style="margin-top:10px"><button class="btn" data-act="imp-x">閉じる</button></div></div></div>');
      var c=$("#cpTa");if(c){c.focus();c.select()}});break;
  case "delsong":if(S.confirm!=="song"){S.confirm="song";render();setTimeout(function(){if(S.confirm==="song"){S.confirm=null;render()}},3000);break}
    S.confirm=null;S.songs=S.songs.filter(function(x){return x.id!==s.id});Store.remove(s.id).catch(function(){});recordHistory();setWake(false);go("list");toast("削除しました");break;
  }
}
document.addEventListener("click",function(e){
  var c=e.target.closest(".c[data-i]");
  if(c&&S.view==="song"&&S.mode==="mark"){tapChar(c);return}
  var m=e.target.closest("[data-memo-line]");
  if(m&&S.mode==="mark"){S.sel={line:m.dataset.memoLine,a:0,b:0,lineOnly:true};S.tab="memo";render();focusMemo();return}
  var ln=e.target.closest(".ln[data-lineid]");
  if(ln&&S.view==="song"&&S.mode==="mark"){tapLine(ln.dataset.lineid);return}
  var b=e.target.closest("[data-act]");
  if(b){if(b.dataset.act==="imp-x"&&b.classList.contains("sheetwrap")&&e.target!==b)return;act(b.dataset.act,b)}
});
var taTimer;
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==='songSearch'){if(e.isComposing)return;var caret=el.selectionStart;S.query=el.value;render();var input=$('#songSearch');input.focus();try{input.setSelectionRange(caret,caret)}catch(err){}return}
  var s=cur();if(!s)return;
  if(el.matches("textarea[data-sec]")){autosize(el);clearTimeout(taTimer);if(!e.isComposing)taTimer=setTimeout(commitEdits,600)}
  else if(el.dataset&&el.dataset.f){clearTimeout(taTimer);taTimer=setTimeout(commitEdits,400)}
  else if(el.id==="memoTa"){var l=selLine();if(l){l.n=el.value;queueSave(s)}}
});
document.addEventListener("compositionend",function(e){if(e.target.id==='songSearch'){S.query=e.target.value;render();var q=$('#songSearch');if(q)q.focus();return}if(e.target.matches&&e.target.matches("textarea[data-sec]")){clearTimeout(taTimer);taTimer=setTimeout(commitEdits,300)}});
document.addEventListener("focusout",function(e){
  if(e.target.matches&&(e.target.matches("textarea[data-sec]")||e.target.matches("[data-f]")))commitEdits();
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="phNew"&&!e.isComposing){e.preventDefault();act("phadd",e.target)}});
document.addEventListener("focusin",function(e){if(e.target.id==="memoTa")document.body.classList.add("typing")});
document.addEventListener("focusout",function(e){if(e.target.id==="memoTa")document.body.classList.remove("typing")});
window.addEventListener("pagehide",function(){commitEdits();flushAllSaves()});

/* ---------- 起動 ---------- */
render();
Store.init().then(function(){return Store.loadAll()}).then(function(r){
  S.songs=r.songs;if(r.phrases&&r.phrases.length)S.phrases=r.phrases;
  if(!r.seeded&&!S.songs.length){var sm=sampleSong();S.songs.push(sm);Store.save(sm).catch(function(){});Store.markSeeded()}
  else if(!r.seeded)Store.markSeeded();
  S.ready=true;recordHistory();render();
}).catch(function(){S.ready=true;render()});
</script>
<script>
"use strict";
var deferredInstall=null;
function isStandalone(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredInstall=e});
window.addEventListener("appinstalled",function(){deferredInstall=null;toast("ホーム画面に追加しました")});
function installHTML(){
  if(isStandalone())return "";
  var h='<h3>ホーム画面に追加</h3><p class="sub" style="margin:0 0 10px;font-size:13px">';
  if(deferredInstall)return h+'アプリとして端末に追加できます。</p><div style="margin-bottom:12px"><button class="btn sm pri" data-act="install">アプリとして追加</button></div>';
  return h+'iPhoneは、Safariの共有ボタンから「ホーム画面に追加」を選びます。Androidは、ブラウザのメニューから「アプリをインストール」または「ホーム画面に追加」を選びます。</p>';
}
document.addEventListener("click",function(e){var b=e.target.closest('[data-act="install"]');if(b&&deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(function(){deferredInstall=null;var w=document.querySelector(".sheetwrap");if(w)w.remove()})}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
